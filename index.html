                            <span><span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span> Know it: ${counts.strong}</span>
                            <span><span class="inline-block w-2 h-2 rounded-full bg-amber-500"></span> Getting there: ${counts.mid}</span>
                            <span><span class="inline-block w-2 h-2 rounded-full bg-rose-500"></span> Needs work: ${counts.weak}</span>
                            <span><span class="inline-block w-2 h-2 rounded-full bg-gray-300 dark:bg-slate-600"></span> Not tested: ${counts.none}</span>
                        </div>
                        <div class="flex flex-wrap gap-2 pt-1">
                            <button data-qz="mixed" data-n="10" class="px-3.5 py-2 rounded-lg text-xs font-semibold bg-violet-600 hover:bg-violet-700 text-white">Mixed quiz &middot; 10 questions</button>
                            <button data-qz="mixed" data-n="20" class="px-3.5 py-2 rounded-lg text-xs font-semibold border border-violet-300 dark:border-violet-800 text-violet-700 dark:text-violet-300 hover:bg-violet-50 dark:hover:bg-slate-800">Mixed &middot; 20</button>
                            <button data-qz="weak" ${weakCount ? '' : 'disabled'} class="px-3.5 py-2 rounded-lg text-xs font-semibold border border-rose-300 dark:border-rose-900 text-rose-700 dark:text-rose-300 hover:bg-rose-50 dark:hover:bg-slate-800 disabled:opacity-40 disabled:cursor-not-allowed">Drill my weak spots${weakCount ? ' (' + weakCount + ')' : ''}</button>
                        </div>
                    </div>
                    ${sections}
                    <div class="pt-2"><button data-qz="reset" class="text-[11px] text-gray-400 dark:text-slate-500 hover:text-rose-500 underline">Reset all quiz results</button></div>
                </div>`);
        }

        function quizStart(list, label) {
            if (!list.length) { showToast('No questions available for that choice'); return; }
            breadcrumbSubject.textContent = 'Quiz';
            quiz.session = { label, i: 0, res: [], qs: list.map(q => ({ ...q, opts: qShuffle([q.a, ...q.w]) })) };
            renderQuizQuestion();
        }

        function renderQuizQuestion() {
            const s = quiz.session, q = s.qs[s.i], done = s.res[s.i], total = s.qs.length;
            const f = findChapter(q.c);
            const opts = q.opts.map((o, i) => {
                let cls = 'border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-950 hover:border-violet-400 dark:hover:border-violet-500';
                let icon = '';
                if (done) {
                    cls = 'border-gray-200 dark:border-slate-800 bg-white dark:bg-slate-950 opacity-60';
                    if (o === q.a) { cls = 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40'; icon = '<i class="fa-solid fa-circle-check text-emerald-500 ml-auto shrink-0"></i>'; }
                    else if (i === done.pick) { cls = 'border-rose-500 bg-rose-50 dark:bg-rose-950/40 opacity-100'; icon = '<i class="fa-solid fa-circle-xmark text-rose-500 ml-auto shrink-0"></i>'; }
                }
                return `<button data-qz="answer" data-i="${i}" ${done ? 'disabled' : ''} class="w-full text-left px-4 py-3 rounded-xl border text-sm flex items-center gap-3 transition-colors text-gray-900 dark:text-slate-100 ${cls}"><span class="shrink-0 w-6 h-6 rounded-full border border-current/30 text-[11px] font-bold flex items-center justify-center text-gray-500 dark:text-slate-400">${'ABCD'[i]}</span><span class="min-w-0">${qe(o)}</span>${icon}</button>`;
            }).join('');
            const feedback = done ? `
                <div class="p-4 rounded-xl border ${done.ok ? 'border-emerald-300 dark:border-emerald-900 bg-emerald-50/70 dark:bg-emerald-950/30' : 'border-rose-300 dark:border-rose-900 bg-rose-50/70 dark:bg-rose-950/30'} space-y-1.5">
                    <div class="text-sm font-bold ${done.ok ? 'text-emerald-700 dark:text-emerald-400' : 'text-rose-700 dark:text-rose-400'}">${done.ok ? 'Correct!' : (done.dk ? "No problem, now you know." : 'Not quite.')}</div>
                    <div class="text-[13px] text-gray-700 dark:text-slate-300">${qe(q.e)}</div>
                </div>
                <div class="flex items-center justify-between gap-2">
                    <button data-qz="notes" data-id="${q.c}" class="text-xs font-semibold text-blue-600 dark:text-blue-400 hover:underline">Open notes for this</button>
                    <button data-qz="next" class="px-4 py-2 rounded-lg text-xs font-semibold bg-violet-600 hover:bg-violet-700 text-white">${s.i + 1 === total ? 'See results' : 'Next question'} <i class="fa-solid fa-arrow-right ml-1"></i></button>
                </div>` : `
                <button data-qz="dk" class="text-xs font-semibold text-gray-500 dark:text-slate-400 hover:text-violet-600 dark:hover:text-violet-400 underline">I don't know this one</button>`;
            qRender(`
                <div class="space-y-5">
                    <div class="flex items-center justify-between gap-3">
                        <button data-qz="home" class="text-xs text-gray-500 dark:text-slate-400 hover:text-violet-600"><i class="fa-solid fa-arrow-left mr-1"></i> Quit quiz</button>
                        <span class="text-xs font-semibold text-gray-500 dark:text-slate-400">${qe(s.label)} &middot; ${s.i + 1} of ${total}</span>
                    </div>
                    <div class="h-1.5 rounded-full bg-gray-200 dark:bg-slate-800 overflow-hidden"><div class="h-full bg-violet-500" style="width:${100 * (s.i + (done ? 1 : 0)) / total}%"></div></div>
                    <div>
                        <div class="text-[10px] font-bold uppercase tracking-wider text-gray-400 dark:text-slate-500">${qe(f.subTitle)} &middot; ${qe(f.ch.name)}</div>
                        <h2 class="text-lg md:text-xl font-bold text-gray-900 dark:text-white mt-1.5 leading-snug">${qe(q.q)}</h2>
                    </div>
                    <div class="space-y-2.5">${opts}</div>
                    ${feedback}
                </div>`);
        }

        function quizAnswer(pick, dk) {
            const s = quiz.session, q = s.qs[s.i];
            if (s.res[s.i]) return;
            const ok = !dk && q.opts[pick] === q.a;
            s.res[s.i] = { c: q.c, ok, dk: !!dk, pick: dk ? null : pick };
            const e = (store.quiz[q.c] = store.quiz[q.c] || { h: [] });
            e.h.push(ok); if (e.h.length > 8) e.h = e.h.slice(-8); e.last = Date.now();
            saveStore();
            renderQuizQuestion();
        }

        function renderQuizResults() {
            const s = quiz.session, total = s.qs.length, right = s.res.filter(r => r.ok).length, pct = Math.round(100 * right / total);
            const byCh = {};
            s.res.forEach(r => { const o = byCh[r.c] = byCh[r.c] || { r: 0, t: 0 }; o.t++; if (r.ok) o.r++; });
            const rows = Object.keys(byCh).sort((a, b) => byCh[a].r / byCh[a].t - byCh[b].r / byCh[b].t).map(cid => {
                const o = byCh[cid], f = findChapter(cid), st = o.r === o.t ? 'strong' : o.r / o.t >= 0.5 ? 'mid' : 'weak';
                return `<div class="flex items-center gap-2 p-2.5 rounded-lg border border-gray-200 dark:border-slate-800 bg-white dark:bg-slate-950">
                    <span class="w-1.5 self-stretch rounded-full ${Q_BADGE[st][2]}"></span>
                    <div class="min-w-0 flex-1"><div class="text-[13px] font-semibold text-gray-900 dark:text-white truncate">${qe(f.ch.name)}</div><div class="text-[11px] text-gray-500 dark:text-slate-400">${qe(f.subTitle)} &middot; ${o.r}/${o.t} correct</div></div>
                    ${qBadge(st, st === 'strong' ? 'You know this' : st === 'mid' ? 'Revise a little' : 'Revise this')}
                    <button data-qz="notes" data-id="${cid}" class="px-2.5 py-1 rounded-md text-[11px] font-semibold border border-gray-200 dark:border-slate-700 text-gray-700 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-800">Notes</button>
                </div>`;
            }).join('');
            const missed = s.qs.map((q, i) => ({ q, r: s.res[i] })).filter(x => !x.r.ok);
            const added = Object.keys(byCh).filter(id => ['weak', 'mid'].includes(qMastery(id).st)).length;
            const missedHtml = missed.map(({ q, r }) => `
                <div class="p-3.5 rounded-xl border border-gray-200 dark:border-slate-800 bg-white dark:bg-slate-950 space-y-1.5">
                    <div class="text-sm font-semibold text-gray-900 dark:text-white">${qe(q.q)}</div>
                    <div class="text-[13px] ${r.dk ? 'text-gray-500 dark:text-slate-400' : 'text-rose-600 dark:text-rose-400'}">${r.dk ? "You said you didn't know" : 'Your answer: ' + qe(q.opts[r.pick])}</div>
                    <div class="text-[13px] text-emerald-700 dark:text-emerald-400">Correct answer: ${qe(q.a)}</div>
                    <div class="text-xs text-gray-500 dark:text-slate-400">${qe(q.e)}</div>
                </div>`).join('');
            const msg = pct >= 80 ? 'Strong result!' : pct >= 50 ? 'Good start, a bit more revision will help.' : "That's useful: now you know where to focus.";
            qRender(`
                <div class="space-y-6">
                    <div class="text-center p-6 rounded-2xl border border-violet-200 dark:border-violet-900/60 bg-violet-50/60 dark:bg-slate-800/40">
                        <div class="text-[10px] font-bold uppercase tracking-wider text-violet-600 dark:text-violet-400">${qe(s.label)}</div>
                        <div class="text-5xl font-extrabold text-gray-900 dark:text-white mt-2">${right}<span class="text-2xl text-gray-400">/${total}</span></div>
                        <div class="text-sm text-gray-600 dark:text-slate-300 mt-1">${pct}% &middot; ${msg}</div>
                        <div class="flex flex-wrap justify-center gap-2 mt-4">
                            ${missed.length ? `<button data-qz="retry" class="px-3.5 py-2 rounded-lg text-xs font-semibold bg-violet-600 hover:bg-violet-700 text-white">Retry the ${missed.length} I missed</button>` : ''}
                            <button data-qz="home" class="px-3.5 py-2 rounded-lg text-xs font-semibold border border-gray-300 dark:border-slate-700 text-gray-700 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-800">Knowledge map</button>
                        </div>
                    </div>
                    ${added ? `<button data-qz="gohome" class="w-full text-left p-3.5 rounded-xl border border-amber-300 dark:border-amber-900 bg-amber-50/70 dark:bg-amber-950/30 flex items-center justify-between gap-3"><span class="text-[13px] text-amber-800 dark:text-amber-300"><i class="fa-solid fa-lightbulb mr-1.5"></i><b>${added} topic${added === 1 ? '' : 's'}</b> added to <b>Recommended to revise</b> on your Home page</span><i class="fa-solid fa-arrow-right text-amber-600 shrink-0"></i></button>` : ''}
                    <div class="space-y-2"><h2 class="font-bold text-sm text-gray-900 dark:text-white">By chapter (weakest first)</h2><div class="grid gap-2 md:grid-cols-2">${rows}</div></div>
                    ${missed.length ? `<div class="space-y-2"><h2 class="font-bold text-sm text-gray-900 dark:text-white">What to review</h2><div class="space-y-2">${missedHtml}</div></div>` : ''}
                </div>`);
        }


        // ---- Recommended to revise (built from quiz results, shown at the bottom of Home) ----
        function quizRecommendations() {
            const out = [];
            Object.keys(store.quiz || {}).forEach(id => {
                const f = findChapter(id); if (!f) return;
                const m = qMastery(id); if (m.st !== 'weak' && m.st !== 'mid') return;
                const e = store.quiz[id];
                if (e.dismissed && e.dismissed >= (e.last || 0)) return;   // hidden until you next answer a question on it
                out.push({ id, f, m, last: e.last || 0 });
            });
            out.sort((a, b) => (a.m.pct - b.m.pct) || (b.last - a.last));
            return out;
        }

        function recommendedHtml() {
            const recs = quizRecommendations();
            const tested = Object.keys(store.quiz || {}).some(id => findChapter(id) && qMastery(id).st !== 'none');
            const head = `
                <h2 class="font-bold text-md text-gray-900 dark:text-white flex items-center gap-2"><i class="fa-solid fa-lightbulb text-amber-500 text-sm"></i> Recommended to revise${recs.length ? ` <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-amber-100 dark:bg-amber-950/60 text-amber-700 dark:text-amber-400">${recs.length}</span>` : ''}</h2>`;
            let body;
            if (!recs.length) {
                body = `
                    <div class="p-6 rounded-xl border border-dashed border-gray-300 dark:border-slate-700 text-center">
                        <i class="fa-solid ${tested ? 'fa-circle-check text-emerald-500' : 'fa-list-check text-violet-500'} text-3xl mb-3"></i>
                        <p class="text-sm font-semibold text-gray-800 dark:text-slate-200">${tested ? 'Nothing to revise right now' : 'No recommendations yet'}</p>
                        <p class="text-xs text-gray-500 dark:text-slate-400 mt-1 max-w-sm mx-auto leading-relaxed">${tested ? "You're doing well on everything you've tested. Take more quizzes to keep checking." : 'Take a quiz and the chapters you get wrong or skip will show up here.'}</p>
                        <button data-qz="enter" class="mt-3 px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-violet-600 hover:bg-violet-700 text-white">${tested ? 'Take another quiz' : 'Take a quiz'}</button>
                    </div>`;
            } else {
                const cards = recs.map(({ id, f, m }) => {
                    const hasQs = QUIZ_BANK.some(q => q.c === id), fav = isFav(id);
                    return `
                        <div class="p-4 rounded-xl border border-gray-200 dark:border-slate-800 bg-white dark:bg-slate-950 flex flex-col gap-3">
                            <div class="flex items-start justify-between gap-2">
                                <div class="min-w-0">
                                    <span class="text-[10px] font-bold uppercase tracking-wider text-gray-400 dark:text-slate-500">${qe(f.subTitle)} &middot; ${qe(f.secName)}</span>
                                    <h3 class="font-bold text-sm mt-0.5 text-gray-900 dark:text-white">${qe(f.ch.name)}</h3>
                                </div>
                                ${qBadge(m.st, Q_BADGE[m.st][0] + ' · ' + m.pct + '%')}
                            </div>
                            <p class="text-xs text-gray-500 dark:text-slate-400">${m.r} of your last ${m.n} answers were right</p>
                            <div class="flex items-center gap-2">
                                <button data-qz="notes" data-id="${id}" class="flex-1 px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white transition-colors">Open notes</button>
                                ${hasQs ? `<button data-qz="chapter" data-id="${id}" data-sub="${f.subKey}" class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-violet-300 dark:border-violet-800 text-violet-700 dark:text-violet-300 hover:bg-violet-50 dark:hover:bg-slate-800">Quiz again</button>` : ''}
                                <button data-qz="recfav" data-id="${id}" title="${fav ? 'Saved to revision list' : 'Add to Revise these'}" aria-label="Add to revision list" class="px-3 py-1.5 rounded-lg text-xs border border-gray-200 dark:border-slate-700 hover:bg-gray-100 dark:hover:bg-slate-800"><i class="${fav ? 'fa-solid text-rose-500' : 'fa-regular text-gray-500 dark:text-slate-400'} fa-heart"></i></button>
                                <button data-qz="dismiss" data-id="${id}" title="Hide until I next take a quiz on it" aria-label="Dismiss" class="px-3 py-1.5 rounded-lg text-xs border border-gray-200 dark:border-slate-700 text-gray-500 dark:text-slate-400 hover:bg-gray-100 dark:hover:bg-slate-800"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        </div>`;
                }).join('');
                body = `<div class="grid gap-3 md:grid-cols-2">${cards}</div>
                    <p class="text-[11px] text-gray-400 dark:text-slate-500">Built from your quiz results. A topic leaves this list once you score 80% or more on it, or you can dismiss it.</p>`;
            }
            return `<div class="space-y-3 pt-2 border-t border-gray-200 dark:border-slate-800">${head}${body}</div>`;
        }

        notesReader.addEventListener('click', (e) => {
            const el = e.target.closest('[data-qz]');
            if (!el) return;
            if (el.dataset.sub) quiz.subject = el.dataset.sub;
            const act = el.dataset.qz, subj = quiz.subject, bank = subj ? qBankFor(subj) : [];
            if (act === 'enter') quizEnter();
            else if (act === 'home') { quiz.session = null; renderQuizHome(); }
            else if (act === 'subject') { quiz.subject = el.dataset.key; renderQuizHome(); }
            else if (act === 'mixed') quizStart(qShuffle(bank).slice(0, +el.dataset.n), `Mixed quiz`);
            else if (act === 'weak') {
                const weakIds = new Set(Object.keys(store.quiz).filter(id => ['weak', 'mid'].includes(qMastery(id).st)));
                quizStart(qShuffle(bank.filter(q => weakIds.has(q.c))).slice(0, 15), 'Weak spots');
            }
            else if (act === 'chapter') { const f = findChapter(el.dataset.id); quizStart(qShuffle(bank.filter(q => q.c === el.dataset.id)), f.ch.name); }
            else if (act === 'section') { const sec = SYLLABUS_DATA[subj].sections[+el.dataset.i]; quizStart(qShuffle(bank.filter(q => sec.chapters.some(c => c.id === q.c))), sec.name); }
            else if (act === 'answer') quizAnswer(+el.dataset.i, false);
            else if (act === 'dk') quizAnswer(null, true);
            else if (act === 'next') { const s = quiz.session; s.i++; s.i >= s.qs.length ? renderQuizResults() : renderQuizQuestion(); }
            else if (act === 'retry') { const s = quiz.session; quizStart(qShuffle(s.qs.filter((q, i) => !s.res[i].ok)), 'Retry missed'); }
            else if (act === 'notes') openChapter(el.dataset.id);
            else if (act === 'recfav') toggleFav(el.dataset.id);
            else if (act === 'dismiss') { const e2 = store.quiz[el.dataset.id]; if (e2) { e2.dismissed = Date.now(); saveStore(); } renderHome(); showToast('Hidden until you next take a quiz on it'); }
            else if (act === 'gohome') showHome();
            else if (act === 'reset') { if (confirm('Reset all quiz results? Your notes and saved topics are not affected.')) { store.quiz = {}; saveStore(); renderQuizHome(); showToast('Quiz results reset'); } }
        });
        document.getElementById('sidebar-quiz-btn').addEventListener('click', quizEnter);

        // =====================================================================
        // Previous / next topic buttons (bottom of every notes page)
        // They move through the topics that have notes, in syllabus order.
        // =====================================================================
        function topicNavHtml(topicId) {
            const sub = SYLLABUS_DATA[currentState.subject];
            if (!sub) return '';
            const list = [];
            sub.sections.forEach(sec => sec.chapters.forEach(ch => { if (ch.status === 'ready' || ch.id === topicId) list.push({ id: ch.id, name: ch.name, sec: sec.name }); }));
            const i = list.findIndex(x => x.id === topicId);
            if (i < 0 || list.length < 2) return '';
            const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const btn = (t, dir) => {
                if (!t) return '<div></div>';
                const prev = dir === 'prev';
                return `
                    <button type="button" data-topic-nav="${t.id}" class="group ${prev ? 'text-left' : 'text-right'} p-3.5 rounded-xl border border-gray-200 dark:border-slate-800 bg-white dark:bg-slate-950 hover:border-blue-400 dark:hover:border-blue-500 hover:shadow-sm transition-all min-w-0">
                        <span class="flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-wider text-blue-600 dark:text-blue-400 ${prev ? '' : 'justify-end'}">
                            ${prev ? '<i class="fa-solid fa-arrow-left transition-transform group-hover:-translate-x-0.5"></i>Previous topic' : 'Next topic<i class="fa-solid fa-arrow-right transition-transform group-hover:translate-x-0.5"></i>'}
                        </span>
                        <span class="block text-sm font-semibold text-gray-900 dark:text-white mt-1 leading-snug">${esc(t.name)}</span>
                        <span class="block text-[11px] text-gray-500 dark:text-slate-400 mt-0.5 truncate">${esc(t.sec)}</span>
                    </button>`;
            };
            return `
                <nav class="mt-10 pt-6 border-t border-gray-200 dark:border-slate-800" aria-label="Topic navigation">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${btn(list[i - 1], 'prev')}${btn(list[i + 1], 'next')}</div>
                    <p class="text-center text-[11px] text-gray-400 dark:text-slate-500 mt-3">Topic ${i + 1} of ${list.length} with notes in ${esc(sub.title)}</p>
                </nav>`;
        }
        notesReader.addEventListener('click', (e) => {
            const b = e.target.closest('[data-topic-nav]');
            if (b) openChapter(b.dataset.topicNav);
        });
    </script>
</body>
</html>
