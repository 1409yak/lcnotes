le">Training and professional development</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Induction / onboarding</div><div class="p-2 leading-snug">Helps new employees settle in (shown systems, culture).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">On-the-job training</div><div class="p-2 leading-snug">Practical learning for existing staff during normal work to build role-specific skills.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Off-the-job training</div><div class="p-2 leading-snug">External courses or workshops to build new skills or gain qualifications.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Professional development</div><div class="p-2 leading-snug">Continuous long-term support to build leadership, communication and strategic thinking for future growth and career progression.</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Why it matters for HCM</div><div class="p-2 leading-snug">1. Employees learn from real experiences, building confidence and practical skills. 2. Training builds a skilled, adaptable workforce ready for change. 3. Professional development boosts morale, helping staff feel valued and committed long-term.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#6366f1">5</div><div class="min-w-0"><div class="int-title">Teams, sustainability and digital technology</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#6366f122;border-left:3px solid #6366f1">Teams: employers</div><div class="p-2 leading-snug">Opportunities: boost creativity, productivity, divide tasks efficiently, increase engagement. Challenges: conflicts, slow progress without clear roles, more supervision.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#6366f122;border-left:3px solid #6366f1">Teams: employees</div><div class="p-2 leading-snug">Opportunities: support, shared learning, belonging, communication skills. Challenges: stress from group conflict, unequal effort, poor communication.</div></div></div><p class="text-[13px] leading-snug mt-2">Employers and employees creating a more sustainable workplace:</p><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Skills</div><div class="p-2 leading-snug">Future-focused training keeps skills relevant and boosts adaptability.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Wellbeing</div><div class="p-2 leading-snug">A shared focus on health, safety and wellbeing creates a safer, more supportive environment.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Ethical</div><div class="p-2 leading-snug">Both build an inclusive, respectful culture through fairness, integrity and accountability.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Environmental</div><div class="p-2 leading-snug">Employers lead on reducing waste and emissions; employees support sustainable daily habits.</div></div></div><p class="text-[13px] leading-snug mt-2">How digital technology impacts the workplace:</p><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Collaboration</div><div class="p-2 leading-snug">Zoom and project management apps help decision-making and support remote teamwork.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Automation / AI</div><div class="p-2 leading-snug">Handles repetitive tasks, improves efficiency, frees time for higher-value work.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Upskilling</div><div class="p-2 leading-snug">Flexible, lower-cost online platforms, though quality may vary.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Data analytics</div><div class="p-2 leading-snug">Clearer performance data but concerns about how staff info is used.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Work patterns</div><div class="p-2 leading-snug">Remote and hybrid work improve flexibility and work-life balance.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">6</div><div class="min-w-0"><div class="int-title">Remote and blended working</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#ef444422;border-left:3px solid #ef4444">Employees</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#ef4444">Opportunities</span>Flexibility, greater autonomy, access to wider job opportunities.</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#ef4444">Challenges</span>Isolation, blurred work-life boundaries, need for strong tech skills.</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#ef444422;border-left:3px solid #ef4444">Employers</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#ef4444">Opportunities</span>Can reduce costs, attract talent from wider locations, boost employee satisfaction.</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#ef4444">Challenges</span>Managing remotely affects communication, performance monitoring and team cohesion.</div></div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Ethical issues</div><div class="p-2 leading-snug">Data privacy, fairness in home setups, risk of blurred work-life boundaries.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Sustainability</div><div class="p-2 leading-snug">Reduces commuting (emissions) but may lower long-term engagement and connection.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#14b8a6">7</div><div class="min-w-0"><div class="int-title">Corporate wellness</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#14b8a622;border-left:3px solid #14b8a6">Importance</div><div class="p-2 leading-snug">Supports physical, mental and emotional wellbeing, boosts motivation, improves retention, builds a more inclusive and positive workplace.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#14b8a622;border-left:3px solid #14b8a6">Employee motivation</div><div class="p-2 leading-snug">Helps staff feel valued, reduces stress, supports mental health and belonging, leading to stronger engagement and performance.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#14b8a622;border-left:3px solid #14b8a6">Organisational culture</div><div class="p-2 leading-snug">Builds a culture of care, teamwork and loyalty by supporting day-to-day experiences and making employees feel respected.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#14b8a622;border-left:3px solid #14b8a6">Role of leadership</div><div class="p-2 leading-snug">Leaders promote wellness by setting the tone through their own behaviour, providing resources, creating a safe and inclusive culture, and clearly communicating its value.</div></div></div></div></div>
                `
            },
            "bus-c15": {
                title: "Chapter 15: The Importance of Communication",
                section: "Strand 3: Leading in Business",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Importance of communication in an organisation</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Supports collaboration</div><div class="p-2 leading-snug">Clear communication keeps teams aligned, helping them share ideas more efficiently.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Helps avoid conflict</div><div class="p-2 leading-snug">Respectful, open communication prevents misunderstandings and builds relationships.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Increases engagement</div><div class="p-2 leading-snug">When employees understand their role and feel heard, motivation improves.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Promotes a positive culture</div><div class="p-2 leading-snug">Open, fair communication builds trust, respect and a supportive environment.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Helps manage change</div><div class="p-2 leading-snug">Explaining what's happening and why reduces uncertainty around change.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Promotes innovation</div><div class="p-2 leading-snug">Safe, open communication encourages new ideas and employees to challenge how things are done.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">2</div><div class="min-w-0"><div class="int-title">Modes of communication</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Verbal</div><div class="p-2 leading-snug">Shares detailed messages, gives quick feedback, builds trust. Supports collaboration and flexible tone, but may lack a record, be misinterpreted or swayed by emotion.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Non-verbal</div><div class="p-2 leading-snug">Tone, gestures, visuals (graphs/infographics) and facial expressions support or reinforce messages; convey urgency and simplify complex data. Can be misinterpreted, lacks a record, may confuse if visuals are unclear.</div></div></div><p class="text-[13px] leading-snug mt-2">Factors to consider when choosing the mode:</p><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Urgency</div><div class="p-2 leading-snug">Faster verbal tools (calls, instant messaging) for urgent messages; written for less immediate needs.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Complexity</div><div class="p-2 leading-snug">Written formats for complex info (allows re-reading); verbal or short written for simple updates.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Formality</div><div class="p-2 leading-snug">Formal topics (e.g. policies) need structured written formats such as reports; informal updates can be casual.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Audience</div><div class="p-2 leading-snug">Larger or remote groups may need multimodal formats; small groups may benefit from direct verbal contact.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Confidentiality</div><div class="p-2 leading-snug">Handle sensitive issues privately using secure verbal channels; written records may be needed for formal documentation.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Need for record</div><div class="p-2 leading-snug">Choose written formats when proof or a permanent record is required (reports, policies, financial matters).</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">3</div><div class="min-w-0"><div class="int-title">How technology enables communication</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Modes</div><div class="p-2 leading-snug">Zoom and Canva combine spoken, visual and written elements in one format.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Speed</div><div class="p-2 leading-snug">Slack and Microsoft Teams enable real-time updates, fast decisions and quick check-ins.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Cost</div><div class="p-2 leading-snug">Google Docs and Slack reduce printing, posting and admin costs through shared online spaces.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Access</div><div class="p-2 leading-snug">Notion and Teams let employees access policies and files anytime, anywhere.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Collaboration</div><div class="p-2 leading-snug">Google Workspace and Trello help teams share messages, edit files and track progress.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Sustainable practices</div><div class="p-2 leading-snug">Zoom and Google Drive cut paper/printing; Skype, Meet and Teams cut travel for meetings.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Productivity</div><div class="p-2 leading-snug">Asana and Google Calendar manage tasks, schedule meetings and reduce follow-ups. AI can prepare and refine messages.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Security</div><div class="p-2 leading-snug">DocuSign and Signal protect sensitive data with encryption and secure digital storage.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#22c55e">4</div><div class="min-w-0"><div class="int-title">How communication might be improved</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Setting clear goals</div><div class="p-2 leading-snug">Define the purpose of each message to keep communication focused and easy to understand.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Listening actively</div><div class="p-2 leading-snug">Show openness to feedback and avoid interruptions to build trust and reduce misunderstandings.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Ensuring ongoing engagement</div><div class="p-2 leading-snug">Regular check-ins and updates keep staff informed and involved.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Choosing the correct mode</div><div class="p-2 leading-snug">Match the method to the message's urgency, tone and formality to avoid confusion.</div></div></div></div></div>
                `
            },
            "bus-c16": {
                title: "Chapter 16: The Rationale for Planning",
                section: "Strand 3: Leading in Business",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Internal and external changes organisations encounter</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Internal</div><div class="p-2 leading-snug">Leadership changes (new vision/style/goals); adoption of technology (software/systems); restructuring (job losses); business model; organisational (hybrid).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">External</div><div class="p-2 leading-snug">Consumer expectations (trends); economic (inflation, tariffs); regulatory (laws, compliance); digital (disruptive models); competitors (innovation, prices).</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">2</div><div class="min-w-0"><div class="int-title">Resistance to change</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Fear of job losses</div><div class="p-2 leading-snug">Staff worry change (e.g. restructuring or automation) will cost them their jobs.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Fear of failure</div><div class="p-2 leading-snug">Worry they lack the skills, training or confidence to adapt: provide training and support.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">No clear benefit communicated</div><div class="p-2 leading-snug">Staff may see change as a threat or unnecessary: they need to be sold the benefits.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Inertia</div><div class="p-2 leading-snug">Employees comfortable with how things have always been done; needs inspiration.</div></div></div><div class="int-note"><span>💡</span><div>In your book the "Fear of job losses" row repeats a sentence from the risk chapter by mistake, so the meaning here is the usual one.</div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Practices that promote innovation</div><div class="p-2 leading-snug">Leadership culture that encourages risk-taking; teamwork and collaboration; training and resources for staff; recognition and rewards for innovation.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Overcoming resistance</div><div class="p-2 leading-snug">Lead by example; open communication and consultation; training and resource support; employee empowerment; rewarding staff; teamwork and collaboration.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">3</div><div class="min-w-0"><div class="int-title">Strategic planning</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Strategic planning</div><div class="p-2 leading-snug">An ongoing process of defining an organisation's long-term goals and determining the best way to achieve them.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">As an ongoing process</div><div class="p-2 leading-snug">Needs review and adaption: evaluation and control of the plan; adjust as the environment changes (competitors, technology, target market habits) and learnings/risks emerge.</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Clarity and direction</div><div class="p-2 leading-snug">Provides a roadmap; reduces confusion for management decisions.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Ability to manage change</div><div class="p-2 leading-snug">Helps respond to unexpected challenges quickly; gives structure to change.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Resource efficiency</div><div class="p-2 leading-snug">Reasoned allocation of resources (staff, capital, equipment) based on strategy.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Competitive advantage</div><div class="p-2 leading-snug">Scanning the environment on an ongoing basis encourages innovation to stay ahead.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">4</div><div class="min-w-0"><div class="int-title">Force-field analysis</div></div></div><p class="text-[13px] leading-snug mt-2">An approach used to identify and analyse forces (internal and external) that drive change (driving forces) and inhibit change (restraining forces).</p><div class="flex flex-wrap items-center gap-4 mt-2"><svg viewBox="0 0 310 130" class="w-full" style="color:#64748b;max-width:440px" xmlns="http://www.w3.org/2000/svg"><line x1="14.0" y1="28.0" x2="104.0" y2="28.0" stroke="#22c55e" stroke-width="2.4"/><polygon points="104.0,28.0 98.6,30.6 98.6,25.4" fill="#22c55e"/><line x1="296.0" y1="28.0" x2="206.0" y2="28.0" stroke="#ef4444" stroke-width="2.4"/><polygon points="206.0,28.0 211.4,25.4 211.4,30.6" fill="#ef4444"/><line x1="14.0" y1="62.0" x2="104.0" y2="62.0" stroke="#22c55e" stroke-width="2.4"/><polygon points="104.0,62.0 98.6,64.6 98.6,59.4" fill="#22c55e"/><line x1="296.0" y1="62.0" x2="206.0" y2="62.0" stroke="#ef4444" stroke-width="2.4"/><polygon points="206.0,62.0 211.4,59.4 211.4,64.6" fill="#ef4444"/><line x1="14.0" y1="96.0" x2="104.0" y2="96.0" stroke="#22c55e" stroke-width="2.4"/><polygon points="104.0,96.0 98.6,98.6 98.6,93.4" fill="#22c55e"/><line x1="296.0" y1="96.0" x2="206.0" y2="96.0" stroke="#ef4444" stroke-width="2.4"/><polygon points="206.0,96.0 211.4,93.4 211.4,98.6" fill="#ef4444"/><rect x="112" y="8" width="86" height="108" rx="8" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.2" opacity="0.2"/><text x="155" y="53.5" font-size="9.5" text-anchor="middle" fill="currentColor" font-weight="700">Change /</text><text x="155" y="65.5" font-size="9.5" text-anchor="middle" fill="currentColor" font-weight="700">strategic</text><text x="155" y="77.5" font-size="9.5" text-anchor="middle" fill="currentColor" font-weight="700">plan</text><text x="60.0" y="123.5" font-size="9.5" text-anchor="middle" fill="#16a34a">Driving forces</text><text x="252.0" y="123.5" font-size="9.5" text-anchor="middle" fill="#dc2626">Restraining forces</text></svg></div><div class="flex flex-wrap gap-2 mt-2"><div class="px-3 py-1.5 rounded-full text-[12px] font-semibold" style="background:#8b5cf61f;border:1px solid #8b5cf655">1. List the forces</div><div class="px-3 py-1.5 rounded-full text-[12px] font-semibold" style="background:#8b5cf61f;border:1px solid #8b5cf655">2. Weight each by strength</div><div class="px-3 py-1.5 rounded-full text-[12px] font-semibold" style="background:#8b5cf61f;border:1px solid #8b5cf655">3. Strengthen driving, reduce restraining</div><div class="px-3 py-1.5 rounded-full text-[12px] font-semibold" style="background:#8b5cf61f;border:1px solid #8b5cf655">4. Compare totals: can the plan succeed?</div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">5</div><div class="min-w-0"><div class="int-title">Contingency plans</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Contingency plan</div><div class="p-2 leading-snug">A back-up plan an organisation prepares to deal with disruption from unexpected events or emergencies. Helps respond quickly, protect assets, maintain operations and minimise damage.</div></div></div><p class="text-[13px] leading-snug mt-2">Factors to consider when developing one:</p><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Cost</div><div class="p-2 leading-snug">Cost-benefit of the plan; costs include training, back-up equipment, securing suppliers.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Timing</div><div class="p-2 leading-snug">How sudden or time-sensitive the disruption can be: the more sudden, the more panic, so a plan is needed.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Risk</div><div class="p-2 leading-snug">Prioritise high-probability risks and high-impact risks.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Communication</div><div class="p-2 leading-snug">Plan who to contact, how to notify stakeholders, and how to control messaging with the public.</div></div></div></div></div>
                `
            },
            "bus-c17": {
                title: "Chapter 17: Making Informed Decisions as a Consumer",
                section: "Strand 4: Being Informed and Making Informed Decisions",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">CCPC: Competition and Consumer Protection Commission</div><div class="int-tip">Functions</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:122px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Inform the consumer</div><div class="p-2 leading-snug">Provides information on ccpc.ie and its social media; summarises consumer legislation (e.g. Consumer Rights Act 2022) so it is easier to understand.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:122px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Educate the consumer</div><div class="p-2 leading-snug">Free tools such as budget planners, cost comparison calculators and interactive quizzes.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:122px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Advise the government</div><div class="p-2 leading-snug">Highlights issues facing consumers and suggests law changes to ensure fair competition.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:122px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Enforce legislation</div><div class="p-2 leading-snug">Investigates suspected breaches of consumer law. Can enter premises, issue on-the-spot fines, or refer serious cases for prosecution.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:122px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Publish Consumer Protection List</div><div class="p-2 leading-snug">Lists businesses that have broken consumer law or have criminal records.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:122px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Monitor mergers and acquisitions</div><div class="p-2 leading-snug">Reviews mergers to ensure they do not reduce competition or harm consumers. Can block or approve deals with conditions.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">2</div><div class="min-w-0"><div class="int-title">Consumer Rights Act 2022</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:90px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Products</div><div class="p-2 leading-snug">Fit for purpose (normal use / what the shop knows you bought it for). Work for a reasonable time (relative to price). Match description (quality/colour of any sample or ad). Have spare parts/instructions (chargers, manual).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:90px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Services</div><div class="p-2 leading-snug">Work as described. Provider has skills (competent/qualified). Due care and diligence (not rushed). Fit-for-purpose materials. At a reasonable price (in line with regular cost if none agreed).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:90px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Digital content</div><div class="p-2 leading-snug">Works as described (or as in a trial version). Up-to-date version unless agreed. Includes accessories needed.</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:98px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Redress</div><div class="p-2 leading-snug">Full refund within 30 days if a product is faulty. After that the consumer may seek a repair or replacement; if that fails, a refund or price reduction. Compensation can be claimed if a faulty service causes financial loss.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:98px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Right to cancel</div><div class="p-2 leading-snug">Online / phone / doorstep orders (distance contracts) have a cooling-off period: full refund within 14 days of receiving goods or ordering a service.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:98px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Guarantees and warranties</div><div class="p-2 leading-snug">They add to consumer rights; they cannot limit your legal rights. Guarantee: free from the manufacturer, a promise to fix a good within a time frame. Warranty: usually purchased to extend additional cover.</div></div></div><div class="flex flex-wrap gap-2 mt-2"><div class="px-3 py-2 rounded-xl text-center" style="background:#10b9811f;border:1px solid #10b98155"><div class="text-base font-extrabold leading-tight" style="color:#10b981">30 days</div><div class="text-[11px] text-gray-600 dark:text-slate-300">full refund for faulty product</div></div><div class="px-3 py-2 rounded-xl text-center" style="background:#10b9811f;border:1px solid #10b98155"><div class="text-base font-extrabold leading-tight" style="color:#10b981">14 days</div><div class="text-[11px] text-gray-600 dark:text-slate-300">cooling-off / cancel distance contract</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">3</div><div class="min-w-0"><div class="int-title">Rights in the EU compared to outside the EU</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">EU purchases</div><div class="p-2 leading-snug">Strong protections: 14-day cooling-off period, refund within 14 days for faulty goods, no extra VAT or customs, digital services must notify you of contract changes. EU small claims compensation up to €5,000.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Non-EU purchases</div><div class="p-2 leading-snug">Fewer legal rights, no guaranteed refunds, and extra charges like VAT or customs may apply.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">4</div><div class="min-w-0"><div class="int-title">Consumer Protection Act 2007</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:118px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Misleading, false or inaccurate information</div><div class="p-2 leading-snug">Cannot sell counterfeit items as real, lie about origin or an award. Advertising must make clear what to expect and cannot mislead by comparing not like-for-like products. Prohibits harassment and coercion to get someone to buy.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:118px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Price display regulations</div><div class="p-2 leading-snug">Display prices including all charges/fees/taxes for certain products; must price all goods for sale; some items must be shown per kg. Government can impose a maximum price on certain goods in an emergency.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:118px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Enforcement</div><div class="p-2 leading-snug">The CCPC may serve a compliance notice, issue on-the-spot fines of €300, and keep and publish a Consumer Protection List.</div></div></div><div class="flex flex-wrap gap-2 mt-2"><div class="px-3 py-2 rounded-xl text-center" style="background:#f59e0b1f;border:1px solid #f59e0b55"><div class="text-base font-extrabold leading-tight" style="color:#f59e0b">€300</div><div class="text-[11px] text-gray-600 dark:text-slate-300">on-the-spot fine</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">5</div><div class="min-w-0"><div class="int-title">Small Claims Court and the Ombudsman</div></div></div><div class="flex flex-wrap gap-2 mt-2"><div class="px-3 py-2 rounded-xl text-center" style="background:#ef44441f;border:1px solid #ef444455"><div class="text-base font-extrabold leading-tight" style="color:#ef4444">€25</div><div class="text-[11px] text-gray-600 dark:text-slate-300">to apply</div></div><div class="px-3 py-2 rounded-xl text-center" style="background:#ef44441f;border:1px solid #ef444455"><div class="text-base font-extrabold leading-tight" style="color:#ef4444">€2,000</div><div class="text-[11px] text-gray-600 dark:text-slate-300">maximum compensation</div></div><div class="px-3 py-2 rounded-xl text-center" style="background:#ef44441f;border:1px solid #ef444455"><div class="text-base font-extrabold leading-tight" style="color:#ef4444">2 weeks</div><div class="text-[11px] text-gray-600 dark:text-slate-300">retailer given to respond</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Types of claims</div><div class="p-2 leading-snug">Faulty goods, bad workmanship or damage to property.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Affordable / accessible</div><div class="p-2 leading-snug">Costs €25 to apply.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Convenience</div><div class="p-2 leading-snug">No need to hire a solicitor: convenient and lower cost.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Speed</div><div class="p-2 leading-snug">Retailer given 2 weeks to respond or a District Court hearing is set.</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Ombudsman: claims</div><div class="p-2 leading-snug">Investigates complaints about public service bodies (e.g. incorrect information, mishandled complaints). Decisions are not legally binding.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Ombudsman: last resort</div><div class="p-2 leading-snug">Only intervenes if all other complaint procedures have been exhausted.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Ombudsman: investigations</div><div class="p-2 leading-snug">Preliminary: informal interview. Formal: demand files, formal interview.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#22c55e">6</div><div class="min-w-0"><div class="int-title">Responsibilities of consumers and ethical choices</div></div></div><p class="text-[13px] leading-snug mt-2">Responsibilities: become informed (CCPC calculators); keep records (store receipts); use products correctly (do not use shoes to play football); be sustainable/ethical (source local goods or goods from ethical businesses).</p><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Ethical concerns</div><div class="p-2 leading-snug">Fair treatment of workers: choose Fairtrade/ethically sourced. Animal welfare: cruelty-free or vegan-certified logos (e.g. Leaping Bunny). Data privacy: clear privacy policies, minimal tracking. Support local: buy Irish to back jobs and reduce import impact.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Sustainability concerns</div><div class="p-2 leading-snug">Packaging waste: loose produce, recyclable packaging. Transport emissions: buy local or in-season. Overproduction: eco-labels, low-impact manufacturing. Reduce fast fashion: durable options over cheap goods that wear out.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#6366f1">7</div><div class="min-w-0"><div class="int-title">Shadow economy, circular economy and digital technology</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#6366f122;border-left:3px solid #6366f1">Shadow economy: consumer</div><div class="p-2 leading-snug">Cheaper goods, but may be unsafe, lower quality, fewer legal rights.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#6366f122;border-left:3px solid #6366f1">Shadow economy: business</div><div class="p-2 leading-snug">Damages legitimate business; reduces workers' rights.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#6366f122;border-left:3px solid #6366f1">Shadow economy: economy</div><div class="p-2 leading-snug">Loss of government revenue (less tax); increased spending on enforcement.</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#14b8a622;border-left:3px solid #14b8a6">Circular economy</div><div class="p-2 leading-snug">A model of production and consumption which extends the life cycle of products, reduces waste and creates further value.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#14b8a622;border-left:3px solid #14b8a6">Consumer role</div><div class="p-2 leading-snug">Buy second hand, recycle/reuse/repurpose, improve habits, choose sustainable brands.</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#6366f122;border-left:3px solid #6366f1">Benefits of digital technology</div><div class="p-2 leading-snug">More convenient (quicker, easier, accessible); more information (more informed, comparisons); increased choice (access to more shops/options).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#6366f122;border-left:3px solid #6366f1">Drawbacks</div><div class="p-2 leading-snug">Impulse buying (targeted ads increase spending); reduced social interaction (less human engagement); higher screen time (over-reliance on tech platforms).</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">8</div><div class="min-w-0"><div class="int-title">GDPR: General Data Protection Regulation</div></div></div><div class="flex flex-wrap gap-2 mt-2"><div class="px-3 py-2 rounded-xl text-center" style="background:#ef44441f;border:1px solid #ef444455"><div class="text-base font-extrabold leading-tight" style="color:#ef4444">72 hours</div><div class="text-[11px] text-gray-600 dark:text-slate-300">to inform the DPC of a data breach</div></div><div class="px-3 py-2 rounded-xl text-center" style="background:#ef44441f;border:1px solid #ef444455"><div class="text-base font-extrabold leading-tight" style="color:#ef4444">€20m / 4%</div><div class="text-[11px] text-gray-600 dark:text-slate-300">maximum penalty (of global turnover)</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:118px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Business responsibilities</div><div class="p-2 leading-snug">Report data breaches: inform the DPC within 72 hours. Keep data safe and secure; try to prevent breaches.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:118px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Individual rights</div><div class="p-2 leading-snug">Right not to be subject to automated decision making. Right to complain to the Commissioner if the data controller is not complying. Right to access, correction and erasure (the right to be forgotten).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:118px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Data Protection Commissioner</div><div class="p-2 leading-snug">Enforces GDPR (e.g. getting info deleted) by investigating complaints or carrying out their own investigations. Promotes public awareness of individuals' rights. Imposes penalties. Promotes awareness and compliance by data controllers.</div></div></div></div></div>
                `
            },
            "bus-c18": {
                title: "Chapter 18: Making Informed Financial Decisions",
                section: "Strand 4: Being Informed and Making Informed Decisions",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Saving, investing and borrowing</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Saving</div><div class="p-2 leading-snug">Rate needs to be higher than inflation; low risk = low return; some accounts limit access for higher rates.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Investing</div><div class="p-2 leading-snug">Prices can go up or down; profits liable for tax (CGT); spread risk through varied investments.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Borrowing</div><div class="p-2 leading-snug">Failure to repay damages credit rating/ability to borrow again; fixed rates less risky but usually higher than variable; penalties may exist for early repayment.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">2</div><div class="min-w-0"><div class="int-title">Risk tolerance</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Risk tolerance</div><div class="p-2 leading-snug">A consumer's willingness to accept the possibility of financial loss in exchange for potential rewards (depends on age, personality, income/stability).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Range of risks</div><div class="p-2 leading-snug">Financial loss (losing money); information risk (understanding T&amp;Cs); fraud (being scammed); suitability risk (matching risk/purpose to situation).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Reliable sources of information</div><div class="p-2 leading-snug">Choose government funded (Central Bank, CCPC, MABS), check if regulated/qualified, watch for sales pitches or guaranteed get-rich-quick schemes.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">3</div><div class="min-w-0"><div class="int-title">Switching providers and fintech</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Better rates</div><div class="p-2 leading-snug">Seek a higher AER or lower APR.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Terms</div><div class="p-2 leading-snug">Flexibility, fees, early penalties or limits.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Incentives</div><div class="p-2 leading-snug">Cashback, introductory rates, loyalty rewards, waived fees.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Convenience</div><div class="p-2 leading-snug">Ease, 24/7 access, easier switching, budget tracking.</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#10b98122;border-left:3px solid #10b981">Speed / convenience</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#10b981">Benefits</span>Instant access 24/7.</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#10b981">Challenges</span>Increases impulse decisions, e.g. instant approval.</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#10b98122;border-left:3px solid #10b981">More choice</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#10b981">Benefits</span>Lots of new options.</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#10b981">Challenges</span>Cybersecurity risks: data breach, fake apps, phishing.</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#10b98122;border-left:3px solid #10b981">Lower costs</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#10b981">Benefits</span>Better rates, lower fees.</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#10b981">Challenges</span>Digital exclusion: internet, devices or digital skills.</div></div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">4</div><div class="min-w-0"><div class="int-title">Credit rating</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">How it is established</div><div class="p-2 leading-snug">The Central Credit Register (CCR) gives credit reports to lenders. A lender makes a credit rating based on previous loans/history, missed bills and number of credit applications.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Positive factors</div><div class="p-2 leading-snug">Repayments on time, low credit card balances, varied credit sources.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Negative factors</div><div class="p-2 leading-snug">Missing payments, high levels of debt, applying for lots of loans.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Poor credit rating</div><div class="p-2 leading-snug">Limits access to credit, higher interest rates, difficulty buying a home/renting; it travels with you over time (shows for 5 years after any event).</div></div></div><div class="flex flex-wrap gap-2 mt-2"><div class="px-3 py-2 rounded-xl text-center" style="background:#8b5cf61f;border:1px solid #8b5cf655"><div class="text-base font-extrabold leading-tight" style="color:#8b5cf6">5 years</div><div class="text-[11px] text-gray-600 dark:text-slate-300">a credit event shows up for</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">5</div><div class="min-w-0"><div class="int-title">Regulation and financial fraud</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Financial regulator</div><div class="p-2 leading-snug">The Central Bank of Ireland licenses and supervises banks and improves consumer protection and market integrity.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">If under-regulated</div><div class="p-2 leading-snug">Higher risk for consumers, no guarantees, the banking sector could collapse.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Fraud activities</div><div class="p-2 leading-snug">Phishing, smishing and vishing, card skimming or cloning, investment and crypto scams on social media, fake online shops or payment requests.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Consumer protection</div><div class="p-2 leading-snug">Always verify requests; never share full passwords, PINs or codes; avoid cash machines that look damaged or tampered with; check bank statements regularly; be sceptical.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#0ea5e9">6</div><div class="min-w-0"><div class="int-title">Digital currency</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">CBDC</div><div class="p-2 leading-snug">Digital version of cash, issued and backed by a central bank (e.g. ECB). Stable and regulated.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Stablecoin</div><div class="p-2 leading-snug">Pegged to a real-world currency/asset (e.g. USD/gold), reducing volatility. Often run by private firms.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Crypto</div><div class="p-2 leading-snug">Decentralised digital asset like Bitcoin. High risk, not backed or regulated.</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Benefits</div><div class="p-2 leading-snug">Low or no transaction fees across borders; faster payments (avoid banking delays); built-in record keeping helps track income.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Challenges</div><div class="p-2 leading-snug">Privacy is reduced and rules are still unclear; needs internet and tech skills; risk of exclusion or confusion.</div></div></div></div></div>
                `
