            "bus-c19": {
                title: "Chapter 19: Being an Informed Employee",
                section: "Strand 4: Being Informed and Making Informed Decisions",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">How employees are protected</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Legislatively</div><div class="p-2 leading-snug">Employment laws protect workers' rights around pay, hours, health and safety and equality, enforced by the WRC and Labour Court if disputes arise.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Non-legislatively</div><div class="p-2 leading-snug">Employees can raise concerns through managers, HR, union reps or grievance procedures to resolve issues fairly without legal action.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">2</div><div class="min-w-0"><div class="int-title">Rights and responsibilities in employment legislation</div></div></div><div class="flex flex-wrap gap-2 mt-2"><div class="px-3 py-2 rounded-xl text-center" style="background:#10b9811f;border:1px solid #10b98155"><div class="text-base font-extrabold leading-tight" style="color:#10b981">48 hours</div><div class="text-[11px] text-gray-600 dark:text-slate-300">maximum working week</div></div><div class="px-3 py-2 rounded-xl text-center" style="background:#10b9811f;border:1px solid #10b98155"><div class="text-base font-extrabold leading-tight" style="color:#10b981">5 days</div><div class="text-[11px] text-gray-600 dark:text-slate-300">to receive terms of employment</div></div><div class="px-3 py-2 rounded-xl text-center" style="background:#10b9811f;border:1px solid #10b98155"><div class="text-base font-extrabold leading-tight" style="color:#10b981">12 months</div><div class="text-[11px] text-gray-600 dark:text-slate-300">service for unfair dismissal protection</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:110px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Pay</div><div class="p-2 leading-snug">Right to details of pay in a written statement, to be paid at least the national minimum wage, and to a payslip showing gross and net pay.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:110px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Conditions</div><div class="p-2 leading-snug">A safe, respectful working environment, reasonable hours (maximum 48 hours a week), proper breaks (legal right), and clear terms of employment (within 5 days).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:110px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Health and safety</div><div class="p-2 leading-snug">A safe and healthy workplace, proper training, protective equipment if needed, and the right to raise safety concerns without penalty.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:110px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Discrimination</div><div class="p-2 leading-snug">Protected under the Employment Equality Acts 1998-2015 on nine grounds (e.g. age, gender, race, religion, disability). Employers must ensure equal treatment in recruitment, pay, conditions, promotion and training.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:110px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Job security</div><div class="p-2 leading-snug">Protected from unfair dismissal once they have 12 months' continuous service. Employers must provide fair procedures for performance management and redundancy.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:110px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Dismissal</div><div class="p-2 leading-snug">Right to fair notice, procedures, explanation, appeal and redress if unfair. Dismissal must be for valid reasons like misconduct, redundancy or capability.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">3</div><div class="min-w-0"><div class="int-title">The role of trade unions</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Representation in talks</div><div class="p-2 leading-snug">Speak on behalf of workers in disputes over pay, hours or discipline, often through a shop steward or union official.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Collective bargaining</div><div class="p-2 leading-snug">Negotiate with employers to improve pay or conditions, leading to collective agreements that apply to all staff, e.g. Public Service Agreement 2024-2026.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Advice / legal support</div><div class="p-2 leading-snug">Advice, legal help and support with WRC or Labour Court cases so members understand and enforce their rights.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Lobbying / campaigning</div><div class="p-2 leading-snug">Lobby for national-level improvements: better sick pay, paid leave, higher minimum wages.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Protecting job security</div><div class="p-2 leading-snug">Support members during redundancies or restructuring: fair procedures, retraining, or better redundancy packages.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">4</div><div class="min-w-0"><div class="int-title">The gig-based economy</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Role</div><div class="p-2 leading-snug">Part of the labour market relying on temporary positions, part-time workers or freelancers, paid 'per piece' rather than holding a permanent job.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Opportunities</div><div class="p-2 leading-snug">Flexible hours, potential for multiple income sources, quick access to start work, remote options for digital roles.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Challenges</div><div class="p-2 leading-snug">No job security, variable/unpredictable income, limited legal protections, work-related stress (isolation, pressure to earn).</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">5</div><div class="min-w-0"><div class="int-title">How the annual government budget impacts workers</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Direct tax</div><div class="p-2 leading-snug">Higher income tax rates DECREASE take-home pay. Higher income tax bands INCREASE it. Higher tax credits INCREASE it. Lower USC or PRSI rates INCREASE it.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Minimum wage</div><div class="p-2 leading-snug">Raising it increases pay, but may reduce job opportunities if employers cut staff.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Entitlements</div><div class="p-2 leading-snug">Budget changes can improve conditions through paid leave, sick pay, workplace enforcement or extra public holidays.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Indirect tax</div><div class="p-2 leading-snug">Lowering VAT (e.g. in hospitality) can reduce prices, boost demand and help create more jobs.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Business supports</div><div class="p-2 leading-snug">More funding for grants (e.g. LEOs, Enterprise Ireland) helps small businesses hire staff, expand and reduce the cost of creating jobs.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Training and upskilling</div><div class="p-2 leading-snug">Investment in training (e.g. SOLAS, Springboard+, apprenticeships) helps workers gain new skills, adapt to digital change and access better-paid, long-term employment.</div></div></div></div></div>
                `
            },
            "m1-c27": {
                title: "Chapter 27: Proof by Induction",
                section: "Section 10: Mathematical Induction",
                content: `
                    <div class="space-y-6">
                        <div class="p-4 rounded-lg bg-blue-600 text-white font-bold text-sm">
                            4-Step Protocol: P(1) Base Case \u2192 P(k) Assumption \u2192 P(k+1) Proof \u2192 Formal Conclusion
                        </div>

                        <!-- 1. Steps -->
                        <div class="bg-white dark:bg-slate-950 p-5 rounded-xl border border-gray-200 dark:border-slate-800 space-y-3">
                            <h3 class="font-bold text-lg text-blue-600 dark:text-blue-400">1. Steps for Proving by Induction</h3>
                            <ul class="text-sm space-y-2">
                                <li><b>(a)</b> Prove that the result is true for a starting value of \\( n \\in \\mathbb{N} \\).</li>
                                <li><b>(b)</b> Assume the result is true for \\( n = k \\).</li>
                                <li><b>(c)</b> Prove that the result is true for \\( n = k + 1 \\) using <b>(b)</b>.</li>
                            </ul>
                        </div>

                        <!-- 2. Types -->
                        <div class="bg-white dark:bg-slate-950 p-5 rounded-xl border border-gray-200 dark:border-slate-800 space-y-3">
                            <h3 class="font-bold text-lg text-blue-600 dark:text-blue-400">2. Types</h3>

                            <h4 class="font-bold text-sm text-gray-800 dark:text-slate-200">(a) Sums (\\( \\Sigma \\))</h4>
                            <p class="text-xs">Technique:</p>
                            <div class="math-block text-sm">
                                \\( \\sum_{r=1}^{k+1} T_r = (T_1 + T_2 + \\dots + T_k) + T_{k+1} \\)
                            </div>

                            <div class="border-t border-gray-100 dark:border-slate-900 pt-3 space-y-2">
                                <h4 class="font-bold text-sm text-gray-800 dark:text-slate-200">(b) Factorisation (Divisibilities)</h4>
                                <p class="text-xs">Technique:</p>
                                <div class="math-block text-sm">
                                    \\( b \\text{ is a factor of } a \\implies a = mb, \\; m \\in \\mathbb{N} \\)
                                </div>
                            </div>

                            <div class="border-t border-gray-100 dark:border-slate-900 pt-3 space-y-3">
                                <h4 class="font-bold text-sm text-gray-800 dark:text-slate-200">(c) Inequalities</h4>

                                <div class="space-y-2">
                                    <h5 class="font-bold text-xs text-gray-700 dark:text-slate-300">(i) Factorial / Exponential</h5>
                                    <ul class="text-xs space-y-2 list-disc pl-5">
                                        <li>Put the factorial on the left and break it up.</li>
                                        <li>\\( a = b \\text{ and } s > t \\implies as > bt \\)</li>
                                        <li>\\( (k+1)! = (k+1) \\times k! \\)</li>
                                    </ul>
                                </div>

                                <div class="space-y-2">
                                    <h5 class="font-bold text-xs text-gray-700 dark:text-slate-300">(ii) Polynomial / Exponential</h5>

                                    <div class="srp-box">
                                        <span class="bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase">(1) Linear Polynomials</span>
                                        <p class="text-xs mt-1">Polynomials in which the power of the variable \\( n \\) is 1.</p>
                                        <p class="text-xs mt-1">In <b>Step 1</b> put the exponential expression on the left-hand side of the inequality and in <b>Step 3</b> break up the exponential expression.</p>
                                    </div>

                                    <div class="srp-box">
                                        <span class="bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase">(2) Higher-Power Polynomials</span>
                                        <p class="text-xs mt-1">Polynomials in which the power of the variable is greater than 1 (e.g. \\( n^2, n^3, n^4 \\), etc.).</p>
                                        <p class="text-xs mt-1">In <b>Step 1</b> put the polynomial expression on the left-hand side of the inequality and in <b>Step 3</b> factorise the polynomial expression so that what appears on the left-hand side in <b>Step 2</b> is a factor of the polynomial.</p>
                                    </div>

                                    <div class="math-block text-xs">
                                        <p class="font-bold mb-1">Note: If \\( k \\geq a \\) and \\( a \\) and \\( k \\) are both positive,</p>
                                        then dividing by \\( ak \\) \u21d2 \\( \\frac{1}{a} \\geq \\frac{1}{k} \\) \u21d2 \\( \\frac{1}{a^2} \\geq \\frac{1}{k^2} \\)
                                    </div>
                                </div>
                            </div>

                            <div class="border-t border-gray-100 dark:border-slate-900 pt-3">
                                <h4 class="font-bold text-sm text-gray-800 dark:text-slate-200">(d) De Moivre's Theorem</h4>
                            </div>

                            <div class="srp-box space-y-3">
                                <span class="bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase">Example 8</span>
                                <p class="text-sm">Prove that \\( [r(\\cos\\theta + i\\sin\\theta)]^n = r^n(\\cos n\\theta + i\\sin n\\theta), \\; n \\in \\mathbb{N} \\).</p>

                                <div class="space-y-2">
                                    <p class="text-xs"><b>Step 1:</b> \\( n = 1 \\): Prove \\( [r(\\cos\\theta + i\\sin\\theta)]^1 = r^1(\\cos 1\\theta + i\\sin 1\\theta) \\).</p>
                                    <div class="math-block text-xs overflow-x-auto">\\( r(\\cos\\theta + i\\sin\\theta) = r(\\cos\\theta + i\\sin\\theta) \\)</div>
                                    <p class="text-xs">It is true for \\( n = 1 \\).</p>
                                </div>

                                <p class="text-xs"><b>Step 2:</b> \\( n = k \\): Assume \\( [r(\\cos\\theta + i\\sin\\theta)]^k = r^k(\\cos k\\theta + i\\sin k\\theta) \\).</p>

                                <div class="space-y-2">
                                    <p class="text-xs"><b>Step 3:</b> \\( n = k + 1 \\): Prove</p>
                                    <div class="math-block text-xs overflow-x-auto">\\( [r(\\cos\\theta + i\\sin\\theta)]^{k+1} = r^{k+1}[\\cos(k+1)\\theta + i\\sin(k+1)\\theta] \\)</div>
                                </div>

                                <div class="space-y-2">
                                    <p class="text-xs"><b>Proof:</b></p>
                                    <div class="math-block text-xs overflow-x-auto">\\( \\begin{aligned} [r(\\cos\\theta + i\\sin\\theta)]^{k+1} &= [r(\\cos\\theta + i\\sin\\theta)]^k\\,[r(\\cos\\theta + i\\sin\\theta)] \\\\ &= r^k(\\cos k\\theta + i\\sin k\\theta)\\,r(\\cos\\theta + i\\sin\\theta) \\quad \\text{[From Step 2]} \\\\ &= r^{k+1}[(\\cos k\\theta\\cos\\theta - \\sin k\\theta\\sin\\theta) + i(\\sin k\\theta\\cos\\theta + \\cos k\\theta\\sin\\theta)] \\\\ &= r^{k+1}[\\cos(k+1)\\theta + i\\sin(k+1)\\theta] \\end{aligned} \\)</div>
                                </div>

                                <p class="text-xs font-bold">Therefore, assuming it is true for \\( n = k \\) means it is true for \\( n = k + 1 \\). So, true for \\( n = 1 \\) and true for \\( n = k \\) means it is true for \\( n = k + 1 \\) implies it is true for all \\( n \\in \\mathbb{N} \\).</p>
                            </div>
                        </div>
                    </div>
                `
            },
            "geo-c4": {
                title: "Greater Dublin Area (GDA) Climate Essay",
                section: "Unit 2: Core Regional Geography",
                content: `
                    <div class="space-y-4">
                        <div class="bg-indigo-950 text-white p-5 rounded-xl">

        function setupEventListeners() {
            setupSubjectPicker();
            sidebarBackdrop.addEventListener('click', closeSidebar);

            topicSearch.addEventListener('input', (e) => {
                currentState.filterText = e.target.value.toLowerCase();
                renderSidebar();

            toggleThemeBtn.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                currentState.isDark = document.documentElement.classList.contains('dark');

            fontDecBtn.addEventListener('click', () => adjustFontSize(-10));
            fontResetBtn.addEventListener('click', () => setFontSize(100));

            copyNotesBtn.addEventListener('click', () => {
                const text = notesReader.innerText;
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text);
                } else {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                }
                showToast("Notes text copied to clipboard!");
            });

                if (!document.fullscreenElement) {

                    if (document.exitFullscreen) document.exitFullscreen();

        function getFirstTopicIdOfSubject(subKey) {
            const data = SYLLABUS_DATA[subKey];
            if (data && data.sections.length > 0 && data.sections[0].chapters.length > 0) {

        function renderSidebar() {
            const subData = SYLLABUS_DATA[currentState.subject];
            sidebarSubjectTitle.textContent = subData.title;
            
            let totalChapters = 0;
            topicListContainer.innerHTML = '';

            subData.sections.forEach(sec => {
                const filteredChapters = sec.chapters.filter(ch =>
                    ch.name.toLowerCase().includes(currentState.filterText) &&
                    (!currentState.savedOnly || isFav(ch.id))
                );

                totalChapters += sec.chapters.length;
                if (filteredChapters.length === 0 && (currentState.filterText !== '' || currentState.savedOnly)) return;

                const sectionGroup = document.createElement('div');
                sectionGroup.className = 'mb-3';

                const sectionTitle = document.createElement('div');
                sectionTitle.className = 'text-[11px] font-bold text-gray-400 dark:text-slate-500 uppercase tracking-wider px-2 py-1 flex items-center justify-between cursor-pointer';
                sectionTitle.innerHTML = `<span>${sec.name}</span>`;

                const chapterList = document.createElement('div');
                chapterList.className = 'mt-1 space-y-0.5';

                filteredChapters.forEach(ch => {
                    const isActive = ch.id === currentState.activeTopicId;
                    const fav = isFav(ch.id);

                    const row = document.createElement('div');
                    row.className = `w-full rounded-lg flex items-center transition-all ${
                        isActive
                        ? 'bg-blue-600 text-white shadow-sm font-semibold'
                        : 'text-gray-700 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-900'
                    }`;

                    const itemBtn = document.createElement('button');
                    itemBtn.className = 'flex-1 min-w-0 text-left px-3 py-2 text-xs font-medium flex items-center justify-between';

                    const statusBadge = ch.status === 'ready'
                        ? `<span class="w-2 h-2 rounded-full shrink-0 ${isActive ? 'bg-white' : 'bg-emerald-500'}" title="Notes Transcribed"></span>`
                        : `<span class="text-[10px] opacity-60 shrink-0"><i class="fa-regular fa-clock"></i></span>`;

                    itemBtn.innerHTML = `<span class="truncate pr-2">${ch.name}</span>${statusBadge}`;
                    itemBtn.addEventListener('click', () => openChapter(ch.id));

                    const heartBtn = document.createElement('button');
                    heartBtn.className = 'px-2.5 py-2 text-xs shrink-0';
                    heartBtn.title = fav ? 'Remove from revision list' : 'Save to revision list';
                    heartBtn.setAttribute('aria-label', heartBtn.title);
                    heartBtn.innerHTML = fav
                        ? `<i class="fa-solid fa-heart ${isActive ? 'text-rose-200' : 'text-rose-500'}"></i>`
                        : `<i class="fa-regular fa-heart opacity-40 hover:opacity-100 hover:text-rose-500"></i>`;
                    heartBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleFav(ch.id);
                    });

                    row.appendChild(itemBtn);
                    row.appendChild(heartBtn);
                    chapterList.appendChild(row);
                });

                sectionGroup.appendChild(sectionTitle);
                sectionGroup.appendChild(chapterList);
                topicListContainer.appendChild(sectionGroup);
            });

            if (topicListContainer.children.length === 0) {
                const empty = document.createElement('p');
                empty.className = 'text-xs text-gray-400 dark:text-slate-500 text-center px-4 py-8 leading-relaxed';

                    : 'No chapters match your filter.';
                topicListContainer.appendChild(empty);

            sidebarTopicCount.textContent = `${totalChapters} Chapters`;

            // Saved-only button state
            const savedBtn = document.getElementById('saved-only-btn');
            const subjectFavCount = subData.sections.reduce((n, sec) => n + sec.chapters.filter(c => isFav(c.id)).length, 0);
            document.getElementById('saved-count').textContent = subjectFavCount;
            ['bg-rose-50', 'dark:bg-rose-950/40', 'border-rose-300', 'dark:border-rose-900'].forEach(c =>
                savedBtn.classList.toggle(c, currentState.savedOnly));
        }

        function loadTopicContent(topicId) {
            const subData = SYLLABUS_DATA[currentState.subject];
            let activeChapterObj = null;
            let activeSectionName = "";

            for (let sec of subData.sections) {
                for (let ch of sec.chapters) {

                        activeSectionName = sec.name;
                        break;
                    }
                }

            breadcrumbSubject.textContent = subData.title;
            breadcrumbSection.textContent = activeSectionName || "Section";
            breadcrumbChapter.textContent = activeChapterObj ? activeChapterObj.name : "Topic";

            contentSearch.value = '';
            setHeaderMode('chapter');

            if (NOTES_DATABASE[topicId]) {

                notesReader.innerHTML = `
                    <div class="mb-6 border-b border-gray-200 dark:border-slate-800 pb-4">

                        </div>
                        <span class="px-3 py-1 bg-amber-100 dark:bg-amber-950/60 text-amber-700 dark:text-amber-400 font-semibold text-xs rounded-full mb-3 border border-amber-200 dark:border-amber-900/50">
                            Notes Pending
                        </span>

                        <p class="text-sm text-gray-500 dark:text-slate-400 max-w-md leading-relaxed mb-8">
                            This chapter is ready for future scanned content uploads. When you provide textbook photos or scans for this chapter, complete summaries and worked examples will appear here.
                        </p>

        // ===== Custom subject picker =====
        const SUBJECT_META = {

        };

        function subjectIconHtml(key) {
            const m = SUBJECT_META[key] || { icon: 'fa-book', color: '#64748b' };
            return `<span class="sp-ico" style="background:${m.color}"><i class="fa-solid ${m.icon}"></i></span>`;

        function updateSubjectPicker() {
            const key = currentState.subject;

        function renderSubjectPanel() {
            const panel = document.getElementById('subject-panel');
            let html = '<div class="sp-head">Choose a subject</div>';
            Object.keys(SYLLABUS_DATA).forEach(key => {
                const d = SYLLABUS_DATA[key];
                const chs = d.sections.flatMap(sec => sec.chapters);
                const ready = chs.filter(c => c.status === 'ready').length;
                const saved = chs.filter(c => isFav(c.id)).length;
                const active = key === currentState.subject;
                html += `
                    <button type="button" class="sp-item" role="option" aria-selected="${active}" data-subject="${key}">
                        ${subjectIconHtml(key)}
                        <span class="sp-text">
                            <span class="sp-name">${escapeHtml(d.title)}</span>
                            <span class="sp-sub">${ready} of ${chs.length} chapters ready${saved ? ` &middot; <i class="fa-solid fa-heart" style="color:#f43f5e"></i> ${saved} saved` : ''}</span>
                        </span>
                        ${active ? '<i class="fa-solid fa-check sp-check"></i>' : ''}
                    </button>`;
            });
            panel.innerHTML = html;
        }

        function openSubjectPanel() {
            renderSubjectPanel();
            document.getElementById('subject-panel').hidden = false;
            document.getElementById('subject-btn').setAttribute('aria-expanded', 'true');

            document.getElementById('subject-panel').hidden = true;
            document.getElementById('subject-btn').setAttribute('aria-expanded', 'false');
            document.getElementById('subject-picker').classList.remove('sp-open');

        function setSubject(key) {
            if (key === currentState.subject) return;
            currentState.subject = key;
            updateSubjectPicker();
            showHome();
            openSidebar(); // open the menu so you can pick a chapter straight away (mobile)

        function setupSubjectPicker() {
            const btn = document.getElementById('subject-btn');
            const panel = document.getElementById('subject-panel');
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                panel.hidden ? openSubjectPanel() : closeSubjectPanel();
            });
            panel.addEventListener('click', (e) => {
                const item = e.target.closest('[data-subject]');
                if (!item) return;
                const key = item.dataset.subject;
                closeSubjectPanel();
                setSubject(key);
            });
            document.addEventListener('click', (e) => {
                if (!panel.hidden && !document.getElementById('subject-picker').contains(e.target)) closeSubjectPanel();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !panel.hidden) { closeSubjectPanel(); btn.focus(); }

        // ===== Saved topics (revision list) + Home page =====
        const STORE_KEY = 'lcRevisionHub.v1';
        let store = { favs: {}, last: null, quiz: {} };

        function loadStore() {
            try {
                const raw = localStorage.getItem(STORE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && typeof parsed === 'object') {
                        store.favs = parsed.favs || {};
                        store.last = parsed.last || null;
                        store.quiz = parsed.quiz || {};
                    }
                }
            } catch (e) { /* storage unavailable: fall back to in-memory only */ }
        }

        function saveStore() {
            try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {}
        }

        function findChapter(id) {
            for (const subKey of Object.keys(SYLLABUS_DATA)) {
                for (const sec of SYLLABUS_DATA[subKey].sections) {
                    for (const ch of sec.chapters) {
                        if (ch.id === id) return { subKey, subTitle: SYLLABUS_DATA[subKey].title, secName: sec.name, ch };
                    }
                }
            }
            return null;
        }

        function isFav(id) { return !!store.favs[id]; }

        function toggleFav(id) {
            if (isFav(id)) {
                delete store.favs[id];
                showToast('Removed from revision list');
            } else {
                store.favs[id] = { added: Date.now(), reviewed: null };
                showToast('Saved to revision list');
            }
            saveStore();
            renderSidebar();
            updateFavButton();
            if (currentState.activeTopicId === null) renderHome();
        }

        function markReviewed(id) {
            if (!store.favs[id]) return;
            store.favs[id].reviewed = Date.now();
            saveStore();
            showToast('Marked as reviewed');
            renderHome();
        }

        function daysSince(ts) {
            const startOf = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x.getTime(); };
            return Math.round((startOf(Date.now()) - startOf(ts)) / 86400000);
        }

        function reviewInfo(entry) {
            if (!entry.reviewed) return { due: true, text: 'Not reviewed yet' };
            const d = daysSince(entry.reviewed);
            const text = d === 0 ? 'Reviewed today' : d === 1 ? 'Reviewed yesterday' : `Reviewed ${d} days ago`;
            return { due: d >= 3, text };
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function openChapter(id) {
            const found = findChapter(id);
            if (!found) return;
            currentState.subject = found.subKey;
            updateSubjectPicker();
            currentState.activeTopicId = id;
            store.last = id;
            saveStore();
            renderSidebar();
            loadTopicContent(id);
            document.getElementById('notes-scroll-container').scrollTop = 0;
            closeSidebar();
        }

        function updateFavButton() {
            const id = currentState.activeTopicId;
            const btn = document.getElementById('fav-btn');
            if (!id) { btn.classList.add('hidden'); return; }
            btn.classList.remove('hidden');
            const fav = isFav(id);
            document.getElementById('fav-icon').className = fav ? 'fa-solid fa-heart text-rose-500' : 'fa-regular fa-heart';
            document.getElementById('fav-label').textContent = fav ? 'Saved' : 'Save';
            btn.title = fav ? 'Remove from revision list' : 'Save to revision list';
        }

        function setHeaderMode(mode) {
            const isChapter = mode === 'chapter';
            [breadcrumbSection, breadcrumbChapter].forEach(el => {
                el.classList.toggle('hidden', !isChapter);
                if (el.previousElementSibling) el.previousElementSibling.classList.toggle('hidden', !isChapter);
            });
            copyNotesBtn.classList.toggle('hidden', !isChapter);
            updateFavButton();
        }

        function showHome() {
            currentState.activeTopicId = null;
            renderSidebar();
            breadcrumbSubject.textContent = 'Home';
            contentSearch.value = '';
            setHeaderMode('home');
            renderHome();
            document.getElementById('notes-scroll-container').scrollTop = 0;
        }

        function renderHome() {
            const ids = Object.keys(store.favs).filter(id => findChapter(id));
            // least recently reviewed first (never reviewed at the top)
            ids.sort((a, b) => (store.favs[a].reviewed || 0) - (store.favs[b].reviewed || 0));
            const dueCount = ids.filter(id => reviewInfo(store.favs[id]).due).length;

            const hour = new Date().getHours();
            const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';

            let cards = '';
            ids.forEach(id => {
                const f = findChapter(id);
                const info = reviewInfo(store.favs[id]);
                const pending = f.ch.status !== 'ready';
                cards += `
                    <div class="p-4 rounded-xl border border-gray-200 dark:border-slate-800 bg-white dark:bg-slate-950 flex flex-col gap-3">
                        <div class="flex items-start justify-between gap-2">
                            <div class="min-w-0">
                                <span class="text-[10px] font-bold uppercase tracking-wider text-gray-400 dark:text-slate-500">${escapeHtml(f.subTitle)} &middot; ${escapeHtml(f.secName)}</span>
                                <h3 class="font-bold text-sm mt-0.5 text-gray-900 dark:text-white">${escapeHtml(f.ch.name)}</h3>
                            </div>
                            <span class="shrink-0 text-[10px] font-bold px-2 py-0.5 rounded-full ${info.due
                                ? 'bg-amber-100 dark:bg-amber-950/60 text-amber-700 dark:text-amber-400'
                                : 'bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-400'}">${info.due ? 'Due' : 'Done'}</span>
                        </div>
                        <p class="text-xs text-gray-500 dark:text-slate-400">${info.text}${pending ? ' &middot; notes still pending' : ''}</p>
                        <div class="flex items-center gap-2">
                            <button data-action="open" data-id="${id}" class="flex-1 px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white transition-colors">Open notes</button>
                            <button data-action="reviewed" data-id="${id}" title="Mark as reviewed" aria-label="Mark as reviewed" class="px-3 py-1.5 rounded-lg text-xs border border-gray-200 dark:border-slate-700 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-slate-900 transition-colors"><i class="fa-solid fa-check"></i></button>
                            <button data-action="unfav" data-id="${id}" title="Remove from revision list" aria-label="Remove from revision list" class="px-3 py-1.5 rounded-lg text-xs border border-gray-200 dark:border-slate-700 hover:bg-rose-50 dark:hover:bg-slate-900 transition-colors"><i class="fa-solid fa-heart text-rose-500"></i></button>
                        </div>
                    </div>`;
            });

            const empty = `
                <div class="p-8 rounded-xl border border-dashed border-gray-300 dark:border-slate-700 text-center">
                    <i class="fa-regular fa-heart text-3xl text-rose-400 mb-3"></i>
                    <p class="text-sm font-semibold text-gray-800 dark:text-slate-200">Nothing saved yet</p>
                    <p class="text-xs text-gray-500 dark:text-slate-400 mt-1 max-w-sm mx-auto leading-relaxed">Tap the heart next to any chapter in the menu (or the Save button at the top of a chapter) and it will show up here as a reminder to revise it again.</p>
                </div>`;

            const last = store.last ? findChapter(store.last) : null;
            const continueCard = last ? `

        function enlargeFormulas(root) {
            if (!root) return;
            root.querySelectorAll('.math-block, .font-mono').forEach(el => {
                if (el.tagName === 'TD' || el.tagName === 'TH') return;
                const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
                let node;
                while ((node = walker.nextNode())) {
                    if (node.nodeValue.indexOf('\\(') !== -1) {
                        node.nodeValue = node.nodeValue.replace(/\\\((?!\s*\\displaystyle)/g, '\\(\\displaystyle ');
                    }
                }
            });
        }

        function switchTab(tabId, btn) {
            const container = btn.closest('#notes-body');
            if (!container) return;
            
            const tabs = container.querySelectorAll('.tab-content');
            tabs.forEach(t => t.classList.add('hidden'));

            const targetTab = container.querySelector(`#${tabId}`);
            if (targetTab) targetTab.classList.remove('hidden');

            const tabBtns = container.querySelectorAll('.tab-btn');
            tabBtns.forEach(b => {
                b.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600', 'active');
                b.classList.add('text-gray-500');
            });

            btn.classList.remove('text-gray-500');
            btn.classList.add('text-blue-600', 'border-b-2', 'border-blue-600', 'active');
        }

        function adjustFontSize(delta) {
            currentState.fontSize = Math.min(Math.max(currentState.fontSize + delta, 70), 150);
            setFontSize(currentState.fontSize);
        }

        function setFontSize(size) {
            currentState.fontSize = size;
            notesReader.style.fontSize = `${currentState.fontSize}%`;
            const mReset = document.getElementById('m-font-reset');
            if (mReset) mReset.textContent = `${currentState.fontSize}%`;
            showToast(`Font size set to ${currentState.fontSize}%`);
        }

        function filterContentTerms(query) {
            const body = document.getElementById('notes-body');
            if (!body) return;

            const elements = body.querySelectorAll('.math-block, .srp-box, .border');
            elements.forEach(el => {
                if (!query) {
                    el.style.opacity = '1';
                } else {
                    const text = el.innerText.toLowerCase();
                    el.style.opacity = text.includes(query) ? '1' : '0.3';
                }
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');

            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-16', 'opacity-0');
            }, 2500);

], "e": "where \\(d = x - \\mu\\)."}, {"c": "m2-c21", "q": "The empirical rule says about __ of the data lies within 2 standard deviations of the mean.", "a": "95%", "w": ["68%", "99.7%", "50%"], "e": "68% within 1σ, 95% within 2σ, 99.7% within 3σ."}, {"c": "m2-c21", "q": "\\(z = 2\\) arises from \\(x = 70\\), \\(\\mu = 60\\) and \\(\\sigma =\\)", "a": "\\(5\\)", "w": ["\\(10\\)", "\\(2\\)", "\\(20\\)"], "e": "\\(z = \\frac{x - \\mu}{\\sigma} = \\frac{10}{5}\\)."}, {"c": "m2-c22", "q": "A 95% confidence interval for \\(\\mu\\) with \\(\\bar{x} = 50\\), \\(\\sigma = 10\\), \\(n = 100\\) is:", "a": "\\((48.04,\\, 51.96)\\)", "w": ["\\((40,\\, 60)\\)", "\\((49,\\, 51)\\)", "\\((30.4,\\, 69.6)\\)"], "e": "\\(\\bar{x} \\pm 1.96\\frac{\\sigma}{\\sqrt{n}} = 50 \\pm 1.96\\)."}, {"c": "m2-c22", "q": "At the 5% level you reject \\(H_0\\) if:", "a": "\\(\\bar{z} \\lt -1.96\\) or \\(\\bar{z} \\gt 1.96\\)", "w": ["\\(-1.96 \\lt \\bar{z} \\lt 1.96\\)", "\\(p \\geq 0.05\\)", "\\(\\bar{z} = 0\\)"], "e": "Also reject if p < 0.05."}, {"c": "m2-c22", "q": "The alternative hypothesis H₁ is:", "a": "the opposite of the null hypothesis", "w": ["the same as the null hypothesis", "always true", "a sample statistic"], "e": "H₀ is the stand-alone claim or \"no change\" statement."}, {"c": "phy-c1", "q": "An error that makes every measurement too high (or every one too low) is a:", "a": "systematic error", "w": ["random error", "precision error", "order of magnitude"], "e": "Systematic errors always push the value in the same direction."}, {"c": "phy-c1", "q": "Random errors:", "a": "vary unpredictably in both directions around the true value", "w": ["always make the value too high", "are removed by using SI units", "show how accurate the true value is"], "e": "Some readings come out too high and others too low."}, {"c": "phy-c1", "q": "Precise measurements are:", "a": "clustered closely together", "w": ["clustered around the correct value", "always equal to the true value", "always accurate"], "e": "Accurate = close to the correct value. Precise = close to each other."}, {"c": "phy-c1", "q": "Error is calculated as:", "a": "the true value − the estimate", "w": ["the estimate ÷ the true value", "the true value + the estimate", "the estimate × the true value"], "e": "Percentage error divides this by the true value and multiplies by 100."}, {"c": "phy-c1", "q": "The order of magnitude of \\(4.5 \\times 10^{3}\\) is:", "a": "\\(3\\)", "w": ["\\(4\\)", "\\(4.5\\)", "\\(10\\)"], "e": "It is the power of 10 when written in scientific notation."}, {"c": "phy-c2", "q": "A luminous object:", "a": "gives out its own light", "w": ["only reflects light", "absorbs all light", "is always a mirror"], "e": "A non-luminous object does not give out its own light."}, {"c": "phy-c2", "q": "The speed of light in a vacuum is:", "a": "\\(3 \\times 10^{8}\\ \\text{m s}^{-1}\\)", "w": ["\\(3 \\times 10^{6}\\ \\text{m s}^{-1}\\)", "\\(3 \\times 10^{10}\\ \\text{m s}^{-1}\\)", "\\(340\\ \\text{m s}^{-1}\\)"], "e": "Very high speed, in straight lines."}, {"c": "phy-c2", "q": "A beam of light that gets narrower is:", "a": "convergent", "w": ["divergent", "parallel", "diffuse"], "e": "Divergent gets wider; parallel stays the same width."}, {"c": "phy-c2", "q": "The second law of reflection says the angle of incidence equals:", "a": "the angle of reflection", "w": ["the angle of refraction", "\\(90^\\circ\\)", "the critical angle"], "e": "\\(i = r\\)."}, {"c": "phy-c2", "q": "Diffuse reflection is:", "a": "scattering of light in all directions from a surface", "w": ["reflection from a smooth mirror in one direction", "bending of light entering glass", "absorption of light"], "e": "Regular reflection obeys the laws of reflection from a smooth surface."}, {"c": "phy-c2", "q": "The image formed in a plane mirror is:", "a": "virtual", "w": ["real", "upside-down and real", "magnified and real"], "e": "A virtual image forms by the apparent intersection of rays."}, {"c": "phy-c3", "q": "Refraction is:", "a": "the bending of light when it travels between media in which its speed is different", "w": ["the bouncing of light off a surface", "the scattering of light in all directions", "the absorption of light by a medium"], "e": "Light changes speed (and so direction) as it enters a new medium."}, {"c": "phy-c3", "q": "Light travelling from air into glass (rarer to denser) is refracted:", "a": "towards the normal", "w": ["away from the normal", "not at all", "along the surface"], "e": "Denser to rarer bends away from the normal."}, {"c": "phy-c3", "q": "Snell's law states that:", "a": "\\(\\dfrac{\\sin i}{\\sin r} = n\\), a constant", "w": ["\\(\\sin i \\times \\sin r = n\\)", "\\(\\dfrac{i}{r} = n\\)", "\\(\\dfrac{\\cos i}{\\cos r} = n\\)"], "e": "The ratio of the sines is constant."}, {"c": "phy-c3", "q": "The refractive index in terms of the critical angle C is:", "a": "\\(n = \\dfrac{1}{\\sin C}\\)", "w": ["\\(n = \\sin C\\)", "\\(n = \\dfrac{1}{\\cos C}\\)", "\\(n = \\dfrac{C}{90}\\)"], "e": "At the critical angle, r = 90°."}, {"c": "phy-c3", "q": "Total internal reflection happens when light goes from a denser to a rarer medium at an angle of incidence:", "a": "greater than the critical angle", "w": ["less than the critical angle", "equal to 0°", "equal to the angle of refraction"], "e": "All the light is reflected back into the denser medium."}, {"c": "phy-c3", "q": "Refraction does NOT occur if the light:", "a": "enters the second medium parallel to the normal", "w": ["goes from air to glass", "slows down in the new medium", "enters at 45°"], "e": "Also none if the refractive indices are the same."}, {"c": "phy-c4", "q": "A converging lens is also called a:", "a": "convex lens", "w": ["concave lens", "plane lens", "prism"], "e": "A diverging lens is concave."}, {"c": "phy-c4", "q": "Which lens can only produce a virtual image?", "a": "diverging lens", "w": ["converging lens", "both lenses", "neither lens"], "e": "A converging lens can produce real and virtual images."}, {"c": "phy-c4", "q": "The lens formula is:", "a": "\\(\\dfrac{1}{u} + \\dfrac{1}{v} = \\dfrac{1}{f}\\)", "w": ["\\(u + v = f\\)", "\\(\\dfrac{1}{u} - \\dfrac{1}{v} = f\\)", "\\(uv = f\\)"], "e": "Provided u, v and f have the correct signs."}, {"c": "phy-c4", "q": "A magnifying glass is:", "a": "a converging lens producing a magnified virtual image", "w": ["a diverging lens producing a real image", "a plane mirror", "a prism"], "e": "Object closer than the focal length."}, {"c": "phy-c5", "q": "Velocity is the rate of change of:", "a": "displacement with respect to time", "w": ["distance with respect to time", "speed with respect to time", "acceleration with respect to time"], "e": "Speed uses distance; velocity uses displacement (distance in a direction)."}, {"c": "phy-c5", "q": "The slope of a distance–time graph is:", "a": "the speed", "w": ["the acceleration", "the displacement", "the momentum"], "e": "For a displacement–time graph the slope is the velocity."}, {"c": "phy-c5", "q": "Displacement is:", "a": "distance in a given direction", "w": ["the total path length only", "speed × time only", "the same thing as speed"], "e": "It is a vector."}, {"c": "phy-c5", "q": "The SI unit of speed is:", "a": "\\(\\text{m s}^{-1}\\)", "w": ["\\(\\text{m s}^{-2}\\)", "\\(\\text{m}\\)", "\\(\\text{kg m s}^{-1}\\)"], "e": "Metres per second."}, {"c": "phy-c6", "q": "Average acceleration equals:", "a": "change in velocity ÷ time taken", "w": ["change in distance ÷ time taken", "velocity × time taken", "force ÷ time taken"], "e": "\\(a = \\frac{v - u}{t}\\)."}, {"c": "phy-c6", "q": "A car at \\(5\\ \\text{m s}^{-1}\\) accelerates at \\(2\\ \\text{m s}^{-2}\\) for \\(4\\ \\text{s}\\). Its final velocity is:", "a": "\\(13\\ \\text{m s}^{-1}\\)", "w": ["\\(8\\ \\text{m s}^{-1}\\)", "\\(11\\ \\text{m s}^{-1}\\)", "\\(40\\ \\text{m s}^{-1}\\)"], "e": "\\(v = u + at = 5 + 2 \\times 4\\)."}, {"c": "phy-c6", "q": "The area under a velocity–time graph gives:", "a": "the distance travelled (displacement)", "w": ["the acceleration", "the speed", "the force"], "e": "The slope gives the acceleration."}, {"c": "phy-c6", "q": "From rest, \\(a = 3\\ \\text{m s}^{-2}\\) over \\(s = 6\\ \\text{m}\\). The final speed is:", "a": "\\(6\\ \\text{m s}^{-1}\\)", "w": ["\\(3\\ \\text{m s}^{-1}\\)", "\\(18\\ \\text{m s}^{-1}\\)", "\\(36\\ \\text{m s}^{-1}\\)"], "e": "\\(v^2 = u^2 + 2as = 0 + 2(3)(6) = 36\\), so \\(v = 6\\)."}, {"c": "phy-c6", "q": "For an object thrown upwards (up taken as positive), the acceleration is:", "a": "\\(-g\\) for the whole flight", "w": ["\\(+g\\) on the way up and \\(-g\\) on the way down", "zero at the top", "zero on the way up"], "e": "Gravity always acts downwards."}, {"c": "phy-c7", "q": "A scalar quantity has:", "a": "magnitude only", "w": ["magnitude and direction", "direction only", "neither"], "e": "A vector has both."}, {"c": "phy-c7", "q": "A vector \\(v\\) makes angle \\(\\theta\\) with the component \\(x\\). Then \\(x =\\)", "a": "\\(v\\cos\\theta\\)", "w": ["\\(v\\sin\\theta\\)", "\\(v\\tan\\theta\\)", "\\(\\dfrac{v}{\\cos\\theta}\\)"], "e": "And \\(y = v\\sin\\theta\\)."}, {"c": "phy-c7", "q": "Three forces keep a particle at rest. The resultant of any two of them is:", "a": "equal in magnitude but opposite in direction to the third force", "w": ["equal to the third force in direction", "zero", "twice the third force"], "e": "So all three balance."}, {"c": "phy-c7", "q": "Which of these is a vector?", "a": "displacement", "w": ["mass", "time", "speed"], "e": "Displacement has magnitude and direction."}, {"c": "phy-c8", "q": "Newton's second law in equation form is:", "a": "\\(F = ma\\)", "w": ["\\(F = \\dfrac{m}{a}\\)", "\\(F = mv\\)", "\\(F = m + a\\)"], "e": "Force = mass × acceleration."}, {"c": "phy-c8", "q": "\\(1\\ \\text{N}\\) is equal to:", "a": "\\(1\\ \\text{kg m s}^{-2}\\)", "w": ["\\(1\\ \\text{kg m s}^{-1}\\)", "\\(1\\ \\text{kg m}^{2}\\ \\text{s}^{-2}\\)", "\\(1\\ \\text{kg s}^{-2}\\)"], "e": "The force that gives 1 kg an acceleration of 1 m s⁻²."}, {"c": "phy-c8", "q": "With \\(g = 9.8\\ \\text{m s}^{-2}\\), the weight of a 5 kg mass is:", "a": "\\(49\\ \\text{N}\\)", "w": ["\\(5\\ \\text{N}\\)", "\\(1.96\\ \\text{N}\\)", "\\(490\\ \\text{N}\\)"], "e": "\\(W = mg = 5 \\times 9.8\\)."}, {"c": "phy-c8", "q": "Newton's third law says:", "a": "action and reaction are equal and opposite", "w": ["force equals mass times velocity", "a body at rest stays at rest", "momentum is always zero"], "e": "A exerts a force on B, so B exerts an equal but opposite force on A."}, {"c": "phy-c8", "q": "The momentum of a 2 kg object moving at \\(3\\ \\text{m s}^{-1}\\) is:", "a": "\\(6\\ \\text{kg m s}^{-1}\\)", "w": ["\\(1.5\\ \\text{kg m s}^{-1}\\)", "\\(5\\ \\text{kg m s}^{-1}\\)", "\\(18\\ \\text{kg m s}^{-1}\\)"], "e": "\\(p = mv\\)."}, {"c": "phy-c8", "q": "Momentum is conserved in an interaction provided:", "a": "no external forces act on the system", "w": ["the bodies have equal mass", "the bodies are at rest", "the collision is perfectly elastic"], "e": "Total momentum before = total momentum after."}, {"c": "m2-c22", "q": "A sample-size calculation gives n ≥ 96.04. How many people should you survey?", "a": "97", "w": ["96", "96.04", "95"], "e": "Always round the sample size up: you cannot survey part of a person, and rounding down would make the margin of error too big."}, {"c": "phy-c6", "q": "To derive \\(s = ut + \\tfrac{1}{2}at^2\\) you use displacement = average velocity × time, where (for constant acceleration) the average velocity is:", "a": "\\(\\dfrac{u + v}{2}\\)", "w": ["\\(\\dfrac{v - u}{2}\\)", "\\(uv\\)", "\\(u + v\\)"], "e": "Then substitute \\(v = u + at\\): \\(s = \\frac{(2u + at)t}{2}\\)."}, {"c": "phy-c6", "q": "Squaring \\(v = u + at\\) gives \\(v^2 = u^2 + 2a\\left(ut + \\tfrac{1}{2}at^2\\right)\\). Since \\(ut + \\tfrac{1}{2}at^2 = s\\), this becomes:", "a": "\\(v^2 = u^2 + 2as\\)", "w": ["\\(v^2 = u^2 + as\\)", "\\(v = u^2 + 2as\\)", "\\(v^2 = u + 2as\\)"], "e": "This is how the third equation of motion is derived."}, {"c": "phy-c6", "q": "Starting from \\(a = \\dfrac{v - u}{t}\\), the first equation of motion is obtained by:", "a": "multiplying by \\(t\\) to get \\(at = v - u\\), then adding \\(u\\)", "w": ["dividing by \\(t\\) again", "squaring both sides", "multiplying by \\(u\\)"], "e": "This gives \\(v = u + at\\)."}, {"c": "phy-c9", "q": "The SI unit of pressure is the pascal. \\(1\\ \\text{Pa}\\) equals:", "a": "\\(1\\ \\text{N m}^{-2}\\)", "w": ["\\(1\\ \\text{N m}\\)", "\\(1\\ \\text{kg m}^{-3}\\)", "\\(1\\ \\text{J s}^{-1}\\)"], "e": "Force per unit area."}, {"c": "phy-c9", "q": "The pressure due to a liquid at depth \\(h\\) (density \\(\\rho\\)) is:", "a": "\\(P = h\\rho g\\)", "w": ["\\(P = \\dfrac{\\rho g}{h}\\)", "\\(P = \\dfrac{h\\rho}{g}\\)", "\\(P = \\dfrac{h}{\\rho g}\\)"], "e": "Pressure increases with depth."}, {"c": "phy-c9", "q": "In a liquid open to the atmosphere, the absolute pressure at depth h is:", "a": "\\(P_{\\text{atm}} + h\\rho g\\)", "w": ["\\(h\\rho g\\)", "\\(P_{\\text{atm}} - h\\rho g\\)", "\\(P_{\\text{atm}} \\times h\\rho g\\)"], "e": "Atmospheric pressure plus the pressure due to the liquid."}, {"c": "phy-c9", "q": "A floating object has a buoyancy force that is:", "a": "equal in magnitude to its weight", "w": ["greater than its weight", "zero", "equal to its mass"], "e": "Buoyancy (upthrust) comes from the greater pressure deeper in the fluid."}, {"c": "phy-c9", "q": "Newton's law of universal gravitation is:", "a": "\\(F = \\dfrac{Gm_1m_2}{d^2}\\)", "w": ["\\(F = \\dfrac{Gm_1m_2}{d}\\)", "\\(F = \\dfrac{G(m_1 + m_2)}{d^2}\\)", "\\(F = Gm_1m_2d^2\\)"], "e": "It is an inverse square law."}, {"c": "phy-c9", "q": "The SI unit of gravitational field strength is:", "a": "\\(\\text{N kg}^{-1}\\)", "w": ["\\(\\text{kg N}^{-1}\\)", "\\(\\text{N m}\\)", "\\(\\text{m s}^{-1}\\)"], "e": "\\(g = \\frac{F}{m}\\)."}, {"c": "phy-c9", "q": "The escape velocity at distance \\(r\\) from the Earth\\'s centre is:", "a": "\\(v_e = \\sqrt{\\dfrac{2GM}{r}}\\)", "w": ["\\(v_e = \\sqrt{\\dfrac{GM}{r}}\\)", "\\(v_e = \\dfrac{2GM}{r}\\)", "\\(v_e = \\sqrt{\\dfrac{GM}{2r}}\\)"], "e": "Higher level."}, {"c": "phy-c10", "q": "Work done by a force \\(F\\) over displacement \\(s\\) in the direction of the force:", "a": "\\(W = Fs\\)", "w": ["\\(W = \\dfrac{F}{s}\\)", "\\(W = Ft\\)", "\\(W = F + s\\)"], "e": "Unit: the joule, \\(1\\ \\text{J} = 1\\ \\text{N m}\\)."}, {"c": "phy-c10", "q": "\\(1\\ \\text{W}\\) is equal to:", "a": "\\(1\\ \\text{J s}^{-1}\\)", "w": ["\\(1\\ \\text{J s}\\)", "\\(1\\ \\text{N m}^{-1}\\)", "\\(1\\ \\text{kg m s}^{-1}\\)"], "e": "Power is the rate of doing work."}, {"c": "phy-c10", "q": "Kinetic energy is:", "a": "\\(E_k = \\tfrac{1}{2}mv^2\\)", "w": ["\\(E_k = mv^2\\)", "\\(E_k = mgh\\)", "\\(E_k = \\tfrac{1}{2}mv\\)"], "e": "Energy due to motion."}, {"c": "phy-c10", "q": "A 2 kg mass is raised 5 m (take \\(g = 9.8\\ \\text{m s}^{-2}\\)). Its gain in potential energy is:", "a": "\\(98\\ \\text{J}\\)", "w": ["\\(10\\ \\text{J}\\)", "\\(49\\ \\text{J}\\)", "\\(196\\ \\text{J}\\)"], "e": "\\(E_p = mgh = 2 \\times 9.8 \\times 5\\)."}, {"c": "phy-c10", "q": "In collisions:", "a": "momentum is always conserved (no external forces) but kinetic energy is not always", "w": ["kinetic energy is always conserved but momentum is not", "neither is ever conserved", "both are always conserved"], "e": "Some kinetic energy can be converted to other forms."}, {"c": "phy-c11", "q": "Centripetal acceleration for speed \\(v\\) in a circle of radius \\(r\\) is:", "a": "\\(a = \\dfrac{v^2}{r}\\)", "w": ["\\(a = vr\\)", "\\(a = \\dfrac{v}{r^2}\\)", "\\(a = \\dfrac{r}{v^2}\\)"], "e": "The force is \\(F = \\frac{mv^2}{r}\\)."}, {"c": "phy-c11", "q": "Kepler's third law says:", "a": "\\(T^2 \\propto R^3\\)", "w": ["\\(T \\propto R^2\\)", "\\(T^3 \\propto R^2\\)", "\\(T \\propto R\\)"], "e": "Period squared is proportional to radius cubed."}, {"c": "phy-c11", "q": "A geostationary satellite has a period of:", "a": "24 hours (and orbits in the equatorial plane in the Earth's direction of rotation)", "w": ["12 hours", "90 minutes", "1 year"], "e": "So it stays above the same point on the Earth."}, {"c": "phy-c11", "q": "A particle moving at constant speed in a circle is:", "a": "accelerating, because its direction keeps changing", "w": ["not accelerating", "slowing down", "moving with constant velocity"], "e": "Velocity changes direction, so it accelerates towards the centre."}, {"c": "phy-c12", "q": "Hooke's law states that the restoring force is:", "a": "directly proportional to the displacement, provided the elastic limit is not exceeded", "w": ["inversely proportional to the displacement", "equal to the displacement squared", "constant for any displacement"], "e": "\\(F = -ks\\)."}, {"c": "phy-c12", "q": "A spring with \\(k = 200\\ \\text{N m}^{-1}\\) is stretched \\(0.1\\ \\text{m}\\). The elastic potential energy is:", "a": "\\(1\\ \\text{J}\\)", "w": ["\\(2\\ \\text{J}\\)", "\\(20\\ \\text{J}\\)", "\\(0.5\\ \\text{J}\\)"], "e": "\\(\\tfrac{1}{2}ks^2 = \\tfrac{1}{2}(200)(0.01)\\)."}, {"c": "phy-c12", "q": "The equilibrium position of an oscillating spring is where:", "a": "the resultant force on the object is zero", "w": ["the speed is zero", "the spring is fully stretched", "the energy is zero"], "e": "Total energy stays the same throughout the motion."}, {"c": "phy-c13", "q": "The SI unit of temperature is the:", "a": "kelvin", "w": ["degree Celsius", "joule", "watt"], "e": "Degrees Celsius is the practical everyday unit."}, {"c": "phy-c13", "q": "A temperature of \\(300\\ \\text{K}\\) in degrees Celsius is:", "a": "\\(26.85\\ ^\\circ\\text{C}\\)", "w": ["\\(573.15\\ ^\\circ\\text{C}\\)", "\\(273.15\\ ^\\circ\\text{C}\\)", "\\(300\\ ^\\circ\\text{C}\\)"], "e": "\\(\\theta = T - 273.15\\)."}, {"c": "phy-c13", "q": "Which is an example of a thermometric property?", "a": "electrical resistance", "w": ["ma raisal", "induction"], "e": "Formative appraisal is ongoing, informal feedback."}, {"c": "bus-c15", "q": "Which mode of communication is best when a permanent record is required?", "a": "Written", "w": ["Verbal", "Non-verbal", "Gestures"], "e": "Choose written formats for reports, policies and financial matters."}, {"c": "bus-c15", "q": "Explaining what's happening and why helps an organisation to:", "a": "manage change", "w": ["reduce its tax bill", "avoid all conflict", "increase prices"], "e": "It reduces uncertainty around change."}, {"c": "bus-c16", "q": "In force-field analysis, the forces that inhibit change are called:", "a": "restraining forces", "w": ["driving forces", "external forces", "contingency forces"], "e": "Driving forces push for change."}, {"c": "bus-c16", "q": "A contingency plan is:", "a": "a back-up plan for unexpected events or emergencies", "w": ["a plan to raise finance", "a yearly marketing calendar", "a plan to open new branches"], "e": "It helps respond quickly, protect assets and maintain operations."}, {"c": "bus-c17", "q": "Under the Consumer Rights Act 2022, a faulty product can be returned for a full refund within:", "a": "30 days", "w": ["7 days", "14 days", "6 months"], "e": "After that the consumer may seek a repair or replacement."}, {"c": "bus-c17", "q": "The maximum compensation the Small Claims Court can award is:", "a": "€2,000", "w": ["€200", "€5,000", "€20,000"], "e": "It costs €25 to apply and no solicitor is needed."}, {"c": "bus-c17", "q": "Under GDPR a data breach must be reported to the Data Protection Commission within:", "a": "72 hours", "w": ["24 hours", "7 days", "30 days"], "e": "Penalties can be up to €20m or 4% of global turnover."}, {"c": "bus-c18", "q": "Who is the financial regulator in Ireland?", "a": "Central Bank of Ireland", "w": ["CCPC", "IDA Ireland", "Ombudsman"], "e": "It licenses and supervises banks."}, {"c": "bus-c18", "q": "A CBDC is:", "a": "a digital version of cash issued and backed by a central bank", "w": ["a decentralised, unregulated digital asset", "a coin pegged to gold run by a private firm", "a type of credit card"], "e": "Crypto is decentralised; stablecoins are pegged to real-world assets."}, {"c": "bus-c19", "q": "The maximum working week under employment law is:", "a": "48 hours", "w": ["35 hours", "40 hours", "60 hours"], "e": "Employees are also entitled to proper breaks."}, {"c": "bus-c19", "q": "Employees are protected from unfair dismissal once they have:", "a": "12 months of continuous service", "w": ["1 month of service", "6 months of service", "5 years of service"], "e": "Employers must provide fair procedures."}, {"c": "bus-c19", "q": "An increase in tax credits would:", "a": "increase an employee's take-home pay", "w": ["decrease take-home pay", "have no effect on pay", "raise the minimum wage"], "e": "A higher income tax rate would decrease take-home pay."}];
        const quiz = { subject: null, session: null };

        const qSubjectOf = (cid) => { const f = findChapter(cid); return f ? f.subKey : null; };
        const qBankFor = (subKey) => QUIZ_BANK.filter(q => qSubjectOf(q.c) === subKey);
        const qSubjectsWithQuestions = () => Object.keys(SYLLABUS_DATA).filter(k => qBankFor(k).length);

        function qMastery(cid) {
            const e = store.quiz && store.quiz[cid];
            if (!e || !e.h || !e.h.length) return { st: 'none', pct: null, n: 0 };
            const h = e.h.slice(-8), r = h.filter(Boolean).length, pct = Math.round(100 * r / h.length);

        function qRender(html) {
