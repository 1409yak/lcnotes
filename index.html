leading-tight" style="color:#22c55e">300,000+</div><div class="text-[11px] text-gray-600 dark:text-slate-300">new homes by end of 2030</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">2</div><div class="min-w-0"><div class="int-title">Government policy vs legislation</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Policy</div><div class="p-2 leading-snug">A strategy or set of guidelines the government adopts to achieve an economic, social or environmental target. Provides direction but is not law and not mandatory.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Legislation</div><div class="p-2 leading-snug">Legally binding on businesses; they must comply or face penalties or fines.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">3</div><div class="min-w-0"><div class="int-title">Role of business in developing national policy</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Interest groups</div><div class="p-2 leading-snug">Represent businesses/industries with a common goal. IBEC (Irish Business and Employers Confederation) lobbies government on tax policy, employment law and economic development.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Lobbying</div><div class="p-2 leading-snug">Actions to influence decisions made by politicians, government officials or public bodies: direct engagement, public consultation and media campaigns to raise awareness.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">4</div><div class="min-w-0"><div class="int-title">Key decision-makers in European policy</div></div></div><div class="flex flex-wrap items-center gap-4 mt-2"><svg viewBox="0 0 310 170" class="w-full" style="color:#64748b;max-width:465px" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="46" width="84" height="42" rx="6" fill="#3b82f6" stroke="none" stroke-width="1.2" opacity="1"/><text x="46" y="62.5" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="600">European</text><text x="46" y="73.5" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="600">Commission</text><text x="46.0" y="103.5" font-size="8" text-anchor="middle" fill="currentColor">drafts and proposes</text><rect x="130" y="10" width="96" height="34" rx="6" fill="#8b5cf6" stroke="none" stroke-width="1.2" opacity="1"/><text x="178" y="23.5" font-size="9" text-anchor="middle" fill="#fff" font-weight="600">European</text><text x="178" y="34.5" font-size="9" text-anchor="middle" fill="#fff" font-weight="600">Parliament</text><rect x="130" y="90" width="96" height="34" rx="6" fill="#0ea5e9" stroke="none" stroke-width="1.2" opacity="1"/><text x="178" y="103.5" font-size="9" text-anchor="middle" fill="#fff" font-weight="600">Council of</text><text x="178" y="114.5" font-size="9" text-anchor="middle" fill="#fff" font-weight="600">the EU</text><line x1="90.0" y1="60.0" x2="128.0" y2="32.0" stroke="#64748b" stroke-width="1.6"/><polygon points="128.0,32.0 125.2,37.3 122.1,33.1" fill="#64748b"/><line x1="90.0" y1="74.0" x2="128.0" y2="102.0" stroke="#64748b" stroke-width="1.6"/><polygon points="128.0,102.0 122.1,100.9 125.2,96.7" fill="#64748b"/><path d="M178 46 L178 88" stroke="#64748b" stroke-width="1.6" stroke-dasharray="3 3"/><text x="222.0" y="71.5" font-size="8.5" text-anchor="start" fill="currentColor">co-decision</text><line x1="228.0" y1="60.0" x2="262.0" y2="60.0" stroke="#64748b" stroke-width="1.6"/><polygon points="262.0,60.0 256.6,62.6 256.6,57.4" fill="#64748b"/><rect x="264" y="40" width="42" height="40" rx="6" fill="#22c55e" stroke="none" stroke-width="1.2" opacity="1"/><text x="285" y="55.5" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="600">New</text><text x="285" y="65.0" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="600">law /</text><text x="285" y="74.5" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="600">budget</text><rect x="4" y="138" width="302" height="28" rx="6" fill="#f59e0b" stroke="none" stroke-width="1.2" opacity="0.25"/><text x="155" y="149.5" font-size="8" text-anchor="middle" fill="currentColor" font-weight="600">European Central Bank: monetary policy (interest rates, money supply), inflation at or just below 2%</text></svg></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:122px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">European Commission</div><div class="p-2 leading-snug">Drafts and proposes legislation and the EU Budget to Parliament. Implements proposals using Regulations, Directives and Decisions.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:122px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">European Parliament</div><div class="p-2 leading-snug">Discusses, debates and amends proposed legislation and the EU Budget. Approves new legislation through co-decision with the Council of the EU.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:122px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Council of the EU</div><div class="p-2 leading-snug">Main decision-making body of the EU. Decides to approve new laws and the EU budget (co-decision with the Parliament).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:122px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">European Central Bank</div><div class="p-2 leading-snug">Key decision-maker for monetary policy in the Eurozone: sets interest rates and money supply. Goal: keep inflation at or just below 2% (raises interest rates if higher).</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">5</div><div class="min-w-0"><div class="int-title">EU regulations, directives and opinions</div><div class="int-tip">and the government's response</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Regulations</div><div class="p-2 leading-snug">Take precedence over national law. The Irish government does not have to act: it becomes law without their intervention.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Directives</div><div class="p-2 leading-snug">Require member states to reach a certain target within a specified time limit. The Irish government decides how to achieve the result.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Opinions</div><div class="p-2 leading-snug">Non-binding advice or recommendations from the EU. No legal requirement for the Irish government to take action.</div></div></div><div class="int-note"><span>💡</span><div>Strength: Regulation (law automatically) > Directive (goal binding, method flexible) > Opinion (advice only).</div></div></div></div>

                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Trading blocs</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Trading bloc</div><div class="p-2 leading-snug">A group of countries that allow free trade between them. No tariffs or trade barriers between participating countries.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Most relevant blocs</div><div class="p-2 leading-snug">EU, USMCA, Mercosur.</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Larger markets</div><div class="p-2 leading-snug">Access without tariffs/charges, e.g. EU over 450 million consumers.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Lower costs</div><div class="p-2 leading-snug">Source raw materials, equipment and components more cheaply.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Free movement of labour and capital</div><div class="p-2 leading-snug">Easier to find skilled staff and attract investment.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Common standards</div><div class="p-2 leading-snug">Same standards apply across the EU, no need to adapt.</div></div></div><div class="flex flex-wrap gap-2 mt-2"><div class="px-3 py-2 rounded-xl text-center" style="background:#3b82f61f;border:1px solid #3b82f655"><div class="text-base font-extrabold leading-tight" style="color:#3b82f6">450 million+</div><div class="text-[11px] text-gray-600 dark:text-slate-300">consumers in the EU market</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">2</div><div class="min-w-0"><div class="int-title">Ireland's membership of the EU</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Economy</div><div class="p-2 leading-snug">Economic growth, improved infrastructure, increased FDI; loss of power for decision-making.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Businesses</div><div class="p-2 leading-snug">Higher sales, lower costs, access to labour, common currency; greater regulations and competition.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Consumers</div><div class="p-2 leading-snug">Greater choice, lower prices, enhanced rights (e.g. GDPR), increased freedom of movement.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">3</div><div class="min-w-0"><div class="int-title">Trading internationally</div><div class="int-tip">Factors and why Irish firms go global</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Taxes and tariffs</div><div class="p-2 leading-snug">No import duties within the EU, but imposed outside, adding to the selling price.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Increased costs</div><div class="p-2 leading-snug">May need extra transportation, storage, marketing and local staffing costs.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Exchange rate</div><div class="p-2 leading-snug">No fluctuation within the EU. Outside it, if foreign currencies weaken versus the euro, demand for Irish exports falls.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Varying regulation</div><div class="p-2 leading-snug">May need to adjust product, production, packaging and marketing for different product safety, data protection and labour laws in non-EU countries.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">More competition</div><div class="p-2 leading-snug">Market research needed to adjust against a variety of competition.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Language and culture</div><div class="p-2 leading-snug">Adjust to local language, customs and business etiquette.</div></div></div><p class="text-[13px] leading-snug mt-2">Ireland is a relatively small economy (5 million people). Selling abroad increases market size, allows higher output (economies of scale) and spreads risk across more markets (diversification).</p><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Benefits</div><div class="p-2 leading-snug">Increased sales (bigger markets), helps identify new markets, cost efficiencies from higher output (economies of scale), spreads risk (diversification).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Challenges</div><div class="p-2 leading-snug">Higher taxes (customs), higher costs (transport...), exchange rate fluctuations, varying regulation, more competition, language and culture adjustments.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">4</div><div class="min-w-0"><div class="int-title">Balance of trade vs balance of payments</div></div></div><div class="flex flex-wrap items-center gap-4 mt-2"><svg viewBox="0 0 310 70" class="w-full" style="color:#64748b;max-width:440px" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="4" width="150" height="60" rx="6" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.2" opacity="0.2"/><text x="77" y="15.5" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="600">Balance of TRADE</text><text x="77" y="28.5" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="600">VISIBLE exports − VISIBLE imports</text><text x="77" y="45.5" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="500">+ = surplus   − = deficit</text><rect x="158" y="4" width="150" height="60" rx="6" fill="#8b5cf6" stroke="#8b5cf6" stroke-width="1.2" opacity="0.2"/><text x="233" y="15.5" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="600">Balance of PAYMENTS</text><text x="233" y="28.5" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="600">TOTAL exports − TOTAL imports</text><text x="233" y="45.5" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="500">+ = surplus   − = deficit</text></svg></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Trade surplus / deficit</div><div class="p-2 leading-snug">Visible exports > visible imports = surplus. Visible exports < visible imports = deficit.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Payments surplus / deficit</div><div class="p-2 leading-snug">Total exports > total imports = surplus. Total exports < total imports = deficit.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">5</div><div class="min-w-0"><div class="int-title">Impact of Irish organisations trading internationally</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Political risks</div><div class="p-2 leading-snug">Changes in foreign governments, trade wars or instability can disrupt markets.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Financial risks</div><div class="p-2 leading-snug">Exports to non-EU countries face currency fluctuations and market instability.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Cultural barriers</div><div class="p-2 leading-snug">Misunderstandings or poor adaptation to local customs and consumer behaviour.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Social impact</div><div class="p-2 leading-snug">Outsourcing of jobs from Ireland; labour issues in non-EU countries; homogenisation.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Environmental</div><div class="p-2 leading-snug">Higher carbon emissions; overexploitation of natural resources; sustainability issues.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#0ea5e9">6</div><div class="min-w-0"><div class="int-title">Globalisation and technology</div></div></div><p class="text-[13px] leading-snug mt-2">Globalisation increases interdependence: the world is treated like one marketplace.</p><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Businesses</div><div class="p-2 leading-snug">+ access to larger markets, + access to cheaper or better suppliers; - greater exposure to supply chain disruption, - vulnerability to financial shocks.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Consumers</div><div class="p-2 leading-snug">+ increased choice, + lower prices; - less ethical consumption, - cultural homogenisation, - carbon footprint.</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#6366f122;border-left:3px solid #6366f1">Trade</div><div class="p-2 leading-snug">Improved distribution through ICT. AI allows more dynamic planning of inventory and better forecasting of stock.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#6366f122;border-left:3px solid #6366f1">Work practices</div><div class="p-2 leading-snug">Remote collaboration, flexible work. New working models, easier freelancing and gig employment (e-commerce).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#6366f122;border-left:3px solid #6366f1">Business operations</div><div class="p-2 leading-snug">Improved marketing (adaptive reach to target segments); deep market/competitor research; e-commerce platforms; disruptive industries.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#22c55e">7</div><div class="min-w-0"><div class="int-title">Foreign direct investment (FDI)</div></div></div><p class="text-[13px] leading-snug mt-2">FDI occurs when a company or individual from one country invests directly in facilities, operations or businesses in another country.</p><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Workforce</div><div class="p-2 leading-snug">Invests in education and training, especially technology, science and engineering.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Pro-enterprise</div><div class="p-2 leading-snug">Low corporation tax (12.5%/15%), IDA promotes opportunities, business-friendly regulations.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Market access</div><div class="p-2 leading-snug">Gateway to the EU market, English as first language, suits American MNCs.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">R&amp;D</div><div class="p-2 leading-snug">IDA supports R&amp;D through grants, tax credits and innovation hubs.</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">IDA Ireland</div><div class="p-2 leading-snug">Responsible for attracting and developing FDI. Grants: Employment Grants (creating jobs), RD&amp;I Grants, Capital Grants (equipment or construction/fit-out). Provides key data on sectors, network links to local industry, and education links so skills match FDI needs.</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#22c55e22;border-left:3px solid #22c55e">Employment</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#22c55e">Opportunities</span>Over 300,000 employed in MNCs; over half of new investment outside Dublin</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#22c55e">Challenges</span>Relocation of American MNCs / tariffs; global tech layoffs</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#22c55e22;border-left:3px solid #22c55e">Revenue</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#22c55e">Opportunities</span>Over 80% of corporation tax revenue came from MNCs in 2024</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#22c55e">Challenges</span>Over-reliance on a small number of MNCs for a large share of tax</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#22c55e22;border-left:3px solid #22c55e">Research</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#22c55e">Opportunities</span>Govt supports and incentivises R&amp;D through IDA: Ireland an R&amp;D hub</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#22c55e">Challenges</span>Higher start-up costs, skills shortages in areas</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#22c55e22;border-left:3px solid #22c55e">Infrastructure</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#22c55e">Opportunities</span>Rural development through enterprise zones and tax incentives</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#22c55e">Challenges</span>Pressure on infrastructure, housing/rent prices, energy (data centres)</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#22c55e22;border-left:3px solid #22c55e">Innovation</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#22c55e">Opportunities</span>Specialised innovation clusters bring new tech, practices, expertise</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#22c55e">Challenges</span>Vulnerable to MNCs relocating if over-reliant on them for R&amp;D</div></div></div></div><div class="flex flex-wrap gap-2 mt-2"><div class="px-3 py-2 rounded-xl text-center" style="background:#22c55e1f;border:1px solid #22c55e55"><div class="text-base font-extrabold leading-tight" style="color:#22c55e">300,000+</div><div class="text-[11px] text-gray-600 dark:text-slate-300">employed in MNCs</div></div><div class="px-3 py-2 rounded-xl text-center" style="background:#22c55e1f;border:1px solid #22c55e55"><div class="text-base font-extrabold leading-tight" style="color:#22c55e">80%+</div><div class="text-[11px] text-gray-600 dark:text-slate-300">of corporation tax from MNCs (2024)</div></div></div></div></div>
                `
            },
            "bus-c6": {
                title: "Chapter 6: Enterprise in Action",
                section: "Strand 2: Understanding Enterprise",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Reasons for starting an enterprise</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Personal motives</div><div class="p-2 leading-snug">Take on a challenge; be their own boss; live a self-directed lifestyle.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Financial motives</div><div class="p-2 leading-snug">Financial independence; earn more in profits than they would in a wage/salary.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Social goals</div><div class="p-2 leading-snug">Solve a social problem, e.g. reduce social inequality.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">2</div><div class="min-w-0"><div class="int-title">Innovation, intrapreneurship and entrepreneurship</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Innovation</div><div class="p-2 leading-snug">Someone coming up with a new way of doing something: new products/process.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Intrapreneurship</div><div class="p-2 leading-snug">An employee within a business who is innovative for the business.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Entrepreneurship</div><div class="p-2 leading-snug">Someone coming up with an idea and taking on personal and financial risk to set up a business with the aim of making a profit.</div></div></div><p class="text-[13px] leading-snug mt-2">The importance of innovation:</p><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">For business</div><div class="p-2 leading-snug">Gain a competitive advantage over rivals; expand to new markets.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">For the economy</div><div class="p-2 leading-snug">Drive economic growth, create jobs, increase exports.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">For society</div><div class="p-2 leading-snug">Improve standards of living; solve social inequalities; environmental sustainability.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">3</div><div class="min-w-0"><div class="int-title">Key competencies of innovators</div></div></div><p class="text-[13px] leading-snug mt-2">Competencies: the integration of knowledge, skills, values and dispositions that support and foster innovation.</p><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Risk taker</div><div class="p-2 leading-snug">Takes on the personal and financial risk involved in setting up a business.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Creative</div><div class="p-2 leading-snug">Innovative; spots gaps in the market.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Decision making</div><div class="p-2 leading-snug">Able to analyse situations; decisive under pressure.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Proactive</div><div class="p-2 leading-snug">Uses initiative to act rather than wait for the market to change.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Realistic</div><div class="p-2 leading-snug">Good reality perception: sees situations as they really are, not as they would like them to be.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Other</div><div class="p-2 leading-snug">Resilient, human relations, independent, flexible, time management.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">4</div><div class="min-w-0"><div class="int-title">Local government and State support for business</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:130px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Local Enterprise Offices (LEOs)</div><div class="p-2 leading-snug">Promote entrepreneurship in their local area and support start-ups or existing small businesses to expand. Services: TRAINING (courses), MENTORING (experienced mentors), FINANCE (feasibility/expansion grants), NETWORKING (local events).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:130px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Others</div><div class="p-2 leading-snug">Microfinance Ireland (funding); LEADER (rural areas); SOLAS (training); APCs.</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Enterprise Ireland</div><div class="p-2 leading-snug">Helps develop indigenous Irish industry with an export focus (10 or more employees).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Funding</div><div class="p-2 leading-snug">Funding and equity supports for start-ups and companies expanding internationally.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">International offices</div><div class="p-2 leading-snug">30+ global offices offering marketing and networking services to support export growth.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">R&amp;D</div><div class="p-2 leading-snug">Encourages R&amp;D to boost innovation through university links.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Market research</div><div class="p-2 leading-snug">Up-to-date market data, trends and consumer insights.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Events</div><div class="p-2 leading-snug">Trade fairs and missions to connect Irish businesses with global markets.</div></div></div><div class="int-note"><span>💡</span><div>Enterprise Ireland also operates the National Enterprise Hub, designed to make it much easier for Irish businesses to access the correct supports.</div></div></div></div>
                `
            },
            "bus-c7": {
                title: "Chapter 7: Idea Development",
                section: "Strand 2: Understanding Enterprise",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">How business ideas are developed</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:110px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Internal sources</div><div class="p-2 leading-snug">Personal experience, solving own frustrations; brainstorming/staff innovation; suggestion boxes, encouraging intrapreneurship; dedicated R&amp;D departments; identifying problems to solve (design thinking).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:110px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">External sources</div><div class="p-2 leading-snug">Monitoring and copying successful products/competitors; market trends and consumer data analytics; import substitution (an Irish business producing a product to compete against an imported good).</div></div></div><p class="text-[13px] leading-snug mt-2">Factors that impact the development of business ideas:</p><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#6366f122;border-left:3px solid #6366f1">Organisational culture</div><div class="p-2 leading-snug">Workplace values and leadership: charismatic leaders inspire and encourage innovation, autocratic leadership will limit idea development.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#6366f122;border-left:3px solid #6366f1">Availability of resources</div><div class="p-2 leading-snug">Staff need time, resources, training and/or finance to research and develop ideas, e.g. Google 20% time.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#6366f122;border-left:3px solid #6366f1">Market trends and consumer behaviour</div><div class="p-2 leading-snug">Changing/disrupted markets encourage innovation, e.g. environmental awareness has encouraged plastic alternatives.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#6366f122;border-left:3px solid #6366f1">Technological advancements</div><div class="p-2 leading-snug">New tech creates new opportunities, e.g. apps and software allowing new educational businesses in Ireland.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#6366f122;border-left:3px solid #6366f1">Legal requirements</div><div class="p-2 leading-snug">There may be legal limitations to certain ideas.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">2</div><div class="min-w-0"><div class="int-title">Design thinking</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Person-centred</div><div class="p-2 leading-snug">A business tries to understand user problems and empathise with them.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Solution-centred</div><div class="p-2 leading-snug">Defines the problem and tries to imagine ways to solve it.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Iterative</div><div class="p-2 leading-snug">Uses trial and error to create, test, improve and re-test until they are happy.</div></div></div><div class="flex flex-wrap items-center gap-4 mt-2"><svg viewBox="0 0 310 124" class="w-full" style="color:#64748b;max-width:440px" xmlns="http://www.w3.org/2000/svg"><polygon points="6,20 68,20 80,44 68,68 6,68 18,44" fill="#3b82f6"/><text x="44" y="41.5" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="700">1 Clarify</text><polygon points="82,20 144,20 156,44 144,68 82,68 94,44" fill="#8b5cf6"/><text x="120" y="41.5" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="700">2 Ideate</text><polygon points="158,20 220,20 232,44 220,68 158,68 170,44" fill="#f59e0b"/><text x="196" y="41.5" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="700">3 Develop</text><polygon points="234,20 296,20 308,44 296,68 234,68 246,44" fill="#22c55e"/><text x="272" y="41.5" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="700">4 Implement</text><path d="M268 74 Q268 100 150 100 Q40 100 40 76" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4 3"/><polygon points="40,72 36,82 45,82" fill="#64748b"/><text x="154.0" y="115.5" font-size="8.5" text-anchor="middle" fill="currentColor">test, refine and revisit steps until happy</text></svg></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">1. Clarify</div><div class="p-2 leading-snug">Gain an understanding of the user's problems using observation, market research, interviews and user feedback.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">2. Ideate</div><div class="p-2 leading-snug">Teams brainstorm a wide range of creative solutions, thinking outside the box without judgment.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">3. Develop</div><div class="p-2 leading-snug">Promising ideas are turned into prototypes so teams can explore how solutions might function in reality.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">4. Implement</div><div class="p-2 leading-snug">Prototypes are tested with real users to gain feedback; revisit steps to refine the idea until they are happy to move forward.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#22c55e">3</div><div class="min-w-0"><div class="int-title">Importance of a feasibility study</div><div class="int-tip">Evaluating a business idea</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#22c55e22;border-left:3px solid #22c55e">Market feasibility</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#22c55e">What it checks</span>Researching level of demand, identifying target market, analysing competitors.</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#22c55e">Why it matters</span>Reduces risk: prevents launching a product with low demand, saving time/investment.</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#22c55e22;border-left:3px solid #22c55e">Production feasibility</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#22c55e">What it checks</span>Necessary staff, equipment or suppliers needed to make the product.</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#22c55e">Why it matters</span>Saves resources: does not commit to an idea it cannot deliver.</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#22c55e22;border-left:3px solid #22c55e">Financial feasibility</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#22c55e">What it checks</span>Is it affordable/profitable? Assesses costs, funding, cashflow and potential profits.</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#22c55e">Why it matters</span>Increases profits: prevents producing an idea that is not profitable or affordable to make.</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#22c55e22;border-left:3px solid #22c55e">Environmental feasibility</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#22c55e">What it checks</span>Assesses environmental impact: emissions, waste, compliance with environmental laws.</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#22c55e">Why it matters</span>Ensures sustainability: avoids fines and reputational damage; supports ethical practice.</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#22c55e22;border-left:3px solid #22c55e">Legal feasibility</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#22c55e">What it checks</span>Compliant with laws, copyright, intellectual property and employee legislation.</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#22c55e">Why it matters</span>Prevents fines: avoids legal issues and delays due to non-compliance.</div></div></div></div></div></div>
                `
            },
            "bus-c8": {
                title: "Chapter 8: Business Planning",
                section: "Strand 2: Understanding Enterprise",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Functions and importance of a business plan</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Attract investment / access finance</div><div class="p-2 leading-snug">Gives investors/lenders evidence to judge viability (Executive Summary, Financial Plan, Market Analysis).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Set objectives and strategies</div><div class="p-2 leading-snug">Sets targets and strategies to measure performance (Sales and Marketing, Business Model Canvas).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Assess market potential</div><div class="p-2 leading-snug">Identifies demand, competitors/barriers to entry, target market size (Market Analysis, Sales and Marketing).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Identify risks and challenges</div><div class="p-2 leading-snug">Recognise obstacles (competition, production limits, financial risks, staffing) using Market Analysis, Financial Plan, Operational/Production Plans.</div></div></div><p class="text-[13px] leading-snug mt-2">The business plan at different stages:</p><div class="flex flex-wrap items-center gap-4 mt-2"><svg viewBox="0 0 310 66" class="w-full" style="color:#64748b;max-width:440px" xmlns="http://www.w3.org/2000/svg"><polygon points="6,8 94,8 106,32 94,56 6,56 18,32" fill="#3b82f6"/><text x="56" y="31.5" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="700">1 Start-up</text><polygon points="106,8 194,8 206,32 194,56 106,56 118,32" fill="#8b5cf6"/><text x="156" y="29.5" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="700">2</text><text x="156" y="39.5" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="700">Growth and expansion</text><polygon points="206,8 294,8 306,32 294,56 206,56 218,32" fill="#22c55e"/><text x="256" y="31.5" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="700">3 Maturity</text></svg></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">1. Start-up</div><div class="p-2 leading-snug">Clarifies idea/value proposition. Forces the entrepreneur to create a detailed financial plan to assess viability and access finance from LEOs/investors.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">2. Growth and expansion</div><div class="p-2 leading-snug">To secure further funding, shows growth potential using revised projections and updated strategic goals.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">3. Maturity</div><div class="p-2 leading-snug">Supports ongoing operations: benchmark performance, track output, control costs.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#22c55e">2</div><div class="min-w-0"><div class="int-title">Ethics and sustainability when planning</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:140px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">1. Improves reputation and brand loyalty</div><div class="p-2 leading-snug">Builds trust, shows values, highlighted in marketing, e.g. an ethical purpose or socially conscious mission.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:140px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">2. Attracts investment</div><div class="p-2 leading-snug">Improves ESG and financial sustainability for planet-positive growth.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:140px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">3. Ensures legal and regulatory compliance</div><div class="p-2 leading-snug">Avoids breaking environmental or labour laws, or scandal, e.g. using sweat shops.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:140px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">4. Supports long-term profitability</div><div class="p-2 leading-snug">Future-proofs against changes, e.g. green energy helps avoid law/tax changes that hit non-green businesses.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">3</div><div class="min-w-0"><div class="int-title">Business model and the business model canvas</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Business model</div><div class="p-2 leading-snug">Outlines how a company will operate, create, deliver and capture value in economic, social and cultural contexts. E.g. Sky's model is primarily subscription-based for TV, broadband and mobile.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Role in the plan</div><div class="p-2 leading-snug">The core idea that connects and supports all elements of the plan; shows how the business generates income and delivers value.</div></div></div><div class="flex flex-wrap items-center gap-4 mt-2"><svg viewBox="0 0 300 166" class="w-full" style="color:#64748b;max-width:440px" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="58" height="108" rx="5" fill="#94a3b8" stroke="#94a3b8" stroke-width="1.2" opacity="0.28"/><text x="30.0" y="51.5" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="600">Key</text><text x="30.0" y="61.5" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="600">Partners</text><rect x="61" y="1" width="58" height="53" rx="5" fill="#60a5fa" stroke="#60a5fa" stroke-width="1.2" opacity="0.28"/><text x="90.0" y="24.0" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="600">Key</text><text x="90.0" y="34.0" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="600">Activities</text><rect x="61" y="56" width="58" height="53" rx="5" fill="#60a5fa" stroke="#60a5fa" stroke-width="1.2" opacity="0.28"/><text x="90.0" y="79.0" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="600">Key</text><text x="90.0" y="89.0" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="600">Resources</text><rect x="121" y="1" width="58" height="108" rx="5" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.2" opacity="0.28"/><text x="150.0" y="51.5" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="600">Value</text><text x="150.0" y="61.5" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="600">Propositions</text><rect x="181" y="1" width="58" height="53" rx="5" fill="#34d399" stroke="#34d399" stroke-width="1.2" opacity="0.28"/><text x="210.0" y="24.0" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="600">Customer</text><text x="210.0" y="34.0" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="600">Relationships</text><rect x="181" y="56" width="58" height="53" rx="5" fill="#34d399" stroke="#34d399" stroke-width="1.2" opacity="0.28"/><text x="210.0" y="84.0" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="600">Channels</text><rect x="241" y="1" width="58" height="108" rx="5" fill="#34d399" stroke="#34d399" stroke-width="1.2" opacity="0.28"/><text x="270.0" y="51.5" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="600">Customer</text><text x="270.0" y="61.5" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="600">Segments</text><rect x="1" y="115" width="146" height="48" rx="5" fill="#ef4444" stroke="#ef4444" stroke-width="1.2" opacity="0.28"/><text x="74.0" y="140.5" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="600">Cost Structure</text><rect x="153" y="115" width="146" height="48" rx="5" fill="#22c55e" stroke="#22c55e" stroke-width="1.2" opacity="0.28"/><text x="226.0" y="140.5" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="600">Revenue Streams</text></svg></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">4</div><div class="min-w-0"><div class="int-title">Common business models</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:128px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Retail (e.g. SPAR)</div><div class="p-2 leading-snug">Buys finished goods from wholesalers/manufacturers and sells to customers. Income: markup on price paid. Value: convenience, variety, loyalty rewards (e.g. Tesco Clubcard).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:128px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Manufacturing (e.g. White Fox)</div><div class="p-2 leading-snug">Makes products from raw materials; sells to retailers or directly to consumers. Income: sells above production cost. Value: innovation and efficiency through in-house production and direct sales.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:128px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Subscription (e.g. gym, Sky)</div><div class="p-2 leading-snug">Recurring fee for continued access to a product or service. Income: regular payments (monthly/annual). Value: access, personalisation, flexible options.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:128px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Franchise (e.g. Supermacs)</div><div class="p-2 leading-snug">Franchisees open branches using the business's name, brand, logo and systems for a fee/%. Income: franchise fees and royalties. Value: faster growth, franchisees use their own capital.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:128px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Affiliate (e.g. TikTok user / Amazon)</div><div class="p-2 leading-snug">Promotes other businesses' products online and earns a cut of resulting sales. Income: commission per referred sale. Value: targeted marketing and trusted recommendations.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#0ea5e9">5</div><div class="min-w-0"><div class="int-title">Digital technology as a driver of change</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">AI and machine learning</div><div class="p-2 leading-snug">Automate tasks, personalise customer service, speed up decisions using smart algorithms.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Big data and analytics</div><div class="p-2 leading-snug">Turn large datasets into insights; predict trends and make smarter, faster, cheaper decisions.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Cloud computing</div><div class="p-2 leading-snug">Flexible, on-demand IT; makes scaling and remote working easier without major upfront costs.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Blockchain</div><div class="p-2 leading-snug">Secure, transparent record-keeping; improves supply chain traceability and trust.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">E-commerce platforms</div><div class="p-2 leading-snug">Simplify setting up online stores; reach more customers and reduce costs.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Internal drivers</div><div class="p-2 leading-snug">Innovation, efficiency and automation, market research and data analysis, employee collaboration.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">External drivers</div><div class="p-2 leading-snug">Evolving consumer behaviour, competitor pressure, globalisation, media and public image.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">6</div><div class="min-w-0"><div class="int-title">Technology-driven business models</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:130px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Marketplace (Adverts.ie, Vinted)</div><div class="p-2 leading-snug">Revenue: commissions or listing fees. Consumer: low/free access; sellers may pay to post. Scalability: very scalable, grows as more users join. Engagement: reviews, ratings, personalisation.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:130px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Subscription (Strava, Spotify)</div><div class="p-2 leading-snug">Revenue: recurring payments. Consumer: pay to access or unlock full features. Scalability: easy to scale globally at low added cost. Engagement: customised content and new features retain users.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:130px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Crowdfunding (Kickstarter, GoFundMe)</div><div class="p-2 leading-snug">Revenue: collects money upfront from many individuals. Consumer: free to browse or back a project; rewards. Scalability: campaigns reach large audiences online. Engagement: updates and storytelling build emotional buy-in.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:130px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Advertising-supported (YouTube, Facebook)</div><div class="p-2 leading-snug">Revenue: advertisers pay per view, click or impression. Consumer: usually free; ad-free versions may cost. Scalability: grows quickly as users and content generate more ads. Engagement: algorithms keep users scrolling.</div></div></div><div class="int-note"><span>💡</span><div>In your book this first model is labelled "Marketing"; its description (commissions/listing fees, e.g. Adverts.ie, Vinted) is a marketplace model.</div></div></div></div>
                `
            },
            "bus-c9": {
                title: "Chapter 9: The Target Market",
                section: "Strand 2: Understanding Enterprise",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Importance of market research in identifying the target market</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Suitable brand development</div><div class="p-2 leading-snug">Shapes a brand's name, logo and packaging to suit the customer's age, lifestyle and preferences.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Product design and features</div><div class="p-2 leading-snug">Creates products that match specific needs, such as health trends or dietary choices.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">More effective marketing</div><div class="p-2 leading-snug">Targets the right audience with the right message on the right platform, saving time and money.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Higher customer satisfaction</div><div class="p-2 leading-snug">When marketing and products reflect what customers want, they're more likely to feel understood and stay loyal.</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Market research</div><div class="p-2 leading-snug">The process of collecting and analysing information about the target market to establish trends (market size, competitors, consumer reactions/preferences).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Field research</div><div class="p-2 leading-snug">Gathering new data/new sources: surveys, observation, customer feedback, focus groups.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Desk research</div><div class="p-2 leading-snug">Gathering data from existing sources: internet, reports, CSO, media.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">2</div><div class="min-w-0"><div class="int-title">The marketing mix and how the target market influences it</div><div class="int-tip">7 Ps</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#f59e0b22;border-left:3px solid #f59e0b">Product / service</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#f59e0b">Outline</span>Function, features, design, quality and branding.</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#f59e0b">How the target market influences it</span>Design/features match customer needs. Branding reflects values/lifestyle.</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#f59e0b22;border-left:3px solid #f59e0b">Pricing</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#f59e0b">Outline</span>Pricing strategies (premium, dynamic, penetration); factors: competitors, brand image, income levels.</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#f59e0b">How the target market influences it</span>Income level affects acceptable price range. Competitor pricing shapes price strategy.</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#f59e0b22;border-left:3px solid #f59e0b">Promotion</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#f59e0b">Outline</span>Advertising, direct marketing, sales promotions, PR, personal selling, digital promotion.</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase t
