                            <path d="M45 105 C85 100 130 75 185 20" fill="none" stroke="#3b82f6" stroke-width="1.8"/>
                            <line x1="55" y1="104" x2="170" y2="36" stroke="#f43f5e" stroke-width="1.4" stroke-dasharray="4"/>
                            <circle cx="55" cy="104" r="3" fill="#f43f5e"/><circle cx="170" cy="36" r="3" fill="#f43f5e"/>
                            <text x="40" y="95" fill="currentColor" font-size="10" font-style="italic">A</text><text x="164" y="30" fill="currentColor" font-size="10" font-style="italic">B</text>
                            <text x="58" y="127" fill="currentColor" font-size="10">(t&#8321;, Q&#8321;)</text><text x="132" y="52" fill="currentColor" font-size="10">(t&#8322;, Q&#8322;)</text>
                            <text x="196" y="110" fill="currentColor" font-size="10" font-style="italic">t</text><text x="20" y="14" fill="currentColor" font-size="10" font-style="italic">Q</text><text x="22" y="127" fill="currentColor" font-size="10">0</text>
                        </svg><span class="int-tag">(b) Speed</span><div class="int-math">\\[ v = \\frac{s_2 - s_1}{t_2 - t_1} = \\frac{\\text{Change in distance}}{\\text{Change in time}} \\]</div><span class="int-tag">Acceleration</span><div class="int-math">\\[ a = \\frac{v_2 - v_1}{t_2 - t_1} = \\frac{\\text{Change in speed}}{\\text{Change in time}} \\]</div></div>
                    </div>
                    <div class="int-card">
                        <div class="int-head">
                            <div class="int-badge" style="background:#f43f5e">&prop;</div>
                            <div class="min-w-0"><div class="int-title">8. Direct and inverse proportion</div></div>
                        </div>
                        <div class="int-cell"><span class="int-tag">Direct</span><div class="int-math">\\[ y \\propto x \\implies y = kx, \\quad k \\in \\mathbb{R} \\]</div><span class="int-tag">Inverse</span><div class="int-math">\\[ y \\propto \\frac{1}{x} \\implies y = \\frac{k}{x}, \\quad k \\in \\mathbb{R} \\]</div></div>
                    </div>
                    </div>
                `
            },
            "m1-c3": {
                title: "Chapter 3: Working with Algebraic Expressions",
                section: "Section 2: Algebraic Expressions",
                content: `
                    <div class="space-y-4">
                    <div class="int-card">
                        <div class="int-head">
                            <div class="int-badge" style="background:#3b82f6">1</div>
                            <div class="min-w-0"><div class="int-title">Combining terms</div><div class="int-tip">Multiply out brackets term by term and combine like terms.</div></div>
                        </div>
                        <div class="law-grid"><div class="law"><span class="int-tag">Difference of two squares</span><div class="int-math">\\[ (a-b)(a+b) = a^2 - b^2 \\]</div></div><div class="law"><span class="int-tag">Perfect square</span><div class="int-math">\\[ (a+b)^2 = a^2 + 2ab + b^2 \\]</div></div></div>
                    </div>
                    <div class="int-card">
                        <div class="int-head">
                            <div class="int-badge" style="background:#10b981">2</div>
                            <div class="min-w-0"><div class="int-title">Evaluating algebraic expressions</div></div>
                        </div>
                        <div class="int-cell"><p class="text-[13px] leading-snug mt-1.5">Put <b>brackets</b> around the variables and then substitute the given values.</p></div>
                    </div>
                    <div class="int-card">
                        <div class="int-head">
                            <div class="int-badge" style="background:#f59e0b">3</div>
                            <div class="min-w-0"><div class="int-title">Binomial theorem</div></div>
                        </div>
                        <div class="int-cell"><span class="int-tag">(a) Expansion</span><div class="int-math">\\[ \\begin{aligned}(x+y)^n = {}&{}^{n}C_{0}(x)^{n}(y)^{0} + {}^{n}C_{1}(x)^{n-1}(y)^{1} \\\\ &+ {}^{n}C_{2}(x)^{n-2}(y)^{2} + \\dots + {}^{n}C_{n}(x)^{0}(y)^{n}\\end{aligned} \\]</div><span class="int-tag">(b) Finding a term</span><p class="text-[13px] leading-snug mt-1.5">In \\( (p+2q)^7 \\) the fifth term is given by:</p><div class="int-math">\\[ {}^{7}C_{4}(p)^{(7-4)}(2q)^{4} \\]</div><p class="text-xs text-gray-500 dark:text-slate-400 mt-1">Tip: the term number is <i>r</i> + 1, so the fifth term uses <i>r</i> = 4.</p></div>
                    </div>
                    <div class="int-card">
                        <div class="int-head">
                            <div class="int-badge" style="background:#8b5cf6">4</div>
                            <div class="min-w-0"><div class="int-title">Factorisation</div></div>
                        </div>
                        <div class="int-cell"><span class="int-tag">Steps</span><ol class="text-[13px] leading-snug mt-1.5 space-y-1 list-decimal pl-5"><li>Take out the <b>HCF</b>.</li><li>Factorise what is left by one of these methods: <b>(i)</b> grouping, <b>(ii)</b> trinomials, <b>(iii)</b>&ndash;<b>(v)</b> the special cases below.</li></ol><span class="int-tag">(ii) Trinomials</span><p class="text-[11px] text-gray-500 dark:text-slate-400 mt-1">Cross (X) method layout</p>                        <svg viewBox="0 0 160 120" class="sum-svg" style="width:100%;max-width:11rem" xmlns="http://www.w3.org/2000/svg">
                            <rect x="25" y="10" width="26" height="26" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.7"/><rect x="25" y="55" width="26" height="26" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
                            <rect x="105" y="10" width="26" height="26" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.7"/><rect x="105" y="55" width="26" height="26" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
                            <line x1="51" y1="23" x2="105" y2="68" stroke="#f43f5e" stroke-width="1.4"/><line x1="51" y1="68" x2="105" y2="23" stroke="#3b82f6" stroke-width="1.4"/>
                            <rect x="20" y="92" width="116" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
                        </svg></div>
                        <div class="law-grid"><div class="law"><span class="int-tag">(iii) Difference of two squares</span><div class="int-math">\\[ a^2 - b^2 = (a-b)(a+b) \\]</div></div><div class="law"><span class="int-tag">(iv) Sum of two cubes</span><div class="int-math">\\[ a^3 + b^3 = (a+b)(a^2 - ab + b^2) \\]</div></div><div class="law"><span class="int-tag">(v) Difference of two cubes</span><div class="int-math">\\[ a^3 - b^3 = (a-b)(a^2 + ab + b^2) \\]</div></div></div>
                    </div>
                    </div>
                `
            },
            "m1-c4": {
                title: "Chapter 4: Polynomial and Rational Expressions",
                section: "Section 2: Algebraic Expressions",
                content: `
                    <div class="space-y-4">
                    <div class="int-card">
                        <div class="int-head">
                            <div class="int-badge" style="background:#3b82f6">5</div>
                            <div class="min-w-0"><div class="int-title">Polynomials</div><div class="int-tip">L = Linear, Q = Quadratic, C = Cubic</div></div>
                        </div>
                        <div class="int-cell"><span class="int-tag">(a) Types</span><div class="int-math">\\[ \\begin{aligned} \\text{Linear:} \\quad & ax + b && (L) \\\\ \\text{Quadratic:} \\quad & ax^2 + bx + c && (Q) \\\\ \\text{Cubic:} \\quad & ax^3 + bx^2 + cx + d && (C) \\end{aligned} \\]</div></div>
                        <div class="law-grid"><div class="law"><span class="int-tag">(b)(i) Multiplication</span><div class="int-math">\\[ L \\times L = Q \\]</div></div><div class="law"><span class="int-tag">(b)(ii) Multiplication</span><div class="int-math">\\[ L \\times L \\times L = C \\]</div></div><div class="law"><span class="int-tag">(b)(iii) Multiplication</span><div class="int-math">\\[ L \\times Q = C \\]</div></div></div>
                        <div class="law-grid"><div class="law"><span class="int-tag">(c)(i) Division</span><div class="int-math">\\[ \\frac{Q}{L} = L \\]</div></div><div class="law"><span class="int-tag">(c)(ii) Division</span><div class="int-math">\\[ \\frac{C}{Q} = L \\]</div></div><div class="law"><span class="int-tag">(c)(iii) Division</span><div class="int-math">\\[ \\frac{C}{L} = Q \\]</div></div></div>
                        <div class="int-cell"><p class="text-[13px] leading-snug mt-1.5">Division can be done by the <b>division process</b> or by <b>factorisation with lining up</b>.</p></div>
                    </div>
                    <div class="int-card">
                        <div class="int-head">
                            <div class="int-badge" style="background:#10b981">6</div>
                            <div class="min-w-0"><div class="int-title">Rational expressions</div></div>
                        </div>
                        <div class="int-cell"><ul class="text-[13px] leading-snug space-y-2.5 mt-1"><li><b>(a) Addition and subtraction:</b> common denominator.</li><li><b>(b) Multiplication:</b> multiply the tops and multiply the bottoms (cancel).</li><li><b>(c) Division:</b> invert the divisor and multiply, <i>or</i> multiply above and below by the common denominator of all fractions.</li></ul></div>
                    </div>
                    </div>
                `
            },
            "m1-c5": {
                title: "Chapter 5: Exponentials and Logs",
                section: "Section 2: Algebraic Expressions",
                content: `
                    <div class="space-y-4">
                    <div class="int-card">
                        <div class="int-head">
                            <div class="int-badge" style="background:#3b82f6">aᵖ</div>
                            <div class="min-w-0"><div class="int-title">7. Exponential expressions</div></div>
                        </div>
                        <div class="law-grid"><div class="law"><span class="int-tag">(a)</span><div class="int-math">\\[ a^p a^q = a^{p+q} \\]</div></div><div class="law"><span class="int-tag">(b)</span><div class="int-math">\\[ \\frac{a^p}{a^q} = a^{p-q} \\]</div></div><div class="law"><span class="int-tag">(c)</span><div class="int-math">\\[ (a^p)^q = a^{pq} \\]</div></div><div class="law"><span class="int-tag">(d)</span><div class="int-math">\\[ a^0 = 1 \\]</div></div><div class="law"><span class="int-tag">(e)</span><div class="int-math">\\[ a^{-p} = \\frac{1}{a^p} \\]</div></div><div class="law"><span class="int-tag">(f)</span><div class="int-math">\\[ a^{\\frac{1}{q}} = \\sqrt[q]{a} \\]</div></div><div class="law"><span class="int-tag">(g)</span><div class="int-math">\\[ a^{\\frac{p}{q}} = \\sqrt[q]{a^p} = \\left(\\sqrt[q]{a}\\right)^p \\]</div></div><div class="law"><span class="int-tag">(h)</span><div class="int-math">\\[ (ab)^p = a^p b^p \\]</div></div><div class="law"><span class="int-tag">(i)</span><div class="int-math">\\[ \\left(\\frac{a}{b}\\right)^p = \\frac{a^p}{b^p} \\]</div></div></div>
                    </div>
                    <div class="int-card">
                        <div class="int-head">
                            <div class="int-badge" style="background:#f59e0b">√</div>
                            <div class="min-w-0"><div class="int-title">8. Surds</div></div>
                        </div>
                        <div class="int-cell"><span class="int-tag">(a) Addition and subtraction</span><p class="text-[13px] leading-snug mt-1.5">Add and subtract <b>like terms</b>.</p></div>
                        <div class="law-grid"><div class="law"><span class="int-tag">(b)(i) Multiplication</span><div class="int-math">\\[ \\sqrt{a} \\times \\sqrt{b} = \\sqrt{ab} \\]</div></div><div class="law"><span class="int-tag">(b)(ii) Conjugate surds</span><div class="int-math">\\[ (\\sqrt{a}-\\sqrt{b})(\\sqrt{a}+\\sqrt{b}) = a - b \\]</div></div><div class="law"><span class="int-tag">(c) Division</span><div class="int-math">\\[ \\frac{\\sqrt{a}}{\\sqrt{b}} = \\sqrt{\\frac{a}{b}} \\]</div></div></div>
                        <div class="int-cell"><span class="int-tag">(d) Rationalising the denominator</span><p class="text-[13px] leading-snug mt-1.5">Multiply above and below by the <b>conjugate</b> of the denominator.</p></div>
                        <div class="int-cell"><span class="int-tag">(e) Properties of surds</span></div>
                        <div class="law-grid"><div class="law"><span class="int-tag">(i)</span><div class="int-math">\\[ (\\sqrt{a})^p = \\sqrt{a^p} = a^{\\frac{p}{2}} \\]</div></div><div class="law"><span class="int-tag">(ii)</span><div class="int-math">\\[ (\\sqrt{a})^2 = a \\]</div></div><div class="law"><span class="int-tag">(iii)</span><div class="int-math">\\[ a\\sqrt{a} = \\sqrt{a^2} \\times \\sqrt{a} = \\sqrt{a^3} \\]</div></div></div>
                    </div>
                    <div class="int-card">
                        <div class="int-head">
                            <div class="int-badge" style="background:#10b981">log</div>
                            <div class="min-w-0"><div class="int-title">9. Logs</div></div>
                        </div>
                        <div class="int-cell"><span class="int-tag">(a) Definition</span><div class="int-math">\\[ \\log_a y = x \\iff y = a^x \\]</div><span class="int-tag">(b) Properties of logs</span></div>
                        <div class="law-grid"><div class="law"><span class="int-tag">(i)</span><div class="int-math">\\[ \\log_a(xy) = \\log_a x + \\log_a y \\]</div></div><div class="law"><span class="int-tag">(ii)</span><div class="int-math">\\[ \\log_a\\left(\\frac{x}{y}\\right) = \\log_a x - \\log_a y \\]</div></div><div class="law"><span class="int-tag">(iii)</span><div class="int-math">\\[ \\log_a(x^q) = q\\log_a x \\]</div></div><div class="law"><span class="int-tag">(iv)</span><div class="int-math">\\[ \\log_a 1 = 0 \\]</div></div><div class="law"><span class="int-tag">(v)</span><div class="int-math">\\[ \\log_a\\left(\\frac{1}{x}\\right) = \\log_a 1 - \\log_a x = -\\log_a x \\]</div></div><div class="law"><span class="int-tag">(vi)</span><div class="int-math">\\[ \\log_a(a^x) = x\\log_a a = x \\]</div></div><div class="law"><span class="int-tag">(vii)</span><div class="int-math">\\[ a^{\\log_a x} = x \\]</div></div><div class="law"><span class="int-tag">(viii)</span><div class="int-math">\\[ \\log_a b = \\frac{1}{\\log_b a} \\]</div></div><div class="law"><span class="int-tag">(ix) Change of base</span><div class="int-math">\\[ \\log_b a = \\frac{\\log_c a}{\\log_c b} \\]</div></div></div>
                    </div>
                    </div>
                `
            },
            "m1-c6": {
                title: "Chapter 6: Polynomial Equations",
                section: "Section 3: Algebraic Equations",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Linear equations</div></div></div><div class="int-cell"><span class="int-tag">Solution</span><div class="int-math">\\[ ax + b = 0 \\implies x = -\\frac{b}{a} \\]</div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">2</div><div class="min-w-0"><div class="int-title">Quadratic equations</div><div class="int-tip">Standard form below.</div></div></div><div class="int-cell"><span class="int-tag">Equation</span><div class="int-math">\\[ ax^2 + bx + c = 0 \\]</div></div><div class="int-cell"><span class="int-tag">(a) Solution</span><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li><b>(i)</b> By factorisation</li><li><b>(ii)</b> By completing the square</li><li><b>(iii)</b> By using the quadratic formula:</li></ul><div class="int-math">\\[ x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a} \\]</div></div><div class="int-cell"><span class="int-tag">(b)(i) Two different, real roots</span><p class="text-[13px] leading-snug mt-1.5">\\( b^2 > 4ac \\) or \\( b^2 - 4ac > 0 \\) gives <b>two different, real roots</b>.</p><div class="flex flex-wrap items-center gap-3 mt-2"><svg viewBox="0 0 120 80" class="w-full max-w-[150px]" style="color:#64748b" xmlns="http://www.w3.org/2000/svg"><line x1="2" y1="40" x2="118" y2="40" stroke="currentColor" stroke-width="1"/><path d="M10 10 Q60 110 110 10" fill="none" stroke="#3b82f6" stroke-width="2"/><circle cx="28" cy="40" r="2.2" fill="currentColor"/><circle cx="92" cy="40" r="2.2" fill="currentColor"/><text x="20" y="52" font-size="8" fill="currentColor">(p,0)</text><text x="84" y="52" font-size="8" fill="currentColor">(q,0)</text><text x="52" y="10" font-size="8" fill="currentColor">a&gt;0</text></svg><span class="text-xs opacity-60">or</span><svg viewBox="0 0 120 80" class="w-full max-w-[150px]" style="color:#64748b" xmlns="http://www.w3.org/2000/svg"><line x1="2" y1="40" x2="118" y2="40" stroke="currentColor" stroke-width="1"/><path d="M10 70 Q60 -30 110 70" fill="none" stroke="#3b82f6" stroke-width="2"/><circle cx="28" cy="40" r="2.2" fill="currentColor"/><circle cx="92" cy="40" r="2.2" fill="currentColor"/><text x="20" y="52" font-size="8" fill="currentColor">(p,0)</text><text x="84" y="52" font-size="8" fill="currentColor">(q,0)</text><text x="52" y="74" font-size="8" fill="currentColor">a&lt;0</text></svg></div></div><div class="int-cell"><span class="int-tag">(b)(ii) Two equal, real roots</span><p class="text-[13px] leading-snug mt-1.5">\\( b^2 = 4ac \\) or \\( b^2 - 4ac = 0 \\) gives <b>two equal, real roots</b>.</p><div class="flex flex-wrap items-center gap-3 mt-2"><svg viewBox="0 0 120 80" class="w-full max-w-[150px]" style="color:#64748b" xmlns="http://www.w3.org/2000/svg"><line x1="2" y1="40" x2="118" y2="40" stroke="currentColor" stroke-width="1"/><path d="M10 10 Q60 70 110 10" fill="none" stroke="#3b82f6" stroke-width="2"/><circle cx="60" cy="40" r="2.2" fill="currentColor"/><text x="42" y="54" font-size="8" fill="currentColor">(p,0) p=q</text><text x="52" y="10" font-size="8" fill="currentColor">a&gt;0</text></svg><span class="text-xs opacity-60">or</span><svg viewBox="0 0 120 80" class="w-full max-w-[150px]" style="color:#64748b" xmlns="http://www.w3.org/2000/svg"><line x1="2" y1="40" x2="118" y2="40" stroke="currentColor" stroke-width="1"/><path d="M10 70 Q60 10 110 70" fill="none" stroke="#3b82f6" stroke-width="2"/><circle cx="60" cy="40" r="2.2" fill="currentColor"/><text x="42" y="30" font-size="8" fill="currentColor">(p,0) p=q</text><text x="52" y="74" font-size="8" fill="currentColor">a&lt;0</text></svg></div></div><div class="int-cell"><span class="int-tag">(b)(iii) Complex roots</span><p class="text-[13px] leading-snug mt-1.5">\\( b^2 < 4ac \\) or \\( b^2 - 4ac < 0 \\) gives <b>complex roots</b>.</p><div class="flex flex-wrap items-center gap-3 mt-2"><svg viewBox="0 0 120 80" class="w-full max-w-[150px]" style="color:#64748b" xmlns="http://www.w3.org/2000/svg"><line x1="2" y1="60" x2="118" y2="60" stroke="currentColor" stroke-width="1"/><path d="M10 5 Q60 45 110 5" fill="none" stroke="#3b82f6" stroke-width="2"/><text x="52" y="10" font-size="8" fill="currentColor">a&gt;0</text></svg><span class="text-xs opacity-60">or</span><svg viewBox="0 0 120 80" class="w-full max-w-[150px]" style="color:#64748b" xmlns="http://www.w3.org/2000/svg"><line x1="2" y1="20" x2="118" y2="20" stroke="currentColor" stroke-width="1"/><path d="M10 75 Q60 35 110 75" fill="none" stroke="#3b82f6" stroke-width="2"/><text x="52" y="74" font-size="8" fill="currentColor">a&lt;0</text></svg></div></div><div class="int-cell"><span class="int-tag">(b)(iv) Forming a quadratic from its roots</span><p class="text-[13px] leading-snug mt-1.5">Roots \\( \\frac{q}{p}, \\frac{r}{s} \\):</p><div class="int-math">\\[ (px - q)(sx - r) = 0 \\]</div><p class="text-[13px] leading-snug mt-1.5"><b>or</b></p><div class="int-math">\\[ x^2 - Sx + P = 0 \\]</div><p class="text-[13px] leading-snug mt-1.5">where <b>S</b> is the sum of the roots and <b>P</b> is the product of the roots.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">3</div><div class="min-w-0"><div class="int-title">Cubic equations</div></div></div><div class="int-cell"><span class="int-tag">Equation</span><div class="int-math">\\[ ax^3 + bx^2 + cx + d = 0 \\]</div></div><div class="int-cell"><span class="int-tag">(a) Solution</span><p class="text-[13px] leading-snug mt-1.5">Given an integer root \\( k \\), form a linear factor \\( (x-k) \\) and solve the equation by <b>division</b> or <b>factorisation</b>.</p></div><div class="int-cell"><span class="int-tag">(b) Forming a cubic from its roots</span><div class="int-math">\\[ (\\text{Linear})(\\text{Quadratic}) = 0 \\]</div></div></div></div>
                `
            },
            "m1-c7": {
                title: "Chapter 7: Other Types of Equations",
                section: "Section 3: Algebraic Equations",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">4</div><div class="min-w-0"><div class="int-title">Square root equations</div></div></div><div class="int-cell"><span class="int-tag">Method</span><p class="text-[13px] leading-snug mt-1.5">Isolate the square root and <b>square both sides</b>.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#14b8a6">5</div><div class="min-w-0"><div class="int-title">Literal equations</div></div></div><div class="int-cell"><span class="int-tag">Method</span><p class="text-[13px] leading-snug mt-1.5"><b>Isolate the unknown variable</b>.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">6</div><div class="min-w-0"><div class="int-title">Exponential equations</div><div class="int-tip">Two methods.</div></div></div><div class="int-cell"><span class="int-tag">Method 1: same base</span><p class="text-[13px] leading-snug mt-1.5">Get the same base and find the solutions by equating the powers.</p><div class="int-math">\\[ a^f = a^g \\implies f = g \\]</div></div><div class="int-cell"><span class="int-tag">Method 2: take logs</span><p class="text-[13px] leading-snug mt-1.5">Take the log of both sides after getting the base with the unknown power on one side:</p><div class="int-math">\\[ a^y = c \\implies \\log_a a^y = \\log_a c \\implies y = \\log_a c \\]</div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">7</div><div class="min-w-0"><div class="int-title">Log equations</div><div class="int-tip">Steps for solution.</div></div></div><div class="int-cell"><span class="int-tag">Steps</span><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li><b>(a)</b> Get the same base.</li><li><b>(b)</b> Get all logs on one side.</li><li><b>(c)</b> Get a single log.</li><li><b>(d)</b> Get out of logs (Hoosh):</li></ul></div><div class="int-cell"><span class="int-tag">(d) Hoosh</span><div class="int-math">\\[ \\log_b y = c \\implies y = b^c \\]</div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">8</div><div class="min-w-0"><div class="int-title">Modulus equations</div></div></div><div class="int-cell"><span class="int-tag">Method</span><div class="int-math">\\[ |ax + b| = cx + d \\implies ax + b = \\pm(cx + d) \\]</div></div></div></div>
                `
            },
            "m1-c8": {
                title: "Chapter 8: Systems of Simultaneous Equations",
                section: "Section 3: Algebraic Equations",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#6366f1">9</div><div class="min-w-0"><div class="int-title">Simultaneous equations</div><div class="int-tip">Know which method suits each type.</div></div></div><div class="int-cell"><span class="int-tag">(a) Two linear equations, two unknowns</span><p class="text-[13px] leading-snug mt-1.5">Solve by <b>elimination by addition</b>.</p></div><div class="int-cell"><span class="int-tag">(b) One linear + one equation of order two</span><p class="text-[13px] leading-snug mt-1.5">Solve by <b>substitution</b>.</p></div><div class="int-cell"><span class="int-tag">(c) Three linear equations, three unknowns</span><p class="text-[13px] leading-snug mt-1.5">Solve by <b>elimination by addition</b>.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ec4899">10</div><div class="min-w-0"><div class="int-title">Word problems</div><div class="int-tip">Write down the equations, then solve them.</div></div></div><div class="int-cell"><span class="int-tag">Write down</span><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li><b>(a)</b> One equation for one unknown</li><li><b>(b)</b> Two equations for two unknowns</li><li><b>(c)</b> Three equations for three unknowns</li></ul></div><div class="int-cell"><span class="int-tag">Then</span><p class="text-[13px] leading-snug mt-1.5"><b>Solve the equations</b>.</p></div></div></div>
                `
            },
            "m1-c9": {
                title: "Chapter 9: Inequalities",
                section: "Section 3: Algebraic Equations",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">11</div><div class="min-w-0"><div class="int-title">Inequalities</div></div></div><div class="int-cell"><span class="int-tag">(a) Linear inequalities</span><div class="int-math">\\[ ax + b \\geq 0 \\implies x \\geq -\\frac{b}{a} \\]</div><p class="text-[13px] leading-snug mt-1.5">once \\( a > 0 \\).</p></div><div class="int-cell"><span class="int-tag">(b) Quadratic / rational / modulus inequalities</span><p class="text-[13px] leading-snug mt-1.5">Find the roots of the equality and do the <b>region test</b> using the test box.</p></div><div class="int-cell"><span class="int-tag">(c) Proofs</span><p class="text-[13px] leading-snug mt-1.5"><b>Disprove the opposite</b> by contradiction.</p></div></div><div class="math-block text-sm"><b>Worked example:</b> Solve \\( |2x-3| \\leq 5 \\) \\( \\implies -5 \\leq 2x-3 \\leq 5 \\implies -1 \\leq x \\leq 4 \\)</div></div>
                `
            },
            "m1-c10": {
                title: "Chapter 10: Sequences and Series",
                section: "Section 4: Sequences and Series",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">2</div><div class="min-w-0"><div class="int-title">Series</div></div></div><div class="int-cell"><span class="int-tag">(a) Definition</span><p class="text-[13px] leading-snug mt-1.5">A series is the <b>sum of the terms of a sequence</b>:</p><div class="int-math">\\[ S_n = \\sum_{r=1}^{n} T_r \\]</div></div><div class="int-cell"><span class="int-tag">(b) The Σ rules</span><div class="law-grid"><div class="law"><span class="int-tag">(i)</span><div class="int-math">\\[ \\sum_{n=1}^{n} (u_n + v_n) = \\sum_{n=1}^{n} u_n + \\sum_{n=1}^{n} v_n \\]</div></div><div class="law"><span class="int-tag">(ii) where k ∈ ℝ</span><div class="int-math">\\[ \\sum_{n=1}^{n} k u_n = k \\sum_{n=1}^{n} u_n \\]</div></div><div class="law"><span class="int-tag">(iii)</span><div class="int-math">\\[ \\sum_{n=1}^{n} 1 = n \\]</div></div></div></div></div></div>
                `
            },
            "m1-c11": {
                title: "Chapter 11: Analysing Sequences and Series",
                section: "Section 4: Sequences and Series",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">1</div><div class="min-w-0"><div class="int-title">Convergence of a sequence</div><div class="int-tip">General term \\( T_n \\).</div></div></div><div class="int-cell"><span class="int-tag">Limit</span><div class="int-math">\\[ \\lim_{n \\to \\infty} T_n = L \\]</div></div><div class="int-cell"><span class="int-tag">Convergent</span><p class="text-[13px] leading-snug mt-1.5">The sequence is <b>convergent</b> if \\( L \\) is finite.</p></div><div class="int-cell"><span class="int-tag">Divergent</span><p class="text-[13px] leading-snug mt-1.5">The sequence is <b>divergent</b> if \\( L \\) is infinite or does not exist.</p></div></div></div>
                `
            },
            "m1-c12": {
                title: "Chapter 12: Arithmetic Sequences and Series",
                section: "Section 4: Sequences and Series",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">3</div><div class="min-w-0"><div class="int-title">Arithmetic sequences and series</div></div></div><div class="int-cell"><span class="int-tag">(a) General term</span><div class="int-math">\\[ T_n = a + (n-1)d \\]</div><p class="text-[13px] leading-snug mt-1.5"><b>Example:</b> \\( T_{57} = a + 56d \\)</p></div><div class="int-cell"><span class="int-tag">(b) Sum of the first n terms</span><div class="int-math">\\[ S_n = \\frac{n}{2}\\left[2a + (n-1)d\\right] \\]</div></div><div class="int-cell"><span class="int-tag">(c) Test for an arithmetic sequence</span><div class="int-math">\\[ T_{n+1} - T_n = d = \\text{constant for all } n \\in \\mathbb{N} \\]</div></div><div class="int-cell"><span class="int-tag">(d) Notation</span><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>\\( T_1 = S_1 = a \\) = first term</li><li>\\( n \\) = place number of a term</li><li>\\( d \\) = common difference = any term − previous one</li><li>\\( T_n \\) = value of the term in the nth place</li><li>\\( S_n \\) = sum of the first \\( n \\) terms</li></ul></div><div class="int-cell"><span class="int-tag">(e) Three consecutive terms</span><p class="text-[13px] leading-snug mt-1.5">Choose \\( a-d,\\; a,\\; a+d \\).</p></div><div class="int-cell"><span class="int-tag">(f) Arithmetic mean</span><p class="text-[13px] leading-snug mt-1.5">The arithmetic mean \\( c \\) of two numbers \\( a \\) and \\( b \\) is:</p><div class="int-math">\\[ c = \\frac{a+b}{2} \\]</div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#6366f1">5(a)</div><div class="min-w-0"><div class="int-title">Σ notation: arithmetic series</div></div></div><div class="int-cell"><span class="int-tag">Sum</span><div class="int-math">\\[ S_n = \\sum_{n=1}^{n} \\left[a + (n-1)d\\right] \\]</div></div></div></div>
                `
            },
            "m1-c13": {
                title: "Chapter 13: Geometric Sequences and Series",
                section: "Section 4: Sequences and Series",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">4</div><div class="min-w-0"><div class="int-title">Geometric sequences and series</div></div></div><div class="int-cell"><span class="int-tag">(a) General term</span><div class="int-math">\\[ T_n = a(r)^{n-1} \\]</div><p class="text-[13px] leading-snug mt-1.5"><b>Example:</b> \\( T_{25} = ar^{24} \\)</p></div><div class="int-cell"><span class="int-tag">(b) Sum of the first n terms</span><div class="int-math">\\[ S_n = \\frac{a\\left(1 - (r)^n\\right)}{1 - r} \\]</div></div><div class="int-cell"><span class="int-tag">(c) Sum to infinity</span><div class="int-math">\\[ S_\\infty = \\frac{a}{1-r} \\quad \\text{if } -1 < r < 1 \\]</div></div><div class="int-cell"><span class="int-tag">(d) Test for a geometric sequence</span><div class="int-math">\\[ \\frac{T_{n+1}}{T_n} = r = \\text{constant for all } n \\in \\mathbb{N} \\]</div></div><div class="int-cell"><span class="int-tag">(e) Notation</span><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>\\( T_1 = S_1 = a \\) = first term</li><li>\\( n \\) = place number of a term</li><li>\\( r \\) = common ratio = any term ÷ previous one</li><li>\\( T_n \\) = value of the term in the nth place</li><li>\\( S_n \\) = sum of the first \\( n \\) terms</li></ul></div><div class="int-cell"><span class="int-tag">(f) Three consecutive terms</span><p class="text-[13px] leading-snug mt-1.5">Choose \\( \\frac{a}{r},\\; a,\\; ar \\).</p></div><div class="int-cell"><span class="int-tag">(g) Geometric mean</span><p class="text-[13px] leading-snug mt-1.5">The geometric mean \\( c \\) of two numbers \\( a \\) and \\( b \\) is:</p><div class="int-math">\\[ c = \\sqrt{ab} \\]</div></div><div class="int-cell"><span class="int-tag">(h) Recurring decimals</span><p class="text-[13px] leading-snug mt-1.5">Use \\( S_\\infty = \\frac{a}{1-r} \\).</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#6366f1">5(b)</div><div class="min-w-0"><div class="int-title">Σ notation: geometric series</div></div></div><div class="int-cell"><span class="int-tag">Sum</span><div class="int-math">\\[ S_n = \\sum_{r=1}^{n} a(r)^{n-1} \\]</div></div></div></div>
                `
            },
            "m1-c14": {
                title: "Chapter 14: Financial Maths 1",
                section: "Section 5: Financial Maths",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Unit rates</div></div></div><div class="int-cell"><span class="int-tag">Example</span><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>5 objects cost €20</li><li>1 object costs €4</li><li>7 objects cost €28</li></ul></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">2</div><div class="min-w-0"><div class="int-title">Value added tax (VAT)</div></div></div><div class="int-cell"><span class="int-tag">Note</span><p class="text-[13px] leading-snug mt-1.5">VAT can be <b>included</b> or <b>not included</b> in a cost price.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">3</div><div class="min-w-0"><div class="int-title">Income tax and deductions</div></div></div><div class="int-cell"><span class="int-tag">(a) PRSI</span><p class="text-[13px] leading-snug mt-1.5">Pay Related Social Insurance (PRSI) is calculated as a <b>percentage of gross income</b>.</p></div><div class="int-cell"><span class="int-tag">(b) Tax on income</span><p class="text-[13px] leading-snug mt-1.5"><b>(i) Gross tax:</b> 20% on the first €33 800 of gross income; 40% on the remainder.</p><p class="text-[13px] leading-snug mt-1.5"><b>(ii) Net tax</b> = gross tax − tax credits.</p></div><div class="int-cell"><span class="int-tag">(c) USC</span><p class="text-[13px] leading-snug mt-1.5">Universal Social Charge (USC): there are different rates for different bands of income.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">4</div><div class="min-w-0"><div class="int-title">Profit</div><div class="int-tip">Profit (P) = Selling price (SP) − Cost price (CP)</div></div></div><div class="int-cell"><span class="int-tag">Formulas</span><div class="int-math">\\[ \\text{Profit} = \\text{SP} - \\text{CP} \\]</div><div class="law-grid"><div class="law"><span class="int-tag">Percentage profit</span><div class="int-math">\\[ \\frac{\\text{Profit}}{\\text{Cost price}} \\times 100\\% \\]</div></div><div class="law"><span class="int-tag">Profit margin</span><div class="int-math">\\[ \\frac{\\text{Profit}}{\\text{Selling price}} \\times 100\\% \\]</div></div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">5</div><div class="min-w-0"><div class="int-title">Loss</div><div class="int-tip">Loss (L) = Cost price (CP) − Selling price (SP)</div></div></div><div class="int-cell"><span class="int-tag">Formulas</span><div class="int-math">\\[ \\text{Loss} = \\text{CP} - \\text{SP} \\]</div><div class="law-grid"><div class="law"><span class="int-tag">Percentage loss</span><div class="int-math">\\[ \\frac{\\text{Loss}}{\\text{Cost price}} \\times 100\\% \\]</div></div></div></div></div></div>
                `
            },
            "m1-c15": {
                title: "Chapter 15: Financial Maths 2",
                section: "Section 5: Financial Maths",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">6</div><div class="min-w-0"><div class="int-title">Simple interest</div></div></div><div class="int-cell"><span class="int-tag">Formula</span><div class="int-math">\\[ I = \\frac{P \\times r \\times t}{100} \\]</div><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>\\( I \\) = interest</li><li>\\( P \\) = principal</li><li>\\( r \\) = percentage rate per year (p.a.)</li><li>\\( t \\) = time in years</li></ul></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">7</div><div class="min-w-0"><div class="int-title">Compound interest</div></div></div><div class="int-cell"><span class="int-tag">Formula</span><div class="int-math">\\[ F = P\\left(1 + \\frac{r}{100}\\right)^t = P(1+i)^t \\]</div><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>\\( F \\) = final amount after \\( t \\) periods</li><li>\\( P \\) = principal</li><li>\\( r \\) = percentage rate per interest period</li><li>\\( t \\) = number of interest periods in the term</li><li>\\( i \\) = annual rate of compound interest expressed as a decimal or fraction</li></ul></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">8</div><div class="min-w-0"><div class="int-title">Depreciation by the reducing balance method</div></div></div><div class="int-cell"><span class="int-tag">Formula</span><div class="int-math">\\[ F = P\\left(1 - \\frac{r}{100}\\right)^t = P(1-i)^t \\]</div><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>\\( F \\) = value after \\( t \\) periods</li><li>\\( P \\) = principal</li><li>\\( r \\) = percentage rate per depreciation period</li><li>\\( t \\) = number of depreciation periods</li><li>\\( i \\) = annual rate of depreciation expressed as a decimal or fraction</li></ul></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">9</div><div class="min-w-0"><div class="int-title">Saving</div><div class="int-tip">Geometric series</div></div></div><div class="int-cell"><span class="int-tag">Idea</span><p class="text-[13px] leading-snug mt-1.5">When saving regular amounts in a savings account or paying back regular amounts to clear a loan, the payments form a <b>geometric series</b> where the sum of \\( n \\) terms \\( S_n \\) is given by:</p><div class="int-math">\\[ S_n = \\frac{a(1 - r^n)}{1 - r} \\]</div><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>\\( a \\) = the first term</li><li>\\( r \\) = the common ratio</li></ul></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">10</div><div class="min-w-0"><div class="int-title">Amortisation (mortgages and loans)</div><div class="int-tip">Equal repayments at equal intervals.</div></div></div><div class="int-cell"><span class="int-tag">Formula</span><div class="int-math">\\[ A = P\\,\\frac{i(1+i)^t}{(1+i)^t - 1} \\]</div><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>\\( A \\) = annual repayment amount</li><li>\\( P \\) = principal</li><li>\\( i \\) = annual rate of interest expressed as a decimal or fraction</li><li>\\( t \\) = time in years</li></ul></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#14b8a6">11</div><div class="min-w-0"><div class="int-title">Continuous compounding</div></div></div><div class="int-cell"><span class="int-tag">Formula</span><div class="int-math">\\[ F = Pe^{it} \\]</div><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>\\( F \\) = final value</li><li>\\( P \\) = principal</li><li>\\( i \\) = annual rate of interest expressed as a decimal or fraction</li><li>\\( t \\) = time in years</li></ul></div></div></div>
                `
            },
            "m1-c18": {
                title: "Chapter 18: Relations and Functions",
                section: "Section 7: Functions",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Function</div></div></div><div class="int-cell"><p class="text-[13px] leading-snug mt-1.5">A function \\( f(x) \\) takes values of a variable \\( x \\) from a set called the <b>domain</b> and sends them to values \\( y \\) in a set called the <b>codomain</b>, so that each value of \\( x \\) is sent to <b>one and only one</b> value of \\( y \\).</p><svg viewBox="0 0 260 70" class="w-full max-w-[300px] mt-2" style="color:#64748b" xmlns="http://www.w3.org/2000/svg"><text x="12" y="26" font-size="9" fill="currentColor">Input</text><text x="14" y="48" font-size="10" fill="currentColor">x</text><line x1="24" y1="44" x2="78" y2="44" stroke="currentColor" stroke-width="1.2"/><path d="M78 44 l-6 -3 v6z" fill="currentColor"/><text x="112" y="14" font-size="9" fill="currentColor">f(x)</text><rect x="82" y="20" width="76" height="40" fill="none" stroke="#3b82f6" stroke-width="1.6"/><text x="92" y="44" font-size="9" fill="currentColor">Operation</text><line x1="158" y1="44" x2="212" y2="44" stroke="currentColor" stroke-width="1.2"/><path d="M212 44 l-6 -3 v6z" fill="currentColor"/><text x="172" y="26" font-size="9" fill="currentColor">Output</text><text x="218" y="48" font-size="10" fill="currentColor">y</text></svg></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">2</div><div class="min-w-0"><div class="int-title">Domain and range</div></div></div><div class="int-cell"><span class="int-tag">Domain</span><p class="text-[13px] leading-snug mt-1.5">The set of values which is mapped by a function.</p></div><div class="int-cell"><span class="int-tag">Range</span><p class="text-[13px] leading-snug mt-1.5">The set of <b>images</b> obtained by mapping the elements of the domain.</p></div><div class="int-cell"><span class="int-tag">Codomain</span><p class="text-[13px] leading-snug mt-1.5">The set of values into which the elements of the domain are mapped.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">3</div><div class="min-w-0"><div class="int-title">Test for a function (vertical line test)</div></div></div><div class="int-cell"><p class="text-[13px] leading-snug mt-1.5">\\( y = f(x) \\) is a function if all lines drawn parallel to the \\( y \\)-axis from all points in the domain of \\( f(x) \\) intersect the graph of \\( y = f(x) \\) <b>once and only once</b>.</p><div class="flex flex-wrap items-center gap-3 mt-2"><svg viewBox="-4 -4 158 108" style="color:#64748b;max-width:200px" class="w-full" xmlns="http://www.w3.org/2000/svg"><line x1="0" y1="50.0" x2="150" y2="50.0" stroke="currentColor" stroke-width="1"/><line x1="75.0" y1="0" x2="75.0" y2="100" stroke="currentColor" stroke-width="1"/><text x="144" y="47.0" font-size="7" fill="currentColor">x</text><text x="78.0" y="8" font-size="7" fill="currentColor">y</text><line x1="15.0" y1="0" x2="15.0" y2="100" stroke="currentColor" stroke-width=".8" stroke-dasharray="3 2"/><line x1="37.5" y1="0" x2="37.5" y2="100" stroke="currentColor" stroke-width=".8" stroke-dasharray="3 2"/><line x1="60.0" y1="0" x2="60.0" y2="100" stroke="currentColor" stroke-width=".8" stroke-dasharray="3 2"/><line x1="82.5" y1="0" x2="82.5" y2="100" stroke="currentColor" stroke-width=".8" stroke-dasharray="3 2"/><line x1="105.0" y1="0" x2="105.0" y2="100" stroke="currentColor" stroke-width=".8" stroke-dasharray="3 2"/><line x1="127.5" y1="0" x2="127.5" y2="100" stroke="currentColor" stroke-width=".8" stroke-dasharray="3 2"/><line x1="147.0" y1="0" x2="147.0" y2="100" stroke="currentColor" stroke-width=".8" stroke-dasharray="3 2"/><path d="M0.0 60.2 L1.2 60.9 L2.5 61.5 L3.8 62.1 L5.0 62.7 L6.3 63.3 L7.5 63.8 L8.7 64.4 L10.0 65.0 L11.2 65.5 L12.5 66.0 L13.8 66.5 L15.0 67.0 L16.2 67.4 L17.5 67.8 L18.8 68.2 L20.0 68.6 L21.3 68.9 L /div><div class="int-cell"><span class="int-tag">(i)</span><p class="text-[13px] leading-snug mt-1.5">Solve for \\( x \\) in terms of \\( y \\) and then replace \\( y \\) by \\( x \\).</p></div><div class="int-cell"><span class="int-tag">or (ii)</span><p class="text-[13px] leading-snug mt-1.5">Swap the values of \\( x \\) and \\( y \\) in \\( y = f(x) \\) and solve for \\( y \\).</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#6366f1">6</div><div class="min-w-0"><div class="int-title">Combining functions</div></div></div><div class="int-cell"><div class="int-math">\\[ f(g(x)) = (f \\circ g)(x) \\]</div><p class="text-[13px] leading-snug mt-1.5">Let \\( u = g(x) \\):</p><div class="int-math">\\[ u = g(x) \\implies f(g(x)) = f(u) \\]</div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#14b8a6">7</div><div class="min-w-0"><div class="int-title">Continuity</div></div></div><div class="int-cell"><p class="text-[13px] leading-snug mt-1.5">A function \\( y = f(x) \\) is continuous if:</p><div class="int-math">\\[ \\lim_{x \\to a} f(x) = f(a) \\]</div><p class="text-[13px] leading-snug mt-1.5">A continuous function is a function with <b>no gaps</b> in it.</p></div></div></div>

            "m1-c19": {
                title: "Chapter 19: Linear Functions",

                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#6366f1">6(a)</div><div class="min-w-0"><div class="int-title">Circles</div><div class="int-tip">3.1 Circle theorems</div></div></div><div class="int-cell"><span class="int-tag">(i) Angle at the centre</span><p class="text-[13px] leading-snug mt-1.5">Circle centre \\( O \\):</p><div class="int-math">\\[ |\\angle AOB| = 2|\\angle ACB| \\]</div><div class="flex flex-wrap items-center gap-4 mt-2"><svg viewBox="0 0 200 125" class="w-full" style="color:#64748b;max-width:300px" xmlns="http://www.w3.org/2000/svg"><circle cx="100" cy="62" r="52" fill="none" stroke="#3b82f6" stroke-width="1.8"/><line x1="100.0" y1="10.0" x2="59.0" y2="94.0" stroke="#3b82f6" stroke-width="1.8"/><line x1="100.0" y1="10.0" x2="141.0" y2="94.0" stroke="#3b82f6" stroke-width="1.8"/><line x1="100.0" y1="62.0" x2="59.0" y2="94.0" stroke="#3b82f6" stroke-width="1.8"/><line x1="100.0" y1="62.0" x2="141.0" y2="94.0" stroke="#3b82f6" stroke-width="1.8"/><circle cx="100.0" cy="62.0" r="2.3" fill="currentColor"/><circle cx="59.0" cy="94.0" r="2.3" fill="currentColor"/><circle cx="141.0" cy="94.0" r="2.3" fill="currentColor"/><circle cx="100.0" cy="10.0" r="2.3" fill="currentColor"/><text x="100.0" y="5.5" font-size="9" text-anchor="middle" fill="currentColor">C</text><text x="51.0" y="102.5" font-size="9" text-anchor="middle" fill="currentColor">A</text><text x="149.0" y="102.5" font-size="9" text-anchor="middle" fill="currentColor">B</text><text x="106.0" y="53.5" font-size="9" text-anchor="middle" fill="currentColor">O</text><path d="M94.3 21.7 A13.0 13.0 0 0 0 105.7 21.7" fill="none" stroke="#f59e0b" stroke-width="1.4"/><text x="100.0" y="37.5" font-size="10" text-anchor="middle" fill="#f59e0b">x</text><path d="M89.0 70.6 A14.0 14.0 0 0 0 111.0 70.6" fill="none" stroke="#f59e0b" stroke-width="1.4"/><text x="100.0" y="87.5" font-size="10" text-anchor="middle" fill="#f59e0b">2x -size="9" text-anchor="middle" fill="currentColor">O</text><text x="120.0" y="73.5" font-size="9" text-anchor="start" fill="currentColor">P</text><text x="120.0" y="21.5" font-size="10" text-anchor="start" fill="currentColor">t</text><text x="122.0" y="33.5" font-size="9" text-anchor="start" fill="currentColor">Q</text><circle cx="112.0" cy="28.0" r="2.3" fill="currentColor"/></svg></div></div><div class="int-cell"><span class="int-tag">(ii) Chords</span><p class="text-[13px] leading-snug mt-1.5">If \\( [AB] \\) is a chord to the circle with centre \\( O \\):</p><div class="int-math">\\[ OD \\perp AB \\iff |AD| = |DB| \\]</div><div class="flex flex-wrap items-center gap-4 mt-2"><svg viewBox="0 0 200 125" class="w-full" style="color:#64748b;max-width:300px" xmlns="http://www.w3.org/2000/svg"><circle cx="100" cy="56" r="46" fill="none" stroke="#3b82f6" stroke-width="1.8"/><line x1="63.5" y1="84.0" x2="136.5" y2="84.0" stroke="#3b82f6" stroke-width="1.8"/><line x1="100.0" y1="56.0" x2="100.0" y2="84.0" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/><line x1="100.0" y1="56.0" x2="63.5" y2="84.0" stroke="#64748b" stroke-width="1.2"/><line x1="100.0" y1="56.0" x2="136.5" y2="84.0" stroke="#64748b" stroke-width="1.2"/><circle cx="100.0" cy="56.0" r="2.3" fill="currentColor"/><circle cx="63.5" cy="84.0" r="2.3" fill="currentColor"/><circle cx="136.5" cy="84.0" r="2.3" fill="currentColor"/><circle cx="100.0" cy="84.0" r="2.3" fill="currentColor"/><path d="M100.0 77.0 L107.0 77.0 L107.0 84.0" fill="none" stroke="currentColor" stroke-width="1.2"/><text x="108.0" y="53.5" font-size="9" text-anchor="middle" fill="currentColor">O</text><text x="55.5" y="93.5" font-size="9" text-anchor="middle" fill="currentColor">A</text><text x="144.5" y="93.5" font-size="9" text-anchor="middle" fill="currentColor">B</text><text x="100.0" y="98.5" font-size="9" text-anchor="middle" fill="currentColor">D</text><line x1="81.8" y1="80.0" x2="81.8" y2="88.0" stroke="#3b82f6" stroke-width="1.6"/><line x1="118.2" y1="80.0" x2="118.2" y2="88.0" stroke="#3b82f6" stroke-width="1.6"/></svg></div></div><div class="int-cell"><span class="int-tag">(iii) Touching circles</span><div class="law-grid"><div class="law"><span class="int-tag">Externally</span><div class="int-math">\\[ |C_1C_2| = r_1 + r_2 \\]</div></div><div class="law"><span class="int-tag">Internally</span><div class="int-math">\\[ |C_1C_2| = r_1 - r_2 \\]</div></div></div><div class="flex flex-wrap items-center gap-4 mt-2"><svg viewBox="0 0 210 125" class="w-full" style="color:#64748b;max-width:315px" xmlns="http://www.w3.org/2000/svg"><circle cx="62" cy="62" r="46" fill="none" stroke="#3b82f6" stroke-width="1.8"/><circle cx="146" cy="62" r="30" fill="none" stroke="#3b82f6" stroke-width="1.8"/><line x1="62.0" y1="62.0" x2="146.0" y2="62.0" stroke="currentColor" stroke-width="1"/><line x1="108.0" y1="20.0" x2="108.0" y2="104.0" stroke="#f59e0b" stroke-width="1.3"/><circle cx="62.0" cy="62.0" r="2.3" fill="currentColor"/><circle cx="146.0" cy="62.0" r="2.3" fill="currentColor"/><circle cx="108.0" cy="62.0" r="2.3" fill="currentColor"/><text x="62.0" y="76.5" font-size="9" text-anchor="middle" fill="currentColor">C₁</text><text x="146.0" y="76.5" font-size="9" text-anchor="middle" fill="currentColor">C₂</text><text x="84.0" y="59.5" font-size="9" text-anchor="middle" fill="currentColor">r₁</text><text x="127.0" y="59.5" font-size="9" text-anchor="middle" fill="currentColor">r₂</text></svg><svg viewBox="0 0 210 125" class="w-full" style="color:#64748b;max-width:315px" xmlns="http://www.w3.org/2000/svg"><circle cx="92" cy="62" r="52" fill="none" stroke="#3b82f6" stroke-width="1.8"/><circle cx="117" cy="62" r="27" fill="none" stroke="#3b82f6" stroke-width="1.8"/><line x1="92.0" y1="62.0" x2="117.0" y2="62.0" stroke="currentColor" stroke-width="1"/><circle cx="92.0" cy="62.0" r="2.3" fill="currentColor"/><circle cx="117.0" cy="62.0" r="2.3" fill="currentColor"/><circle cx="144.0" cy="62.0" r="2.3"             "m2-c4": {
                title: "Chapter 4: Constructions and Dilations",
                section: "Section 1: Geometry",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#14b8a6">7</div><div class="min-w-0"><div class="int-title">Constructions</div><div class="int-tip">4.1</div></div></div><div class="int-cell"><ol class="text-[13px] leading-snug space-y-1 mt-1.5 list-decimal pl-5"><li>Circumcentre and circumcircle</li><li>Incentre and incircle</li><li>Angle of 60°</li><li>Tangent to a circle</li><li>Parallelogram</li><li>Centroid</li><li>Orthocentre</li></ol></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ec4899">8</div><div class="min-w-0"><div class="int-title">Dilations</div><div class="int-tip">4.2 Under a dilation with centre \\( O \\) and scale factor \\( k \\):</div></div></div><div class="int-cell"><span class="int-tag">(i) Lengths</span><div class="int-math">\\[ \\frac{|OA^{\\prime}|}{|OA|} = \\frac{|OB^{\\prime}|}{|OB|} = \\frac{|OC^{\\prime}|}{|OC|} = \\frac{|A^{\\prime}B^{\\prime}|}{|AB|} = \\frac{|A^{\\prime}C^{\\prime}|}{|AC|} = \\frac{|B^{\\prime}C^{\\prime}|}{|BC|} = k \\]</div><div class="flex flex-wrap items-center gap-4 mt-2"><svg viewBox="0 0 220 125" class="w-full" style="color:#64748b;max-width:330px" xmlns="http://www.w3.org/2000/svg"><line x1="14.0" y1="104.0" x2="74.0" y2="64.0" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/><line x1="14.0" y1="104.0" x2="134.0" y2="104.0" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/><line x1="14.0" y1="104.0" x2="106.0" y2="28.0" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/><polygon points="44.0,84.0 74.0,104.0 60.0,66.0" fill="none" stroke="#3b82f6" stroke-width="1.8" stroke-linejoin="round"/><polygon points="74.0,64.0 134.0,104.0 106.0,28.0" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linejoin="round"/><circle cx="14.0" cy="104.0" r="2.3" fill="currentColor"/><text x="8.0" y="115.5" font-size="9" text-anchor="middle" fill="currentColor">O</text><text x="36.0" y="87.5" font-size="9" text-anchor="middle" fill="currentColor">A</text><text x="80.0" y="115.5" font-size="9" text-anchor="middle" fill="currentColor">B</text><text x="60.0" y="62.5" font-size="9" text-anchor="middle" fill="currentColor">C</text><text x="65.0" y="67.5" font-size="9" text-anchor="middle" fill="currentColor">A′</text><text x="140.0" y="116.5" font-size="9" text-anchor="middle" fill="currentColor">B′</text><text x="106.0" y="24.5" font-size="9" text-anchor="middle" fill="currentColor">C′</text></svg></div></div><div class="int-cell"><span class="int-tag">(ii) Areas</span><div class="int-math">\\[ \\text{Area } \\triangle A^{\\prime}B^{\\prime}C^{\\prime} = k^2 \\times \\text{Area } \\triangle ABC \\]</div></div></div></div>
                `
