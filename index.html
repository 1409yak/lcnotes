            "m2-c5": {
                title: "Chapter 5: Two-dimensional Figures",
                section: "Section 2: Mensuration",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">2D shapes</div><div class="int-tip">Perimeter and area.</div></div></div><div class="int-cell"><span class="int-tag">(a) Rectangle</span><div class="law-grid"><div class="law"><span class="int-tag">Perimeter</span><div class="int-math">\\[ 2b + 2h \\]</div></div><div class="law"><span class="int-tag">Area</span><div class="int-math">\\[ b \\times h \\]</div></div></div></div><div class="int-cell"><span class="int-tag">(b) Square</span><div class="law-grid"><div class="law"><span class="int-tag">Perimeter</span><div class="int-math">\\[ 4b \\]</div></div><div class="law"><span class="int-tag">Area</span><div class="int-math">\\[ b^2 \\]</div></div></div></div><div class="int-cell"><span class="int-tag">(c) Parallelogram</span><div class="law-grid"><div class="law"><span class="int-tag">Perimeter</span><div class="int-math">\\[ 2b + 2a \\]</div></div><div class="law"><span class="int-tag">Area</span><div class="int-math">\\[ b \\times h \\]</div></div></div></div><div class="int-cell"><span class="int-tag">(d) Rhombus</span><div class="law-grid"><div class="law"><span class="int-tag">Perimeter</span><div class="int-math">\\[ 4b \\]</div></div><div class="law"><span class="int-tag">Area</span><div class="int-math">\\[ b \\times h \\]</div></div></div></div><div class="int-cell"><span class="int-tag">(e) Triangle</span><div class="law-grid"><div class="law"><span class="int-tag">Perimeter</span><div class="int-math">\\[ a + b + c \\]</div></div><div class="law"><span class="int-tag">Area</span><div class="int-math">\\[ \\tfrac{1}{2} \\times b \\times h \\]</div></div></div></div><div class="int-cell"><span class="int-tag">(f) Trapezium</span><div class="law-grid"><div class="law"><span class="int-tag">Perimeter</span><div class="int-math">\\[ b + c + a + d \\]</div></div><div class="law"><span class="int-tag">Area</span><div class="int-math">\\[ \\tfrac{1}{2}h(b + a) \\]</div></div></div></div><div class="int-cell"><span class="int-tag">(g)(i) Full circle</span><div class="law-grid"><div class="law"><span class="int-tag">Perimeter</span><div class="int-math">\\[ 2\\pi r \\]</div></div><div class="law"><span class="int-tag">Area</span><div class="int-math">\\[ \\pi r^2 \\]</div></div></div></div><div class="int-cell"><span class="int-tag">(g)(ii) Sector of a circle (θ in degrees)</span><div class="law-grid"><div class="law"><span class="int-tag">Arc length PQ</span><div class="int-math">\\[ 2\\pi r \\times \\left(\\frac{\\theta}{360}\\right) \\]</div></div><div class="law"><span class="int-tag">Area</span><div class="int-math">\\[ \\pi r^2 \\times \\left(\\frac{\\theta}{360}\\right) \\]</div></div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">2</div><div class="min-w-0"><div class="int-title">Trapezoidal rule</div></div></div><div class="int-cell"><div class="int-math">\\[ \\text{Area} \\approx \\frac{\\text{Base step } h}{2}\\Big\\{(\\text{First height} + \\text{last height}) + 2(\\text{sum of the other heights})\\Big\\} \\]</div></div></div></div>
                `
            },
            "m2-c6": {
                title: "Chapter 6: Three-dimensional Figures and Nets",
                section: "Section 2: Mensuration",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">3</div><div class="min-w-0"><div class="int-title">3D shapes</div></div></div><div class="int-cell"><span class="int-tag">(a) Triangular prism</span><div class="int-math">\\[ \\text{Surface area} = \\text{sum of areas of all faces} = (ah + bh + ch) + 2B \\]</div><div class="int-math">\\[ \\text{Volume} = \\text{cross-sectional area } B \\times \\text{height } h \\]</div></div><div class="int-cell"><span class="int-tag">(b) Cuboid</span><div class="law-grid"><div class="law"><span class="int-tag">Surface area</span><div class="int-math">\\[ 2(ab + bh + ah) \\]</div></div><div class="law"><span class="int-tag">Volume</span><div class="int-math">\\[ Bh = abh \\]</div></div></div></div><div class="int-cell"><span class="int-tag">(c) Cylinder</span><div class="law-grid"><div class="law"><span class="int-tag">Curved surface area</span><div class="int-math">\\[ 2\\pi rh \\]</div></div><div class="law"><span class="int-tag">Total surface area</span><div class="int-math">\\[ 2\\pi rh + 2\\pi r^2 \\]</div></div><div class="law"><span class="int-tag">Volume</span><div class="int-math">\\[ \\pi r^2 h \\]</div></div></div></div><div class="int-cell"><span class="int-tag">(d) Right-circular cone</span><div class="law-grid"><div class="law"><span class="int-tag">Curved surface area</span><div class="int-math">\\[ \\pi rl \\]</div></div><div class="law"><span class="int-tag">Total surface area</span><div class="int-math">\\[ \\pi r^2 + \\pi rl \\]</div></div><div class="law"><span class="int-tag">Volume</span><div class="int-math">\\[ \\tfrac{1}{3}\\pi r^2 h \\]</div></div></div></div><div class="int-cell"><span class="int-tag">(e)(i) Sphere</span><div class="law-grid"><div class="law"><span class="int-tag">Surface area</span><div class="int-math">\\[ 4\\pi r^2 \\]</div></div><div class="law"><span class="int-tag">Volume</span><div class="int-math">\\[ \\tfrac{4}{3}\\pi r^3 \\]</div></div></div></div><div class="int-cell"><span class="int-tag">(e)(ii) Hemisphere</span><div class="law-grid"><div class="law"><span class="int-tag">Curved surface area</span><div class="int-math">\\[ 2\\pi r^2 \\]</div></div><div class="law"><span class="int-tag">Total surface area</span><div class="int-math">\\[ 3\\pi r^2 \\]</div></div><div class="law"><span class="int-tag">Volume</span><div class="int-math">\\[ \\tfrac{2}{3}\\pi r^3 \\]</div></div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#6366f1">4</div><div class="min-w-0"><div class="int-title">Rate of flow of a liquid or gas</div></div></div><div class="int-cell"><div class="int-math">\\[ \\text{Rate of flow} = \\frac{\\text{Volume}}{\\text{Time}} = B \\times x \\]</div><p class="text-[13px] leading-snug mt-1.5">where \\( B \\) is the cross-sectional area and \\( x \\) is the speed.</p></div></div></div>
                `
            },
            "m2-c7": {
                title: "Chapter 7: Trigonometry 1",
                section: "Section 3: Trigonometry",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Trigonometric ratios</div></div></div><div class="int-cell"><span class="int-tag">(a) The three basic ratios (unit circle, point P(x, y))</span><div class="law-grid"><div class="law"><span class="int-tag">cos A</span><div class="int-math">\\[ \\frac{x \\text{ co-ordinate}}{\\text{Radius}} \\]</div></div><div class="law"><span class="int-tag">sin A</span><div class="int-math">\\[ \\frac{y \\text{ co-ordinate}}{\\text{Radius}} \\]</div></div><div class="law"><span class="int-tag">tan A</span><div class="int-math">\\[ \\frac{y \\text{ co-ordinate}}{x \\text{ co-ordinate}} = \\frac{\\sin A}{\\cos A} \\]</div></div></div></div><div class="int-cell"><span class="int-tag">(b) Angles not in the first quadrant</span><p class="text-[13px] leading-snug mt-1.5"><b>ASTC:</b> the letter shows what is <b>positive</b> in each quadrant. <b>Location:</b> always locate angles using the (0°–180°) line. \\( \\theta \\) is the reference angle in the first quadrant.</p><div class="grid grid-cols-2 gap-2 mt-2 text-[13px] text-center"><div class="law"><b>S (Sin +)</b><br>\\( 180^\\circ - \\theta \\)</div><div class="law"><b>A (All +)</b><br>\\( \\theta \\)</div><div class="law"><b>T (Tan +)</b><br>\\( 180^\\circ + \\theta \\)</div><div class="law"><b>C (Cos +)</b><br>\\( 360^\\circ - \\theta \\)</div></div></div><div class="int-cell"><span class="int-tag">(c) Negative angles</span><div class="law-grid"><div class="law"><span class="int-tag"></span><div class="int-math">\\[ \\cos(-A) = \\cos A \\]</div></div><div class="law"><span class="int-tag"></span><div class="int-math">\\[ \\sin(-A) = -\\sin A \\]</div></div><div class="law"><span class="int-tag"></span><div class="int-math">\\[ \\tan(-A) = -\\tan A \\]</div></div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">2</div><div class="min-w-0"><div class="int-title">Degrees versus radians</div></div></div><div class="int-cell"><span class="int-tag">(a) Conversion</span><div class="int-math">\\[ \\pi \\text{ rads} = 180^\\circ \\]</div></div><div class="int-cell"><span class="int-tag">(b) Arc length of circle</span><div class="int-math">\\[ l = r\\theta \\quad (\\theta \\text{ in radians}) \\]</div></div><div class="int-cell"><span class="int-tag">(c) Area of sector of circle</span><div class="int-math">\\[ \\text{Area} = \\tfrac{1}{2}r^2\\theta \\quad (\\theta \\text{ in rads}) \\]</div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">3(a)</div><div class="min-w-0"><div class="int-title">Solving right-angled triangles (RATs)</div><div class="int-tip">7.3 and 7.4</div></div></div><div class="int-cell"><div class="law-grid"><div class="law"><span class="int-tag">cos A</span><div class="int-math">\\[ \\frac{ADJ}{HYP} \\]</div></div><div class="law"><span class="int-tag">sin A</span><div class="int-math">\\[ \\frac{OPP}{HYP} \\]</div></div><div class="law"><span class="int-tag">tan A</span><div class="int-math">\\[ \\frac{OPP}{ADJ} \\]</div></div></div><p class="text-[13px] leading-snug mt-1.5">Pythagoras: \\( r^2 = x^2 + y^2 \\)</p></div></div></div>
                `
            },
            "m2-c8": {
                title: "Chapter 8: Trigonometry 2",
                section: "Section 3: Trigonometry",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">3(b)</div><div class="min-w-0"><div class="int-title">Area of a triangle</div><div class="int-tip">8.1</div></div></div><div class="int-cell"><div class="int-math">\\[ \\text{Area} = \\tfrac{1}{2}bc\\sin A = \\tfrac{1}{2}ac\\sin B = \\tfrac{1}{2}ab\\sin C \\]</div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">3(c)</div><div class="min-w-0"><div class="int-title">Sine rule (proof required)</div><div class="int-tip">8.2</div></div></div><div class="int-cell"><div class="int-math">\\[ \\frac{a}{\\sin A} = \\frac{b}{\\sin B} = \\frac{c}{\\sin C} \\]</div><p class="text-[13px] leading-snug mt-1.5"><b>or</b></p><div class="int-math">\\[ \\frac{\\sin A}{a} = \\frac{\\sin B}{b} = \\frac{\\sin C}{c} \\]</div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">3(d)</div><div class="min-w-0"><div class="int-title">Cosine rule (proof required)</div><div class="int-tip">8.3</div></div></div><div class="int-cell"><div class="int-math">\\[ a^2 = b^2 + c^2 - 2bc\\cos A \\quad (A \\text{ version}) \\]</div><div class="int-math">\\[ b^2 = c^2 + a^2 - 2ac\\cos B \\quad (B \\text{ version}) \\]</div><div class="int-math">\\[ c^2 = a^2 + b^2 - 2ab\\cos C \\quad (C \\text{ version}) \\]</div></div></div></div>
                `
            },
            "m2-c9": {
                title: "Chapter 9: Trigonometry 3",
                section: "Section 3: Trigonometry",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">4</div><div class="min-w-0"><div class="int-title">Trigonometric conversions</div></div></div><div class="int-cell"><span class="int-tag">(a) Products to sums</span><div class="int-math">\\[ 2\\sin A\\cos B = \\sin(A+B) + \\sin(A-B) \\]</div><div class="int-math">\\[ 2\\cos A\\sin B = \\sin(A+B) - \\sin(A-B) \\]</div><div class="int-math">\\[ 2\\cos A\\cos B = \\cos(A+B) + \\cos(A-B) \\]</div><div class="int-math">\\[ 2\\sin A\\sin B = \\cos(A-B) - \\cos(A+B) \\]</div></div><div class="int-cell"><span class="int-tag">(b) Sums to products</span><div class="int-math">\\[ \\sin A + \\sin B = 2\\sin\\left(\\frac{A+B}{2}\\right)\\cos\\left(\\frac{A-B}{2}\\right) \\]</div><div class="int-math">\\[ \\sin A - \\sin B = 2\\cos\\left(\\frac{A+B}{2}\\right)\\sin\\left(\\frac{A-B}{2}\\right) \\]</div><div class="int-math">\\[ \\cos A + \\cos B = 2\\cos\\left(\\frac{A+B}{2}\\right)\\cos\\left(\\frac{A-B}{2}\\right) \\]</div><div class="int-math">\\[ \\cos A - \\cos B = -2\\sin\\left(\\frac{A+B}{2}\\right)\\sin\\left(\\frac{A-B}{2}\\right) \\]</div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">5</div><div class="min-w-0"><div class="int-title">Trigonometric equations</div></div></div><div class="int-cell"><ol class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-[lower-alpha] pl-5"><li>Isolate the trigonometric function on one side.</li><li>Use ASTC to locate the two quadrants the basic angles are in.</li><li>Find the reference angle \\( \\theta \\) in the first quadrant.</li><li>Find the two basic angles.</li><li>Find all angles in the range of values specified.</li><li>Find the general solution if required.</li></ol></div><div class="int-cell"><span class="int-tag">Sums of sines and cosines</span><p class="text-[13px] leading-snug mt-1.5">Change a sum into a product to solve an equation involving a sum of sines and cosines.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#6366f1">6</div><div class="min-w-0"><div class="int-title">Trigonometric graphs</div></div></div><div class="int-cell"><span class="int-tag">(a) \\( y = a + b\\cos kx \\) and \\( y = a + b\\sin kx \\)</span><div class="law-grid"><div class="law"><span class="int-tag">Period</span><div class="int-math">\\[ P = \\frac{2\\pi}{k} \\]</div></div><div class="law"><span class="int-tag">Range</span><div class="int-math">\\[ [a-b,\\, a+b] \\text{ if } b > 0 \\]</div></div><div class="law"><span class="int-tag">Range</span><div class="int-math">\\[ [a+b,\\, a-b] \\text{ if } b < 0 \\]</div></div></div></div><div class="int-cell"><span class="int-tag">(b) \\( y = a + b\\tan kx \\)</span><div class="law-grid"><div class="law"><span class="int-tag">Period</span><div class="int-math">\\[ P = \\frac{\\pi}{k} \\]</div></div><div class="law"><span class="int-tag">Range</span><div class="int-math">\\[ [-\\infty, \\infty] \\]</div></div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#14b8a6">7</div><div class="min-w-0"><div class="int-title">Inverse trigonometry</div></div></div><div class="int-cell"><div class="law-grid"><div class="law"><span class="int-tag">(a)</span><div class="int-math">\\[ y = \\cos^{-1}x \\iff \\cos y = x \\]</div></div><div class="law"><span class="int-tag">(b)</span><div class="int-math">\\[ y = \\sin^{-1}x \\iff \\sin y = x \\]</div></div><div class="law"><span class="int-tag">(c)</span><div class="int-math">\\[ y = \\tan^{-1}x \\iff \\tan y = x \\]</div></div></div></div></div></div>
                `
            },
            "m2-c10": {
                title: "Chapter 10: Line 1",
                section: "Section 4: Co-ordinate Geometry",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">The distance between two points</div><div class="int-tip">10.2</div></div></div><div class="int-cell"><div class="int-math">\\[ |PQ| = \\sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2} \\]</div><p class="text-[13px] leading-snug mt-1.5"><b>Remember as:</b> \\( \\sqrt{(\\text{Difference in } x)^2 + (\\text{Difference in } y)^2} \\)</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">2</div><div class="min-w-0"><div class="int-title">The midpoint formula</div><div class="int-tip">10.3</div></div></div><div class="int-cell"><div class="int-math">\\[ \\text{Midpoint of } [PQ] = R\\left(\\frac{x_1 + x_2}{2},\\, \\frac{y_1 + y_2}{2}\\right) \\]</div><p class="text-[13px] leading-snug mt-1.5"><b>Remember as:</b> add the \\( x \\) values ÷ 2, add the \\( y \\) values ÷ 2.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">3</div><div class="min-w-0"><div class="int-title">The area of a triangle</div><div class="int-tip">10.4 Vertices O(0,0), P(x₁, y₁), Q(x₂, y₂)</div></div></div><div class="int-cell"><div class="int-math">\\[ \\text{Area} = \\tfrac{1}{2}\\left|x_1y_2 - x_2y_1\\right| \\]</div><p class="text-[13px] leading-snug mt-1.5">Write the points in a column, repeat the first point (\\( O(0,0) \\) at top and bottom) and cross-multiply.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">4</div><div class="min-w-0"><div class="int-title">The slope of a line</div><div class="int-tip">10.5</div></div></div><div class="int-cell"><div class="int-math">\\[ \\text{Slope} = m = \\tan A = \\frac{\\text{Rise}}{\\text{Run}} = \\frac{y_2 - y_1}{x_2 - x_1} \\]</div><p class="text-[13px] leading-snug mt-1.5"><b>Remember as:</b> difference in \\( y \\) ÷ difference in \\( x \\). Slope = average rate of change of \\( y \\) with respect to \\( x \\).</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">5</div><div class="min-w-0"><div class="int-title">Slopes of special lines</div><div class="int-tip">10.5</div></div></div><div class="int-cell"><span class="int-tag">(a) Parallel lines have the same slope</span><div class="int-math">\\[ l_1 \\parallel l_2 \\parallel l_3 \\iff m_1 = m_2 = m_3 = \\tan A \\]</div></div><div class="int-cell"><span class="int-tag">(b) Perpendicular lines</span><div class="int-math">\\[ l_1 \\perp l_2 \\iff m_1 m_2 = -1 \\iff m_2 = -\\frac{1}{m_1} \\]</div></div><div class="int-cell"><span class="int-tag">(c) All horizontal lines have slope 0</span><div class="int-math">\\[ m = \\tan 0^\\circ = 0 \\]</div></div><div class="int-cell"><span class="int-tag">(d) All vertical lines have slope ∞</span><div class="int-math">\\[ m = \\tan 90^\\circ = \\infty \\]</div></div><div class="int-cell"><span class="int-tag">(e) Lines making equal intercepts on the axes have a slope of ±1</span><div class="int-math">\\[ \\text{Slope of } l_1 = m = \\tan 45^\\circ = +1 \\]</div><div class="int-math">\\[ \\text{Slope of } l_2 = \\tan 135^\\circ = -1 \\]</div></div><div class="int-cell"><span class="int-tag">(f) Collinear points</span><div class="int-math">\\[ \\text{Slope of } PQ = \\text{slope of } PR = \\text{slope of } QR \\]</div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#6366f1">6</div><div class="min-w-0"><div class="int-title">The equation of a straight line</div><div class="int-tip">10.6</div></div></div><div class="int-cell"><span class="int-tag">(a) To find the equation of a line you need two things</span><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li><b>(i)</b> Slope \\( m \\)</li><li><b>(ii)</b> Point \\( P(x_1, y_1) \\) on the line</li></ul><div class="int-math">\\[ (y - y_1) = m(x - x_1) \\]</div></div><div class="int-cell"><span class="int-tag">(b) Slope–intercept form</span><div class="int-math">\\[ y = mx + c \\]</div><p class="text-[13px] leading-snug mt-1.5">Passes through \\( (0, c) \\) with slope \\( m \\).</p></div><div class="int-cell"><span class="int-tag">(c) Slope of \\( ax + by + c = 0 \\)</span><div class="int-math">\\[ m = -\\frac{a}{b} = -\\frac{\\text{(Coefficient of } x)}{\\text{(Coefficient of } y)} \\]</div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#14b8a6">7</div><div class="min-w-0"><div class="int-title">Intersecting lines</div></div></div><div class="int-cell"><div class="int-math">\\[ l_1 \\cap l_2 = \\{P\\} \\]</div><p class="text-[13px] leading-snug mt-1.5">\\( P \\) is found by solving the equations of \\( l_1 \\) and \\( l_2 \\) <b>simultaneously</b>.</p></div></div></div>
                `
            },
            "m2-c11": {
                title: "Chapter 11: Line 2",
                section: "Section 4: Co-ordinate Geometry",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">8</div><div class="min-w-0"><div class="int-title">Division of a line segment</div><div class="int-tip">11.1 \\( P(x_1,y_1) \\) to \\( Q(x_2,y_2) \\) divided in the ratio \\( m : n \\) at \\( R(x, y) \\)</div></div></div><div class="int-cell"><div class="int-math">\\[ x = \\frac{mx_2 \\pm nx_1}{m \\pm n}, \\qquad y = \\frac{my_2 \\pm ny_1}{m \\pm n} \\]</div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">9</div><div class="min-w-0"><div class="int-title">Angle between lines</div><div class="int-tip">11.2</div></div></div><div class="int-cell"><div class="int-math">\\[ \\tan\\theta = \\left|\\frac{m_1 - m_2}{1 + m_1 m_2}\\right|, \\quad \\text{for } \\theta \\text{ acute} \\]</div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">10</div><div class="min-w-0"><div class="int-title">The perpendicular distance from a point to a line</div><div class="int-tip">11.3 Point \\( P(x_1, y_1) \\), line \\( l: ax + by + c = 0 \\)</div></div></div><div class="int-cell"><div class="int-math">\\[ d = \\frac{|ax_1 + by_1 + c|}{\\sqrt{a^2 + b^2}} = \\frac{|\\text{Point into line}|}{\\text{Pythagoras}} \\]</div></div></div></div>
                `
            },
            "m2-c12": {
                title: "Chapter 12: Circle 1",
                section: "Section 4: Co-ordinate Geometry",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">11</div><div class="min-w-0"><div class="int-title">The equation of a circle</div><div class="int-tip">12.1</div></div></div><div class="int-cell"><span class="int-tag">(a) Centre C(0, 0), radius r</span><div class="int-math">\\[ x^2 + y^2 = r^2 \\]</div></div><div class="int-cell"><span class="int-tag">(b) Centre C(h, k), radius r</span><div class="int-math">\\[ (x - h)^2 + (y - k)^2 = r^2 \\]</div></div><div class="int-cell"><span class="int-tag">(c) Centre C(−g, −f), radius r</span><div class="int-math">\\[ x^2 + y^2 + 2gx + 2fy + c = 0 \\]</div><div class="int-math">\\[ r = \\sqrt{g^2 + f^2 - c} \\]</div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ec4899">12</div><div class="min-w-0"><div class="int-title">Tangents</div><div class="int-tip">12.2</div></div></div><div class="int-cell"><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>\\( t \\) is perpendicular to \\( CP \\) at the point of contact \\( P \\).</li><li>\\( r = |CP| \\)</li><li>\\( s \\cap t = \\{P\\} \\)</li></ul></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#14b8a6">13</div><div class="min-w-0"><div class="int-title">Chords</div><div class="int-tip">12.2</div></div></div><div class="int-cell"><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>\\( s \\cap l = \\{P, Q\\} \\)</li><li>A perpendicular line drawn from the centre \\( C \\) to a chord \\( [PQ] \\) bisects the chord \\( [PQ] \\): \\( |PR| = |RQ| \\)</li><li>\\( \\triangle CPR \\equiv \\triangle CQR \\) are both right-angled triangles. You can apply Pythagoras' theorem to both triangles.</li></ul></div></div></div>
                `
            },
            "m2-c13": {
                title: "Chapter 13: Circle 2",
                section: "Section 4: Co-ordinate Geometry",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">11</div><div class="min-w-0"><div class="int-title">Circle with axes as tangents</div><div class="int-tip">13.1 Finding the equation of a circle given certain information. Centre \\( C(-g, -f) \\).</div></div></div><div class="int-cell"><span class="int-tag">(a) x-axis as a tangent</span><div class="int-math">\\[ r = |-f|, \\quad c = g^2 \\]</div></div><div class="int-cell"><span class="int-tag">(b) y-axis as a tangent</span><div class="int-math">\\[ r = |-g|, \\quad c = f^2 \\]</div></div><div class="int-cell"><span class="int-tag">(c) Both axes as tangents</span><div class="int-math">\\[ r = |-g| = |-f|, \\quad c = g^2 = f^2, \\quad f = \\pm g \\]</div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">14</div><div class="min-w-0"><div class="int-title">Intersecting circles</div><div class="int-tip">13.2</div></div></div><div class="int-cell"><span class="int-tag">(a) Touching circles</span><p class="text-[13px] leading-snug mt-1.5"><b>External:</b> \\( |C_1C_2| = r_1 + r_2 \\). <b>Internal:</b> \\( |C_1C_2| = r_1 - r_2 \\).</p><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>\\( [C_1C_2] \\) is the line of centres (LC).</li><li>The common tangent (CT) at the point of contact \\( P \\) is perpendicular to \\( [C_1C_2] \\).</li><li>\\( LC \\cap CT = \\{P\\} \\)</li><li>\\( |C_1P| : |C_2P| = r_1 : r_2 \\)</li><li>CT: \\( s_1 - s_2 = 0 \\)</li></ul></div><div class="int-cell"><span class="int-tag">(b) Cutting circles</span><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>\\( [C_1C_2] \\) is the line of centres (LC).</li><li>The common chord (CC) through the points of intersection \\( P \\) and \\( Q \\) of \\( s_1 \\) and \\( s_2 \\) is perpendicular to \\( [C_1C_2] \\).</li><li>\\( s_1 \\cap CC = \\{P, Q\\} \\), \\( s_2 \\cap CC = \\{P, Q\\} \\)</li><li>\\( LC \\cap CC = \\{R\\} \\): \\( R \\) is the midpoint of \\( [PQ] \\), \\( |QR| = |RP| \\)</li></ul></div><div class="int-cell"><span class="int-tag">(c) Good habits</span><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>Find the centres \\( C_1 \\) and \\( C_2 \\) and the radii \\( r_1 \\) and \\( r_2 \\) of the circles \\( s_1 \\) and \\( s_2 \\) before you draw them.</li><li>Draw the LC.</li><li>Find \\( |C_1C_2| \\).</li></ul></div></div></div>
                `
            },
            "m2-c14": {
                title: "Chapter 14: Counting",
                section: "Section 5: Probability",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Counting</div><div class="int-tip">14.1 to 14.3</div></div></div><div class="int-cell"><span class="int-tag">(a) Multiplication principle</span><p class="text-[13px] leading-snug mt-1.5">If there are \\( a \\) ways to do one operation and \\( b \\) ways to do a second operation and \\( c \\) ways to do a third operation, etc., the number of ways of doing the first operation and then the second and then the third, etc., is:</p><div class="int-math">\\[ a \\times b \\times c \\times \\ldots \\]</div></div><div class="int-cell"><span class="int-tag">(b) Permutations of n different objects, all taken, no repetition</span><div class="int-math">\\[ n! = n \\times (n-1) \\times (n-2) \\times \\ldots \\times 1 \\]</div></div><div class="int-cell"><span class="int-tag">(c) Permutations of n different objects taken r at a time, no repetition</span><div class="int-math">\\[ {}^nP_r = n \\times (n-1) \\times \\ldots \\times (n-r+1) \\]</div></div><div class="int-cell"><span class="int-tag">(d) Ways of selecting r different objects from n different objects</span><div class="int-math">\\[ {}^nC_r = \\frac{{}^nP_r}{r!} = \\frac{n!}{r!\\,(n-r)!} \\]</div></div></div></div>
                `
            },
            "m2-c15": {
                title: "Chapter 15: Probability 1",
                section: "Section 5: Probability",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">2</div><div class="min-w-0"><div class="int-title">The probability ratio P(E)</div><div class="int-tip">15.1 to 15.3</div></div></div><div class="int-cell"><div class="int-math">\\[ P(E) = \\frac{\\text{Number of desired outcomes}}{\\text{Total number of outcomes}} \\]</div><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>\\( 0 \\leq P \\leq 1 \\)</li><li>\\( P(\\text{Failure}) = Q = 1 - P(\\text{Success}) \\)</li></ul></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">3</div><div class="min-w-0"><div class="int-title">Rules of probability</div><div class="int-tip">15.4</div></div></div><div class="int-cell"><span class="int-tag">(a) ‘or’</span><div class="int-math">\\[ P(A \\text{ or } B) = P(A) + P(B) - P(A \\cap B) \\]</div><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>\\( A \\cap B = \\{\\;\\} \\iff P(A \\cap B) = 0 \\) ⇔ \\( A \\) and \\( B \\) are <b>mutually exclusive</b></li></ul></div><div class="int-cell"><span class="int-tag">(b) ‘and then’</span><div class="int-math">\\[ P(A \\text{ and then } B) = P(A) \\times P(B) \\]</div><p class="text-[13px] leading-snug mt-1.5">once \\( A \\) and \\( B \\) are <b>independent</b>.</p></div></div></div>
                `
            },
            "m2-c16": {
                title: "Chapter 16: Probability 2",
                section: "Section 5: Probability",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">4</div><div class="min-w-0"><div class="int-title">Bernoulli trials</div><div class="int-tip">16.1</div></div></div><div class="int-cell"><span class="int-tag">(a) The Bernoulli rules</span><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>The number of trials \\( n \\) is fixed.</li><li>There are only two possible outcomes to each trial (success or failure).</li><li>Each trial is independent of any previous one.</li><li>The probability of success \\( p \\) and failure \\( q \\) are fixed from trial to trial.</li></ul></div><div class="int-cell"><span class="int-tag">(b) The Bernoulli formula</span><p class="text-[13px] leading-snug mt-1.5">The probability of \\( r \\) successes in \\( n \\) Bernoulli trials is:</p><div class="int-math">\\[ P(r) = {}^nC_r\\,(p)^r\\,(q)^{n-r} \\]</div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">5</div><div class="min-w-0"><div class="int-title">Conditional probability</div><div class="int-tip">16.2</div></div></div><div class="int-cell"><div class="int-math">\\[ P(B|A) = \\frac{P(A \\cap B)}{P(A)} \\]</div><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>\\( P(B|A) = P(B) \\) ⇔ \\( B \\) and \\( A \\) are independent</li></ul></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#14b8a6">6</div><div class="min-w-0"><div class="int-title">Expected value</div><div class="int-tip">16.3</div></div></div><div class="int-cell"><div class="int-math">\\[ E = \\sum x\\,P(x) \\]</div></div></div></div>
                `
            },
            "m2-c17": {
                title: "Chapter 17: Statistical Reasoning",
                section: "Section 6: Statistics",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Organising data</div><div class="int-tip">17.3</div></div></div><div class="int-cell"><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li><b>(a)</b> Tally frequency tables</li><li><b>(b)</b> Grouped frequency tables</li><li><b>(c)</b> Stem-and-leaf plots</li></ul></div></div></div>
                `

            "m2-c18": {
                title: "Chapter 18: Statistical Graphs and Charts",
                section: "Section 6: Statistics",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">2</div><div class="min-w-0"><div class="int-title">Types of graphs</div><div class="int-tip">18.1 and 18.2</div></div></div><div class="int-cell"><span class="int-tag">(a) Graphs</span><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li><b>(i)</b> Pie</li><li><b>(ii)</b> Line</li><li><b>(iii)</b> Bar</li><li><b>(iv)</b> Trend</li></ul></div><div class="int-cell"><span class="int-tag">(b) Histograms</span><p class="text-[13px] leading-snug mt-1.5">In a histogram, area represents frequency. Joining the tops gives a frequency distribution.</p><div class="int-math">\\[ A = \\text{area} = \\text{frequency of data between } x_1 \\text{ and } x_2 \\]</div></div></div></div>
                `
            },
            "m2-c19": {
                title: "Chapter 19: Central Tendency",
                section: "Section 6: Statistics",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">3</div><div class="min-w-0"><div class="int-title">Central tendency</div><div class="int-tip">19.1 to 19.4</div></div></div><div class="int-cell"><span class="int-tag">(a) Mode</span><p class="text-[13px] leading-snug mt-1.5">The <b>most frequent</b> value.</p></div><div class="int-cell"><span class="int-tag">(b) Mean</span><p class="text-[13px] leading-snug mt-1.5">The <b>average</b> of a set of numbers.</p><p class="text-[13px] leading-snug mt-1.5"><b>(i) List:</b></p><div class="int-math">\\[ \\mu = \\frac{\\sum x}{N} \\]</div><p class="text-[13px] leading-snug mt-1.5">where \\( x \\) is a data value and \\( N \\) is the number of data values.</p><p class="text-[13px] leading-snug mt-1.5"><b>(ii) Frequency or grouped frequency distribution:</b></p><div class="int-math">\\[ \\mu = \\frac{\\sum fx}{\\sum f} \\]</div><p class="text-[13px] leading-snug mt-1.5">where \\( x \\) is a data value for a frequency distribution, or the <b>mid-interval value</b> for a grouped frequency distribution.</p></div><div class="int-cell"><span class="int-tag">(c) Median</span><p class="text-[13px] leading-snug mt-1.5">The numerical value in the middle of a set of data when arranged in order of increasing value.</p><p class="text-[13px] leading-snug mt-1.5"><b>(i) Odd number</b> \\( n \\) of data values in increasing size:</p><div class="int-math">\\[ \\text{Median} = \\text{value of } \\left(\\frac{n+1}{2}\\right)^{\\text{th}} \\text{ result} \\]</div><p class="text-[13px] leading-snug mt-1.5"><b>(ii) Even number</b> \\( n \\) of data values in increasing size:</p><div class="int-math">\\[ \\text{Median} = \\text{average of } \\left(\\frac{n}{2}\\right)^{\\text{th}} \\text{ and } \\left(\\frac{n}{2}+1\\right)^{\\text{th}} \\text{ results} \\]</div></div><div class="int-cell"><span class="int-tag">(d) Shapes of frequency distributions</span><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li><b>(i) Symmetrical:</b> mean = mode = median</li><li><b>(ii) Positively skewed:</b> mode < median < mean (tail to the right)</li><li><b>(iii) Negatively skewed:</b> mean < median < mode (tail to the left)</li></ul><div class="flex flex-wrap items-center gap-4 mt-2"><svg viewBox="-4 -4 158 108" style="color:#64748b;max-width:200px" class="w-full" xmlns="http://www.w3.org/2000/svg"><line x1="0" y1="84.6" x2="150" y2="84.6" stroke="currentColor" stroke-width="1"/><line x1="75.0" y1="0" x2="75.0" y2="100" stroke="currentColor" stroke-width="1"/><text x="144" y="81.6" font-size="7" fill="currentColor">x</text><text x="78.0" y="8" font-size="7" fill="currentColor">y</text><line x1="75.0" y1="0" x2="75.0" y2="100" stroke="currentColor" stroke-width=".8" stroke-dasharray="3 2"/><path d="M0.0 84.2 L1.2 84.1 L2.5 84.0 L3.8 83.9 L5.0 83.7 L6.2 83.6 L7.5 83.4 L8.8 83.2 L10.0 83.0 L11.2 82.7 L12.5 82.4 L13.8 82.1 L15.0 81.7 L16.2 81.3 L17.5 80.8 L18.7 80.3 L20.0 79.7 L21.2 79.1 L22.5 78.4 L23.8 77.6 L25.0 76.7 L26.3 75.8 L27.5 74.7 L28.8 73.6 L30.0 72.4 L31.2 71.1 L32.5 69.8 L33.8 68.3 L35.0 66.7 L36.3 65.0 L37.5 63.2 L38.7 61.4 L40.0 59.4 L41.2 57.3 L42.5 55.2 L43.7 53.0 L45.0 50.7 L46.2 48.4 L47.5 46.0 L48.8 43.5 L50.0 41.1 L51.2 38.6 L52.5 36.1 L53.8 33.6 L55.0 31.2 L56.2 28.8 L57.5 26.4 L58.8 24.1 L60.0 21.9 L61.3 19.9 L62.5 17.9 L63.8 16.1 L65.0 14.4 L66.2 12.9 L67.5 11.5 L68.7 10.4 L70.0 9.4 L71.2 8.7 L72.5 8.1 L73.8 7.8 L75.0 7.7 L76.2 7.8 L77.5 8.1 L78.8 8.7 L80.0 9.4 L81.2 10.4 L82.5 11.5 L83.7 12.9 L85.0 14.4 L86.2 16.1 L87.5 17.9 L88.8 19.9 L90.0 21.9 L91.2 24.1 L92.5 26.4 L93.8 28.8 L95.0 31.2 L96.2 33.6 L97.5 36.1 L98.8 38.6 L100.0 41.1 L101.2 43.5 L102.5 46.0 L103.8 48.4 L105.0 50.7 L106.2 53.0 L107.5 55.2 L108.8 57.3 L110.0 59.4 L111.2 61.4 L112.5 63.2 L113.8 65.0 L115.0 66.7 L116.2 68.3 L117.5 69.8 L118.8 71.1 L120.0 72.4 L121.2 73.6 L122.5 74.7 L123.8 75.8 L125.0 76.7 L126.3 77.6 L127.5 78.4 L128. " fill="currentColor">μ−2σ</text><text x="49.7" y="96.8" font-size="7.5" fill="currentColor">μ−σ</text><text x="72.0" y="96.8" font-size="7.5" fill="currentColor">μ</text><text x="92.2" y="96.8" font-size="7.5" fill="currentColor">μ+σ</text><text x="112.5" y="96.8" font-size="7.5" fill="currentColor">μ+2σ</text><text x="132.8" y="96.8" font-size="7.5" fill="currentColor">μ+3σ</text></svg></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">6</div><div class="min-w-0"><div class="int-title">Position</div><div class="int-tip">21.2 Percentiles, 21.3 z-scores</div></div></div><div class="int-cell"><span class="int-tag">(a) Percentiles</span><p class="text-[13px] leading-snug mt-1.5">The \\( p \\)th percentile is the data value with \\( p\\% \\) of the data values less than or equal to it.</p></div><div class="int-cell"><span class="int-tag">(b) z-scores</span><div class="int-math">\\[ z = \\frac{x - \\mu}{\\sigma} \\]</div><p class="text-[13px] leading-snug mt-1.5">for the standard normal distribution.</p></div></div></div>

            "m2-c22": {
                title: "Chapter 22: Inferential Statistics",
                section: "Section 6: Statistics",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">7(a)</div><div class="min-w-0"><div class="int-title">95% confidence intervals</div><div class="int-tip">22.2</div></div></div><div class="int-cell"><span class="int-tag">(i) Population proportion p</span><div class="int-math">\\[ \\hat{p} - 1.96\\hat{\\sigma} \\leftarrow p \\rightarrow \\hat{p} + 1.96\\hat{\\sigma} \\]</div><div class="int-math">\\[ \\text{where } \\hat{\\sigma} = \\sqrt{\\frac{\\hat{p}(1-\\hat{p})}{n}} \\;\\text{ or }\\; \\sqrt{\\frac{p(1-p)}{n}} \\]</div></div><div class="int-cell"><span class="int-tag">(ii) Population mean μ</span><div class="int-math">\\[ \\bar{x} - 1.96\\frac{\\sigma}{\\sqrt{n}} \\leftarrow \\mu \\rightarrow \\bar{x} + 1.96\\frac{\\sigma}{\\sqrt{n}} \\]</div><p class="text-[13px] leading-snug mt-1.5">where \\( \\sigma \\) is the standard deviation of the population or the sample.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">7(a)+</div><div class="min-w-0"><div class="int-title">Finding a sample size n</div><div class="int-tip">How many people do I need?</div></div></div><div class="int-cell"><span class="int-tag">Margin of error E (95% confidence)</span><div class="int-math">\\[ E = 1.96\\frac{\\sigma}{\\sqrt{n}} \\;\\Longrightarrow\\; n \\geq \\left(\\frac{1.96\\,\\sigma}{E}\\right)^2 \\]</div><div class="int-math">\\[ E = 1.96\\sqrt{\\frac{\\hat{p}(1-\\hat{p})}{n}} \\;\\Longrightarrow\\; n \\geq \\left(\\frac{1.96}{E}\\right)^2 \\hat{p}(1-\\hat{p}) \\]</div></div><div class="int-note"><span>💡</span><div><b>Always round the sample size UP</b> to the next whole number, even if the decimal is small (e.g. 96.04 → <b>97</b>). You cannot survey part of a person, and rounding down would make the margin of error bigger than the one you were asked for.</div></div><div class="int-cell"><span class="int-tag">Worked examples</span><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>Mean: \\( \\sigma = 10 \\), \\( E = 2 \\): \\( n \\geq (1.96 \\times 10 \\div 2)^2 = 96.04 \\) so \\( n = 97 \\) people.</li><li>Proportion: \\( \\hat{p} = 0.5 \\), \\( E = 0.03 \\): \\( n \\geq (1.96 \\div 0.03)^2(0.25) = 1067.11 \\) so \\( n = 1068 \\) people.</li></ul></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">7(b)</div><div class="min-w-0"><div class="int-title">Hypotheses</div><div class="int-tip">22.3</div></div></div><div class="int-cell"><span class="int-tag">(i) Null hypothesis \\( H_0 \\)</span><p class="text-[13px] leading-snug mt-1.5">A stand-alone claim stated to be true, <b>or</b> a statement of no change or difference in an established situation or standard.</p></div><div class="int-cell"><span class="int-tag">(ii) Alternative hypothesis \\( H_1 \\)</span><p class="text-[13px] leading-snug mt-1.5">The <b>opposite</b> of the null hypothesis.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">7(c)</div><div class="min-w-0"><div class="int-title">Hypothesis testing</div><div class="int-tip">22.3</div></div></div><div class="int-cell"><span class="int-tag">(i) Population proportion using a 95% confidence interval</span><div class="int-math">\\[ \\hat{p} - 1.96\\hat{\\sigma} \\leftarrow p \\rightarrow \\hat{p} + 1.96\\hat{\\sigma} \\]</div><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>Do not reject \\( H_0 \\) if \\( p \\) is <b>inside</b> this interval.</li><li>Reject \\( H_0 \\) if \\( p \\) is <b>not inside</b> this interval.</li></ul></div><div class="int-cell"><span class="int-tag">(ii) Population mean at 5% level of significance</span><p class="text-[13px] leading-snug mt-1.5">Calculate:</p><div class="int-math">\\[ \\bar{z} = \\frac{\\bar{x} - \\mu}{\\bar{\\sigma}}, \\quad \\bar{\\sigma} = \\frac{\\sigma}{\\sqrt{n}} \\]</div><p class="text-[13px] leading-snug mt-1.5">\\( \\bar{\\sigma} \\) is the standard deviation of the population or the sample, and then, if required:</p><div class="int-math">\\[ p = 2\\{1 - P(z < |\\bar{z}|)\\} \\]</div><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>Do not reject \\( H_0 \\) if \\( -1.96 < \\bar{z} < 1.96 \\) or \\( p \\geq 0.05 \\)</li><li>Reject \\( H_0 \\) if \\( \\bar{z} < -1.96 \\) or \\( \\bar{z} > 1.96 \\) or \\( p < 0.05 \\)</li></ul></div></div></div>
                `
            },
            "phy-c1": {
                title: "Chapter 1: The Nature of Science",
                section: "Introduction to Physics",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Physical quantity</div><div class="int-tip">What I should know</div></div></div><div class="int-cell"><span class="int-tag">Definition</span><p class="text-[13px] leading-snug mt-1.5">A <b>physical quantity</b> is any property of matter that can be measured.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">2</div><div class="min-w-0"><div class="int-title">Errors in measurement</div><div class="int-tip">1.3 Error in measurements</div></div></div><div class="int-cell"><span class="int-tag">Systematic error</span><p class="text-[13px] leading-snug mt-1.5">An error that causes a measured value to be <b>always greater</b> than the true value or <b>always less</b> than the true value.</p></div><div class="int-cell"><span class="int-tag">Random errors</span><p class="text-[13px] leading-snug mt-1.5">Unpredictable variations in the value of a repeated measurement that vary in <b>both directions</b> around the true value. Some measurements will be too high and others too low.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">3</div><div class="min-w-0"><div class="int-title">Accuracy and precision</div></div></div><div class="int-cell"><span class="int-tag">Accuracy</span><p class="text-[13px] leading-snug mt-1.5">Indicates how close a measurement is to the <b>correct value</b>. Accurate measurements are clustered around the correct value.</p></div><div class="int-cell"><span class="int-tag">Precision</span><p class="text-[13px] leading-snug mt-1.5">Indicates how close a set of repeated measurements are to <b>each other</b>. Precise measurements are clustered closely together.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">4</div><div class="min-w-0"><div class="int-title">Units and scientific notation</div><div class="int-tip">1.4 to 1.6</div></div></div><div class="int-cell"><span class="int-tag">SI units</span><p class="text-[13px] leading-snug mt-1.5">The SI unit of any quantity can be written as a <b>product or quotient</b> of one or more base units.</p></div><div class="int-cell"><span class="int-tag">Order of magnitude</span><p class="text-[13px] leading-snug mt-1.5">The <b>order of magnitude</b> of a number is the power of 10 when the number is written in scientific notation. The order of magnitude can be any integer.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">5</div><div class="min-w-0"><div class="int-title">Error calculations</div></div></div><div class="int-cell"><span class="int-tag">Error</span><div class="int-math">\\[ \\text{Error} = \\text{the true value} - \\text{the estimate} \\]</div></div><div class="int-cell"><span class="int-tag">Percentage error</span><div class="law-grid"><div class="law"><span class="int-tag">Using the true value</span><div class="int-math">\\[ \\text{Percentage error} = \\frac{\\text{error}}{\\text{true value}} \\times 100 \\]</div></div><div class="law"><span class="int-tag">Using an estimated error</span><div class="int-math">\\[ \\text{Percentage error} = \\frac{\\text{estimated error}}{\\text{measured value}} \\times 100 \\]</div></div></div></div></div></div>
                `
            },
            "phy-c2": {
                title: "Chapter 2: Reflection of Light",
                section: "Light and Optics",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">1</div><div class="min-w-0"><div class="int-title">Light and objects</div><div class="int-tip">2.1 to 2.2 What I should know</div></div></div><div class="int-cell"><span class="int-tag">Luminous object</span><p class="text-[13px] leading-snug mt-1.5">Gives out its <b>own light</b>.</p></div><div class="int-cell"><span class="int-tag">Non-luminous object</span><p class="text-[13px] leading-snug mt-1.5">Does <b>not</b> give out its own light.</p></div><div class="int-cell"><span class="int-tag">Light</span><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>Light is a form of energy.</li><li>Light travels at a very high speed (\\( 3 \\times 10^{8}\\ \\text{m s}^{-1} \\) in a vacuum).</li><li>Light usually travels in straight lines.</li></ul></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">2</div><div class="min-w-0"><div class="int-title">Rays and beams</div></div></div><div class="int-cell"><span class="int-tag">Light ray</span><p class="text-[13px] leading-snug mt-1.5">A straight line showing the <b>direction</b> in which light is travelling.</p></div><div class="int-cell"><span class="int-tag">Types of beam</span><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li><b>Divergent</b> beam: gets wider.</li><li><b>Convergent</b> beam: gets narrower.</li><li><b>Parallel</b> beam: remains the same width.</li></ul><div class="flex flex-wrap items-center gap-4 mt-2"><svg viewBox="0 0 330 110" class="w-full" style="color:#64748b;max-width:495px" xmlns="http://www.w3.org/2000/svg"><line x1="10.0" y1="55.0" x2="90.0" y2="20.0" stroke="#3b82f6" stroke-width="1.8"/><line x1="10.0" y1="55.0" x2="90.0" y2="90.0" stroke="#3b82f6" stroke-width="1.8"/><text x="50.0" y="107.5" font-size="9" text-anchor="middle" fill="currentColor">Divergent (wider)</text><line x1="120.0" y1="20.0" x2="200.0" y2="50.0" stroke="#3b82f6" stroke-width="1.8"/><line x1="120.0" y1="90.0" x2="200.0" y2="60.0" stroke="#3b82f6" stroke-width="1.8"/><text x="160.0" y="107.5" font-size="9" text-anchor="middle" fill="currentColor">Convergent (narrower)</text><line x1="230.0" y1="30.0" x2="320.0" y2="30.0" stroke="#3b82f6" stroke-width="1.8"/><line x1="230.0" y1="75.0" x2="320.0" y2="75.0" stroke="#3b82f6" stroke-width="1.8"/><text x="270.0" y="107.5" font-size="9" text-anchor="middle" fill="currentColor">Parallel (same width)</text></svg></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">3</div><div class="min-w-0"><div class="int-title">Reflection of light</div><div class="int-tip">2.3 and 2.4</div></div></div><div class="int-cell"><span class="int-tag">Reflection</span><p class="text-[13px] leading-snug mt-1.5">The <b>bouncing</b> of light from an object.</p></div><div class="int-cell"><span class="int-tag">Diffuse reflection</span><p class="text-[13px] leading-snug mt-1.5">The <b>scattering</b> of reflected light in all directions from the surface of an object.</p></div><div class="int-cell"><span class="int-tag">Regular reflection</span><p class="text-[13px] leading-snug mt-1.5">When light is reflected obeying the laws of reflection.</p></div><div class="int-cell"><span class="int-tag">The laws of reflection of light state</span><p class="text-[13px] leading-snug mt-1.5"><b>Law 1:</b> The incident ray, the normal at the point of incidence and the reflected ray all lie in the <b>same plane</b>.</p><p class="text-[13px] leading-snug mt-1.5"><b>Law 2:</b> The angle of incidence is equal to the angle of reflection.</p><div class="int-math">\\[ i = r \\]</div><div class="flex flex-wrap items-center gap-4 mt-2"><svg viewBox="0 0 210 120" class="w-full" style="color:#64748b;max-width:315px" xmlns="http://www.w3.org/2000/svg"><line x1="30.0" y1="88.0" x2="170.0" y2="88.0" stroke="#64748b" stroke-width="2.4"/><line x1="36.0" y1="88.0" x2="28.0" y2="100.0" stroke="currentColor" stroke-width="1"/><line x1="46.0" y1="88.0" x2="38.0" y2="100.0" stroke="currentColor" stroke-width="1"/><line x1="56.0" y1="88.0" x2="48.0" y2="100.0" stroke="currentColor" stroke-width="1"/><line x1="66.0" y1="88.0" x2="58.0" y2="100.0" stroke="currentColor" stroke-width="1"/><line x1="76.0" y1="88.0" x2="68.0" y2="100.0" stroke="currentColor" stroke-width="1"/><line x1="86.0" y1="88.0" x2="78.0" y2="100.0" stroke="currentColor" stroke-width="1"/><line x1="96.0" y1="88.0" x2="88.0" y2="100.0" stroke="currentColor" stroke-width="1"/><line x1="106.0" y1="88.0" x2="98.0" y2="100.0" stroke="currentColor" stroke-width="1"/><line x1="116.0" y1="88.0" x2="108.0" y2="100.0" stroke="currentColor" stroke-width="1"/><line x1="126.0" y1="88.0" x2="118.0" y2="100.0" stroke="currentColor" stroke-width="1"/><line x1="136.0" y1="88.0" x2="128.0" y2="100.0" stroke="currentColor" stroke-width="1"/><line x1="146.0" y1="88.0" x2="138.0" y2="100.0" stroke="currentColor" stroke-width="1"/><line x1="156.0" y1="88.0" x2="148.0" y2="100.0" stroke="currentColor" stroke-width="1"/><line x1="166.0" y1="88.0" x2="158.0" y2="100.0" stroke="currentColor" stroke-width="1"/><line x1="100.0" y1="12.0" x2="100.0" y2="88.0" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/><line x1="38.0" y1="28.0" x2="100.0" y2="88.0" stroke="#3b82f6" stroke-width="2"/><line x1="100.0" y1="88.0" x2="162.0" y2="28.0" stroke="#f59e0b" stroke-width="2"/><circle cx="100.0" cy="88.0" r="2.3" fill="currentColor"/><path d="M100.0 58.0 A30.0 30.0 0 0 0 78.4 67.1" fill="none" stroke="#3b82f6" stroke-width="1.4"/><text x="83.6" y="52.8" font-size="10" text-anchor="middle" fill="#3b82f6">i</text><path d="M121.6 67.1 A30.0 30.0 0 0 0 100.0 58.0" fill="none" stroke="#f59e0b" stroke-width="1.4"/><text x="116.4" y="52.8" font-size="10" text-anchor="middle" fill="#f59e0b">r</text><text x="100.0" y="9.5" font-size="9" text-anchor="middle" fill="currentColor">normal</text><text x="36.0" y="21.5" font-size="8" text-anchor="middle" fill="#3b82f6">incident ray</text><text x="168.0" y="21.5" font-size="8" text-anchor="middle" fill="#f59e0b">reflected ray</text><text x="100.0" y="116.5" font-size="8" text-anchor="middle" fill="currentColor">plane mirror</text></svg></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">4</div><div class="min-w-0"><div class="int-title">Images in plane mirrors</div><div class="int-tip">2.5 and 2.6</div></div></div><div class="int-cell"><span class="int-tag">Virtual image</span><p class="text-[13px] leading-snug mt-1.5">An image formed by the <b>apparent intersection</b> of rays.</p></div><div class="int-cell"><span class="int-tag">Plane mirror</span><p class="text-[13px] leading-snug mt-1.5">An image formed in a plane mirror is a <b>virtual</b> image.</p></div><div class="int-cell"><span class="int-tag">Everyday uses</span><p class="text-[13px] leading-snug mt-1.5">Some everyday applications of plane mirrors (e.g. bathroom mirrors and periscopes).</p></div></div></div>
                `
            },
            "phy-c3": {
                title: "Chapter 3: Refraction of Light",
                section: "Light and Optics",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Refraction of light</div><div class="int-tip">What I should know</div></div></div><div class="int-cell"><span class="int-tag">Definition</span><p class="text-[13px] leading-snug mt-1.5"><b>Refraction of light</b> is the bending of light when it travels from one medium to another in which its speed is different.</p></div><div class="int-cell"><span class="int-tag">Refraction will NOT occur if</span><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>the light enters the second medium <b>parallel to the normal</b>, or</li><li>the refractive index of the second medium and the first medium are <b>the same</b>, or</li><li>light travels at the <b>same speed</b> in each medium.</li></ul></div><div class="int-cell"><span class="int-tag">Direction of bending</span><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>Optically <b>rarer → denser</b>: refracted <i>towards</i> the normal.</li><li>Optically <b>denser → rarer</b>: refracted <i>away</i> from the normal.</li></ul><div class="flex flex-wrap items-center gap-4 mt-2"><svg viewBox="0 0 210 125" class="w-full" style="color:#64748b;max-width:315px" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="60" width="160" height="58" fill="#3b82f6" opacity="0.10"/><line x1="20.0" y1="60.0" x2="180.0" y2="60.0" stroke="#64748b" stroke-width="2"/><line x1="100.0" y1="8.0" x2="100.0" y2="118.0" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/><line x1="40.0" y1="10.0" x2="100.0" y2="60.0" stroke="#3b82f6" stroke-width="2"/><polygon points="100.0,60.0 93.2,58.3 97.1,53.6" fill="#3b82f6"/><line x1="100.0" y1="60.0" x2="131.0" y2="112.0" stroke="#f59e0b" stroke-width="2"/><polygon points="131.0,112.0 125.2,108.1 130.4,105.0" fill="#f59e0b"/><circle cx="100.0" cy="60.0" r="2.3" fill="currentColor"/><path d="M100.0 38.0 A22.0 22.0 0 0 0 83.1 45.9" fill="none" stroke="#3b82f6" stroke-width="1.4"/><text x="86.0" y="33.6" font-size="10" text-anchor="middle" fill="#3b82f6">i</text><path d="M100.0 82.0 A22.0 22.0 0 0 0 111.3 78.9" fill="none" stroke="#f59e0b" stroke-width="1.4"/><text x="109.0" y="96.3" font-size="10" text-anchor="middle" fill="#f59e0b">r</text><text x="152.0" y="17.5" font-size="9" text-anchor="middle" fill="currentColor">air (rarer)</text><text x="152.0" y="115.5" font-size="9" text-anchor="middle" fill="currentColor">glass (denser)</text><text x="112.0" y="11.5" font-size="8" text-anchor="start" fill="currentColor">normal</text></svg></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">2</div><div class="min-w-0"><div class="int-title">Laws of refraction</div><div class="int-tip">Snell's law</div></div></div><div class="int-cell"><span class="int-tag">1st law</span><p class="text-[13px] leading-snug mt-1.5">The incident ray, the normal at the point of incidence and the refracted ray all lie in the <b>same plane</b>.</p></div><div class="int-cell"><span class="int-tag">2nd law (Snell's law)</span><p class="text-[13px] leading-snug mt-1.5">The ratio of the sine of the angle of incidence to the sine of the angle of refraction is a constant:</p><div class="int-math">\\[ \\frac{\\sin i}{\\sin r} = n \\]</div><p class="text-[13px] leading-snug mt-1.5">where \\( n \\) is a constant.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">3</div><div class="min-w-0"><div class="int-title">Refractive index</div></div></div><div class="int-cell"><span class="int-tag">Of a medium</span><p class="text-[13px] leading-snug mt-1.5">The ratio of the sine of the angle of incidence to the sine of the angle of refraction when light travels from a <b>vacuum (or air)</b> into that medium.</p></div><div class="int-cell"><span class="int-tag">Between two media</span><p class="text-[13px] leading-snug mt-1.5">The ratio of the sine of the angle of incidence to the sine of the angle of refraction when light travels from one of those media into the other.</p></div><div class="int-cell"><span class="int-tag">In terms of speed</span><p class="text-[13px] leading-snug mt-1.5">Light travels from medium 1 (speed \\( c_1 \\)) to medium 2 (speed \\( c_2 \\)):</p><div class="int-math">\\[ {}_1n_2 = \\frac{c_1}{c_2} \\quad \\text{i.e.} \\quad \\frac{\\sin i}{\\sin r} = \\frac{c_1}{c_2} \\]</div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">4</div><div class="min-w-0"><div class="int-title">Critical angle and total internal reflection</div></div></div><div class="int-cell"><span class="int-tag">Critical angle (C)</span><p class="text-[13px] leading-snug mt-1.5">When light travels from an optically denser to an optically rarer medium, the angle of incidence whose corresponding angle of refraction is <b>90°</b> is called the critical angle for those two media.</p></div><div class="int-cell"><span class="int-tag">Total internal reflection</span><p class="text-[13px] leading-snug mt-1.5">When light going from a denser to a rarer medium hits it at an angle of incidence <b>greater than the critical angle</b>, it does not enter the second medium. It is all reflected back into the denser medium.</p></div><div class="int-cell"><span class="int-tag">Refractive index and critical angle</span><div class="int-math">\\[ n = \\frac{1}{\\sin C} \\]</div><p class="text-[13px] leading-snug mt-1.5">where \\( C \\) is the critical angle.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#14b8a6">5</div><div class="min-w-0"><div class="int-title">Optical fibre</div><div class="int-tip">3.6 Applications of total internal reflection</div></div></div><div class="int-cell"><span class="int-tag">Definition</span><p class="text-[13px] leading-snug mt-1.5">An <b>optical fibre</b> is a very thin, flexible, transparent rod (usually of glass) through which light can travel by total internal reflection.</p></div></div></div>
                `
            },
            "phy-c4": {
                title: "Chapter 4: Lenses",
                section: "Light and Optics",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Types of lens</div><div class="int-tip">What I should know</div></div></div><div class="int-cell"><span class="int-tag">Lenses</span><p class="text-[13px] leading-snug mt-1.5">Lenses change the direction of light rays by <b>refraction</b>.</p></div><div class="int-cell"><span class="int-tag">Converging (convex) lens</span><p class="text-[13px] leading-snug mt-1.5">Changes a parallel beam into a converging beam and brings it to a <b>focus</b> at a particular point.</p></div><div class="int-cell"><span class="int-tag">Diverging (concave) lens</span><p class="text-[13px] leading-snug mt-1.5">Changes a parallel beam into a diverging beam, which spreads out as if it were coming from a particular point.</p></div><div class="flex flex-wrap items-center gap-4 mt-2"><svg viewBox="0 0 190 125" class="w-full" style="color:#64748b;max-width:285px" xmlns="http://www.w3.org/2000/svg"><line x1="10.0" y1="60.0" x2="185.0" y2="60.0" stroke="currentColor" stroke-width="1"/><path d="M100 8 Q122 60 100 112 Q78 60 100 8Z" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/><line x1="20.0" y1="30.0" x2="100.0" y2="30.0" stroke="#f59e0b" stroke-width="1.6"/><polygon points="100.0,30.0 93.7,33.0 93.7,27.0" fill="#f59e0b"/><line x1="100.0" y1="30.0" x2="165.0" y2="60.0" stroke="#f59e0b" stroke-width="1.6"/><line x1="20.0" y1="60.0" x2="100.0" y2="60.0" stroke="#f59e0b" stroke-width="1.6"/><polygon points="100.0,60.0 93.7,63.0 93.7,57.0" fill="#f59e0b"/><line x1="100.0" y1="60.0" x2="165.0" y2="60.0" stroke="#f59e0b" stroke-width="1.6"/><line x1="20.0" y1="90.0" x2="100.0" y2="90.0" stroke="#f59e0b" stroke-width="1.6"/><polygon points="100.0,90.0 93.7,93.0 93.7,87.0" fill="#f59e0b"/><line x1="100.0" y1="90.0" x2="165.0" y2="60.0" stroke="#f59e0b" stroke-width="1.6"/><circle cx="165.0" cy="60.0" r="2.3" fill="currentColor"/><text x="165.0" y="77.5" font-size="9" text-anchor="middle" fill="currentColor">F</text><text x="100.0" y="125.5" font-size="8" text-anchor="middle" fill="currentColor">optic centre</text><text x="95.0" y="7.5" font-size="9" text-anchor="middle" fill="currentColor">converging (convex)</text></svg><svg viewBox="0 0 190 125" class="w-full" style="color:#64748b;max-width:285px" xmlns="http://www.w3.org/2000/svg"><line x1="10.0" y1="60.0" x2="185.0" y2="60.0" stroke="currentColor" stroke-width="1"/><path d="M88 8 Q102 60 88 112 L112 112 Q98 60 112 8Z" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/><line x1="20.0" y1="35.0" x2="100.0" y2="35.0" stroke="#f59e0b" stroke-width="1.6"/><line x1="100.0" y1="35.0" x2="162.0" y2="10.0" stroke="#f59e0b" stroke-width="1.6"/><line x1="100.0" y1="35.0" x2="35.0" y2="60.0" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/><line x1="20.0" y1="85.0" x2="100.0" y2="85.0" stroke="#f59e0b" stroke-width="1.6"/><line x1="100.0" y1="85.0" x2="162.0" y2="110.0" stroke="#f59e0b" stroke-width="1.6"/><line x1="100.0" y1="85.0" x2="35.0" y2="60.0" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/><circle cx="35.0" cy="60.0" r="2.3" fill="currentColor"/><text x="35.0" y="77.5" font-size="9" text-anchor="middle" fill="currentColor">F</text><text x="100.0" y="125.5" font-size="8" text-anchor="middle" fill="currentColor">optic centre</text><text x="95.0" y="7.5" font-size="9" text-anchor="middle" fill="currentColor">diverging (concave)</text></svg></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">2</div><div class="min-w-0"><div class="int-title">Parts of a lens</div></div></div><div class="int-cell"><span class="int-tag">Optic centre</span><p class="text-[13px] leading-snug mt-1.5">The centre of the lens.</p></div><div class="int-cell"><span class="int-tag">Focus</span><p class="text-[13px] leading-snug mt-1.5">Converging and diverging lenses both have a focus at <b>each side</b> of the lens. Each focus is the same distance from the optic centre.</p></div><div class="int-cell"><span class="int-tag">Axis</span><p class="text-[13px] leading-snug mt-1.5">The straight line that is perpendicular to both faces of the lens and passes through the optic centre.</p></div><div class="int-cell"><span class="int-tag">Focal length</span><p class="text-[13px] leading-snug mt-1.5">The distance from the optic centre to each focus.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">3</div><div class="min-w-0"><div class="int-title">Images</div></div></div><div class="int-cell"><span class="int-tag">Converging lens</span><p class="text-[13px] leading-snug mt-1.5">Can produce both <b>real and virtual</b> images.</p></div><div class="int-cell"><span class="int-tag">Diverging lens</span><p class="text-[13px] leading-snug mt-1.5">Can only produce a <b>virtual</b> image.</p></div><div class="int-cell"><span class="int-tag">Magnifying glass</span><p class="text-[13px] leading-snug mt-1.5">A converging lens used to produce a <b>magnified virtual image</b>.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">4</div><div class="min-w-0"><div class="int-title">The lens formula</div></div></div><div class="int-cell"><span class="int-tag">Converging or diverging lens</span><div class="int-math">\\[ \\frac{1}{u} + \\frac{1}{v} = \\frac{1}{f} \\]</div><p class="text-[13px] leading-snug mt-1.5">relates the object distance \\( u \\), image distance \\( v \\) and focal length \\( f \\), provided \\( u, v \\) and \\( f \\) have the <b>correct signs</b>. Use the sign convention from your class.</p></div></div></div>
                `
            },
            "phy-c5": {
                title: "Chapter 5: Speed, Displacement and Velocity",
                section: "Mechanics",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Time, distance and speed</div><div class="int-tip">What I should know</div></div></div><div class="int-cell"><span class="int-tag">Units</span><p class="text-[13px] leading-snug mt-1.5">The SI unit of time is the second (s). The SI unit of distance is the metre (m).</p></div><div class="int-cell"><span class="int-tag">Speed</span><p class="text-[13px] leading-snug mt-1.5">The rate of change of distance with respect to time.</p></div><div class="int-cell"><span class="int-tag">Average speed</span><div class="int-math">\\[ \\text{Average speed} = \\frac{\\text{distance travelled}}{\\text{time taken}}, \\quad v = \\frac{s}{t}, \\quad v = \\frac{\\Delta s}{\\Delta t} \\]</div><p class="text-[13px] leading-snug mt-1.5">SI unit: \\( \\text{m s}^{-1} \\) or m/s.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">2</div><div class="min-w-0"><div class="int-title">Displacement and velocity</div></div></div><div class="int-cell"><span class="int-tag">Displacement</span><p class="text-[13px] leading-snug mt-1.5">Distance in a <b>given direction</b>. SI unit: the metre (m).</p></div><div class="int-cell"><span class="int-tag">Velocity</span><p class="text-[13px] leading-snug mt-1.5">The rate of change of displacement with respect to time. SI unit: \\( \\text{m s}^{-1} \\) or m/s.</p></div><div class="int-cell"><span class="int-tag">Average velocity</span><div class="int-math">\\[ \\text{Average velocity} = \\frac{\\text{displacement undergone}}{\\text{time taken}} \\]</div><p class="text-[13px] leading-snug mt-1.5">Average velocity = <b>instantaneous velocity</b> (to a high degree of accuracy) provided the average velocity is measured over a very short time interval or a very small distance.</p></div><div class="int-cell"><span class="int-tag">Constant velocity</span><p class="text-[13px] leading-snug mt-1.5">An object has constant velocity if it is <b>not speeding up, not slowing down and not changing direction</b>.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">3</div><div class="min-w-0"><div class="int-title">Graphs</div><div class="int-tip">5.7 Displacement–time graphs</div></div></div><div class="int-cell"><span class="int-tag">Distance–time graph</span><p class="text-[13px] leading-snug mt-1.5">The <b>slope</b> is the speed.</p></div><div class="int-cell"><span class="int-tag">Displacement–time graph</span><p class="text-[13px] leading-snug mt-1.5">The <b>slope</b> is the velocity.</p></div></div></div>
                `
            },
            "phy-c6": {
                title: "Chapter 6: Acceleration",
                section: "Mechanics",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Acceleration</div><div class="int-tip">What I should know</div></div></div><div class="int-cell"><span class="int-tag">Definition</span><p class="text-[13px] leading-snug mt-1.5"><b>Acceleration</b> is the rate of change of velocity with respect to time.</p></div><div class="int-cell"><span class="int-tag">Average acceleration</span><div class="int-math">\\[ \\text{Average acceleration} = \\frac{\\text{change in velocity}}{\\text{time taken}} \\]</div><div class="int-math">\\[ a = \\frac{v - u}{t} \\quad \\text{or} \\quad a = \\frac{\\Delta v}{\\Delta t} \\]</div></div><div class="int-cell"><span class="int-tag">Unit</span><p class="text-[13px] leading-snug mt-1.5">The SI unit of acceleration is the metre per second squared (\\( \\text{m s}^{-2} \\) or \\( \\text{m/s}^2 \\)).</p></div><div class="int-cell"><span class="int-tag">Constant acceleration</span><p class="text-[13px] leading-snug mt-1.5">An object has <b>constant acceleration</b> if its average acceleration is always the same, no matter the time interval over which it is calculated.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">2</div><div class="min-w-0"><div class="int-title">The kinematic equations</div><div class="int-tip">Used to solve problems for objects moving with constant acceleration</div></div></div><div class="int-cell"><div class="law-grid"><div class="law"><span class="int-tag">1</span><div class="int-math">\\[ v = u + at \\]</div></div><div class="law"><span class="int-tag">2</span><div class="int-math">\\[ s = ut + \\tfrac{1}{2}at^2 \\]</div></div><div class="law"><span class="int-tag">3</span><div class="int-math">\\[ v^2 = u^2 + 2as \\]</div></div></div></div><div class="int-cell"><span class="int-tag">Symbols</span><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>\\( u \\) = initial velocity, \\( v \\) = final velocity</li><li>\\( a \\) = acceleration, \\( t \\) = time</li><li>\\( s \\) = displacement</li></ul></div><div class="int-note"><span>💡</span><div>Each equation leaves out one quantity. <b>1</b> has no \\( s \\), <b>2</b> has no \\( v \\), <b>3</b> has no \\( t \\). Pick the one that matches the quantity you are <i>not</i> given or asked for.</div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">3</div><div class="min-w-0"><div class="int-title">Deriving the equations of motion</div><div class="int-tip">6.2 Constant (uniform) acceleration. The derivations of equations 2 and 3 are marked HL in your book.</div></div></div><div class="int-cell"><span class="int-tag">To derive v = u + at</span><p class="text-[13px] leading-snug mt-1.5">From the definition of acceleration, you have:</p><div class="int-math">\\[ a = \\frac{v - u}{t} \\]</div><div class="int-math">\\[ at = v - u \\]</div><div class="int-math">\\[ v = u + at \\]</div></div><div class="int-cell"><span class="int-tag">HL · To derive s = ut + ½at²</span><p class="text-[13px] leading-snug mt-1.5">It can be proved (and you may assume it to be true) that when the acceleration is constant:</p><div class="int-math">\\[ \\text{Average velocity} = \\frac{\\text{initial velocity} + \\text{final velocity}}{2} \\]</div><div class="int-math">\\[ \\text{average velocity} = \\frac{u + v}{2} \\]</div><p class="text-[13px] leading-snug mt-1.5">Displacement = average velocity × time, so:</p><div class="int-math">\\[ s = \\frac{u + v}{2}\\,t \\]</div><p class="text-[13px] leading-snug mt-1.5">Substituting \\( u + at \\) for \\( v \\) in this equation gives:</p><div class="int-math">\\[ s = \\frac{(u + u + at)\\,t}{2} \\]</div><div class="int-math">\\[ s = \\frac{(2u + at)\\,t}{2} \\]</div><p class="text-[13px] leading-snug mt-1.5">which simplifies to</p><div class="int-math">\\[ s = ut + \\tfrac{1}{2}at^2 \\]</div></div><div class="int-cell"><span class="int-tag">HL · To derive v² = u² + 2as</span><p class="text-[13px] leading-snug mt-1.5">Squaring both sides of \\( v = u + at \\) gives \\( v^2 = (u + at)^2 \\):</p><div class="int-math">\\[ v^2 = u^2 + 2uat + (at)^2 \\]</div><div class="int-math">\\[ = u^2 + 2uat + a^2t^2 \\]</div><div class="int-math">\\[ = u^2 + 2a\\left(ut + \\tfrac{1}{2}at^2\\right) \\]</div><p class="text-[13px] leading-snug mt-1.5">But,</p><div class="int-math">\\[ ut + \\tfrac{1}{2}at^2 = s \\]</div><p class="text-[13px] leading-snug mt-1.5">So,</p><div class="int-math">\\[ v^2 = u^2 + 2as \\]</div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">4</div><div class="min-w-0"><div class="int-title">Velocity–time graphs</div></div></div><div class="int-cell"><span class="int-tag">Slope</span><p class="text-[13px] leading-snug mt-1.5">The <b>slope</b> of a velocity–time graph is the <b>acceleration</b>.</p></div><div class="int-cell"><span class="int-tag">Area</span><p class="text-[13px] leading-snug mt-1.5">The <b>area under</b> a velocity–time graph is the distance travelled (or the displacement).</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">5</div><div class="min-w-0"><div class="int-title">Vertical motion under gravity</div><div class="int-tip">6.5 Acceleration due to gravity, g</div></div></div><div class="int-cell"><p class="text-[13px] leading-snug mt-1.5">The kinematic equations \\( v = u + at \\), \\( s = ut + \\tfrac{1}{2}at^2 \\) and \\( v^2 = u^2 + 2as \\) can be used to solve problems involving vertical motion under gravity near the surface of the Earth, with \\( a = g \\).</p><div class="int-note"><span>💡</span><div>Choose a direction as positive (usually <b>up</b>) and keep to it. If up is positive, then \\( a = -g \\) for the whole flight. At the very top of the path, \\( v = 0 \\).</div></div></div></div></div>
                `
            },
            "phy-c7": {
                title: "Chapter 7: Vectors and Scalars",
                section: "Mechanics",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Scalars and vectors</div><div class="int-tip">What I should know</div></div></div><div class="int-cell"><span class="int-tag">Scalar quantity</span><p class="text-[13px] leading-snug mt-1.5">Has <b>magnitude only</b> and no direction in space.</p></div><div class="int-cell"><span class="int-tag">Vector quantity</span><p class="text-[13px] leading-snug mt-1.5">Has both a <b>magnitude</b> and a <b>direction</b> in space.</p></div><div class="int-cell"><span class="int-tag">Representing a vector</span><p class="text-[13px] leading-snug mt-1.5">Drawn as an <b>arrow</b>. The length of the arrow represents its magnitude. The direction of the arrow shows its direction.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">2</div><div class="min-w-0"><div class="int-title">Adding vectors</div><div class="int-tip">7.2 Vectors in two dimensions</div></div></div><div class="int-cell"><span class="int-tag">Resultant</span><p class="text-[13px] leading-snug mt-1.5">The <b>resultant of two vectors</b> is the single vector that, acting alone, has the same effect as the two other vectors acting together.</p></div><div class="int-cell"><span class="int-tag">Parallelogram or triangle law</span><p class="text-[13px] leading-snug mt-1.5">Can be used to find the resultant of two vectors. The <b>law of addition of vectors</b> is another name for the parallelogram law or triangle law.</p></div><div class="int-cell"><span class="int-tag">Three forces at rest</span><p class="text-[13px] leading-snug mt-1.5">If three forces keep a particle at rest, the resultant of any two of them is equal in magnitude but <b>opposite in direction</b> to the third force.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:
