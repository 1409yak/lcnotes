<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23000000'><path d='M19 2H6c-1.2 0-2 .8-2 2v16c0 1.2.8 2 2 2h13c.6 0 1-.4 1-1V3c0-.6-.4-1-1-1zM6 4h12v2H6V4zm0 4h12v11H6V8z'/></svg>">
    <title>Leaving Certificate Revision Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- KaTeX for rendering mathematical notation -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-solid-straight/css/uicons-solid-straight.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.6); }

        .math-block {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(59, 130, 246, 0.05);
            border-left: 4px solid #3b82f6;
            padding: 0.85rem 1.1rem;
            border-radius: 0 0.5rem 0.5rem 0;
            margin: 0.75rem 0;
        }
        .dark .math-block {
            background: rgba(30, 58, 138, 0.25);
            border-left-color: #60a5fa;
        }
        .srp-box {
            border: 1px solid rgba(59, 130, 246, 0.3);
            background: rgba(59, 130, 246, 0.03);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }
        .dark .srp-box {
            border-color: rgba(59, 130, 246, 0.2);
            background: rgba(15, 23, 42, 0.6);
        }
        .tip-box {
            border: 1px solid #f59e0b;
            background: rgba(245, 158, 11, 0.08);
            border-radius: 0.5rem;
            padding: 1rem;
            margin: 1rem 0;
        }
        .dark .tip-box {
            background: rgba(120, 53, 15, 0.25);
            border-color: #d97706;
        }


        /* ---------- Full-height on phones (browser toolbar safe) ---------- */
        html { height: 100%; }
        body { height: 100vh; height: 100dvh; }
        #notes-scroll-container { padding-bottom: calc(2.5rem + env(safe-area-inset-bottom, 0px)); }
        #topic-list-container { padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); }
        #sidebar > div:last-child { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px)); }

        /* ---------- Formulas everywhere: big, clean, readable ---------- */
        .math-block { font-family: 'Inter', sans-serif; border-radius: 0.9rem; border: 1px solid rgba(59, 130, 246, .25); border-left-width: 4px; }
        .dark .math-block { border-color: rgba(96, 165, 250, .25); border-left-color: #60a5fa; }
        #notes-body .math-block .katex { font-size: clamp(1.05rem, 4.6vw, 1.3rem); }
        #notes-body .font-mono { font-family: 'Inter', sans-serif; }
        #notes-body .font-mono .katex { font-size: clamp(1rem, 4.2vw, 1.2rem); }
        #notes-body .int-math .katex { font-size: clamp(1.02rem, 4.4vw, 1.3rem); }

        /* ---------- Compact formula tiles ---------- */
        .law-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: 0.6rem; padding: 0.75rem 0.95rem 0.9rem; }
        .law { border: 1px solid #eef2f7; border-radius: 0.8rem; padding: 0.5rem 0.75rem 0.25rem; min-width: 0; background: rgba(148, 163, 184, .05); }
        .dark .law { border-color: #1e293b; }
        .law .int-math .katex-display { margin: 0.25rem 0 0.35rem; }
        .sum-svg { display: block; margin: 0.5rem auto; max-width: 100%; height: auto; }

        /* ---------- Mobile safety ---------- */
        #notes-reader { min-width: 0; overflow-wrap: break-word; }
        #notes-reader svg, #notes-reader img { max-width: 100%; height: auto; }
        #notes-reader .katex svg { height: inherit; max-width: none; }
        .math-block { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
        .katex-display { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
        @media (max-width: 639px) {
            .math-block { padding: 0.65rem 0.8rem; }
            .srp-box { padding: 0.8rem; }
            .crumb-sec { display: none !important; }
        }

        /* ---------- Subject picker ---------- */
        #subject-picker { position: relative; min-width: 0; }
        .sp-btn { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0.6rem 0.3rem 0.35rem; border-radius: 0.8rem; border: 1px solid #e5e7eb; background: #f9fafb; font-weight: 600; font-size: 0.8rem; color: #1f2937; cursor: pointer; max-width: 100%; transition: border-color .15s, box-shadow .15s; }
        .sp-btn:hover { border-color: #93c5fd; }
        .sp-btn:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }
        .dark .sp-btn { background: #1e293b; border-color: #334155; color: #f1f5f9; }
        .sp-ico { width: 1.7rem; height: 1.7rem; border-radius: 0.55rem; display: grid; place-items: center; color: #fff; font-size: 0.75rem; flex-shrink: 0; }
        .sp-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 6rem; }
        .sp-chev { font-size: 0.6rem; opacity: 0.6; transition: transform .2s; flex-shrink: 0; }
        .sp-open .sp-chev { transform: rotate(180deg); }
        .sp-panel { position: fixed; left: 0.75rem; right: 0.75rem; top: 4.25rem; z-index: 60; background: #fff; border: 1px solid #e5e7eb; border-radius: 1rem; box-shadow: 0 24px 48px -12px rgba(15, 23, 42, .4); padding: 0.4rem; max-height: calc(100vh - 5.5rem); max-height: calc(100dvh - 5.5rem); overflow-y: auto; }
        .dark .sp-panel { background: #0f172a; border-color: #334155; }
        .sp-panel[hidden] { display: none; }
        .sp-head { font-size: 0.62rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #9ca3af; padding: 0.4rem 0.6rem 0.25rem; }
        .sp-item { display: flex; width: 100%; align-items: center; gap: 0.75rem; padding: 0.55rem 0.6rem; border-radius: 0.8rem; text-align: left; cursor: pointer; background: transparent; border: 0; color: inherit; }
        .sp-item:hover, .sp-item:focus-visible { background: #f3f4f6; outline: none; }
        .dark .sp-item:hover, .dark .sp-item:focus-visible { background: #1e293b; }
        .sp-item[aria-selected="true"] { background: rgba(59, 130, 246, .12); }
        .sp-text { min-width: 0; flex: 1; }
        .sp-name { display: block; font-weight: 600; font-size: 0.86rem; }
        .sp-sub { display: block; font-size: 0.7rem; color: #6b7280; margin-top: 1px; }
        .dark .sp-sub { color: #94a3b8; }
        .sp-check { color: #3b82f6; font-size: 0.8rem; flex-shrink: 0; }
        @media (min-width: 640px) {
            .sp-label { max-width: 11rem; }
            .sp-panel { position: absolute; left: auto; right: 0; top: calc(100% + 0.5rem); width: 19rem; max-height: 70vh; }
        }

        /* ---------- Font-size popover (mobile) ---------- */
        .pop-panel { position: absolute; right: 0; top: calc(100% + 0.5rem); z-index: 60; display: flex; align-items: center; gap: 0.25rem; padding: 0.35rem; border-radius: 0.9rem; background: #fff; border: 1px solid #e5e7eb; box-shadow: 0 24px 48px -12px rgba(15, 23, 42, .4); }
        .dark .pop-panel { background: #0f172a; border-color: #334155; }
        .pop-panel[hidden] { display: none; }
        .pop-panel button { min-width: 2.6rem; padding: 0.45rem 0.6rem; border-radius: 0.6rem; font-size: 0.78rem; font-weight: 700; background: transparent; border: 0; color: inherit; cursor: pointer; }
        .pop-panel button:hover { background: rgba(59, 130, 246, .12); }

        /* ---------- Standard integral cards ---------- */
        .int-note { display: flex; gap: 0.7rem; align-items: flex-start; padding: 0.8rem 0.95rem; border-radius: 0.9rem; background: rgba(245, 158, 11, .1); border: 1px solid rgba(245, 158, 11, .45); font-size: 0.82rem; line-height: 1.45; }
        .int-note b { font-weight: 700; }
        .int-card { border: 1px solid #e5e7eb; background: #fff; border-radius: 1rem; overflow: hidden; }
        .dark .int-card { border-color: #1e293b; background: #020617; }
        .int-head { display: flex; align-items: center; gap: 0.7rem; padding: 0.75rem 0.95rem; border-bottom: 1px solid #eef2f7; }
        .dark .int-head { border-color: #1e293b; }
        .int-badge { width: 2.1rem; height: 2.1rem; flex-shrink: 0; border-radius: 0.65rem; display: grid; place-items: center; font-weight: 800; font-size: 0.78rem; color: #fff; font-family: 'Inter', sans-serif; }
        .int-title { font-weight: 700; font-size: 0.88rem; }
        .int-tip { font-size: 0.74rem; color: #6b7280; line-height: 1.35; margin-top: 1px; }
        .dark .int-tip { color: #94a3b8; }
        .int-grid { display: grid; grid-template-columns: minmax(0, 1fr); }
        .int-cell { padding: 0.7rem 0.95rem 0.5rem; min-width: 0; }
        .int-cell + .int-cell { border-top: 1px solid #eef2f7; }
        .dark .int-cell + .int-cell { border-color: #1e293b; }
        .int-tag { display: inline-block; font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; padding: 0.12rem 0.5rem; border-radius: 9999px; background: rgba(59, 130, 246, .12); color: #2563eb; }
        .dark .int-tag { color: #93c5fd; }
        .int-tag.lin { background: rgba(244, 63, 94, .12); color: #e11d48; }
        .dark .int-tag.lin { color: #fda4af; }
        .int-math { font-size: clamp(0.8rem, 3.8vw, 1.08rem); overflow-x: auto; overflow-y: hidden; padding: 0.15rem 0; }
        .int-math .katex-display { margin: 0.35rem 0; }
        .int-foot { display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0 0.95rem 0.8rem; }
        .int-chip { font-size: 0.7rem; padding: 0.15rem 0.55rem; border-radius: 9999px; border: 1px solid #e5e7eb; color: #4b5563; }
        .dark .int-chip { border-color: #334155; color: #cbd5e1; }
        @media (min-width: 640px) {
            .int-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .int-cell + .int-cell { border-top: 0; border-left: 1px solid #eef2f7; }
            .dark .int-cell + .int-cell { border-left-color: #1e293b; }
        }
        .tab-btn.active {
            border-bottom: 2px solid #3b82f6;
            color: #3b82f6;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-gray-800 dark:text-slate-100 font-sans flex flex-col overflow-hidden transition-colors duration-200">

    <!-- TOP HEADER -->
    <header class="h-16 border-b border-gray-200 dark:border-slate-800 bg-white dark:bg-slate-950 px-3 md:px-6 flex items-center justify-between gap-2 z-20 shrink-0">
        <div class="flex items-center gap-2 min-w-0">
            <button id="toggle-sidebar-mobile" aria-label="Open menu" class="md:hidden shrink-0 p-2 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-800">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div id="home-link" class="flex items-center gap-2 cursor-pointer select-none shrink-0" title="Go to home">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div class="hidden sm:block">
                    <h1 class="font-bold text-lg leading-none tracking-tight">LC Revision Hub</h1>
                    <span class="text-xs text-gray-500 dark:text-slate-400 font-medium">Leaving Cert Active Hub</span>
                </div>
            </div>
        </div>

        <!-- Quick Term Search -->
        <div class="hidden lg:flex items-center flex-1 max-w-md mx-8 relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3 text-gray-400 dark:text-slate-500 text-sm"></i>
            <input type="text" id="content-search" placeholder="Search current notes (formulas, rules, SRPs)..."
                class="w-full pl-9 pr-4 py-1.5 text-sm rounded-lg border border-gray-200 dark:border-slate-800 bg-gray-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-slate-200 placeholder-gray-400 dark:placeholder-slate-500">
        </div>

        <!-- Subject picker & utilities -->
        <div class="flex items-center gap-1 sm:gap-3 min-w-0">
            <div id="subject-picker">
                <button id="subject-btn" type="button" class="sp-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="Choose subject">
                    <span class="sp-ico" id="subject-ico"><i class="fa-solid fa-square-root-variable"></i></span>
                    <span class="sp-label" id="subject-label">Maths P1</span>
                    <i class="fa-solid fa-chevron-down sp-chev"></i>
                </button>
                <div id="subject-panel" class="sp-panel" role="listbox" aria-label="Subjects" hidden></div>
            </div>

            <div class="h-6 w-px bg-gray-200 dark:bg-slate-800 hidden md:block"></div>

            <div class="hidden md:flex items-center space-x-1">
                <button id="font-dec" title="Decrease font size" class="p-2 text-gray-600 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-800 rounded-lg transition-colors">
                    <span class="text-xs font-bold">A-</span>
                </button>
                <button id="font-reset" title="Reset font size" class="p-2 text-gray-600 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-800 rounded-lg transition-colors">
                    <span class="text-xs font-bold">A</span>
                </button>
                <button id="font-inc" title="Increase font size" class="p-2 text-gray-600 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-800 rounded-lg transition-colors">
                    <span class="text-xs font-bold">A+</span>
                </button>
                <button id="toggle-focus" title="Full-screen Focus Mode" class="p-2 text-gray-600 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-800 rounded-lg transition-colors ml-1">
                    <i class="fa-solid fa-expand text-sm"></i>
                </button>
            </div>

            <!-- Mobile text-size menu -->
            <div class="relative md:hidden shrink-0">
                <button id="font-pop-btn" aria-label="Text size" aria-expanded="false" class="p-2 text-gray-600 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-800 rounded-lg transition-colors">
                    <span class="text-xs font-bold">Aa</span>
                </button>
                <div id="font-pop" class="pop-panel" hidden>
                    <button id="m-font-dec" aria-label="Smaller text">A-</button>
                    <button id="m-font-reset" aria-label="Reset text size">100%</button>
                    <button id="m-font-inc" aria-label="Larger text">A+</button>
                </div>
            </div>

            <button id="toggle-theme" title="Toggle Theme" aria-label="Toggle theme" class="shrink-0 p-2 text-gray-600 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-800 rounded-lg transition-colors">
                <i class="fa-solid fa-moon dark:hidden text-sm"></i>
                <i class="fa-solid fa-sun hidden dark:inline text-sm text-amber-400"></i>
            </button>
        </div>
    </header>

    <!-- WORKSPACE -->
    <div class="flex flex-1 overflow-hidden relative">
        <div id="sidebar-backdrop" class="hidden md:hidden absolute inset-0 z-[5] bg-black/50"></div>
        <!-- SIDEBAR -->
        <aside id="sidebar" class="w-[85vw] max-w-xs md:w-80 border-r border-gray-200 dark:border-slate-800 bg-white dark:bg-slate-950 flex flex-col transition-all duration-300 ease-in-out absolute md:relative z-10 h-full -translate-x-full md:translate-x-0 shadow-lg md:shadow-none">
            <div class="p-4 border-b border-gray-100 dark:border-slate-900">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-xs font-bold uppercase tracking-wider text-gray-400 dark:text-slate-500" id="sidebar-subject-title">Maths P1</span>
                    <span class="text-xs bg-blue-50 dark:bg-slate-800 text-blue-600 dark:text-blue-400 font-semibold px-2 py-0.5 rounded-full" id="sidebar-topic-count">27 Chapters</span>
                </div>
                <div class="flex items-center gap-2 mb-3">
                    <button id="sidebar-home-btn" class="flex-1 flex items-center justify-center gap-1.5 px-2 py-1.5 rounded-md text-xs font-semibold border border-gray-200 dark:border-slate-800 text-gray-700 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-900 transition-all">
                        <i class="fa-solid fa-house text-[11px]"></i><span>Home</span>
                    </button>
                    <button id="saved-only-btn" title="Show only saved chapters" class="flex-1 flex items-center justify-center gap-1.5 px-2 py-1.5 rounded-md text-xs font-semibold border border-gray-200 dark:border-slate-800 text-gray-700 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-900 transition-all">
                        <i class="fa-solid fa-heart text-[11px] text-rose-500"></i><span>Saved</span><span id="saved-count" class="text-[10px] opacity-70">0</span>
                    </button>
                </div>
                <div class="relative">
                    <i class="fa-solid fa-filter absolute left-3 top-2.5 text-gray-400 text-xs"></i>
                    <input type="text" id="topic-search" placeholder="Filter topics/chapters..." 
                        class="w-full pl-8 pr-3 py-1.5 text-xs rounded-md border border-gray-200 dark:border-slate-800 bg-gray-50 dark:bg-slate-900 focus:outline-none focus:ring-1 focus:ring-blue-500 text-gray-800 dark:text-slate-200">
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-3 space-y-1" id="topic-list-container">
                <!-- Chapters loaded dynamically -->
            </div>

            <div class="p-3 border-t border-gray-100 dark:border-slate-900 bg-gray-50/50 dark:bg-slate-900/30 text-xs text-gray-400 dark:text-slate-500 flex items-center justify-between">
                <span>Active Maths 4 Summary Engine</span>
                <i class="fa-solid fa-circle-check text-emerald-500" title="All Scans Loaded"></i>
            </div>
        </aside>

        <!-- MAIN DISPLAY -->
        <main id="main-content" class="flex-1 flex flex-col bg-gray-50 dark:bg-slate-900 overflow-hidden relative">
            <div id="notes-header-bar" class="h-12 border-b border-gray-200/80 dark:border-slate-800 bg-white/60 dark:bg-slate-950/60 backdrop-blur-md px-3 md:px-6 gap-2 flex items-center justify-between shrink-0">
                <div class="flex items-center gap-2 text-xs text-gray-500 dark:text-slate-400 overflow-hidden whitespace-nowrap min-w-0 flex-1">
                    <button id="breadcrumb-home" title="Home" aria-label="Home" class="shrink-0 hover:text-blue-600 dark:hover:text-blue-400"><i class="fa-solid fa-house"></i></button>
                    <i class="fa-solid fa-chevron-right text-[10px] text-gray-400 shrink-0"></i>
                    <span id="breadcrumb-subject" class="shrink-0">Maths P1</span>
                    <i class="fa-solid fa-chevron-right text-[10px] text-gray-400 shrink-0 crumb-sec"></i>
                    <span id="breadcrumb-section" class="font-medium text-gray-700 dark:text-slate-300 truncate crumb-sec">Section 8</span>
                    <i class="fa-solid fa-chevron-right text-[10px] text-gray-400 shrink-0"></i>
                    <span id="breadcrumb-chapter" class="font-semibold text-blue-600 dark:text-blue-400 truncate min-w-0">Differentiation Summary</span>
                </div>

                <div class="flex items-center gap-2 shrink-0">
                    <button id="fav-btn" class="hidden shrink-0 flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-md text-xs font-medium text-gray-600 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-800 border border-gray-200 dark:border-slate-800 transition-all" title="Save to revision list" aria-label="Save to revision list">
                        <i id="fav-icon" class="fa-regular fa-heart"></i>
                        <span id="fav-label" class="hidden sm:inline">Save</span>
                    </button>
                    <button id="copy-notes-btn" class="shrink-0 flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-md text-xs font-medium text-gray-600 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-800 border border-gray-200 dark:border-slate-800 transition-all" aria-label="Copy notes">
                        <i class="fa-regular fa-copy"></i>
                        <span class="hidden sm:inline">Copy Notes</span>
                    </button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto overflow-x-hidden p-3 sm:p-4 md:p-8 flex justify-center" id="notes-scroll-container">
                <div id="notes-reader" class="w-full min-w-0 max-w-4xl transition-all duration-150">
                    <!-- Note contents populated dynamically -->
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Notification Overlay -->
    <div id="toast" class="fixed bottom-5 right-5 max-w-[calc(100vw-2.5rem)] bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 px-4 py-2.5 rounded-lg shadow-xl text-xs font-medium translate-y-16 opacity-0 transition-all duration-300 flex items-center space-x-2 z-50 pointer-events-none">
        <i class="fa-solid fa-circle-info text-blue-400 dark:text-blue-600"></i>
        <span id="toast-message">Notification message</span>
    </div>

                            <svg viewBox="0 0 220 150" class="w-56 max-w-full mx-auto my-2" xmlns="http://www.w3.org/2000/svg">
                                <line x1="30" y1="125" x2="205" y2="125" stroke="currentColor" stroke-width="1.2" opacity="0.7"/><line x1="30" y1="140" x2="30" y2="10" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
                                <line x1="30" y1="125" x2="120" y2="35" stroke="#ef4444" stroke-width="1.8"/>
                                <line x1="120" y1="35" x2="120" y2="125" stroke="currentColor" stroke-width="1.2" opacity="0.7" stroke-dasharray="3"/>
                                <circle cx="120" cy="35" r="3" fill="#3b82f6"/><circle cx="120" cy="125" r="2.5" fill="currentColor"/>
                                <text x="126" y="32" fill="currentColor" font-size="10" font-style="italic">P(x, y)</text><text x="60" y="30" fill="currentColor" font-size="10" font-style="italic">z = x + yi</text>
                                <text x="22" y="138" fill="currentColor" font-size="10" font-style="italic">O</text><text x="72" y="138" fill="currentColor" font-size="10" font-style="italic">x</text><text x="126" y="82" fill="currentColor" font-size="10" font-style="italic">y</text>
                                <text x="190" y="140" fill="currentColor" font-size="10" font-style="italic">Re</text><text x="8" y="14" fill="currentColor" font-size="10" font-style="italic">Im</text>
                            </svg>
                        </div>
                        <div class="bg-white dark:bg-slate-950 p-5 rounded-xl border border-gray-200 dark:border-slate-800 space-y-3">
                            <h3 class="font-bold text-md text-blue-600 dark:text-blue-400">4 &amp; 5. Addition and Scalar Multiplication</h3>
                            <p class="font-bold text-xs text-gray-700 dark:text-slate-300">Addition</p>
                            <div class="math-block text-sm overflow-x-auto">\\( (a + bi) + (c + di) = (a + c) + (b + d)i \\)</div>
                            <p class="text-xs">Add the real parts and add the imaginary parts.</p>
                            <p class="font-bold text-xs text-gray-700 dark:text-slate-300">Multiplication by a scalar \\( k \\in \\mathbb{R} \\)</p>
                            <div class="math-block text-sm overflow-x-auto">\\( k(a + bi) = ka + kbi \\)</div>
                        </div>
                        <div class="bg-white dark:bg-slate-950 p-5 rounded-xl border border-gray-200 dark:border-slate-800 space-y-3">
                            <h3 class="font-bold text-md text-blue-600 dark:text-blue-400">6, 7 &amp; 8. Modulus, Argument and Conjugate</h3>
                            <p class="font-bold text-xs text-gray-700 dark:text-slate-300">Modulus of \\( z = a + bi \\)</p>
                            <div class="math-block text-sm overflow-x-auto">\\( |z| = \\sqrt{a^2 + b^2} = \\sqrt{(\\text{Re})^2 + (\\text{Im})^2} \\)</div>
                            <p class="font-bold text-xs text-gray-700 dark:text-slate-300">Argument of \\( z = a + bi \\)</p>
                            <div class="math-block text-sm overflow-x-auto">\\( \\arg z = \\tan^{-1}\\left(\\frac{b}{a}\\right) = \\tan^{-1}\\left(\\frac{\\text{Im}}{\\text{Re}}\\right) \\)</div>
                            <p class="font-bold text-xs text-gray-700 dark:text-slate-300">Conjugate of \\( z = a + bi \\)</p>
                            <div class="math-block text-sm overflow-x-auto">\\( \\bar{z} = a - bi \\)</div>
                            <p class="text-xs">Change the sign between Re and Im.</p>
                        </div>
                        <div class="bg-white dark:bg-slate-950 p-5 rounded-xl border border-gray-200 dark:border-slate-800 space-y-3">
                            <h3 class="font-bold text-md text-blue-600 dark:text-blue-400">9. Multiplication of Complex Numbers</h3>
                            <div class="math-block text-sm overflow-x-auto">\\( (a + bi)(c + di) = (ac - bd) + (bc + ad)i \\)</div>
                            <p class="text-xs">Multiply out the brackets and put \\( i^2 = -1 \\).</p>
                            <p class="font-bold text-xs text-gray-700 dark:text-slate-300">Conjugate multiplication</p>
                            <div class="math-block text-sm overflow-x-auto">\\( (a + bi)\\overline{(a + bi)} = (a + bi)(a - bi) = a^2 + b^2 \\)</div>
                        </div>
                        <div class="bg-white dark:bg-slate-950 p-5 rounded-xl border border-gray-200 dark:border-slate-800 space-y-3">
                            <h3 class="font-bold text-md text-blue-600 dark:text-blue-400">10. Division of Complex Numbers</h3>
                            <div class="math-block text-sm overflow-x-auto">\\( \\frac{a + bi}{c + di} = \\frac{(a + bi)(c - di)}{(c + di)(c - di)} \\)</div>
                            <p class="text-xs">Multiply above and below by the conjugate of the complex number on the bottom.</p>
                        </div>
                        <div class="bg-white dark:bg-slate-950 p-5 rounded-xl border border-gray-200 dark:border-slate-800 space-y-3">
                            <h3 class="font-bold text-md text-blue-600 dark:text-blue-400">11. Powers of Complex Numbers</h3>
                            <p class="text-sm">Multiply out the brackets.</p>
                        </div>
                        <div class="bg-white dark:bg-slate-950 p-5 rounded-xl border border-gray-200 dark:border-slate-800 space-y-3">
                            <h3 class="font-bold text-md text-blue-600 dark:text-blue-400">12. Equality of Complex Numbers</h3>
                            <div class="math-block text-sm overflow-x-auto">\\( a + bi = c + di \\implies a = c \\text{ and } b = d \\)</div>
                            <p class="text-xs"><b>Remember:</b> \\( 0 = 0 + 0i \\)</p>
                        </div>
                    </div>
                `
            },

                content: `
                    <div class="space-y-6">

                            <h3 class="font-bold text-md text-blue-600 dark:text-blue-400">13. Quadratic Equations</h3>
                            <p class="font-bold text-xs text-gray-700 dark:text-slate-300">(a) Solution</p>

                            <div class="srp-box">
                                <span class="bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase">(c) Conjugate Root Theorem</span>
                            <p class="text-xs">If all the coefficients of a polynomial equation (quadratic/cubic) are real, then if \\( p + qi \\) is a root so is \\( p - qi \\), and vice versa.</p>

                        <div class="bg-white dark:bg-slate-950 p-5 rounded-xl border border-gray-200 dark:border-slate-800 space-y-3">
                            <h3 class="font-bold text-md text-blue-600 dark:text-blue-400">14. Cubic Equations</h3>
                            <div class="math-block text-sm overflow-x-auto">\\( \\text{Cubic} = \\text{Quadratic} \\times \\text{Linear} \\)</div>
                        </div>
                        <div class="bg-white dark:bg-slate-950 p-5 rounded-xl border border-gray-200 dark:border-slate-800 space-y-3">
                            <h3 class="font-bold text-md text-blue-600 dark:text-blue-400">15. Polar Form</h3>
                            <svg viewBox="0 0 220 150" class="w-56 max-w-full mx-auto my-2" xmlns="http://www.w3.org/2000/svg">
                                <line x1="20" y1="110" x2="205" y2="110" stroke="currentColor" stroke-width="1.2" opacity="0.7"/><line x1="110" y1="140" x2="110" y2="10" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
                                <line x1="110" y1="110" x2="55" y2="35" stroke="#ef4444" stroke-width="1.8"/>

                                <path d="M155 110 A45 45 0 0 0 78 78" fill="none" stroke="currentColor" stroke-width="1.2"/>
                                <text x="45" y="28" fill="currentColor" font-size="10" font-style="italic">z</text><text x="72" y="78" fill="currentColor" font-size="10" font-style="italic">r</text><text x="128" y="96" fill="currentColor" font-size="10" font-style="italic">A</text>
                                <text x="100" y="124" fill="currentColor" font-size="10" font-style="italic">O</text><text x="190" y="124" fill="currentColor" font-size="10" font-style="italic">Re</text><text x="96" y="12" fill="currentColor" font-size="10" font-style="italic">Im</text>
                            </svg>
                            <div class="math-block text-sm overflow-x-auto">\\( z = x + yi \\implies r = |z| = \\sqrt{x^2 + y^2} = \\sqrt{(\\text{Re})^2 + (\\text{Im})^2} \\)</div>
                            <div class="math-block text-sm overflow-x-auto">\\( |\\tan A| = \\left|\\frac{\\text{Im}}{\\text{Re}}\\right| = \\tan\\theta \\implies \\theta = \\tan^{-1}\\left|\\frac{\\text{Im}}{\\text{Re}}\\right| \\)</div>
                            <p class="font-bold text-xs text-gray-700 dark:text-slate-300">Polar form</p>
                            <div class="math-block text-sm overflow-x-auto">\\( z = r(\\cos A + i\\sin A) \\)</div>
                            <p class="font-bold text-xs text-gray-700 dark:text-slate-300">General polar form</p>
                            <div class="math-block text-sm overflow-x-auto">\\( z = r\\big(\\cos(A + 2n\\pi) + i\\sin(A + 2n\\pi)\\big), \\quad n \\in \\mathbb{N}_0 \\)</div>
                        </div>
                        <div class="bg-white dark:bg-slate-950 p-5 rounded-xl border border-gray-200 dark:border-slate-800 space-y-3">
                            <h3 class="font-bold text-md text-blue-600 dark:text-blue-400">16. DMO Tricks</h3>
                            <p class="text-xs"><b>Sign convention:</b> \\( \\oplus \\) = same sign used throughout (all + or all &minus;); \\( \\mp \\) = the opposite sign.</p>
                            <p class="font-bold text-xs text-gray-700 dark:text-slate-300">(a)</p>
                            <div class="math-block text-xs overflow-x-auto">\\( (\\cos A \\oplus i\\sin A)(\\cos B \\oplus i\\sin B) = \\cos(A + B) \\oplus i\\sin(A + B) \\)</div>
                            <p class="font-bold text-xs text-gray-700 dark:text-slate-300">(b)</p>
                            <div class="math-block text-xs overflow-x-auto">\\( \\frac{1}{\\cos A \\pm i\\sin A} = \\cos A \\mp i\\sin A \\)</div>
                            <p class="font-bold text-xs text-gray-700 dark:text-slate-300">(c)</p>
                            <div class="math-block text-xs overflow-x-auto">\\( \\frac{\\cos A \\oplus i\\sin A}{\\cos B \\oplus i\\sin B} = \\cos(A - B) \\oplus i\\sin(A - B) \\)</div>
                            <p class="font-bold text-xs text-gray-700 dark:text-slate-300">(d)</p>
                            <div class="math-block text-xs overflow-x-auto">\\( (\\cos A \\oplus i\\sin A)^n = \\cos nA \\oplus i\\sin nA \\)</div>
                            <div class="srp-box">
                                <span class="bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase">De Moivre's Theorem (DMT)</span>
                            <div class="math-block text-xs overflow-x-auto">\\( [r(\\cos A + i\\sin A)]^p = r^p(\\cos A + i\\sin A)^p = r^p(\\cos pA + i\\sin pA), \\quad p \\in \\mathbb{R} \\)</div>
                            </div>
                            <p class="font-bold text-xs text-gray-700 dark:text-slate-300">DMT Applications</p>
                            <ul class="text-xs space-y-1 list-disc pl-5"><li><b>(a)</b> Powers &ndash; polar form</li><li><b>(b)</b> Roots &ndash; general polar form</li><li><b>(c)</b> Trigonometric identities &ndash; binomial theorem</li></ul>
                        </div>
                        <div class="bg-white dark:bg-slate-950 p-5 rounded-xl border border-gray-200 dark:border-slate-800 space-y-3">
                            <h3 class="font-bold text-md text-blue-600 dark:text-blue-400">17. Geometrical Interpretation</h3>
                            <div class="srp-box">
                                <span class="bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase">(a) Multiplication</span>
                            <p class="text-xs">If you multiply a complex number \\( z \\) by \\( w \\), \\( z \\) is rotated <b>anticlockwise</b> about \\( O(0,0) \\) through \\( \\arg w \\) and its modulus is <b>multiplied</b> by \\( |w| \\).</p>
                            </div>
                            <div class="srp-box">
                                <span class="bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase">(b) Division</span>
                            <p class="text-xs">If you divide a complex number \\( z \\) by \\( w \\), \\( z \\) is rotated <b>clockwise</b> about \\( O(0,0) \\) through \\( \\arg w \\) and its modulus is <b>divided</b> by \\( |w| \\).</p>
                            </div>
                        </div>
                    </div>
                `

            "m1-c25": {

                section: "Section 9: Integration",
                content: `
                    <div class="space-y-6">
                        <!-- Navigation Tabs for Integration -->
                        <div class="flex border-b border-gray-200 dark:border-slate-800 text-xs md:text-sm font-medium overflow-x-auto whitespace-nowrap">
                            <button onclick="switchTab('int-tab-1', this)" class="tab-btn shrink-0 px-4 py-2 text-blue-600 border-b-2 border-blue-600 active">1. Notation & Basic Rules</button>
                            <button onclick="switchTab('int-tab-2', this)" class="tab-btn shrink-0 px-4 py-2 text-gray-500 hover:text-blue-500">2. Standard Functions Integrals</button>
                        </div>

                        <!-- TAB 1: Notation & Rules -->
                        <div id="int-tab-1" class="tab-content space-y-5">
                            <div class="bg-blue-50/50 dark:bg-slate-800/40 p-4 rounded-xl border border-blue-100 dark:border-slate-800">
                                <h3 class="font-bold text-blue-600 dark:text-blue-400 text-md mb-2">1. Notation & Concept</h3>
                                <p class="text-sm mb-2">(a) \\( \\int g(x) dx = \\text{A function } f(x) \\text{ such that when you differentiate it with respect to } x, \\text{ you get } g(x) \\).</p>
                                <div class="math-block text-xs font-mono">
                                    \\( \\therefore f'(x) = g(x) \\)<br>
                                    \\( (b) \\quad \\frac{dy}{dx} = g(x) \\implies dy = g(x) dx \\implies \\int dy = \\int g(x) dx \\implies y = \\int g(x) dx \\)
                                </div>
                            </div>

                            <div class="space-y-3">
                                <h3 class="font-bold text-gray-800 dark:text-slate-100 text-md">2. Core Integration Rules</h3>
                                <div class="space-y-2 text-xs">
                                    <div class="math-block">
                                        <span class="font-bold text-blue-600 dark:text-blue-400 block mb-1">(a) Sum Rule:</span>
                                        \\( \\int (u(x) + v(x)) dx = \\int u(x) dx + \\int v(x) dx \\)
                                    </div>
                                    <div class="math-block">
                                        <span class="font-bold text-blue-600 dark:text-blue-400 block mb-1">(b) Multiplication by a Constant:</span>
                                        \\( \\int c \\cdot u(x) dx = c \\int u(x) dx, \\quad \\text{where } c \\text{ is a constant} \\)
                                    </div>
                                    <div class="math-block">
                                        <span class="font-bold text-blue-600 dark:text-blue-400 block mb-1">(c) The One Rule:</span>
                                        \\( \\int 1 dx = x + c \\)
                                    </div>
                                </div>
                            </div>

                            <div class="p-4 rounded-xl border border-gray-200 dark:border-slate-800 bg-white dark:bg-slate-950">
                                <h3 class="font-bold text-sm text-blue-600 dark:text-blue-400 mb-2">3. Definite Integration</h3>
                                <div class="math-block text-sm">
                                    \\( \\int_a^b g(x) dx = [f(x)]_a^b = f(b) - f(a) \\)
                                </div>
                            </div>
                        </div>

                        <!-- TAB 2: Standard Integrals -->
                        <div id="int-tab-2" class="tab-content hidden space-y-4">
                            <h3 class="font-bold text-md text-gray-800 dark:text-slate-100">4. Standard Functions Integrals</h3>

                            <div class="int-note">
                                <i class="fa-solid fa-lightbulb text-amber-500 mt-0.5"></i>
                                <div>
                                    <b>Golden rule:</b> if the inside is <i>px + q</i> instead of just <i>x</i>, do the normal integral, then <b>divide by the number in front of x</b>.
                                    <br><span style="color:#f43f5e;font-weight:700">Red</span> = that number (<i>p</i>, or <i>a</i> in the power rule). Follow it: it sits <b>inside the bracket</b> and comes back again <b>as the divisor</b>. Don't forget <b>+ c</b>.
                                </div>
                            </div>

                    <div class="int-card">
                        <div class="int-head">
                            <div class="int-badge" style="background:#3b82f6">x<sup>p</sup></div>
                            <div class="min-w-0">
                                <div class="int-title">Powers of x</div>
                                <div class="int-tip">Add 1 to the power, then divide by the new power.</div>
                            </div>
                        </div>
                        <div class="int-grid">
                            <div class="int-cell"><span class="int-tag">Basic</span><div class="int-math">\\[ \\int x^{p}\\,dx = \\frac{x^{p+1}}{p+1} + c \\]</div></div>
                            <div class="int-cell"><span class="int-tag lin">With ax + b</span><div class="int-math">\\[ \\int (\\textcolor{#f43f5e}{a}x+b)^{p}\\,dx = \\textcolor{#f43f5e}{\\frac{1}{a}}\\cdot\\frac{(\\textcolor{#f43f5e}{a}x+b)^{p+1}}{p+1} + c \\]</div></div>
                        </div>
                    <div class="int-foot"><span class="int-chip">\\( p \\in \\mathbb{R} \\)</span><span class="int-chip">\\( p \\neq -1 \\)</span></div>
                    </div>
                    <div class="int-card">
                        <div class="int-head">
                            <div class="int-badge" style="background:#8b5cf6">e<sup>x</sup></div>
                            <div class="min-w-0">
                                <div class="int-title">Exponential: e</div>
                                <div class="int-tip">e<sup>x</sup> never changes when you integrate it.</div>
                            </div>
                        </div>
                        <div class="int-grid">
                            <div class="int-cell"><span class="int-tag">Basic</span><div class="int-math">\\[ \\int e^{x}\\,dx = e^{x} + c \\]</div></div>
                            <div class="int-cell"><span class="int-tag lin">With px + q</span><div class="int-math">\\[ \\int e^{\\textcolor{#f43f5e}{p}x+q}\\,dx = \\textcolor{#f43f5e}{\\frac{1}{p}}\\,e^{\\textcolor{#f43f5e}{p}x+q} + c \\]</div></div>
                        </div>
                    </div>
                    <div class="int-card">
                        <div class="int-head">
                            <div class="int-badge" style="background:#a855f7">a<sup>x</sup></div>
                            <div class="min-w-0">
                                <div class="int-title">Exponential: any base a</div>
                                <div class="int-tip">Divide by ln a (and by p too when it is px + q).</div>
                            </div>
                        </div>
                        <div class="int-grid">
                            <div class="int-cell"><span class="int-tag">Basic</span><div class="int-math">\\[ \\int a^{x}\\,dx = \\frac{a^{x}}{\\ln a} + c \\]</div></div>
                            <div class="int-cell"><span class="int-tag lin">With px + q</span><div class="int-math">\\[ \\int a^{\\textcolor{#f43f5e}{p}x+q}\\,dx = \\frac{a^{\\textcolor{#f43f5e}{p}x+q}}{\\textcolor{#f43f5e}{p}\\,\\ln a} + c \\]</div></div>
                        </div>
                    </div>
                    <div class="int-card">
                        <div class="int-head">
                            <div class="int-badge" style="background:#10b981">ln</div>
                            <div class="min-w-0">
                                <div class="int-title">Reciprocal: 1 / x</div>
                                <div class="int-tip">Always gives a natural log.</div>
                            </div>
                        </div>
                        <div class="int-grid">
                            <div class="int-cell"><span class="int-tag">Basic</span><div class="int-math">\\[ \\int \\frac{1}{x}\\,dx = \\ln x + c \\]</div></div>
                            <div class="int-cell"><span class="int-tag lin">With px + q</span><div class="int-math">\\[ \\int \\frac{1}{\\textcolor{#f43f5e}{p}x+q}\\,dx = \\textcolor{#f43f5e}{\\frac{1}{p}}\\,\\ln(\\textcolor{#f43f5e}{p}x+q) + c \\]</div></div>
                        </div>
                    <div class="int-foot"><span class="int-chip">\\( x > 0 \\) for the basic one</span><span class="int-chip">\\( px+q > 0 \\) for the linear one</span></div>
                    </div>
                    <div class="int-card">
                        <div class="int-head">
                            <div class="int-badge" style="background:#f59e0b">sin</div>
                            <div class="min-w-0">
                                <div class="int-title">Sine</div>
                                <div class="int-tip">sin becomes <b>minus</b> cos. Watch the minus sign!</div>
                            </div>
                        </div>
                        <div class="int-grid">
                            <div class="int-cell"><span class="int-tag">Basic</span><div class="int-math">\\[ \\int \\sin x\\,dx = -\\cos x + c \\]</div></div>
                            <div class="int-cell"><span class="int-tag lin">With px + q</span><div class="int-math">\\[ \\int \\sin(\\textcolor{#f43f5e}{p}x+q)\\,dx = -\\textcolor{#f43f5e}{\\frac{1}{p}}\\,\\cos(\\textcolor{#f43f5e}{p}x+q) + c \\]</div></div>
                        </div>
                    </div>
                    <div class="int-card">
                        <div class="int-head">
                            <div class="int-badge" style="background:#f97316">cos</div>
                            <div class="min-w-0">
                                <div class="int-title">Cosine</div>
                                <div class="int-tip">cos becomes sin (no minus sign).</div>
                            </div>
                        </div>
                        <div class="int-grid">
                            <div class="int-cell"><span class="int-tag">Basic</span><div class="int-math">\\[ \\int \\cos x\\,dx = \\sin x + c \\]</div></div>
                            <div class="int-cell"><span class="int-tag lin">With px + q</span><div class="int-math">\\[ \\int \\cos(\\textcolor{#f43f5e}{p}x+q)\\,dx = \\textcolor{#f43f5e}{\\frac{1}{p}}\\,\\sin(\\textcolor{#f43f5e}{p}x+q) + c \\]</div></div>
                        </div>
                    </div>
                        </div>
                    </div>
                `
            },
            "m1-c26": {

                content: `
                    <div class="space-y-6">
                        <!-- Area Under Curves -->
                        <div class="bg-white dark:bg-slate-950 p-5 rounded-xl border border-gray-200 dark:border-slate-800 space-y-4">
                            <h3 class="font-bold text-lg text-blue-600 dark:text-blue-400">5. Area Calculations</h3>

                            <h3 class="font-bold text-md text-blue-600 dark:text-blue-400">6. Average Value of a Function</h3>

                content: `
                    <div class="space-y-4">

                        </div>
                        <div class="int-cell"><div class="int-math">\\[ \\mathbb{Z} = \\{\\dots, -3, -2, -1, 0, 1, 2, 3, \\dots\\} \\]</div><p class="text-[13px] leading-snug mt-1.5">Consecutive integers can be written as:</p><div class="int-math">\\[ a,\\; a+1,\\; a+2,\\; \\dots \\]</div><p class="text-center text-xs text-gray-500 dark:text-slate-400">or</p><div class="int-math">\\[ a-1,\\; a,\\; a+1,\\; \\dots \\]</div></div>

                        </div>
                        <div class="int-cell"><div class="int-math">\\[ \\mathbb{Q} = \\left\\{\\dots, -15, \\dots, -\\tfrac{2}{3}, \\dots, 0, \\dots, \\tfrac{1}{2}, \\dots, \\tfrac{11}{3}, \\dots, 10, \\dots\\right\\} \\]</div><p class="text-[13px] leading-snug mt-1.5">Every rational number can be expressed as a <b>terminating decimal</b> or a <b>non-terminating, recurring decimal</b>.</p></div>

                        <div class="int-cell"><div class="int-math">\\[ i = \\sqrt{-1} \\]</div><div class="int-math">\\[ z = a + bi, \\quad a, b \\in \\mathbb{R}, \\; i = \\sqrt{-1} \\]</div>                        <svg viewBox="0 0 300 200" class="sum-svg" style="width:100%;max-width:26rem" xmlns="http://www.w3.org/2000/svg">

                            <g fill="currentColor" font-size="10" font-weight="700"><text x="12" y="22">&#8450;</text><text x="55" y="62">&#8477;</text><text x="80" y="76">&#8474;</text><text x="100" y="89">&#8484;</text><text x="130" y="101">&#8469;</text></g>
                            <g fill="currentColor" font-size="10"><text x="158" y="109">4</text><text x="106" y="117">&minus;3</text><text x="232" y="109">2/3</text><text x="196" y="42">&minus;&radic;2/2</text><text x="232" y="34">3 + 2i</text></g>

            "m1-c2": {
                title: "Chapter 2: Arithmetic",
                section: "Section 1: Number Systems",
                content: `
                    <div class="space-y-4">
                    <div class="int-card">
                        <div class="int-head">
                            <div class="int-badge" style="background:#3b82f6">%</div>
                            <div class="min-w-0"><div class="int-title">1. Percentages</div></div>
                        </div>
                        <div class="int-cell"><span class="int-tag">(a) Definition</span><p class="text-[13px] leading-snug mt-1.5">A percentage is a fraction expressed as part of 100:</p><div class="int-math">\\[ r\\% = \\frac{r}{100} \\]</div><span class="int-tag">(b) Increase</span><p class="text-[13px] leading-snug mt-1.5">To increase a quantity by <i>r</i>%, multiply it by:</p><div class="int-math">\\[ \\left(1 + \\frac{r}{100}\\right) \\]</div><span class="int-tag">(c) Decrease</span><p class="text-[13px] leading-snug mt-1.5">To decrease a quantity by <i>r</i>%, multiply it by:</p><div class="int-math">\\[ \\left(1 - \\frac{r}{100}\\right) \\]</div></div>
                    </div>
                    <div class="int-card">
                        <div class="int-head">
                            <div class="int-badge" style="background:#8b5cf6">&times;10</div>
                            <div class="min-w-0"><div class="int-title">2 &amp; 3. Scientific notation and order of magnitude</div></div>
                        </div>
                        <div class="int-cell"><span class="int-tag">2. Scientific notation</span><div class="int-math">\\[ a \\times 10^{n}, \\quad n \\in \\mathbb{Z} \\text{ and } 1 \\leq a < 10 \\]</div><span class="int-tag">3. Order of magnitude</span><p class="text-[13px] leading-snug mt-1.5">The order of magnitude of \\( a \\times 10^{n}, \\; 1 \\leq a \\leq 10 \\) is:</p><div class="int-math">\\[ n \\text{ if } a < 5, \\qquad n + 1 \\text{ if } a \\geq 5 \\]</div></div>
                    </div>
                    <div class="int-card">
                        <div class="int-head">
                            <div class="int-badge" style="background:#f59e0b">&plusmn;</div>
                            <div class="min-w-0"><div class="int-title">4 &amp; 5. Tolerance and error</div></div>
                        </div>
                        <div class="int-cell"><span class="int-tag">4. Tolerance level</span><p class="text-[13px] leading-snug mt-1.5">The tolerance level of a measurement is the greatest range of variation in the measurement that is allowable.</p><span class="int-tag">5(a) Absolute error</span><div class="int-math">\\[ \\text{Absolute error} = \\left|\\text{Measured value} - \\text{Accepted value}\\right| \\]</div><span class="int-tag">5(b) Percentage error</span><div class="int-math">\\[ \\text{Percentage error} = \\frac{\\text{Absolute error}}{\\text{Accepted value}} \\times 100\\% \\]</div></div>
                    </div>
                    <div class="int-card">
                        <div class="int-head">
                            <div class="int-badge" style="background:#10b981">sf</div>
                            <div class="min-w-0"><div class="int-title">6. Significant figures</div></div>
                        </div>
                        <div class="int-cell"><p class="text-[13px] leading-snug mt-1.5">Write the number in the form \\( a \\times 10^{n}, \\; 1 \\leq a < 10 \\) and give the required number of digits in <i>a</i>.</p></div>
                    </div>
                    <div class="int-card">
                        <div class="int-head">
                            <div class="int-badge" style="background:#06b6d4">Δ</div>
                            <div class="min-w-0"><div class="int-title">7. Rates of change</div></div>
                        </div>
                        <div class="int-cell"><span class="int-tag">(a) Average rate of change</span><p class="text-[13px] leading-snug mt-1.5">Average rate of change of <i>Q</i> with respect to <i>t</i>:</p><div class="int-math">\\[ \\frac{Q_2 - Q_1}{t_2 - t_1} = \\text{slope of line } AB \\]</div>                        <svg viewBox="0 0 220 140" class="sum-svg" style="width:100%;max-width:15rem" xmlns="http://www.w3.org/2000/svg">
                            <line x1="30" y1="115" x2="210" y2="115" stroke="currentColor" stroke-width="1.2" opacity="0.7"/><line x1="30" y1="125" x2="30" y2="8" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
                            <path d="M45 105 C85 100 130 75 185 20" fill="none" stroke="#3b82f6" stroke-width="1.8"/>
                            <line x1="55" y1="104" x2="170" y2="36" stroke="#f43f5e" stroke-width="1.4" stroke-dasharray="4"/>
                            <circle cx="55" cy="104" r="3" fill="#f43f5e"/><circle cx="170" cy="36" r="3" fill="#f43f5e"/>
                            <text x="40" y="95" fill="currentColor" font-size="10" font-style="italic">A</text><text x="164" y="30" fill="currentColor" font-size="10" font-style="italic">B</text>
                            <text x="58" y="127" fill="currentColor" font-size="10">(t&#8321;, Q&#8321;)</text><text x="132" y="52" fill="currentColor" font-size="10">(t&#8322;, Q&#8322;)</text>
                            <text x="196" y="110" fill="currentColor" font-size="10" font-style="italic">t</text><text x="20" y="14" fill="currentColor" font-size="10" font-style="italic">Q</text><text x="22" y="127" fill="currentColor" font-size="10">0</text>
                        </svg><span class="int-tag">(b) Speed</span><div class="int-math">\\[ v = \\frac{s_2 - s_1}{t_2 - t_1} = \\frac{\\text{Change in distance}}{\\text{Change in time}} \\]</div><span class="int-tag">Acceleration</span><div class="int-math">\\[ a = \\frac{v_2 - v_1}{t_2 - t_1} = \\frac{\\text{Change in speed}}{\\text{Change in time}} \\]</div></div>
                    </div>
                    <div class="int-card">
                        <div class="int-head">
                            <div class="int-badge" style="background:#f43f5e">&prop;</div>
                            <div class="min-w-0"><div class="int-title">8. Direct and inverse proportion</div></div>
                        </div>
                        <div class="int-cell"><span class="int-tag">Direct</span><div class="int-math">\\[ y \\propto x \\implies y = kx, \\quad k \\in \\mathbb{R} \\]</div><span class="int-tag">Inverse</span><div class="int-math">\\[ y \\propto \\frac{1}{x} \\implies y = \\frac{k}{x}, \\quad k \\in \\mathbb{R} \\]</div></div>
                    </div>
                    </div>
                `
