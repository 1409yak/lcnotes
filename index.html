#f59e0b">3</div><div class="min-w-0"><div class="int-title">Resolving a vector into perpendicular components</div><div class="int-tip">7.3</div></div></div><div class="int-cell"><span class="int-tag">Resolving</span><p class="text-[13px] leading-snug mt-1.5">Expressing a vector in terms of two other <b>perpendicular</b> vectors, such that it is the resultant of these two. These two are called the perpendicular components of the given vector.</p></div><div class="int-cell"><span class="int-tag">Meaning</span><p class="text-[13px] leading-snug mt-1.5">Each component represents the complete effect of the given vector in the direction that the component points.</p></div><div class="int-cell"><span class="int-tag">Components</span><p class="text-[13px] leading-snug mt-1.5">A vector of magnitude \\( v \\) makes an angle \\( \\theta \\) with the component \\( x \\):</p><div class="law-grid"><div class="law"><span class="int-tag">x</span><div class="int-math">\\[ x = v\\cos\\theta \\]</div></div><div class="law"><span class="int-tag">y</span><div class="int-math">\\[ y = v\\sin\\theta \\]</div></div></div><div class="flex flex-wrap items-center gap-4 mt-2"><svg viewBox="0 0 210 125" class="w-full" style="color:#64748b;max-width:315px" xmlns="http://www.w3.org/2000/svg"><line x1="30.0" y1="104.0" x2="140.0" y2="44.0" stroke="#f59e0b" stroke-width="2.4"/><polygon points="140.0,44.0 135.9,49.7 133.0,44.3" fill="#f59e0b"/><line x1="30.0" y1="104.0" x2="140.0" y2="104.0" stroke="#3b82f6" stroke-width="2"/><line x1="140.0" y1="104.0" x2="140.0" y2="44.0" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5 3"/><path d="M133.0 104.0 L133.0 97.0 L140.0 97.0" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M58.0 104.0 A28.0 28.0 0 0 0 54.6 90.6" fill="none" stroke="#f59e0b" stroke-width="1.4"/><text x="68.8" y="97.6" font-size="10" text-anchor="middle" fill="#f59e0b">θ</text><text x="74.0" y="59.5" font-size="11" text-anchor="middle" fill="#f59e0b">v</text><text x="85.0" y="119.5" font-size="9" text-anchor="middle" fill="currentColor">x = v cos θ</text><text x="170.0" y="79.5" font-size="9" text-anchor="start" fill="currentColor">y = v sin θ</text></svg></div></div></div></div>
                `
            },
            "phy-c8": {
                title: "Chapter 8: Force, Mass and Momentum",
                section: "Mechanics",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Force and mass</div><div class="int-tip">What I should know</div></div></div><div class="int-cell"><span class="int-tag">Force</span><p class="text-[13px] leading-snug mt-1.5">Anything that causes the velocity of an object to change (to speed up, slow down or change direction). In other words, <b>force causes acceleration</b>. SI unit: the newton (N).</p></div><div class="int-cell"><span class="int-tag">Mass</span><p class="text-[13px] leading-snug mt-1.5">A measure of the <b>amount of matter</b> in a body, and a measure of how difficult it is to accelerate that body. SI unit: the kilogram (kg), a base (fundamental) SI unit.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">2</div><div class="min-w-0"><div class="int-title">Force and acceleration</div></div></div><div class="int-cell"><span class="int-tag">Proportionality</span><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>Acceleration is directly proportional to the force causing it: \\( a \\propto F \\) (for a given body).</li><li>Acceleration produced by a given force is inversely proportional to the mass: \\( a \\propto \\dfrac{1}{\\text{mass}} \\).</li></ul></div><div class="int-cell"><span class="int-tag">The newton</span><p class="text-[13px] leading-snug mt-1.5">1 newton is the force that gives a mass of 1 kg an acceleration of \\( 1\\ \\text{m s}^{-2} \\) (\\( 1\\ \\text{N} = 1\\ \\text{kg m s}^{-2} \\)).</p></div><div class="int-cell"><span class="int-tag">If a force F acts on a mass m and produces acceleration a</span><div class="int-math">\\[ F = ma \\]</div><p class="text-[13px] leading-snug mt-1.5">force = mass × acceleration</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">3</div><div class="min-w-0"><div class="int-title">Weight</div><div class="int-tip">8.4 Weight and mass</div></div></div><div class="int-cell"><p class="text-[13px] leading-snug mt-1.5">The <b>weight</b> of an object (on Earth) is the force of the Earth's gravity acting on it.</p><div class="int-math">\\[ W = mg \\]</div><p class="text-[13px] leading-snug mt-1.5">weight = mass × acceleration due to gravity. SI unit: the newton (N).</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">4</div><div class="min-w-0"><div class="int-title">Momentum</div></div></div><div class="int-cell"><p class="text-[13px] leading-snug mt-1.5">The <b>momentum</b> of a body is equal to its mass multiplied by its velocity:</p><div class="int-math">\\[ p = mv \\]</div><p class="text-[13px] leading-snug mt-1.5">SI unit: kilogram metre per second (\\( \\text{kg m s}^{-1} \\)).</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">5</div><div class="min-w-0"><div class="int-title">Newton's laws of motion</div><div class="int-tip">8.5</div></div></div><div class="int-cell"><span class="int-tag">First law</span><p class="text-[13px] leading-snug mt-1.5">Every body will remain in a state of <b>rest or travelling with a constant velocity</b> unless a net external force acts on it.</p></div><div class="int-cell"><span class="int-tag">Second law</span><p class="text-[13px] leading-snug mt-1.5">When a net force acts on a body, the <b>rate of change of the body's momentum</b> is directly proportional to the force and takes place in the direction of the force.</p></div><div class="int-cell"><span class="int-tag">Third law</span><p class="text-[13px] leading-snug mt-1.5">If a body A exerts a force on a body B, then body B exerts an <b>equal but opposite</b> force on body A. Action and reaction are equal and opposite.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#14b8a6">6</div><div class="min-w-0"><div class="int-title">Conservation of momentum</div><div class="int-tip">8.7</div></div></div><div class="int-cell"><p class="text-[13px] leading-snug mt-1.5">The <b>principle of conservation of momentum</b>: in any interaction between two or more bodies, the total momentum of the bodies before the interaction is equal to the total momentum after the interaction, <b>provided no external forces act</b> on the system of bodies.</p></div></div></div>
                `
            },
            "phy-c9": {
                title: "Chapter 9: Density, Pressure and Gravity",
                section: "Mechanics",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Density</div><div class="int-tip">What I should know</div></div></div><div class="int-cell"><p class="text-[13px] leading-snug mt-1.5">Density is <b>mass per unit volume</b>:</p><div class="int-math">\\[ \\text{density} = \\frac{\\text{mass}}{\\text{volume}}, \\qquad \\rho = \\frac{m}{V} \\]</div><p class="text-[13px] leading-snug mt-1.5">SI unit: kilogram per cubic metre (\\( \\text{kg m}^{-3} \\)).</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">2</div><div class="min-w-0"><div class="int-title">Pressure</div><div class="int-tip">9.2 to 9.5</div></div></div><div class="int-cell"><p class="text-[13px] leading-snug mt-1.5">Pressure is <b>force per unit area</b>:</p><div class="int-math">\\[ \\text{pressure} = \\frac{\\text{force}}{\\text{area}}, \\qquad P = \\frac{F}{A} \\]</div><p class="text-[13px] leading-snug mt-1.5">SI unit: the pascal (Pa). \\( 1\\ \\text{Pa} = 1\\ \\text{N m}^{-2} \\).</p></div><div class="int-cell"><span class="int-tag">Pressure due to a liquid</span><p class="text-[13px] leading-snug mt-1.5">At depth \\( h \\) in a liquid of density \\( \\rho \\), where the acceleration due to gravity is \\( g \\):</p><div class="int-math">\\[ P = h\\rho g \\]</div><p class="text-[13px] leading-snug mt-1.5">In a liquid of density \\( \\rho \\), the <b>difference</b> in pressure between two points whose depth difference is \\( h \\) is also \\( P = h\\rho g \\).</p></div><div class="int-cell"><span class="int-tag">In a fluid, pressure</span><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li><b>(i)</b> increases with depth</li><li><b>(ii)</b> acts perpendicular to any surface in the fluid</li><li><b>(iii)</b> at a given depth is the same in all directions</li></ul></div><div class="int-cell"><span class="int-tag">Total (absolute) pressure</span><p class="text-[13px] leading-snug mt-1.5">In a liquid whose surface is exposed to atmospheric pressure, total pressure at depth \\( h \\) = atmospheric pressure + pressure due to the liquid:</p><div class="int-math">\\[ P_{\\text{abs}} = P_{\\text{atm}} + h\\rho g \\]</div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">3</div><div class="min-w-0"><div class="int-title">Buoyancy</div><div class="int-tip">9.4</div></div></div><div class="int-cell"><span class="int-tag">Buoyancy force (upthrust)</span><p class="text-[13px] leading-snug mt-1.5">The overall <b>upward force</b> exerted on an object immersed in a fluid. It is caused by the greater pressure on the parts of the object that are deeper in the fluid.</p></div><div class="int-cell"><span class="int-tag">Floating objects</span><p class="text-[13px] leading-snug mt-1.5">When an object floats on a liquid, the buoyancy force acts on the submerged part and is <b>equal in magnitude to the weight</b> of the object.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">4</div><div class="min-w-0"><div class="int-title">Gravity</div><div class="int-tip">9.6 to 9.8</div></div></div><div class="int-cell"><span class="int-tag">Newton's law of universal gravitation</span><p class="text-[13px] leading-snug mt-1.5">Any two point masses in the universe attract each other with a force that is <b>directly proportional to the product of their masses</b> and <b>inversely proportional to the square of the distance</b> between them:</p><div class="int-math">\\[ F = \\frac{Gm_1m_2}{d^2} \\]</div><p class="text-[13px] leading-snug mt-1.5">This is an example of an <b>inverse square law</b>.</p></div><div class="int-cell"><span class="int-tag">Acceleration due to gravity on the Earth's surface</span><div class="int-math">\\[ g = \\frac{GM}{R^2} \\]</div></div><div class="int-cell"><span class="int-tag">Gravitational field strength g</span><p class="text-[13px] leading-snug mt-1.5">At a point in a gravitational field, it is the <b>force per unit mass</b> at that point:</p><div class="int-math">\\[ g = \\frac{F}{m} \\]</div><p class="text-[13px] leading-snug mt-1.5">SI unit: the newton per kilogram (\\( \\text{N kg}^{-1} \\)).</p></div><div class="int-cell"><span class="int-tag">Data from a book exercise</span><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>\\( G = 6.7 \\times 10^{-11}\\ \\text{N m}^2\\text{kg}^{-2} \\)</li><li>\\( g = 9.8\\ \\text{m s}^{-2} \\)</li><li>\\( \\text{radius of Earth} = 6.4 \\times 10^{6}\\ \\text{m} \\)</li><li>\\( \\text{mass of Earth} = 6 \\times 10^{24}\\ \\text{kg} \\)</li></ul></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">5</div><div class="min-w-0"><div class="int-title">Gravitational field and escape velocity</div><div class="int-tip">9.9 (HL)</div></div></div><div class="int-cell"><span class="int-tag">HL · Field strength</span><p class="text-[13px] leading-snug mt-1.5">The gravitational field strength \\( g \\) at a point a distance \\( d \\) from the centre of a planet (or other celestial body) of mass \\( M \\) is:</p><div class="int-math">\\[ g = \\frac{GM}{d^2} \\]</div><p class="text-[13px] leading-snug mt-1.5">The gravitational field strength at any point is equal to the value of the <b>acceleration due to gravity</b> at that point.</p></div><div class="int-cell"><span class="int-tag">HL · Escape velocity</span><p class="text-[13px] leading-snug mt-1.5">The escape velocity \\( v_e \\) at a distance \\( r \\) from the centre of the Earth is:</p><div class="int-math">\\[ v_e = \\sqrt{\\frac{2GM}{r}} \\]</div><p class="text-[13px] leading-snug mt-1.5">where \\( M \\) is the mass of the Earth and \\( G \\) is the universal gravitation constant.</p></div></div></div>
                `
            },
            "phy-c10": {
                title: "Chapter 10: Work, Energy and Power",
                section: "Mechanics",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Work</div><div class="int-tip">What I should know</div></div></div><div class="int-cell"><p class="text-[13px] leading-snug mt-1.5">The <b>work done</b> \\( W \\) when a force \\( F \\) moves a body through a displacement \\( s \\) in the direction of the force is the force multiplied by the displacement:</p><div class="int-math">\\[ W = Fs \\]</div></div><div class="int-cell"><span class="int-tag">Unit</span><p class="text-[13px] leading-snug mt-1.5">The SI unit of work is the <b>joule (J)</b>. One joule is the work done when a force of 1 newton acts for a distance of 1 metre in the direction of the force: \\( 1\\ \\text{J} = 1\\ \\text{N m} \\).</p></div><div class="int-cell"><span class="int-tag">Energy transfer</span><p class="text-[13px] leading-snug mt-1.5">Whenever work is done, energy is transferred.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">2</div><div class="min-w-0"><div class="int-title">Energy</div></div></div><div class="int-cell"><span class="int-tag">Energy</span><p class="text-[13px] leading-snug mt-1.5"><b>Energy, E</b>, is the ability to do work. The amount of energy something has is the amount of work it can do. SI unit: the joule (J).</p></div><div class="int-cell"><span class="int-tag">Conservation of energy</span><p class="text-[13px] leading-snug mt-1.5">Energy cannot be created or destroyed. It can only be <b>converted</b> from one form to another.</p></div><div class="int-cell"><span class="int-tag">Kinetic energy</span><p class="text-[13px] leading-snug mt-1.5">The energy a body has due to its <b>motion</b>:</p><div class="int-math">\\[ E_k = \\tfrac{1}{2}mv^2 \\]</div></div><div class="int-cell"><span class="int-tag">Potential energy</span><p class="text-[13px] leading-snug mt-1.5">The energy a body has due to its <b>position in a force field</b>. In a gravitational field:</p><div class="int-math">\\[ E_p = mgh \\]</div></div><div class="int-cell"><span class="int-tag">Freely falling body</span><p class="text-[13px] leading-snug mt-1.5">The potential energy plus the kinetic energy of a freely falling body is a <b>constant</b> (in the absence of air resistance).</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">3</div><div class="min-w-0"><div class="int-title">Power and efficiency</div><div class="int-tip">10.7 and 10.8</div></div></div><div class="int-cell"><span class="int-tag">Power</span><p class="text-[13px] leading-snug mt-1.5">Power is the rate at which work is done (the rate at which energy is converted from one form to another):</p><div class="int-math">\\[ P = \\frac{W}{t} \\]</div><p class="text-[13px] leading-snug mt-1.5">SI unit: the watt (W). \\( 1\\ \\text{W} = 1\\ \\text{J s}^{-1} \\).</p></div><div class="int-cell"><span class="int-tag">Percentage efficiency</span><div class="int-math">\\[ \\text{Percentage efficiency} = \\frac{\\text{useful power output}}{\\text{power input}} \\times 100 \\]</div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">4</div><div class="min-w-0"><div class="int-title">Collisions</div></div></div><div class="int-cell"><p class="text-[13px] leading-snug mt-1.5"><b>Kinetic energy is not always conserved in collisions</b>; momentum is always conserved, provided no external forces act.</p></div></div></div>
                `
            },
            "phy-c11": {
                title: "Chapter 11: Circular Motion",
                section: "Mechanics",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Moving in a circle</div><div class="int-tip">What I should know</div></div></div><div class="int-cell"><span class="int-tag">Angular velocity</span><p class="text-[13px] leading-snug mt-1.5">The rate at which an angle is <b>changing</b> with respect to time.</p></div><div class="int-cell"><span class="int-tag">Acceleration in a circle</span><p class="text-[13px] leading-snug mt-1.5">When a particle moves at constant speed around a circle, the <b>direction</b> of its velocity is changing and hence it is accelerating.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">2</div><div class="min-w-0"><div class="int-title">Centripetal force and acceleration</div><div class="int-tip">11.2 and 11.3</div></div></div><div class="int-cell"><span class="int-tag">Centripetal force</span><p class="text-[13px] leading-snug mt-1.5">The force towards the centre of a circle that's needed to keep a body moving in that circle.</p></div><div class="int-cell"><span class="int-tag">Centripetal acceleration</span><p class="text-[13px] leading-snug mt-1.5">The acceleration towards the centre of a circle that a body has if it is moving in that circle.</p></div><div class="int-cell"><span class="int-tag">For mass m, speed v, radius r</span><div class="law-grid"><div class="law"><span class="int-tag">Centripetal force</span><div class="int-math">\\[ F = \\frac{mv^2}{r} \\]</div></div><div class="law"><span class="int-tag">Centripetal acceleration</span><div class="int-math">\\[ a = \\frac{v^2}{r} \\]</div></div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">3</div><div class="min-w-0"><div class="int-title">Orbits</div><div class="int-tip">11.4 to 11.6</div></div></div><div class="int-cell"><span class="int-tag">Gravity and orbits</span><p class="text-[13px] leading-snug mt-1.5">The force of gravity supplies the necessary centripetal force to keep the planets orbiting the Sun and satellites orbiting the Earth.</p></div><div class="int-cell"><span class="int-tag">Period (T)</span><p class="text-[13px] leading-snug mt-1.5">The time taken for a satellite to go <b>once around</b> the central body:</p><div class="int-math">\\[ T = \\frac{2\\pi R}{v} \\]</div></div><div class="int-cell"><span class="int-tag">Kepler's third law</span><p class="text-[13px] leading-snug mt-1.5">For a planet orbiting the Sun, the square of the period of the orbit is directly proportional to the cube of the radius of the orbit:</p><div class="int-math">\\[ T^2 \\propto R^3 \\]</div><div class="int-math">\\[ T^2 = \\frac{4\\pi^2 R^3}{GM} \\]</div></div><div class="int-cell"><span class="int-tag">Geostationary orbit</span><p class="text-[13px] leading-snug mt-1.5">An orbit is <b>geostationary</b> if the satellite orbits in the equatorial plane, its period is 24 hours, and the satellite moves in the same direction as the Earth rotates.</p></div></div></div>
                `
            },
            "phy-c12": {
                title: "Chapter 12: Elasticity and Hooke's Law",
                section: "Mechanics",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Elasticity</div><div class="int-tip">12.1 What I should know</div></div></div><div class="int-cell"><span class="int-tag">Elastic object</span><p class="text-[13px] leading-snug mt-1.5">After being compressed or stretched, it <b>returns to its original shape</b> when the force that compressed or stretched it is removed.</p></div><div class="int-cell"><span class="int-tag">Elastic limit</span><p class="text-[13px] leading-snug mt-1.5">An elastic object reaches its elastic limit when it has been stretched (or compressed) so much that it <b>does not return</b> to its original shape after the force is removed.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">2</div><div class="min-w-0"><div class="int-title">Hooke's law</div><div class="int-tip">12.2</div></div></div><div class="int-cell"><span class="int-tag">Hooke's law</span><p class="text-[13px] leading-snug mt-1.5">When an object is stretched or compressed by a displacement \\( s \\), the restoring force \\( F \\) is <b>directly proportional to the displacement</b>, provided the elastic limit is not exceeded.</p></div><div class="int-cell"><span class="int-tag">Elastic constant k</span><p class="text-[13px] leading-snug mt-1.5">The number \\( k \\) in the equation:</p><div class="int-math">\\[ F = -ks \\]</div><p class="text-[13px] leading-snug mt-1.5">Its unit is the newton per metre (\\( \\text{N m}^{-1} \\)).</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">3</div><div class="min-w-0"><div class="int-title">Energy stored</div><div class="int-tip">12.3 (HL)</div></div></div><div class="int-cell"><span class="int-tag">HL · Elastic potential energy</span><p class="text-[13px] leading-snug mt-1.5">Stored in an object that obeys Hooke's law:</p><div class="int-math">\\[ E_p = \\tfrac{1}{2}ks^2 \\]</div><p class="text-[13px] leading-snug mt-1.5">where \\( s \\) is the displacement by which it is compressed or stretched.</p></div><div class="int-cell"><span class="int-tag">Work done</span><p class="text-[13px] leading-snug mt-1.5">The work done in stretching or compressing an object that obeys Hooke's law is also equal to \\( \\tfrac{1}{2}ks^2 \\).</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">4</div><div class="min-w-0"><div class="int-title">An oscillating spring</div><div class="int-tip">12.4</div></div></div><div class="int-cell"><span class="int-tag">If an object is attached to a spring that obeys Hooke's law and is set oscillating</span><ul class="text-[13px] leading-snug space-y-1.5 mt-1.5 list-disc pl-5"><li>The <b>equilibrium position</b> is the position where the resultant force on the object is zero.</li><li>The energy of the body changes continually from potential to kinetic and back again to potential. The <b>total energy</b> is the same at any point during the motion.</li></ul></div><div class="int-note"><span>💡</span><div>Use \\( F = -ks \\) and \\( E_p = \\tfrac{1}{2}ks^2 \\) to solve problems.</div></div></div></div>
                `
            },
            "phy-c13": {
                title: "Chapter 13: Temperature and Thermometers",
                section: "Heat",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">1</div><div class="min-w-0"><div class="int-title">Temperature</div><div class="int-tip">What I should know</div></div></div><div class="int-cell"><span class="int-tag">Temperature</span><p class="text-[13px] leading-snug mt-1.5">The measure of the <b>hotness or coldness</b> of a body.</p></div><div class="int-cell"><span class="int-tag">Units</span><p class="text-[13px] leading-snug mt-1.5">The SI unit of temperature is the <b>kelvin (K)</b>. The <b>degree Celsius</b> is the practical unit of temperature, used for most everyday situations.</p></div><div class="int-cell"><span class="int-tag">Converting</span><div class="int-math">\\[ \\theta\\ (^\\circ\\text{C}) = T\\ (\\text{K}) - 273.15 \\]</div><p class="text-[13px] leading-snug mt-1.5">temperature in degrees Celsius = temperature in kelvin − 273.15</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">2</div><div class="min-w-0"><div class="int-title">Thermometers</div><div class="int-tip">13.2 Thermometric properties</div></div></div><div class="int-cell"><span class="int-tag">Thermometric property</span><p class="text-[13px] leading-snug mt-1.5">Any physical property that <b>changes measurably</b> with temperature.</p></div><div class="int-cell"><span class="int-tag">Thermometer</span><p class="text-[13px] leading-snug mt-1.5">An instrument based on a particular thermometric property and used to measure temperature.</p></div><div class="int-cell"><span class="int-tag">Examples</span><p class="text-[13px] leading-snug mt-1.5">Length of a column of liquid, electrical resistance, emf and colour are examples of thermometric properties.</p></div></div></div>
                `
            },
            "phy-c14": {
                title: "Chapter 14: Heat Transfer and Temperature Change",
                section: "Heat",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">1</div><div class="min-w-0"><div class="int-title">Heat capacity</div><div class="int-tip">14.2 and 14.3</div></div></div><div class="int-cell"><span class="int-tag">Heat capacity</span><p class="text-[13px] leading-snug mt-1.5">The heat energy needed to change the temperature of an <b>object</b> by 1 K (1 °C). SI unit: joule per kelvin (\\( \\text{J K}^{-1} \\)).</p></div><div class="int-cell"><span class="int-tag">Specific heat capacity (c)</span><p class="text-[13px] leading-snug mt-1.5">The heat energy needed to change the temperature of <b>1 kilogram</b> of that substance by 1 kelvin. SI unit: joule per kilogram per kelvin (\\( \\text{J kg}^{-1}\\text{K}^{-1} \\)).</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">2</div><div class="min-w-0"><div class="int-title">Latent heat</div><div class="int-tip">14.4 and 14.5</div></div></div><div class="int-cell"><span class="int-tag">Latent heat (L)</span><p class="text-[13px] leading-snug mt-1.5">The heat energy needed to change the <b>state</b> of a substance without a change in temperature. SI unit: the joule (J).</p></div><div class="int-cell"><span class="int-tag">Specific latent heat (l)</span><p class="text-[13px] leading-snug mt-1.5">The amount of heat energy needed to change the state of <b>1 kg</b> of that substance without a change in temperature. SI unit: joule per kilogram (\\( \\text{J kg}^{-1} \\)).</p></div><div class="int-cell"><span class="int-tag">Specific latent heat of fusion</span><p class="text-[13px] leading-snug mt-1.5">The heat energy needed to change 1 kg of the substance from a <b>solid to a liquid</b> without a change in temperature (i.e. at its melting point).</p></div><div class="int-cell"><span class="int-tag">HL · Specific latent heat of vaporisation</span><p class="text-[13px] leading-snug mt-1.5">The heat energy needed to change 1 kg of the substance from a <b>liquid to a gas</b> without a change in temperature (i.e. at its boiling point).</p></div><div class="int-cell"><span class="int-tag">Unit</span><p class="text-[13px] leading-snug mt-1.5">The SI unit of specific latent heat of vaporisation and of fusion is the joule per kilogram (\\( \\text{J kg}^{-1} \\)).</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">3</div><div class="min-w-0"><div class="int-title">Heat transfer</div><div class="int-tip">14.7</div></div></div><div class="int-cell"><span class="int-tag">Three means</span><p class="text-[13px] leading-snug mt-1.5"><b>Conduction, convection and radiation</b> are three means by which heat can be transferred from one place to another.</p></div><div class="int-cell"><span class="int-tag">Conduction</span><p class="text-[13px] leading-snug mt-1.5">The movement of heat energy through a substance by the passing on of <b>molecular vibration</b> from molecule to molecule. There is no overall motion of the substance.</p></div><div class="int-cell"><span class="int-tag">Convection</span><p class="text-[13px] leading-snug mt-1.5">The transfer of heat through a <b>fluid</b> by means of circulating currents of fluid caused by the heat.</p></div><div class="int-cell"><span class="int-tag">Radiation</span><p class="text-[13px] leading-snug mt-1.5">The transfer of heat energy from one place to another in the form of <b>electromagnetic waves</b>.</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">4</div><div class="min-w-0"><div class="int-title">U-value</div></div></div><div class="int-cell"><p class="text-[13px] leading-snug mt-1.5">The <b>U-value</b> of a structure is the amount of heat energy conducted per second through 1 m² of that structure when a temperature difference of 1 °C (i.e. 1 K) is maintained between its ends.</p><p class="text-[13px] leading-snug mt-1.5">SI unit: \\( \\text{W m}^{-2}\\text{K}^{-1} \\).</p></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">5</div><div class="min-w-0"><div class="int-title">Heat pump</div><div class="int-tip">14.6 Figure 14.12: a heat pump in a refrigerator</div></div></div><div class="int-cell"><span class="int-tag">Heat pump</span><p class="text-[13px] leading-snug mt-1.5">A heat pump transfers heat energy from a <b>cooler</b> region to a <b>warmer</b> one.</p></div><div class="int-cell"><span class="int-tag">Heat pump in a refrigerator</span><div class="flex flex-wrap items-center gap-4 mt-2"><svg viewBox="0 0 300 190" class="w-full" style="color:#64748b;max-width:400px" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="10" width="200" height="62" rx="4" fill="#3b82f6" opacity="0.12" stroke="#3b82f6" stroke-width="1"/><text x="60.0" y="23.5" font-size="10" text-anchor="middle" fill="currentColor">Fridge</text><polyline points="70.0,48.0 90.0,57.0 110.0,39.0 130.0,57.0 150.0,39.0 170.0,57.0 190.0,48.0" fill="none" stroke="#38bdf8" stroke-width="2.4" stroke-linejoin="round"/><line x1="70.0" y1="48.0" x2="70.0" y2="150.0" stroke="#64748b" stroke-width="2.4"/><line x1="190.0" y1="48.0" x2="190.0" y2="150.0" stroke="#64748b" stroke-width="2.4"/><polyline points="70.0,150.0 90.0,159.0 110.0,141.0 130.0,159.0 150.0,141.0 170.0,159.0 190.0,150.0" fill="none" stroke="#ef4444" stroke-width="2.4" stroke-linejoin="round"/><circle cx="70" cy="98" r="9" fill="#ef4444"/><circle cx="190" cy="98" r="9" fill="#64748b"/><line x1="70.0" y1="96.0" x2="70.0" y2="66.0" stroke="#0f172a" stroke-width="1.8"/><polygon points="70.0,66.0 72.6,71.4 67.4,71.4" fill="#0f172a"/><line x1="70.0" y1="138.0" x2="70.0" y2="120.0" stroke="#0f172a" stroke-width="1.8"/><polygon points="70.0,120.0 72.6,125.4 67.4,125.4" fill="#0f172a"/><line x1="190.0" y1="66.0" x2="190.0" y2="86.0" stroke="#0f172a" stroke-width="1.8"/><polygon points="190.0,86.0 187.4,80.6 192.6,80.6" fill="#0f172a"/><line x1="190.0" y1="112.0" x2="190.0" y2="134.0" stroke="#0f172a" stroke-width="1.8"/><polygon points="190.0,134.0 187.4,128.6 192.6,128.6" fill="#0f172a"/><text x="56.0" y="65.5" font-size="8" text-anchor="end" fill="currentColor">Low-pressure</text><text x="56.0" y="75.5" font-size="8" text-anchor="end" fill="currentColor">liquid</text><text x="56.0" y="101.5" font-size="8" text-anchor="end" fill="currentColor">Expansion valve</text><text x="56.0" y="133.5" font-size="8" text-anchor="end" fill="currentColor">High-pressure</text><text x="56.0" y="143.5" font-size="8" text-anchor="end" fill="currentColor">liquid</text><text x="202.0" y="65.5" font-size="8" text-anchor="start" fill="currentColor">Low-pressure vapour</text><text x="204.0" y="101.5" font-size="8" text-anchor="start" fill="currentColor">Compressor</text><text x="202.0" y="131.5" font-size="8" text-anchor="start" fill="currentColor">High-pressure</text><text x="202.0" y="141.5" font-size="8" text-anchor="start" fill="currentColor">vapour</text><text x="130.0" y="181.5" font-size="9" text-anchor="middle" fill="#ef4444">Heat given off</text><line x1="90.0" y1="166.0" x2="90.0" y2="174.0" stroke="#ef4444" stroke-width="1.4"/><polygon points="90.0,174.0 87.4,168.6 92.6,168.6" fill="#ef4444"/><line x1="110.0" y1="166.0" x2="110.0" y2="174.0" stroke="#ef4444" stroke-width="1.4"/><polygon points="110.0,174.0 107.4,168.6 112.6,168.6" fill="#ef4444"/><line x1="130.0" y1="166.0" x2="130.0" y2="174.0" stroke="#ef4444" stroke-width="1.4"/><polygon points="130.0,174.0 127.4,168.6 132.6,168.6" fill="#ef4444"/><line x1="150.0" y1="166.0" x2="150.0" y2="174.0" stroke="#ef4444" stroke-width="1.4"/><polygon points="150.0,174.0 147.4,168.6 152.6,168.6" fill="#ef4444"/><line x1="170.0" y1="166.0" x2="170.0" y2="174.0" stroke="#ef4444" stroke-width="1.4"/><polygon points="170.0,174.0 167.4,168.6 172.6,168.6" fill="#ef4444"/></svg></div></div></div></div>
                `
            },
            "bus-c1": {
                title: "Chapter 1: Key Stakeholders in Business",
                section: "Strand 1: Exploring the Business Environment",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Stakeholders and their importance to a business</div><div class="int-tip">Key takeaways</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Business owner / entrepreneur</div><div class="p-2 leading-snug">Sets up the business, takes personal/financial risk, hopes to earn a profit. Without them an idea would not become reality and no-one would raise investment.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Managers</div><div class="p-2 leading-snug">Organise the resources to achieve set objectives for the owner. They control day-to-day operations and long-term planning.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Employees</div><div class="p-2 leading-snug">Carry out the manager's orders, contribute ideas and use their skills. Provide the time, skills, experience and qualifications to meet objectives.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Investors</div><div class="p-2 leading-snug">Provide financial support in exchange for ownership (equity). Help the business expand and fund innovation; offer experience/networks.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Consumers</div><div class="p-2 leading-snug">Purchase goods or services, provide feedback, act as advocates. Drive revenue and repeat purchases; feedback can improve products.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Local community</div><div class="p-2 leading-snug">The area and people that surround and interact with the business. Fosters goodwill and provides potential customers and employees.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Suppliers</div><div class="p-2 leading-snug">Provide raw materials, products or services needed. Ensure consistent production and delivery of quality stock on time.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Government</div><div class="p-2 leading-snug">Regulates and oversees business activity, offers grants and incentives. Can provide mentoring, training and funding through state agencies.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Interest groups</div><div class="p-2 leading-snug">Represent the common viewpoints, objectives and goals of a group of stakeholders. Help negotiate or inform the business what members want; avoids conflict.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">2</div><div class="min-w-0"><div class="int-title">Types of relationships between stakeholders</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Co-operative</div><div class="p-2 leading-snug">Win-win: mutual benefit for both parties, they work towards a common goal.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Competitive</div><div class="p-2 leading-snug">Win-lose: one party benefits at the expense of another party; conflict.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">3</div><div class="min-w-0"><div class="int-title">Avoiding and resolving conflict</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Regular and honest communication</div><div class="p-2 leading-snug">Open lines of dialogue to understand stakeholder concerns and expectations.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Good corporate social responsibility (CSR)</div><div class="p-2 leading-snug">Adopt good ethical practices that balance profitability with societal benefits.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Stakeholder engagement plans</div><div class="p-2 leading-snug">Develop plans to actively involve stakeholders in the decision-making process.</div></div></div><p class="text-[13px] leading-snug mt-2">Resolving conflict, from least to most formal:</p><div class="flex flex-wrap items-center gap-4 mt-2"><svg viewBox="0 0 300 140" class="w-full" style="color:#64748b;max-width:420px" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="90" width="54" height="28" rx="4" fill="#fde68a" stroke="none" stroke-width="1.2" opacity="1"/><text x="35.0" y="104.5" font-size="11" text-anchor="middle" fill="#78350f">1</text><text x="35" y="114.5" font-size="8.5" text-anchor="middle" fill="#78350f" font-weight="600">Meet</text><text x="35" y="124.0" font-size="8.5" text-anchor="middle" fill="#78350f" font-weight="600">&amp; talk</text><rect x="66" y="73" width="54" height="45" rx="4" fill="#fbbf24" stroke="none" stroke-width="1.2" opacity="1"/><text x="93.0" y="87.5" font-size="11" text-anchor="middle" fill="#78350f">2</text><text x="93" y="97.5" font-size="8.5" text-anchor="middle" fill="#78350f" font-weight="600">Negoti-</text><text x="93" y="107.0" font-size="8.5" text-anchor="middle" fill="#78350f" font-weight="600">ation</text><rect x="124" y="56" width="54" height="62" rx="4" fill="#f59e0b" stroke="none" stroke-width="1.2" opacity="1"/><text x="151.0" y="70.5" font-size="11" text-anchor="middle" fill="#fff">3</text><text x="151" y="80.5" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="600">Media-</text><text x="151" y="90.0" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="600">tion</text><rect x="182" y="39" width="54" height="79" rx="4" fill="#ef4444" stroke="none" stroke-width="1.2" opacity="1"/><text x="209.0" y="53.5" font-size="11" text-anchor="middle" fill="#fff">4</text><text x="209" y="63.5" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="600">Concili-</text><text x="209" y="73.0" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="600">ation</text><rect x="240" y="22" width="54" height="96" rx="4" fill="#b91c1c" stroke="none" stroke-width="1.2" opacity="1"/><text x="267.0" y="36.5" font-size="11" text-anchor="middle" fill="#fff">5</text><text x="267" y="46.5" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="600">Arbitr-</text><text x="267" y="56.0" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="600">ation</text><line x1="10.0" y1="130.0" x2="290.0" y2="130.0" stroke="#64748b" stroke-width="1.2"/><polygon points="290.0,130.0 284.6,132.6 284.6,127.4" fill="#64748b"/><text x="150.0" y="139.5" font-size="8" text-anchor="middle" fill="currentColor">more formal, more third-party involvement</text></svg></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">1. Meet and talk</div><div class="p-2 leading-snug">Discuss, clarify and communicate issues around the dispute.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">2. Negotiation</div><div class="p-2 leading-snug">Bargaining, counter-offers, compromise to reach a solution.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">3. Mediation</div><div class="p-2 leading-snug">Unbiased 3rd party (facilitator) encourages parties to talk in a meeting. Doesn't offer any solutions or recommendations.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">4. Conciliation</div><div class="p-2 leading-snug">Unbiased third party helps the sides reach an agreement themselves. Does not impose a solution but may suggest options or proposals toward a mutually acceptable resolution.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">5. Arbitration</div><div class="p-2 leading-snug">Listens to both parties, then issues a recommendation (solution) which can be binding or non-binding if agreed beforehand.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">4</div><div class="min-w-0"><div class="int-title">Stakeholder mapping</div><div class="int-tip">Power-interest grid</div></div></div><p class="text-[13px] leading-snug mt-2">Identifies the main stakeholders and their power and influence on a business, to help prioritise actions.</p><div class="flex flex-wrap items-center gap-4 mt-2"><svg viewBox="0 0 230 190" class="w-full" style="color:#64748b;max-width:360px" xmlns="http://www.w3.org/2000/svg"><rect x="34" y="6" width="94" height="76" rx="6" fill="#ef4444" stroke="none" stroke-width="1.2" opacity="1"/><text x="81" y="35.5" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="700">Keep Satisfied</text><rect x="132" y="6" width="94" height="76" rx="6" fill="#3b82f6" stroke="none" stroke-width="1.2" opacity="1"/><text x="179" y="35.5" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="700">Manage Closely</text><rect x="34" y="86" width="94" height="76" rx="6" fill="#64748b" stroke="none" stroke-width="1.2" opacity="1"/><text x="81" y="115.5" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="700">Monitor</text><rect x="132" y="86" width="94" height="76" rx="6" fill="#f59e0b" stroke="none" stroke-width="1.2" opacity="1"/><text x="179" y="115.5" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="700">Keep Informed</text><text transform="rotate(-90 12 84)" x="12" y="84" font-size="8.5" text-anchor="middle" fill="currentColor">Power / influence of stakeholder</text><text x="30.0" y="17.5" font-size="8" text-anchor="end" fill="currentColor">High</text><text x="30.0" y="159.5" font-size="8" text-anchor="end" fill="currentColor">Low</text><text x="130.0" y="179.5" font-size="8.5" text-anchor="middle" fill="currentColor">Level of interest of stakeholder</text><text x="38.0" y="173.5" font-size="8" text-anchor="start" fill="currentColor">Low</text><text x="224.0" y="173.5" font-size="8" text-anchor="end" fill="currentColor">High</text></svg></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Helps allocate resources</div><div class="p-2 leading-snug">The most important stakeholders can be targeted to help satisfy their needs.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Proactive conflict resolution</div><div class="p-2 leading-snug">Highlights stakeholders that require information, who can be engaged/involved to prevent conflict occurring.</div></div></div></div></div>
                `
            },
            "bus-c2": {
                title: "Chapter 2: Forms of Business, Business Regulation and Governance",
                section: "Strand 1: Exploring the Business Environment",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Types of enterprises and their contribution</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:110px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Public enterprises</div><div class="p-2 leading-snug">Owned and controlled by the government (national or local). Semi-states operate as a commercial enterprise but are government owned. LOCAL: essential local services (local transport), community development. NATIONAL: improves infrastructure, essential national services (education/healthcare).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:110px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Private enterprises</div><div class="p-2 leading-snug">Owned by individuals or shareholders; operate for profit. LOCAL: create jobs, positive local spin-off effect, social fabric/vitality. NATIONAL: contributes to GDP/economic growth, increases exports, tax revenue.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:110px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Not-for-profits</div><div class="p-2 leading-snug">Exist to achieve a social, cultural or community goal rather than profit for owners. LOCAL: foster social inclusion, create jobs, offer volunteer opportunities. NATIONAL: provide vital services, help solve social issues, influence government policy.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">2</div><div class="min-w-0"><div class="int-title">Ownership types</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:118px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Sole trader</div><div class="p-2 leading-snug">1 owner / easy to set up; unlimited liability; private accounts; not a separate legal entity.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:118px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Partnership</div><div class="p-2 leading-snug">2-20 owners; unlimited liability; private accounts; not a separate legal entity.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:118px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Private limited company (Ltd)</div><div class="p-2 leading-snug">1-149 owners; limited liability; separate legal entity; continuity of existence.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:118px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Designated activity company (DAC)</div><div class="p-2 leading-snug">Limited company formed for a specific purpose in a regulated industry (banking).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:118px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Public limited company (PLC)</div><div class="p-2 leading-snug">Shares sold on stock exchange; unlimited owners; published accounts; limited liability; continuity of existence.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:118px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Co-operatives</div><div class="p-2 leading-snug">Democratically controlled (one member, one vote); jointly owned by members for a common goal; limited liability; not profit driven; limited finance.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:118px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Franchises</div><div class="p-2 leading-snug">Franchisor gives permission to the franchisee to use their idea/logo/brand in return for a fee / % of profits. + proven, mentoring, customer base; - costly, reduced creativity.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:118px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Public sector</div><div class="p-2 leading-snug">Government-owned businesses that provide essential services in the state.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">3</div><div class="min-w-0"><div class="int-title">Why ownership types change over time</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Limited liability</div><div class="p-2 leading-snug">Move from unlimited to limited, e.g. sole trader or partnership to Ltd.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Continuity of existence</div><div class="p-2 leading-snug">A sole trader business ceases on the death of the owner; not the case in a Ltd.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Expansion</div><div class="p-2 leading-snug">Access to capital: Ltd 1-149 investors vs partnership (2-20) or sole trader (1).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Tax benefits</div><div class="p-2 leading-snug">Ltd pay 12.5%/15% tax on profits; sole traders pay higher PAYE rates (20%/40%).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Privatisation</div><div class="p-2 leading-snug">A semi-state may be sold to private investors so it can raise more capital to compete.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Nationalisation</div><div class="p-2 leading-snug">Government may take over a private business that could fail, to protect the industry/economy from collapse, e.g. nationalising banks.</div></div></div><div class="flex flex-wrap gap-2 mt-2"><div class="px-3 py-2 rounded-xl text-center" style="background:#f59e0b1f;border:1px solid #f59e0b55"><div class="text-base font-extrabold leading-tight" style="color:#f59e0b">1</div><div class="text-[11px] text-gray-600 dark:text-slate-300">sole trader</div></div><div class="px-3 py-2 rounded-xl text-center" style="background:#f59e0b1f;border:1px solid #f59e0b55"><div class="text-base font-extrabold leading-tight" style="color:#f59e0b">2-20</div><div class="text-[11px] text-gray-600 dark:text-slate-300">partnership</div></div><div class="px-3 py-2 rounded-xl text-center" style="background:#f59e0b1f;border:1px solid #f59e0b55"><div class="text-base font-extrabold leading-tight" style="color:#f59e0b">1-149</div><div class="text-[11px] text-gray-600 dark:text-slate-300">private Ltd</div></div><div class="px-3 py-2 rounded-xl text-center" style="background:#f59e0b1f;border:1px solid #f59e0b55"><div class="text-base font-extrabold leading-tight" style="color:#f59e0b">12.5% / 15%</div><div class="text-[11px] text-gray-600 dark:text-slate-300">Ltd tax on profits</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">4</div><div class="min-w-0"><div class="int-title">Regulation in business</div></div></div><p class="text-[13px] leading-snug mt-2">Purpose: ensure businesses operate safely, ethically and sustainably. It protects stakeholders. Good regulation builds trust, reduces risk and encourages transparency.</p><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Internal</div><div class="p-2 leading-snug">Internal audit: independent examination of the firm (financial, environmental). Risk management: identify all risks and potential losses; minimise them. Compliance: procedures to ensure adherence to laws and internal policies. Corporate governance: systems and processes used to manage a company.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">External</div><div class="p-2 leading-snug">Government regulators: CCPC/WRC/EPA ensure businesses comply with rules. Legal compliance: laws, e.g. Unfair Dismissals Acts 1977-2015. External audits: an outside business examines internal processes and reports. European laws: regulations and directives Irish businesses must follow.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#6366f1">5</div><div class="min-w-0"><div class="int-title">Governance and ESG reports</div></div></div><p class="text-[13px] leading-snug mt-2">Governance is the system of rules, practices and processes used to direct and control a business. It identifies who has the authority to make decisions and where accountability for how the business behaves and performs lies.</p><div class="flex flex-wrap items-center gap-4 mt-2"><svg viewBox="0 0 220 130" class="w-full" style="color:#64748b;max-width:300px" xmlns="http://www.w3.org/2000/svg"><circle cx="78" cy="52" r="42" fill="#22c55e" opacity="0.38"/><circle cx="142" cy="52" r="42" fill="#3b82f6" opacity="0.38"/><circle cx="110" cy="92" r="42" fill="#8b5cf6" opacity="0.38"/><text x="62" y="43.5" font-size="9" text-anchor="middle" fill="currentColor" font-weight="600">Environ-</text><text x="62" y="54.5" font-size="9" text-anchor="middle" fill="currentColor" font-weight="600">mental</text><text x="158" y="43.5" font-size="9.5" text-anchor="middle" fill="currentColor" font-weight="600">Social</text><text x="110" y="107.5" font-size="9.5" text-anchor="middle" fill="currentColor" font-weight="600">Governance</text><text x="110.0" y="65.5" font-size="11" text-anchor="middle" fill="currentColor">ESG</text></svg></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#6366f122;border-left:3px solid #6366f1">Environmental</div><div class="p-2 leading-snug">Assesses how a company's operations impact the environment and how it manages risks. Emissions, energy sources, waste management, sustainability efforts.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#6366f122;border-left:3px solid #6366f1">Social</div><div class="p-2 leading-snug">How a company interacts with employees, customers and communities. Employee rights, diversity, inclusion; consumer protection; community engagement/CSR; ethical supply chain.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#6366f122;border-left:3px solid #6366f1">Governance</div><div class="p-2 leading-snug">Company's internal controls, ethics, leadership, compliance with laws. Board composition, gender balance, transparency; anti-corruption and ethical practices; compliance with financial regulations.</div></div></div></div></div>
                `
            },
            "bus-c3": {
                title: "Chapter 3: Business and the Economy",
                section: "Strand 1: Exploring the Business Environment",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">1</div><div class="min-w-0"><div class="int-title">Economic indicators and their impact on business</div><div class="int-tip">Inflation</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Inflation</div><div class="p-2 leading-snug">A rise in the average level of prices from one period to the next.</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Wage demands</div><div class="p-2 leading-snug">Workers need more money to maintain living standards, harder to expand.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Higher costs</div><div class="p-2 leading-snug">Business costs increase, decreasing profit margins, harder to expand.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Less competitive</div><div class="p-2 leading-snug">If inflation in Ireland is greater than export markets, reduces competitiveness.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f97316">2</div><div class="min-w-0"><div class="int-title">Employment</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f9731622;border-left:3px solid #f97316">Employment</div><div class="p-2 leading-snug">Measures the percentage of people in the labour force from the population.</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f9731622;border-left:3px solid #f97316">Increased demand</div><div class="p-2 leading-snug">High rates mean more income so more spending, good for expansion.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f9731622;border-left:3px solid #f97316">Labour shortages</div><div class="p-2 leading-snug">High rates mean some sectors may not have enough workers, harder.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f9731622;border-left:3px solid #f97316">Wage demands</div><div class="p-2 leading-snug">High rates mean workers can ask for more money as they are in demand.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">3</div><div class="min-w-0"><div class="int-title">Interest rates</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Interest rates</div><div class="p-2 leading-snug">The cost of borrowing capital, expressed as a percentage.</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Higher repayments</div><div class="p-2 leading-snug">Existing loan repayments more costly, reducing ability to expand.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Lower sales</div><div class="p-2 leading-snug">Consumers have lower disposable income (higher mortgages, more costly loans).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Lower business confidence</div><div class="p-2 leading-snug">Higher rates usually lead to less investment as borrowing is more expensive, reducing demand in the economy.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#22c55e">4</div><div class="min-w-0"><div class="int-title">Economic growth and development</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Economic growth and development</div><div class="p-2 leading-snug">An increase in the value of goods and services produced in a country from one period to the next; development includes a structural shift in society.</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Increased spending</div><div class="p-2 leading-snug">Economic growth boosts confidence leading to higher demand.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Investment increase</div><div class="p-2 leading-snug">Growth encourages investment as it boosts optimism for the economy.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Higher govt support</div><div class="p-2 leading-snug">Growth leads to higher tax revenue, so supports for businesses looking to expand (grants etc.), infrastructure...</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">5</div><div class="min-w-0"><div class="int-title">Exchange rates</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Exchange rates</div><div class="p-2 leading-snug">The cost of one currency expressed in terms of another currency.</div></div></div><div class="flex flex-wrap items-center gap-4 mt-2"><svg viewBox="0 0 310 86" class="w-full" style="color:#64748b;max-width:440px" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="4" width="150" height="78" rx="6" fill="#22c55e" stroke="#22c55e" stroke-width="1.2" opacity="0.18"/><text x="77" y="15.5" font-size="9.5" text-anchor="middle" fill="currentColor" font-weight="600">Euro rises vs $ / £</text><text x="77" y="33.5" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="500">Irish exports cost more</text><text x="77" y="44.5" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="500">for foreign buyers</text><text x="77" y="55.5" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="500">(less competitive)</text><rect x="158" y="4" width="150" height="78" rx="6" fill="#ef4444" stroke="#ef4444" stroke-width="1.2" opacity="0.18"/><text x="233" y="15.5" font-size="9.5" text-anchor="middle" fill="currentColor" font-weight="600">Euro falls vs $ / £</text><text x="233" y="33.5" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="500">Imported raw materials</text><text x="233" y="44.5" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="500">cost more</text><text x="233" y="55.5" font-size="8.5" text-anchor="middle" fill="currentColor" font-weight="500">(higher operating costs)</text></svg></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Competitiveness of exports</div><div class="p-2 leading-snug">If the euro increases in value relative to the dollar or pound, Irish exports become more expensive for foreign buyers.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Costs of imported raw materials</div><div class="p-2 leading-snug">If the euro decreases, imported raw materials become more expensive, leading to higher operating costs.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Uncertainty</div><div class="p-2 leading-snug">Fluctuating exchange rates cause uncertainty and make planning more difficult.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#eab308">6</div><div class="min-w-0"><div class="int-title">Consumer confidence</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#eab30822;border-left:3px solid #eab308">Consumer confidence</div><div class="p-2 leading-snug">Measures optimism levels consumers feel about the economy/personal finances.</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#eab30822;border-left:3px solid #eab308">Higher spending</div><div class="p-2 leading-snug">Optimism/financial security leads to more purchasing of goods and services.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#eab30822;border-left:3px solid #eab308">Increased expansion</div><div class="p-2 leading-snug">High confidence should lead to higher demand so businesses are happy to expand.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#eab30822;border-left:3px solid #eab308">Easier to access capital</div><div class="p-2 leading-snug">When consumers are confident, owners and investors also feel optimistic, so are more likely to seek investment opportunities.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#14b8a6">7</div><div class="min-w-0"><div class="int-title">Value of the business economy in Ireland</div></div></div><div class="flex flex-wrap gap-2 mt-2"><div class="px-3 py-2 rounded-xl text-center" style="background:#14b8a61f;border:1px solid #14b8a655"><div class="text-base font-extrabold leading-tight" style="color:#14b8a6">€484 billion</div><div class="text-[11px] text-gray-600 dark:text-slate-300">total value added from economic activities, 2023</div></div><div class="px-3 py-2 rounded-xl text-center" style="background:#14b8a61f;border:1px solid #14b8a655"><div class="text-base font-extrabold leading-tight" style="color:#14b8a6">2,794,800</div><div class="text-[11px] text-gray-600 dark:text-slate-300">persons employed in Ireland, 2024 (approx.)</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#14b8a622;border-left:3px solid #14b8a6">Uses for government</div><div class="p-2 leading-snug">Helps plan for education and workforce training to align skills. Positive trends help attract FDI.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#14b8a622;border-left:3px solid #14b8a6">Uses for business</div><div class="p-2 leading-snug">Helps identify growing sectors and market opportunities. Helps benchmark performance against competitors and industry averages.</div></div></div></div></div>
