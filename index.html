racking-wider mb-0.5" style="color:#f59e0b">How the target market influences it</span>Channels chosen on customer habits. Messages tailored to interests and values.</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#f59e0b22;border-left:3px solid #f59e0b">People</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#f59e0b">Outline</span>Everyone involved in delivering the product/service, especially those who interact with customers.</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#f59e0b">How the target market influences it</span>Staff image and tone reflect customer expectations. Staff knowledge matches needs.</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#f59e0b22;border-left:3px solid #f59e0b">Packaging / physical evidence</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#f59e0b">Outline</span>First impression for the customer. Services have physical evidence, e.g. decor in a restaurant/hotel.</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#f59e0b">How the target market influences it</span>Visual style tailored to the target group. Sustainability appeals to eco-conscious buyers.</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#f59e0b22;border-left:3px solid #f59e0b">Process</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#f59e0b">Outline</span>Steps a customer follows from first interaction through completing the purchase.</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#f59e0b">How the target market influences it</span>Speed valued by convenience-focused customers. Simplicity needed for less tech-savvy users.</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#f59e0b22;border-left:3px solid #f59e0b">Place</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#f59e0b">Outline</span>How a product/service reaches the customer: distribution channels, sales platforms, physical and digital stores.</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#f59e0b">How the target market influences it</span>Younger customers prefer fast digital channels. Premium buyers want exclusive shopping experiences.</div></div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">3</div><div class="min-w-0"><div class="int-title">USP analysis</div></div></div><p class="text-[13px] leading-snug mt-2">Helps identify and highlight the unique benefits and features a business can offer its consumers, helping it stand out from competitors.</p><div class="flex flex-wrap gap-2 mt-2"><div class="px-3 py-1.5 rounded-full text-[12px] font-semibold" style="background:#8b5cf61f;border:1px solid #8b5cf655">1. What the business does well</div><div class="px-3 py-1.5 rounded-full text-[12px] font-semibold" style="background:#8b5cf61f;border:1px solid #8b5cf655">2. What the customer wants</div><div class="px-3 py-1.5 rounded-full text-[12px] font-semibold" style="background:#8b5cf61f;border:1px solid #8b5cf655">3. What the competition does well</div></div><div class="int-note"><span>💡</span><div>Build the marketing mix around what the business does well and the customer wants, and the competition does not do well.</div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#22c55e">4</div><div class="min-w-0"><div class="int-title">Ways to improve an existing marketing mix</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Product / service</div><div class="p-2 leading-snug">Launch new items, limited editions to create hype, improve quality/durability, add features.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Pricing</div><div class="p-2 leading-snug">Tiered options, bundle deals, discounts or loyalty prices, dynamic pricing.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Promotion</div><div class="p-2 leading-snug">Polls/giveaways, collaborate with influencers, shift to digital platforms, use PR and storytelling.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">People</div><div class="p-2 leading-snug">Train staff to match the audience, recruit relatable ambassadors, involve staff in campaigns, reward good service.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Packaging / physical evidence</div><div class="p-2 leading-snug">Sustainable/recycled materials, QR codes with info, improve visual impact, enhance store/decor style.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Process</div><div class="p-2 leading-snug">Subscription options, simplify checkout, offer tracking and easy returns, support less tech-savvy users online.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Place</div><div class="p-2 leading-snug">Sell direct online, web-only products, marketplaces or social platforms, click-and-collect.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#0ea5e9">5</div><div class="min-w-0"><div class="int-title">Disruptive impact of technology</div><div class="int-tip">on market research and marketing</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Market research</div><div class="p-2 leading-snug">1. Real-time insights from online surveys, polls and social media listening. 2. AI tools help analyse large volumes of data (reviews, trends). 3. Affordable analytics platforms like Google Analytics.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Marketing</div><div class="p-2 leading-snug">1. Ads precisely targeted by age, location or interests. 2. Digital platforms track views, clicks and purchases in real time; A/B testing improves decisions. 3. Low-cost tools allow creative, personal marketing (influencer videos, viral content).</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">6</div><div class="min-w-0"><div class="int-title">Ethics and sustainability in marketing</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Opportunities</div><div class="p-2 leading-snug">Builds trust and loyalty, creates strong marketing stories, competitive advantage, appeals to eco-conscious buyers who may pay more.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Challenges</div><div class="p-2 leading-snug">Higher costs of sustainable materials/ethical sourcing can reduce margins. Risk of 'greenwashing': brands caught exaggerating sustainability efforts may face backlash.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#6366f1">7</div><div class="min-w-0"><div class="int-title">Power-interest grid for customers</div></div></div><div class="flex flex-wrap items-center gap-4 mt-2"><svg viewBox="0 0 230 190" class="w-full" style="color:#64748b;max-width:360px" xmlns="http://www.w3.org/2000/svg"><rect x="34" y="6" width="94" height="76" rx="6" fill="#ef4444" stroke="none" stroke-width="1.2" opacity="1"/><text x="81" y="17.5" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="700">Keep Satisfied</text><text x="81" y="37.5" font-size="8" text-anchor="middle" fill="#fff" font-weight="500">Influencers,</text><text x="81" y="47.5" font-size="8" text-anchor="middle" fill="#fff" font-weight="500">trendsetters,</text><text x="81" y="57.5" font-size="8" text-anchor="middle" fill="#fff" font-weight="500">bloggers</text><rect x="132" y="6" width="94" height="76" rx="6" fill="#3b82f6" stroke="none" stroke-width="1.2" opacity="1"/><text x="179" y="23.5" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="700">Manage Closely</text><text x="179" y="41.5" font-size="8" text-anchor="middle" fill="#fff" font-weight="500">Loyal core</text><text x="179" y="51.5" font-size="8" text-anchor="middle" fill="#fff" font-weight="500">customers</text><rect x="34" y="86" width="94" height="76" rx="6" fill="#64748b" stroke="none" stroke-width="1.2" opacity="1"/><text x="81" y="103.5" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="700">Monitor</text><text x="81" y="121.5" font-size="8" text-anchor="middle" fill="#fff" font-weight="500">Casual</text><text x="81" y="131.5" font-size="8" text-anchor="middle" fill="#fff" font-weight="500">consumers</text><rect x="132" y="86" width="94" height="76" rx="6" fill="#f59e0b" stroke="none" stroke-width="1.2" opacity="1"/><text x="179" y="103.5" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="700">Keep Informed</text><text x="179" y="121.5" font-size="8" text-anchor="middle" fill="#fff" font-weight="500">Niche fans or</text><text x="179" y="131.5" font-size="8" text-anchor="middle" fill="#fff" font-weight="500">early adopters</text><text transform="rotate(-90 12 84)" x="12" y="84" font-size="8.5" text-anchor="middle" fill="currentColor">Power / influence of stakeholder</text><text x="30.0" y="17.5" font-size="8" text-anchor="end" fill="currentColor">High</text><text x="30.0" y="159.5" font-size="8" text-anchor="end" fill="currentColor">Low</text><text x="130.0" y="179.5" font-size="8.5" text-anchor="middle" fill="currentColor">Level of interest of stakeholder</text><text x="38.0" y="173.5" font-size="8" text-anchor="start" fill="currentColor">Low</text><text x="224.0" y="173.5" font-size="8" text-anchor="end" fill="currentColor">High</text></svg></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#6366f122;border-left:3px solid #6366f1">High power, high interest</div><div class="p-2 leading-snug">Loyal core customers. MANAGE CLOSELY: loyalty rewards, early access, personalised service.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#6366f122;border-left:3px solid #6366f1">High power, low interest</div><div class="p-2 leading-snug">Influencers, trendsetters, bloggers. KEEP SATISFIED: send samples, involve in launches, use for PR.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#6366f122;border-left:3px solid #6366f1">Low power, high interest</div><div class="p-2 leading-snug">Niche fans or early adopters. KEEP INFORMED: social media updates, feedback polls, targeted promotions.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#6366f122;border-left:3px solid #6366f1">Low power, low interest</div><div class="p-2 leading-snug">Casual consumers. MONITOR: light advertising, entry-level products, brand awareness campaigns.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#14b8a6">8</div><div class="min-w-0"><div class="int-title">STEEPLE analysis</div><div class="int-tip">External issues/environment</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#14b8a622;border-left:3px solid #14b8a6">S: Social</div><div class="p-2 leading-snug">Changes in lifestyle, values or demographics that influence what customers want.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#14b8a622;border-left:3px solid #14b8a6">T: Technological</div><div class="p-2 leading-snug">Innovations like AI, apps or platforms that reshape how businesses operate.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#14b8a622;border-left:3px solid #14b8a6">E: Economic</div><div class="p-2 leading-snug">Trends like inflation, employment or consumer sentiment that affect spending and pricing.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#14b8a622;border-left:3px solid #14b8a6">E: Environmental</div><div class="p-2 leading-snug">Pressure to reduce waste and use sustainable practices.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#14b8a622;border-left:3px solid #14b8a6">P: Political</div><div class="p-2 leading-snug">Government policies or trade decisions that impact business operations.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#14b8a622;border-left:3px solid #14b8a6">L: Legal</div><div class="p-2 leading-snug">Laws around data, employment and consumer rights businesses must follow.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#14b8a622;border-left:3px solid #14b8a6">E: Ethical</div><div class="p-2 leading-snug">Public expectations for fairness, transparency and responsible behaviour.</div></div></div></div></div>
                `
            },
            "bus-c10": {
                title: "Chapter 10: Operations and Finance",
                section: "Strand 2: Understanding Enterprise",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Elements of the operational model</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:110px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Key partners</div><div class="p-2 leading-snug">External people/businesses that support key tasks, supply goods or help deliver the product/service: suppliers, couriers, IT services, accountants, licensing partners, joint ventures. They evolve as strategy shifts, new tech is adopted, or legal/ethical pressures change.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:110px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Key activities</div><div class="p-2 leading-snug">Core tasks a business must carry out to deliver value: manufacturing, app updates, order fulfilment, customer service, marketing campaigns. They evolve as customer habits change, the business grows or tech automates tasks.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:110px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Key resources</div><div class="p-2 leading-snug">Essential assets needed to run effectively and compete: staff, funding, software, data systems, reputation, equipment, licences. They evolve as resources age, the business expands or digital tools replace older systems.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">2</div><div class="min-w-0"><div class="int-title">Costs and revenue streams</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Fixed costs</div><div class="p-2 leading-snug">Stay the same each month regardless of output, e.g. rent, insurance, manager salaries. Change when the business grows, moves or restructures long-term commitments.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Variable costs</div><div class="p-2 leading-snug">Rise and fall with how much is produced or sold, e.g. raw materials, electricity, wages. Can drop per unit with bulk buying.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Revenue streams</div><div class="p-2 leading-snug">Ways a business earns income from products/services, e.g. product sales, subscriptions, licensing. Change as customer habits shift, digital tools open new options or the business expands.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">3</div><div class="min-w-0"><div class="int-title">Sources of finance by time</div></div></div><div class="flex flex-wrap items-center gap-4 mt-2"><svg viewBox="0 0 300 130" class="w-full" style="color:#64748b;max-width:440px" xmlns="http://www.w3.org/2000/svg"><rect x="86" y="8" width="34" height="24" rx="5" fill="#38bdf8" stroke="none" stroke-width="1.2" opacity="1"/><text x="82.0" y="23.5" font-size="9.5" text-anchor="end" fill="currentColor">Short-term</text><text x="90.0" y="23.5" font-size="8.5" text-anchor="start" fill="#fff">under 1 year</text><text x="88.0" y="41.5" font-size="8" text-anchor="start" fill="currentColor">overdraft, trade credit, factoring</text><rect x="86" y="48" width="100" height="24" rx="5" fill="#8b5cf6" stroke="none" stroke-width="1.2" opacity="1"/><text x="82.0" y="63.5" font-size="9.5" text-anchor="end" fill="currentColor">Medium-term</text><text x="90.0" y="63.5" font-size="8.5" text-anchor="start" fill="#fff">1 to 5 years</text><text x="88.0" y="81.5" font-size="8" text-anchor="start" fill="currentColor">term loan, leasing, hire purchase</text><rect x="86" y="88" width="190" height="24" rx="5" fill="#f59e0b" stroke="none" stroke-width="1.2" opacity="1"/><text x="82.0" y="103.5" font-size="9.5" text-anchor="end" fill="currentColor">Long-term</text><text x="90.0" y="103.5" font-size="8.5" text-anchor="start" fill="#fff">5+ years</text><text x="88.0" y="121.5" font-size="8" text-anchor="start" fill="currentColor">long-term loan, debenture, equity, grants</text></svg></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:128px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Short-term (under 1 year)</div><div class="p-2 leading-snug">For everyday costs. Types: bank overdraft, trade credit, accrued expenses, factoring. Uses: stock, wages, bills, short-term cashflow gaps.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:128px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Medium-term (1-5 years)</div><div class="p-2 leading-snug">To fund assets lasting a few years. Types: term loan, leasing, hire purchase. Uses: equipment, vehicles, IT systems.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:128px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Long-term (5+ years)</div><div class="p-2 leading-snug">Supports large-scale growth. Types: long-term loan, debenture, equity, venture capital, retained earnings, grants. Uses: buying premises, scaling up, entering new markets.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">4</div><div class="min-w-0"><div class="int-title">Cashflow forecast</div><div class="int-tip">A future projection of all the money coming in and out of the business, to make sure it can meet its payments</div></div></div><div class="flex flex-wrap items-center gap-4 mt-2"><svg viewBox="0 0 310 66" class="w-full" style="color:#64748b;max-width:440px" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="8" width="92" height="44" rx="6" fill="#3b82f6" stroke="none" stroke-width="1.2" opacity="1"/><text x="48" y="23.5" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="600">Opening cash</text><text x="48" y="34.5" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="600">(start of month)</text><text x="104.0" y="33.5" font-size="16" text-anchor="middle" fill="currentColor">+</text><rect x="114" y="8" width="92" height="44" rx="6" fill="#8b5cf6" stroke="none" stroke-width="1.2" opacity="1"/><text x="160" y="23.5" font-size="8" text-anchor="middle" fill="#fff" font-weight="600">Net cash</text><text x="160" y="34.5" font-size="8" text-anchor="middle" fill="#fff" font-weight="600">(receipts − payments)</text><text x="216.0" y="33.5" font-size="16" text-anchor="middle" fill="currentColor">=</text><rect x="226" y="8" width="82" height="44" rx="6" fill="#22c55e" stroke="none" stroke-width="1.2" opacity="1"/><text x="267" y="23.5" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="600">Closing cash</text><text x="267" y="34.5" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="600">(end of month)</text></svg></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Net cash</div><div class="p-2 leading-snug">Total receipts minus total payments in a month.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Opening cash</div><div class="p-2 leading-snug">The cash available at the start of the month.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Closing cash</div><div class="p-2 leading-snug">Opening cash + net cash = cash left at the end of the month.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Closing cash surplus</div><div class="p-2 leading-snug">Positive closing cash: enough left at month end to cover costs.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Closing cash deficit</div><div class="p-2 leading-snug">Negative closing cash: not enough money to make payments.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Issues that arise</div><div class="p-2 leading-snug">Fall in sales for a period (e.g. a seasonal business); one-off spending (e.g. new equipment, delivery van).</div></div></div><p class="text-[13px] leading-snug mt-2">Recommending actions for a deficit:</p><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:40px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">1</div><div class="p-2 leading-snug">Spread large costs over time using loans or leasing rather than one large lump sum.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:40px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">2</div><div class="p-2 leading-snug">Run a promotion or sell stock to raise quick cash. Sell investments owned (e.g. shares).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:40px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">3</div><div class="p-2 leading-snug">Cut spending where possible, e.g. switch to cheaper suppliers.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:40px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">4</div><div class="p-2 leading-snug">Arrange short-term finance (e.g. overdraft) to cover deficits so payments can be made.</div></div></div></div></div>
                `

            "bus-c11": {
                title: "Chapter 11: Growth, Development, and Expansion",
                section: "Strand 2: Understanding Enterprise",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Importance of identifying competition</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Importance</div><div class="p-2 leading-snug">Understand who your direct and indirect competitors are to make better decisions: spot market gaps, avoid failed strategies, track what customers value.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Competitive advantage</div><div class="p-2 leading-snug">A clear advantage helps a business stand out, build loyalty and grow, e.g. price, service, quality, speed, brand or innovation.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">How to capitalise</div><div class="p-2 leading-snug">1. Use it across your marketing mix (product, promotion, place). 2. Invest to keep improving it: today's advantage will not last forever. 3. Monitor rivals and adapt to stay ahead as markets shift.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">2</div><div class="min-w-0"><div class="int-title">Porter's five forces model</div><div class="int-tip">Analyse how competitive a market is: strengths, opportunities, risks and threats</div></div></div><div class="flex flex-wrap items-center gap-4 mt-2"><svg viewBox="0 0 310 190" class="w-full" style="color:#64748b;max-width:430px" xmlns="http://www.w3.org/2000/svg"><rect x="105" y="4" width="100" height="36" rx="6" fill="#3b82f6" stroke="none" stroke-width="1.2" opacity="0.9"/><text x="155" y="17.5" font-size="9" text-anchor="middle" fill="#fff" font-weight="600">Threat of</text><text x="155" y="28.5" font-size="9" text-anchor="middle" fill="#fff" font-weight="600">new entrants</text><rect x="105" y="150" width="100" height="36" rx="6" fill="#8b5cf6" stroke="none" stroke-width="1.2" opacity="0.9"/><text x="155" y="163.5" font-size="9" text-anchor="middle" fill="#fff" font-weight="600">Threat of</text><text x="155" y="174.5" font-size="9" text-anchor="middle" fill="#fff" font-weight="600">substitutes</text><rect x="2" y="77" width="92" height="36" rx="6" fill="#0ea5e9" stroke="none" stroke-width="1.2" opacity="0.9"/><text x="48" y="90.5" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="600">Bargaining power</text><text x="48" y="101.5" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="600">of suppliers</text><rect x="216" y="77" width="92" height="36" rx="6" fill="#22c55e" stroke="none" stroke-width="1.2" opacity="0.9"/><text x="262" y="90.5" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="600">Bargaining power</text><text x="262" y="101.5" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="600">of customers</text><rect x="110" y="72" width="90" height="46" rx="8" fill="#f59e0b" stroke="none" stroke-width="1.2" opacity="1"/><text x="155" y="89.5" font-size="10" text-anchor="middle" fill="#fff" font-weight="700">Competitive</text><text x="155" y="100.5" font-size="10" text-anchor="middle" fill="#fff" font-weight="700">rivalry</text><line x1="155.0" y1="42.0" x2="155.0" y2="70.0" stroke="currentColor" stroke-width="1.6"/><polygon points="155.0,70.0 152.4,64.6 157.6,64.6" fill="currentColor"/><line x1="155.0" y1="148.0" x2="155.0" y2="120.0" stroke="currentColor" stroke-width="1.6"/><polygon points="155.0,120.0 157.6,125.4 152.4,125.4" fill="currentColor"/><line x1="96.0" y1="95.0" x2="108.0" y2="95.0" stroke="currentColor" stroke-width="1.6"/><polygon points="108.0,95.0 102.6,97.6 102.6,92.4" fill="currentColor"/><line x1="214.0" y1="95.0" x2="202.0" y2="95.0" stroke="currentColor" stroke-width="1.6"/><polygon points="202.0,95.0 207.4,92.4 207.4,97.6" fill="currentColor"/></svg></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:128px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Threat of new entrants</div><div class="p-2 leading-snug">HIGH when it is easy/cheap to start a business and customers are open to switching. LOW when strong brands dominate, start-up costs are high, or access to retail space is limited.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:128px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Bargaining power of suppliers</div><div class="p-2 leading-snug">HIGH when few suppliers exist or they offer something unique and hard to replace. LOW when there is a wide choice of similar suppliers.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:128px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Bargaining power of customers</div><div class="p-2 leading-snug">HIGH when customers have lots of options, can easily compare and switching is simple. LOW when there is less choice or customers rely on the business for quality or service.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:128px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Threat of substitutes</div><div class="p-2 leading-snug">HIGH when alternatives meet the same need at lower cost or more convenience. LOW when the product is unique, experience-based or difficult to replace.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:128px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Competitive rivalry</div><div class="p-2 leading-snug">HIGH when many businesses offer similar products and compete on price, speed or ads. LOW when only a few dominant brands operate and customers tend to stay loyal.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">3</div><div class="min-w-0"><div class="int-title">Strategies to adapt or expand</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:118px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Adaption strategies</div><div class="p-2 leading-snug">Updating products, entering new segments, using tech to cut costs, diversifying (increasing number of markets/products), investing in staff, improving sustainability or branding.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:118px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Organic expansion</div><div class="p-2 leading-snug">New markets (sell to new locations or groups using internal resources). E-commerce (sell online without extra premises). Franchising (others run new outlets using your brand, systems and products).</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:118px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Inorganic expansion</div><div class="p-2 leading-snug">Takeover (buy over 50% of another business to gain assets/markets or reduce competition). Merger (join with another business to create a single new entity). Strategic alliance (partner on a project to share risk, resources or expertise).</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#0ea5e9">4</div><div class="min-w-0"><div class="int-title">Technology to support adaption and expansion</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">1. Speed / convenience</div><div class="p-2 leading-snug">Apps/online systems make it easier for customers to browse, order and pay.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">2. Expanding reach</div><div class="p-2 leading-snug">E-commerce platforms (e.g. Shopify) let businesses sell globally without stores.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">3. Smarter decisions</div><div class="p-2 leading-snug">Google Analytics etc. help track behaviour to improve marketing.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">4. Cutting costs</div><div class="p-2 leading-snug">Chatbots and AI streamline tasks, reduce errors, free staff for innovation.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">5. Building loyalty</div><div class="p-2 leading-snug">Instagram/TikTok help engage customers and grow/enter new markets/communities.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#22c55e">5</div><div class="min-w-0"><div class="int-title">Cost-benefit analysis of expansion</div></div></div><p class="text-[13px] leading-snug mt-2">Compares the potential gains of expansion with the possible risks/costs, helping a business decide if growth is worth it.</p><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Benefits</div><div class="p-2 leading-snug">Grow revenue, reduce unit costs, boost brand visibility, gain new skills, tech or products.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#22c55e22;border-left:3px solid #22c55e">Costs</div><div class="p-2 leading-snug">May need investment, increased market risk, culture clashes, loss of focus or quality.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">6</div><div class="min-w-0"><div class="int-title">Adapting the marketing mix and business model</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#ef444422;border-left:3px solid #ef4444">Customer demographics</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#ef4444">Marketing mix</span>Marketing mix: adapt a "P" to suit changing age, values or lifestyles.</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#ef4444">Business model</span>Business model: more personalised, digital or subscription-based services.</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#ef444422;border-left:3px solid #ef4444">Competition</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#ef4444">Marketing mix</span>Marketing mix: adapt a "P" to stand out through service, delivery options or localised experience.</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#ef4444">Business model</span>Business model: add value or combine approaches (e.g. marketplace + delivery or affiliate).</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#ef444422;border-left:3px solid #ef4444">Economic factors</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#ef4444">Marketing mix</span>Marketing mix: adapt a "P" to offer better value, loyalty rewards or affordable alternatives.</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#ef4444">Business model</span>Business model: reduce cost for customers (e.g. ad-supported or tiered pricing).</div></div></div></div></div></div>
                `
            },
            "bus-c12": {
                title: "Chapter 12: Managing Risk",
                section: "Strand 2: Understanding Enterprise",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Challenges and risks of enterprise</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Challenges</div><div class="p-2 leading-snug">Raising finance; production method (creating a USP); choosing ownership type; marketing and market penetration; availability of location or staff.</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Entrepreneurial</div><div class="p-2 leading-snug">Personal and financial risk: losing savings, reputational damage, stress.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Operational</div><div class="p-2 leading-snug">May lack the skills or systems to manage daily operations.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Economic</div><div class="p-2 leading-snug">Risks outside their control, e.g. rising interest rates, high inflation, pandemic.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Market</div><div class="p-2 leading-snug">New companies entering the market or aggressive pricing from competitors.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Compliance</div><div class="p-2 leading-snug">Following employment laws, tax compliance, H&amp;S regulations, accurate reporting.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Technological</div><div class="p-2 leading-snug">Disruption from failures in tech: cyberattack, data breach, outages.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Ethical</div><div class="p-2 leading-snug">Scandal from unethical suppliers, pollution, false sustainability claims.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">2</div><div class="min-w-0"><div class="int-title">Importance of assessing and managing risks</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Helps avoid costly mistakes</div><div class="p-2 leading-snug">Spot problems before they happen; act early to avoid major financial losses, legal issues or reputational damage.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Supports better decision-making</div><div class="p-2 leading-snug">Understanding risks leads to confident, informed decisions about investment, expansion and staffing. Avoidance can put off a risky expansion plan.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Protects resources</div><div class="p-2 leading-snug">Protect money, equipment, data and staff from being lost or harmed. Insurance can cover financial losses.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Improves financial sustainability</div><div class="p-2 leading-snug">Regularly assessing and managing risk increases the chance of surviving over time. Diversifying spreads risk and increases resilience.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">3</div><div class="min-w-0"><div class="int-title">Risk management strategies</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Avoidance</div><div class="p-2 leading-snug">Identify a risk and choose not to engage in the activity at all (avoiding a market). Protects the business but may limit growth if overused.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Spread</div><div class="p-2 leading-snug">Diversify, reducing reliance on a single product, supplier or market. If spread too thin, may drift away from the core market.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Prevention</div><div class="p-2 leading-snug">Steps to stop risks happening in the first place (training, checks, systems). Helps maintain quality/safety but requires investment and time.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Insurance</div><div class="p-2 leading-snug">Cover to protect the business financially if a risk becomes reality. Peace of mind, but premiums are costly and come with T&amp;Cs about level of cover.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#8b5cf6">4</div><div class="min-w-0"><div class="int-title">Types of insurance</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Public liability</div><div class="p-2 leading-snug">Covers large payouts for a member of the public injuring themselves on your property.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Employer liability</div><div class="p-2 leading-snug">Covers payouts for staff becoming ill or injured doing their job.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Product liability</div><div class="p-2 leading-snug">Covers payouts for faulty or defective products causing harm to consumers.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Buildings and contents</div><div class="p-2 leading-snug">Covers financial loss from premises or contents damaged by fire, flooding, storms or burglary.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Other</div><div class="p-2 leading-snug">Key person; fidelity guarantee; goods in transit; cyber insurance; professional indemnity; business interruption.</div></div></div></div></div>
                `
            },
            "bus-c13": {
                title: "Chapter 13: Leading and Managing an Organisation",
                section: "Strand 3: Leading in Business",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Leadership vs management</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Leadership</div><div class="p-2 leading-snug">Create a vision for the business, inspire people and foster innovation.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Management</div><div class="p-2 leading-snug">Responsible for implementing plans and organising resources to achieve goals.</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Role</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#8b5cf6">Leader</span>Provides/creates long-term vision</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#8b5cf6">Manager</span>Organises resources day to day</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Innovation</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#8b5cf6">Leader</span>Promotes innovation and creativity</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#8b5cf6">Manager</span>Implements new ideas</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Risk taking</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#8b5cf6">Leader</span>Accepts risks, willing to fail</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#8b5cf6">Manager</span>Controls risks, looks to minimise them</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#8b5cf622;border-left:3px solid #8b5cf6">People</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#8b5cf6">Leader</span>Inspires trust, builds relationships</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#8b5cf6">Manager</span>Organises and co-ordinates staff</div></div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">2</div><div class="min-w-0"><div class="int-title">Organisational culture and innovation</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#10b98122;border-left:3px solid #10b981">Organisational culture</div><div class="p-2 leading-snug">A set of shared values, beliefs and behaviours that shape how a business operates. Contribution: creates shared values and purpose; improves employee wellbeing and work-life balance; fosters collaboration and innovation; increases employee loyalty and retention.</div></div></div><p class="text-[13px] leading-snug mt-2">The importance of innovation for organisations:</p><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:40px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">1</div><div class="p-2 leading-snug">Helps a business stand out from competitors by making new products/processes.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:40px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">2</div><div class="p-2 leading-snug">Enables a business to adapt to change by being open and ready to shift models.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:40px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">3</div><div class="p-2 leading-snug">Drives efficiency and profitability in all processes to lower costs and increase speed.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:40px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">4</div><div class="p-2 leading-snug">Opens up new markets or customer segments, appeals to new audiences, diversifies risk.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">3</div><div class="min-w-0"><div class="int-title">Leadership styles</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#f59e0b22;border-left:3px solid #f59e0b">Autocratic</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#f59e0b">What it is</span>Leaders make decisions themselves and give instructions without consulting anyone. Useful for rapid decision-making or in a crisis.</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#f59e0b">Impact</span>CULTURE: clear direction for staff, low engagement and morale. INNOVATION: limited ideas as staff do not feel trusted/valued.</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#f59e0b22;border-left:3px solid #f59e0b">Democratic</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#f59e0b">What it is</span>Involve staff in decision-making, trust their employees, maintain open communication. Widely used.</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#f59e0b">Impact</span>CULTURE: open communication, easier to manage change, better problem-solving. INNOVATION: encourages intrapreneurship; staff more likely to offer suggestions.</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#f59e0b22;border-left:3px solid #f59e0b">Laissez-faire</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#f59e0b">What it is</span>Hands-off approach with minimal employee supervision.</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#f59e0b">Impact</span>CULTURE: encourages independence, but some workers may need more direction. INNOVATION: high levels of innovation from highly skilled employees.</div></div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#ef4444">4</div><div class="min-w-0"><div class="int-title">Conflict in the workplace</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Reasons</div><div class="p-2 leading-snug">Disputes over pay, working conditions, redundancies, demarcation, trade union recognition; unfair dismissal or discrimination; staff clashes; poor communication.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#ef444422;border-left:3px solid #ef4444">Impact</div><div class="p-2 leading-snug">Lower productivity and collaboration, lower morale, higher absenteeism/turnover; (sometimes) better problem solving.</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Internal: meet and talk</div><div class="p-2 leading-snug">Parties meet to clarify the issue through open communication to help resolve it.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">Internal: negotiation / bargaining</div><div class="p-2 leading-snug">Both parties compromise to reach a middle ground.</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">External: mediation</div><div class="p-2 leading-snug">A mediator encourages open communication and has both sides listen to each other so they can reach a solution. Does not offer recommendations.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">External: conciliation</div><div class="p-2 leading-snug">Encourages open communication so parties can reach a solution themselves. May suggest a starting point for them to reach an agreement.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">External: arbitration</div><div class="p-2 leading-snug">Hears evidence from both sides and makes a recommendation.</div></div></div></div></div>
                `
            },
            "bus-c14": {
                title: "Chapter 14: Leading and Managing People",
                section: "Strand 3: Leading in Business",
                content: `
                    <div class="space-y-4"><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#3b82f6">1</div><div class="min-w-0"><div class="int-title">Human capital management (HCM) and workforce planning</div></div></div><p class="text-[13px] leading-snug mt-2">HCM is the strategic process of planning, recruiting, developing, motivating and retaining employees, supporting their personal/professional growth and maximising their contribution to the business. It is supported by a positive work culture, support of leaders, communication and a pro-innovation culture.</p><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">Internal factors</div><div class="p-2 leading-snug">Staff turnover, skill gaps and business goals (e.g. expansion) impacting future hiring needs.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#3b82f622;border-left:3px solid #3b82f6">External factors</div><div class="p-2 leading-snug">Labour laws, technology, the economy and competitor actions that influence workforce plans.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#10b981">2</div><div class="min-w-0"><div class="int-title">Recruitment: key stages and ethical approaches</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#10b98122;border-left:3px solid #10b981">Identification</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#10b981">Stage</span>Assess workforce needs, create a job description (role) and person specification (candidate).</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#10b981">Ethical approach</span>Clearly define the role/ideal candidate so applicants are judged only on ability to do the job.</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#10b98122;border-left:3px solid #10b981">Application</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#10b981">Stage</span>Advertise the role, review applications, shortlist candidates.</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#10b981">Ethical approach</span>Remove bias from shortlisting; treat all applicants with respect and transparency.</div></div></div><div class="border-t first:border-t-0 border-gray-200 dark:border-slate-800"><div class="px-2 py-1.5 font-semibold" style="background:#10b98122;border-left:3px solid #10b981">Selection</div><div class="grid sm:grid-cols-2"><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#10b981">Stage</span>Interview fairly (use panel interviews) and offer the role to the best candidate.</div><div class="p-2 leading-snug border-t sm:border-t-0 sm:border-l border-gray-200 dark:border-slate-800"><span class="block text-[10px] font-bold uppercase tracking-wider mb-0.5" style="color:#10b981">Ethical approach</span>Fair interviews, clear criteria and respectful feedback to support applicants.</div></div></div></div><p class="text-[13px] leading-snug mt-2">How digital technologies influence recruitment:</p><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Identification</div><div class="p-2 leading-snug">Online platforms and workforce planning tools identify vacancies, reach a wide talent pool and build shortlists, e.g. LinkedIn.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Application</div><div class="p-2 leading-snug">Applicant tracking systems (ATS) like Greenhouse filter and sort CVs using keywords; chatbots help collect info and screen fairly.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#0ea5e922;border-left:3px solid #0ea5e9">Selection</div><div class="p-2 leading-snug">Video interviews, online assessments and remote tools (Zoom, HireVue) make selection faster, but may miss soft skills.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#f59e0b">3</div><div class="min-w-0"><div class="int-title">Employee motivation and appraisal</div></div></div><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">1. Pay and rewards</div><div class="p-2 leading-snug">Fair pay and bonuses encourage effort and reward high performance.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">2. Working conditions</div><div class="p-2 leading-snug">Supportive, safe and secure environments improve satisfaction and focus.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">3. Teamwork</div><div class="p-2 leading-snug">Collaboration builds belonging and shared purpose.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">4. Recognition and praise</div><div class="p-2 leading-snug">Feeling valued boosts morale and performance.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:124px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#f59e0b22;border-left:3px solid #f59e0b">5. Career progression</div><div class="p-2 leading-snug">Clear promotion paths and development plans increase commitment.</div></div></div><p class="text-[13px] leading-snug mt-2">Effective employee appraisal: evaluating performance, progress and contribution over a period of time. Most effective when feedback is regular, goals are SMART, communication is two-way and appraisers are well-trained.</p><div class="mt-2 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-800 text-[13px]"><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:108px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Self-appraisal</div><div class="p-2 leading-snug">Employee reflects on their own performance and suggests next steps. + self-awareness/ownership; - may be overly self-critical.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:108px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Formative</div><div class="p-2 leading-snug">Ongoing, informal feedback and support while work is in progress. + regular support; - may overwhelm if too frequent or negative.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:108px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">Summative</div><div class="p-2 leading-snug">A formal review at a set time, often linked to goals or bonuses. + goal-focused; - may feel impersonal if judged only on data.</div></div><div class="grid border-t first:border-t-0 border-gray-200 dark:border-slate-800" style="grid-template-columns:108px 1fr"><div class="p-2 font-semibold leading-snug" style="background:#8b5cf622;border-left:3px solid #8b5cf6">360-degree</div><div class="p-2 leading-snug">Feedback from managers, colleagues and customers for a broad appraisal. + broad recognition; - feedback from peers is challenging.</div></div></div></div><div class="int-card"><div class="int-head"><div class="int-badge" style="background:#22c55e">4</div><div class="min-w-0"><div class="int-tit
