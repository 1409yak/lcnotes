                            <button onclick="switchTab('diff-tab-2', this)" class="tab-btn px-4 py-2 text-gray-500 hover:text-blue-500">2. Specific Functions Derivatives</button>

                        <!-- TAB 1: Rules -->
                        <div id="diff-tab-1" class="tab-content space-y-6">
                            <div class="bg-blue-50/50 dark:bg-slate-800/40 p-4 rounded-xl border border-blue-100 dark:border-slate-800">
                                <h3 class="font-bold text-blue-600 dark:text-blue-400 text-md mb-2">1. First Principles Definition</h3>
                                <p class="text-sm">For any continuous function \\( y = f(x) \\), the derivative is defined as:</p>
                                <div class="math-block text-lg font-bold">
                                    \\( \\frac{dy}{dx} = \\lim_{h \\to 0} \\frac{f(x+h) - f(x)}{h} \\)
                                </div>
                            </div>

                            <div>
                                <h3 class="font-bold text-gray-800 dark:text-slate-100 text-md mb-3">2. Core Rules of Differentiation</h3>

                                    <div class="math-block">
                                        <span class="font-bold text-blue-600 dark:text-blue-400 block mb-1">(a) Basic Power Rule:</span>
                                        \\( y = x^p \\implies \\frac{dy}{dx} = p x^{p-1}, \\quad p \\in \\mathbb{R} \\)
                                    </div>
                                    <div class="math-block">
                                        <span class="font-bold text-blue-600 dark:text-blue-400 block mb-1">(b) Multiplication by a Constant:</span>

                                    </div>
                                    <div class="math-block">
                                        <span class="font-bold text-blue-600 dark:text-blue-400 block mb-1">(c) Constant Rule:</span>

                                    </div>
                                    <div class="math-block">
                                        <span class="font-bold text-blue-600 dark:text-blue-400 block mb-1">(d) Sum Rule:</span>

                                    </div>
                                    <div class="math-block col-span-1 md:col-span-2">

                    const isActive = ch.id === currentState.activeTopicId;
                    const itemBtn = document.createElement('button');
                    itemBtn.className = `w-full text-left px-3 py-2 rounded-lg text-xs font-medium flex items-center justify-between transition-all ${
                        isActive 
                        ? 'bg-blue-600 text-white shadow-sm font-semibold' 
                        : 'text-gray-700 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-900'
                    }`;

                    const statusBadge = ch.status === 'ready' 
                        ? `<span class="w-2 h-2 rounded-full ${isActive ? 'bg-white' : 'bg-emerald-500'}" title="Notes Transcribed"></span>`
                        : `<span class="text-[10px] opacity-60"><i class="fa-regular fa-clock"></i></span>`;

                    itemBtn.innerHTML = `<span class="truncate pr-2">${ch.name}</span>${statusBadge}`;

                    itemBtn.addEventListener('click', () => {
                        currentState.activeTopicId = ch.id;
                        renderSidebar();
                        loadTopicContent(ch.id);
                        sidebar.classList.add('-translate-x-full');
                    });

                    chapterList.appendChild(itemBtn);
                });

                sectionGroup.appendChild(sectionTitle);
                sectionGroup.appendChild(chapterList);
                topicListContainer.appendChild(sectionGroup);
            });

            sidebarTopicCount.textContent = `${totalChapters} Chapters`;
        }

        function loadTopicContent(topicId) {
            const subData = SYLLABUS_DATA[currentState.subject];
            let activeChapterObj = null;
            let activeSectionName = "";

            for (let sec of subData.sections) {
                for (let ch of sec.chapters) {
                    if (ch.id === topicId) {
                        activeChapterObj = ch;
                        activeSectionName = sec.name;
                        break;
                    }
                }
            }

            breadcrumbSubject.textContent = subData.title;
            breadcrumbSection.textContent = activeSectionName || "Section";
            breadcrumbChapter.textContent = activeChapterObj ? activeChapterObj.name : "Topic";

            contentSearch.value = '';

            if (NOTES_DATABASE[topicId]) {
                const note = NOTES_DATABASE[topicId];
                notesReader.innerHTML = `
                    <div class="mb-6 border-b border-gray-200 dark:border-slate-800 pb-4">
                        <span class="text-xs font-semibold text-blue-600 dark:text-blue-400 uppercase tracking-wider">${note.section}</span>
                        <h1 class="text-2xl md:text-3xl font-extrabold text-gray-900 dark:text-white mt-1">${note.title}</h1>
                    </div>
                    <div id="notes-body">
                        ${note.content}
                    </div>
                `;

                // Trigger KaTeX math rendering
                if (window.renderMathInElement) {
                    try {
                        renderMathInElement(document.getElementById('notes-body'), {
                            delimiters: [
                                {left: "\\(", right: "\\)", display: false},
                                {left: "\\[", right: "\\]", display: true}
                            ]
                        });
                    } catch(e) {}
                }
            } else {
                const topicName = activeChapterObj ? activeChapterObj.name : "Selected Topic";
                notesReader.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-12 px-4 text-center">
                        <div class="w-20 h-20 rounded-2xl bg-blue-50 dark:bg-slate-800/80 border border-blue-100 dark:border-slate-700/60 flex items-center justify-center text-blue-500 mb-6 shadow-inner">
                            <i class="fa-solid fa-file-circle-plus text-3xl"></i>
                        </div>
                        <span class="px-3 py-1 bg-amber-100 dark:bg-amber-950/60 text-amber-700 dark:text-amber-400 font-semibold text-xs rounded-full mb-3 border border-amber-200 dark:border-amber-900/50">
                            Notes Pending
                        </span>
                        <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">${topicName}</h2>
                        <p class="text-sm text-gray-500 dark:text-slate-400 max-w-md leading-relaxed mb-8">
                            This chapter is ready for future scanned content uploads. When you provide textbook photos or scans for this chapter, complete summaries and worked examples will appear here.
                        </p>
                    </div>
                `;
            }
        }

        function switchTab(tabId, btn) {
            const container = btn.closest('#notes-body');
            if (!container) return;
            
            const tabs = container.querySelectorAll('.tab-content');
            tabs.forEach(t => t.classList.add('hidden'));

            const targetTab = container.querySelector(`#${tabId}`);
            if (targetTab) targetTab.classList.remove('hidden');

            const tabBtns = container.querySelectorAll('.tab-btn');
            tabBtns.forEach(b => {
                b.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600', 'active');
                b.classList.add('text-gray-500');
            });

            btn.classList.remove('text-gray-500');
            btn.classList.add('text-blue-600', 'border-b-2', 'border-blue-600', 'active');
        }

        function adjustFontSize(delta) {
            currentState.fontSize = Math.min(Math.max(currentState.fontSize + delta, 70), 150);
            setFontSize(currentState.fontSize);
        }

        function setFontSize(size) {
            currentState.fontSize = size;
            notesReader.style.fontSize = `${currentState.fontSize}%`;
            showToast(`Font size set to ${currentState.fontSize}%`);
        }

        function filterContentTerms(query) {
            const body = document.getElementById('notes-body');
            if (!body) return;

            const elements = body.querySelectorAll('.math-block, .srp-box, .border');
            elements.forEach(el => {
                if (!query) {
                    el.style.opacity = '1';
                } else {
                    const text = el.innerText.toLowerCase();
                    el.style.opacity = text.includes(query) ? '1' : '0.3';
                }
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            toastMsg.textContent = message;
            
            toast.classList.remove('translate-y-16', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-16', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
